<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>樂樂主題找書 | Le Le Theme Book Finder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#D4A843;--brand-light:#FFF8F0;--brand-hover:#C19A3A;--red:#E74C3C;--yellow:#E8A317;--green:#27AE60;--bg:#fff;--text:#1a1a1a;--sub:#888;--card-radius:14px}
body{font-family:'Noto Sans TC','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);min-height:100vh}

/* Header */
.hdr{text-align:center;padding:2rem 1rem 1.5rem;background:linear-gradient(180deg,#FFF8F0 0%,#fff 100%)}
.hdr-title{font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px}
.hdr-title span{color:var(--brand)}
.hdr-desc{font-size:15px;color:#666;margin-bottom:16px}

/* Search */
.search-wrap{max-width:700px;margin:0 auto;padding:0 1rem}
.search-box{background:#f8f8f8;border:1.5px solid #e0e0e0;border-radius:14px;display:flex;align-items:center;padding:0 20px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--brand)}
.search-box .icon{margin-right:10px;color:#ccc;font-size:18px}
.search-box input{flex:1;border:none;padding:14px 0;font-size:16px;outline:none;background:transparent}
.search-box .cnt{font-size:13px;color:var(--sub);white-space:nowrap}

/* Filters */
.filters{max-width:700px;margin:1rem auto;padding:0 1rem;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fb{padding:8px 20px;border-radius:20px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:14px;transition:all .15s}
.fb:hover{border-color:var(--brand)}
.fb.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Theme Grid */
.theme-section{max-width:1100px;margin:1.5rem auto;padding:0 1rem}
.section-title{font-size:16px;font-weight:600;color:var(--sub);margin-bottom:12px;padding-left:4px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.theme-card{background:#fff;border:1.5px solid #eee;border-radius:16px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.theme-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:var(--brand)}
.theme-card.active{border-color:var(--brand);background:var(--brand-light);box-shadow:0 4px 16px rgba(212,168,67,.2)}
.theme-card .emoji{font-size:36px;display:block;margin-bottom:8px}
.theme-card .name{font-size:15px;font-weight:600;color:var(--text)}
.theme-card .sub{font-size:12px;color:var(--sub);margin-top:4px}
.theme-card .count{position:absolute;top:8px;right:10px;font-size:11px;color:#fff;background:var(--brand);padding:2px 8px;border-radius:10px;font-weight:500}

/* Active theme detail */
.theme-detail{max-width:1100px;margin:0 auto;padding:0 1rem;display:none}
.theme-detail.show{display:block}
.td-header{background:var(--brand-light);border-radius:16px;padding:1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.td-emoji{font-size:48px}
.td-info{flex:1;min-width:200px}
.td-title{font-size:22px;font-weight:700;color:var(--text)}
.td-en{font-size:14px;color:var(--sub)}
.td-close{background:none;border:2px solid #ddd;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:14px;color:#666;transition:all .15s}
.td-close:hover{border-color:var(--brand);color:var(--brand)}

/* Words */
.words-section{margin-bottom:1.2rem}
.words-label{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}
.words-wrap{display:flex;flex-wrap:wrap;gap:8px}
.word-tag{padding:6px 14px;background:#fff;border:1.5px solid #e0e0e0;border-radius:20px;font-size:14px;cursor:pointer;transition:all .15s}
.word-tag:hover{border-color:var(--brand);background:var(--brand-light)}
.word-tag.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Book Grid */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:1rem}
.book-card{background:#fff;border-radius:var(--card-radius);overflow:hidden;cursor:pointer;border:1px solid #eee;transition:all .2s}
.book-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.book-card .cbar{height:4px}
.book-card .cbar.r{background:var(--red)}.book-card .cbar.y{background:var(--yellow)}.book-card .cbar.g{background:var(--green)}
.cover-wrap{width:100%;aspect-ratio:1;background:#faf5f2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover-wrap img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{font-size:48px}
.book-body{padding:10px 14px 14px}
.book-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;color:#fff}
.book-badge.r{background:var(--red)}.book-badge.y{background:var(--yellow)}.book-badge.g{background:var(--green)}
.book-title{font-size:15px;font-weight:600;margin-top:4px;color:var(--text)}
.book-en{font-size:12px;color:var(--sub);margin-top:2px}
.book-count{text-align:center;padding:1rem;color:var(--sub);font-size:14px}

/* Empty */
.empty{text-align:center;padding:3rem;grid-column:1/-1}
.empty .ico{font-size:48px;margin-bottom:8px}

/* Modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:flex-start;padding:2rem 1rem;overflow-y:auto}
.mo.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;overflow:hidden;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:#aaa;background:none;border:none;z-index:2}
.modal-bar{height:6px}
.modal-bar.r{background:var(--red)}.modal-bar.y{background:var(--yellow)}.modal-bar.g{background:var(--green)}
.modal-cover{width:100%;aspect-ratio:1;background:#faf5f2;overflow:hidden;display:flex;align-items:center;justify-content:center;max-height:300px}
.modal-cover img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:1.5rem}
.modal-badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:10px;font-weight:500;color:#fff}
.modal-badge.r{background:var(--red)}.modal-badge.y{background:var(--yellow)}.modal-badge.g{background:var(--green)}
.modal-title{font-size:20px;font-weight:700;margin:6px 0 2px;color:var(--text)}
.modal-en{font-size:14px;color:var(--sub)}
.modal-themes{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.modal-theme-tag{font-size:12px;padding:3px 10px;background:var(--brand-light);color:var(--brand);border-radius:12px}

/* Footer */
.footer{background:#1a1a1a;color:#fff;text-align:center;padding:1.2rem 1rem;font-size:14px;margin-top:2rem}
.footer a{color:#fff;text-decoration:none;margin:0 .6rem;opacity:.8}
.footer a:hover{opacity:1}
.sub-footer{font-size:12px;opacity:.6;margin-top:6px}

/* Back to top */
.back-top{position:fixed;bottom:20px;right:20px;background:var(--brand);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:50;transition:opacity .2s}
.back-top.show{display:flex}

@media(max-width:768px){
  .theme-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .theme-card{padding:14px 8px}
  .theme-card .emoji{font-size:28px}
  .theme-card .name{font-size:13px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .hdr-title{font-size:22px}
  .td-header{flex-direction:column;text-align:center}
}
@media(max-width:480px){
  .theme-grid{grid-template-columns:repeat(3,1fr)}
  .book-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<div class="hdr">

function renderThemes() {
  var q = state.query.toLowerCase();
  var grid = document.getElementById('themeGrid');
  var html = '';
  var shown = 0;

  THEMES.forEach(function(t) {
    // Filter by search
    if (q) {
      var match = t.zh.toLowerCase().indexOf(q) >= 0 ||
                  t.en.toLowerCase().indexOf(q) >= 0 ||
                  t.desc.indexOf(q) >= 0 ||
                  t.words.join('').indexOf(q) >= 0;

    // Count books matching level filter
    var count = getFilteredBooks(t).length;

    html += '<div class="theme-card" onclick="selectTheme(\'' + t.id + '\')">' +
      '<span class="count">' + count + ' 本</span>' +
      '<span class="emoji">' + t.emoji + '</span>' +
      '<div class="name">' + t.zh + '</div>' +
      '<div class="sub">' + t.en + '</div>' +
      '</div>';
    shown++;
  });

  if (!shown) {
    html = '<div class="empty"><div class="ico">🔍</div><p>找不到符合的主題</p></div>';
  }

  grid.innerHTML = html;
  document.getElementById('resultCount').textContent = shown + ' 個主題';
}

function getFilteredBooks(theme) {
  return theme.bookIds.filter(function(id) {
    var b = bookMap[id];
    if (!b) return false;
    if (state.level !== 'ALL' && b.l !== state.level) return false;
    return true;
  });
}

function selectTheme(id) {
  var theme = THEMES.find(function(t){ return t.id === id; });
  if (!theme) return;
  state.activeTheme = theme;
  state.activeWord = null;

  // Hide theme grid, show detail
  document.getElementById('themeSection').style.display = 'none';
  var det = document.getElementById('themeDetail');
  det.classList.add('show');

  document.getElementById('tdEmoji').textContent = theme.emoji;
  document.getElementById('tdTitle').textContent = theme.zh;
  document.getElementById('tdEn').textContent = theme.en + ' · ' + theme.desc;

  // Render words
  var ww = document.getElementById('wordsWrap');
  ww.innerHTML = '<div class="word-tag active" onclick="filterWord(null)">全部</div>' +
    theme.words.map(function(w) {
      return '<div class="word-tag" onclick="filterWord(\'' + w + '\')">' + w + '</div>';
    }).join('');

  renderBooks();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function filterWord(word) {
  state.activeWord = word;
  // Update word tag styles
  document.querySelectorAll('.word-tag').forEach(function(el) {
    el.classList.remove('active');
    if ((!word && el.textContent === '全部') || el.textContent === word) {
      el.classList.add('active');
    }
  });
  renderBooks();
}

function renderBooks() {
  var theme = state.activeTheme;
  if (!theme) return;

  var filteredIds = getFilteredBooks(theme);
  var bookGrid = document.getElementById('bookGrid');

  // If a word filter is active, we could further filter (for future use with word-level data)
  // For now, show all books in theme

  document.getElementById('bookCount').textContent = '共 ' + filteredIds.length + ' 本相關書籍';

  if (!filteredIds.length) {
    bookGrid.innerHTML = '<div class="empty"><div class="ico">📚</div><p>此主題在目前級別下沒有書籍</p></div>';
    return;
  }

  bookGrid.innerHTML = filteredIds.map(function(id) {
    var b = bookMap[id];
    if (!b) return '';
    var lc = b.l.toLowerCase()[0];
    return '<div class="book-card" onclick="openBook(\'' + b.id + '\')">' +
      '<div class="cbar ' + lc + '"></div>' +
      '<div class="cover-wrap">' +
        '<img src="' + b.c + '" alt="' + b.zh + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
        '<div class="cover-placeholder" style="display:none">📖</div>' +
      '</div>' +
      '<div class="book-body">' +
        '<span class="book-badge ' + lc + '">' + b.l + ' #' + b.n + '</span>' +
        '<div class="book-title">' + b.zh + '</div>' +
        '<div class="book-en">' + b.en + '</div>' +
      '</div></div>';
  }).join('');
}

function closeTheme() {
  state.activeTheme = null;
  state.activeWord = null;
  document.getElementById('themeSection').style.display = '';
  document.getElementById('themeDetail').classList.remove('show');
  renderThemes();
}

function openBook(id) {
  var b = bookMap[id];
  if (!b) return;
  var lc = b.l.toLowerCase()[0];

  document.getElementById('modalBar').className = 'modal-bar ' + lc;
  document.getElementById('modalCover').innerHTML =
    '<img src="' + b.c + '" alt="' + b.zh + '" onerror="this.style.display=\'none\'">';

  // Find which themes this book belongs to
  var bookThemes = THEMES.filter(function(t) {
    return t.bookIds.indexOf(b.id) >= 0;
  });
  var themeTags = bookThemes.map(function(t) {
    return '<span class="modal-theme-tag">' + t.emoji + ' ' + t.zh + '</span>';
  }).join('');

  document.getElementById('modalBody').innerHTML =
    '<span class="modal-badge ' + lc + '">' + b.l + ' #' + b.n + '</span>' +
    '<div class="modal-title">' + b.zh + '</div>' +
    '<div class="modal-en">' + b.en + '</div>' +
    '<div class="modal-themes">' + themeTags + '</div>';

  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

function setLevel(level) {
  state.level = level;
  document.querySelectorAll('.fb').forEach(function(btn) {
    btn.classList.remove('active');
    if (btn.dataset.level === level) btn.classList.add('active');
  });
  if (state.activeTheme) {
    renderBooks();
  } else {
    renderThemes();
  }
}

// Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  state.query = e.target.value;
  if (state.activeTheme) {
    closeTheme();
  }
  renderThemes();
});

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('modal').classList.contains('show')) {
      closeModal();
    } else if (state.activeTheme) {
      closeTheme();
    }
  }
});

// Back to top
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backTop');
  btn.classList.toggle('show', window.scrollY > 400);
});

// Init
renderThemes();
</script>
</body>
</html>
