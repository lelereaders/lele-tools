<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列印</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      padding: 40px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #333; }
    .btn-outline {
      display: inline-block;
      padding: 10px 24px;
      background: transparent;
      color: #555;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 12px;
      transition: border-color 0.15s;
    }
    .btn-outline:hover { border-color: #999; }
    .error {
      color: #c00;
      font-size: 16px;
    }
    .preview-wrap {
      margin-top: 24px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">&#128438;</div>
    <h1 id="title">載入中...</h1>
    <p class="subtitle" id="subtitle"></p>
    <div id="actions"></div>
    <div class="preview-wrap" id="previewWrap" style="display:none">
      <iframe id="previewFrame" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function getParam(name) {
      const u = new URLSearchParams(location.search);
      return u.get(name) || '';
    }

    const d = getParam('d');
    const n = decodeURIComponent(getParam('n') || '');

    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const actionsEl = document.getElementById('actions');
    const previewWrap = document.getElementById('previewWrap');
    const previewFrame = document.getElementById('previewFrame');

    if (!d) {
      titleEl.textContent = '連結無效';
      subtitleEl.textContent = '找不到檔案參數，請確認連結是否正確。';
      titleEl.classList.add('error');
    } else {
      titleEl.textContent = n || '列印檔案';
      subtitleEl.textContent = 'Google Drive 檔案';

      // Try to show preview
      const previewUrl = 'https://drive.google.com/file/d/' + d + '/preview';
      const printUrl = 'https://drive.google.com/file/d/' + d + '/view';

      // Show open button
      actionsEl.innerHTML =
        '<a class="btn" href="' + printUrl + '" target="_blank">開啟檔案</a>' +
        '<br><button class="btn-outline" id="previewBtn">預覽</button>';

      document.getElementById('previewBtn').onclick = function() {
        previewWrap.style.display = 'block';
        previewFrame.src = previewUrl;
        this.style.display = 'none';
      };
    }
  </script>
</body>
</html>
