<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E74C3C;--red-bg:#FFF5F5;--yellow:#E8A317;--yellow-bg:#FFFBEB;--green:#27AE60;--green-bg:#F0FFF4;--brand:#E8786F;--bg:#fff;--card:#fff;--text:#1a1a1a;--sub:#888}
body{font-family:'Noto Sans TC','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);min-height:100vh}
.hdr{text-align:center;padding:2rem 1rem 1rem;background:#fff}
.hdr img{max-width:400px;width:80%;margin-bottom:8px}
.hdr .desc{font-size:15px;color:#666;margin-bottom:12px}
.toggle-row{display:flex;gap:0;justify-content:center;margin-bottom:12px}
.toggle-btn{padding:10px 32px;border:2px solid #ddd;background:#fff;cursor:pointer;font-size:14px;transition:all .15s;color:#666}
.toggle-btn:first-child{border-radius:8px 0 0 8px;border-right:1px solid #ddd}
.toggle-btn:last-child{border-radius:0 8px 8px 0;border-left:1px solid #ddd}
.toggle-btn.active{background:#D4A843;color:#fff;border-color:#D4A843;font-weight:700}
.search-wrap{max-width:700px;margin:0 auto;padding:0 1rem}
.search-box{background:#f8f8f8;border:1.5px solid #e0e0e0;border-radius:14px;display:flex;align-items:center;padding:0 20px}
.search-box input{flex:1;border:none;padding:14px 0;font-size:16px;outline:none;background:transparent}
.search-box .cnt{font-size:13px;color:var(--sub);white-space:nowrap}
.filters{max-width:700px;margin:1rem auto;padding:0 1rem;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fb{padding:8px 20px;border-radius:20px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:14px;transition:all .15s}
.fb:hover{border-color:var(--brand)}
.a-all{background:var(--brand);color:#fff;border-color:var(--brand)}
.a-red{background:var(--red);color:#fff;border-color:var(--red)}
.a-yel{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.a-grn{background:var(--green);color:#fff;border-color:var(--green)}
.topics{max-width:700px;margin:0 auto .8rem;padding:0 1rem;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tb{padding:5px 14px;border-radius:16px;border:1px solid #eee;background:#fff;cursor:pointer;font-size:13px;transition:all .15s}
.tb:hover{border-color:var(--brand)}
.tb.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{max-width:1100px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #eee;transition:all .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.cbar{height:4px}.cbar.r{background:var(--red)}.cbar.y{background:var(--yellow)}.cbar.g{background:var(--green)}
.cover-wrap{width:100%;aspect-ratio:1;background:#faf5f2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover-wrap img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{font-size:48px;display:none;align-items:center;justify-content:center;width:100%;height:100%}
.cbody{padding:12px 16px 16px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;color:#fff}
.badge.r{background:var(--red)}.badge.y{background:var(--yellow)}.badge.g{background:var(--green)}
.topic-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#FFF0E6;color:#E8786F;margin-left:4px}
.cnum{font-size:12px;color:var(--sub);margin-top:6px}
.ctitle{font-size:16px;font-weight:600;margin-top:2px;color:var(--text)}
.cfreq{font-size:12px;color:var(--brand);margin-top:4px}
m{background:#FFEAA7;padding:0 2px;border-radius:3px;font-style:normal}
.empty{text-align:center;padding:3rem;grid-column:1/-1}.empty .ico{font-size:48px;margin-bottom:8px}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:flex-start;padding:2rem 1rem;overflow-y:auto}
.mo.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;overflow:hidden;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:#aaa;background:none;border:none;z-index:2}
.modal-bar{height:6px}.modal-bar.r{background:var(--red)}.modal-bar.y{background:var(--yellow)}.modal-bar.g{background:var(--green)}
.mbody{padding:1.5rem}
.mtitle{font-size:22px;font-weight:700;margin:8px 0 4px}
.men{font-size:14px;color:var(--sub)}
.minfo{display:flex;gap:1rem;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#666}
.msection{margin-top:1.2rem;padding-top:1rem;border-top:1px solid #eee}
.msection-label{font-size:13px;font-weight:600;margin-bottom:8px}
.mrec{display:flex;flex-direction:column;gap:6px}
.mrec-item{padding:8px 12px;background:#f8f8f8;border-radius:8px;cursor:pointer;font-size:13px;transition:background .15s}
.mrec-item:hover{background:#eee}
.footer{background:#1a1a1a;color:#fff;text-align:center;padding:1.2rem 1rem;font-size:14px;margin-top:2rem}
.footer a{color:#fff;text-decoration:none;margin:0 .6rem;opacity:.8}
.footer a:hover{opacity:1}
.sub-footer{font-size:12px;opacity:.6;margin-top:6px}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.hdr img{max-width:280px}}
</style>
</head>

topic": "日常活動", "cover": "/covers/YELLOW2.jpg", "top_chars": "我(8次)、今(8次)", "rec_ids": ["YELLOW87", "GREEN25", "GREEN56"], "rec_chars": ["跟今你天子", "冰兒沒你天", "兒沒爸你天"], "s": "YELLOW 2 我沒空  兒子說:「你答應今天跟我踢球!」 爸爸說:「我今天沒空!」 兒子說:「你答應今天跟我騎車!」 爸爸說:「我今天沒空!」 兒子說:「你答應今天跟我溜冰!」 爸爸說:「我今天沒空。你今天應該練琴!」 兒子說:「我今天沒空!」"}, {"id": "YELLOW3", "level": "YELLOW", "number": 3, "title_zh": "找什麼", "title_en": "", "topic": "日常活動", "cover": "/covers/YELLOW3.jpg", "top_chars": "沒(4次)、有(4次)", "rec_ids": ["GREEN56", "GREEN72", "YELLOW13"], "rec_chars": ["問她就什沒", "問頭什沒也", "袋口她就什"], "s": "YELLOW3 找什麼  桌子上沒有， 抽屜裏沒有， 口袋裏沒有， 皮包裏也沒有， 我問:「媽媽，你找什麼?」 「我的眼鏡!」她說。 我說:「你的眼鏡就在你頭上!」"}, {"id": "YELLOW4", "level": "YELLOW", "number": 4, "title_zh": "生病", "title_en": "", "topic": "日常活動", "cover": "/covers/YELLOW4.jpg", "top_chars": "我(7次)、要(4次)", "rec_ids": ["GREEN50", "GREEN62", "GREEN2"], "rec_chars": ["電以做多可", "課功以生做", "課功學做她"], "s": "YELLOW 4 生病  我生病了， 媽媽不要我上學， 她不要我做功課， 她要我喝很多水。 我可以睡在她的床上。 我可以在她的床一看電視。 妹妹說: 「我也要生病!」"}, {"id": "YELLOW5", "level": "YELLOW", "number": 5, "title_zh": "拉吊床", "title_en": "Pulling the hammock", "topic": "日常活動", "cover": "/covers/YELLOW5.jpg", "top_chars": "吊(5次)、床(5次)", "rec_ids": ["GREEN61", "GREEN9", "GREEN19"], "rec_chars": ["進面也地他", "力面下裏要", "拉用下地裏"], "s": "YELLOW 5 拉吊床  我爬進吊床， 我躺在吊床裏面，真舒服啊! 弟弟來了， 他用力地拉吊床， 他說:「我也要躺在裏面。」 我說:「不要拉!不要拉!」 砰!我跌下吊床，弟弟躺在裏面了!"}, {"id": "YELLOW6", "level": "YELLOW", "number": 6, "title_zh": "下不來", "title_en": "Could not come down", "topic": "日常活動", "cover": "/covers/YELLOW6.jpg", "top_chars": "在(10次)、不(10次)", "rec_ids": ["GREEN80", "GREEN11", "GREEN25"], "rec_chars": ["廚飯房兒下", "喵聽貓叫鼠", "卻貓鼠兒老"], "s": "貓兒，你在哪兒? 不在廚房吃飯， 不在家睡覺， 不在陽臺曬太陽， 不在院子追老鼠。 「喵!喵!」我聽到貓兒叫了! 啊!牠爬上樹，卻下不來了!  猫儿，你在哪儿? 不在厨房吃饭， 不在家睡觉， 不在阳臺晒太阳， 不在院子追老鼠。 「喵!喵!」我听到猫儿叫了! 啊!牠爬上树，却下不来了!"}, {"id": "YELLOW7", "level": "YELLOW", "number": 7, "title_zh": "禮物在哪兒", "title_en": "", "topic": "日常活動", "cover": "/covers/YELLOW7.jpg", "top_chars": "在(6次)、面(4次)", "rec_ids": ["GREEN55", "GREEN80", "YELLOW15"], "rec_chars": ["桌原手面鳥", "原兒下物裏", "椅原書物子"], "s": "Yellow 7 禮物在哪兒  我的生日禮物呢? 在椅子上面? 在書包裏面? 在桌子下面? 在床上面? 在媽媽的手裏? 原來，禮物是一隻小鳥!"}, {"id": "YELLOW8", "level": "YELLOW", "number": 8, "title_zh": "夢到什麼", "title_en": "What did I dream of?", "topic": "日常活動", "cover": "/covers/YELLOW8.jpg", "top_chars": "我(6次)、看(3次)", "rec_ids": ["GREEN25", "GREEN92", "GREEN30"], "rec_chars": ["打開著什麼", "夢呀爬穿面", "爬著什下麼"], "s": "Yellow 8 夢到什麼  我穿好睡衣， 我爬上床， 我看恐龍故事書， 看呀看，我睡著了。 我夢到恐龍說:「下雪了! 」 我打開窗戶， 外面真的下雪了!"}, {"id": "YELLOW9", "level": "YELLOW", "number": 9, "title_zh": "我們很無聊", "title_en": "We are bored", "topic": "日常活動", "cover": "/covers/YELLOW9.jpg", "top_chars": "們(8次)、無(5次)", "rec_ids": ["GREEN50", "GREEN61", "GREEN7"], "rec_chars": ["那電以哥就", "那呢哥著就", "腦電為以就"], "s": "Yellow 9 我們很無聊  哥哥很無聊，他看著電腦。 弟弟很無聊，他看著電視。 爸爸說: 「你們不可以看電腦，也不可以看電視。」 「可是，我們很無聊啊!」他們說。 爸爸說:「你們去幫我洗車!」 「那更無聊!」他們說。「為什麼?」 他們說:「下雨了，車就洗好了，為什麼要我們洗呢?」"}, {"id": "YELLOW10", "level": "YELLOW", "number": 10, "title_zh": "做拼圖", "title_en": "Making puzzles", "topic": "日常活動", "cover": "/covers/YELLOW10.jpg", "top_chars": "做(3次)、拼(3次)", "rec_ids": ["GREEN58", "YELLOW35", "GREEN32"], "rec_chars": ["送畫開給她", "送圖紙畫給", "張麗紙二美"], "s": "Yellow 10 做拼圖  拿一張美麗的圖畫， 把它貼在硬紙上， 翻過來，畫九個格子。 拿剪刀剪開來， 九片的拼圖就做好了， 把它送給妹妹玩。 她說:「我要做十二片的拼給你玩!」"}, {"id": "YELLOW11", "level": "YELLOW", "number": 11, "title_zh": "我還是很愛你", "title_en": "I still love you", "topic": "日常活動", "cover": "/covers/YELLOW11.jpg", "top_chars": "愛(6次)、我(3次)", "rec_ids": ["GREEN4", "GREEN57", "GREEN80"], "rec_chars": ["發沙愛過地", "還水地家裏", "發地家裏子"], "s": "Yellow 11 我還是很愛你  小狗很麻煩， 愛在地毯上尿尿， 愛咬家裏的沙發， 愛喝院子裏的髒水， 愛在草地上挖洞。 我說: 你是不乖的小狗!」 「不過，我還是很愛你!」"}, {"id": "YELLOW12", "level": "YELLOW", "number": 12, "title_zh": "照顧寵物", "title_en": "Looking after a pet", "topic": "日常活動", "cover": "/covers/YELLOW12.jpg", "top_chars": "寵(6次)、物(6次)", "rec_ids": ["GREEN74", "GREEN81", "GREEN3"], "rec_chars": ["散步怎呢還", "怎為出給麼", "因怎呢為給"], "s": "Yellow 12 照顧寵物  狗狗是哥哥的寵物， 媽媽要帶狗狗出去散步， 烏龜是妹妹的寵物， 魚兒是弟弟的寵物， 媽媽要給烏龜餵食，還要給魚兒換水。 媽媽說:「你們的寵物，怎麼都是我在照顧呢?」 我們開心地說: 「因為我們是你的寵物!」"}, {"id": "YELLOW13", "level": "YELLOW", "number": 13, "title_zh": "你想住在哪裏", "title_en": "Where do you want to live?", "topic": "日常活動", "cover": "/covers/YELLOW13.jpg", "top_chars": "想(8次)、什(6次)", "rec_ids": ["YELLOW3", "GREEN25", "GREEN50"], "rec_chars": ["袋口她就什", "兒就什想麼", "館就也去你"], "s": "Yellow 13 你想住在哪裏  我想住在圖書館裏， 想看什麼書，就看什麼書。 我想住在玩具店裏， 想玩什麼玩具，就玩什麼玩具。 我想住在糖果屋裏， 想吃什麼糖，就吃什麼糖。 我想住在媽媽口袋裏，她去哪兒，我也去哪兒。"}, {"id": "YELLOW14", "level": "YELLOW", "number": 14, "title_zh": "動物的船沉了", "title_en": "The animals’ boat was sinking", "topic": "動物", "cover": "/covers/YELLOW14.jpg", "top_chars": "了(6次)、們(3次)", "rec_ids": ["GREEN11", "GREEN68", "GREEN80"], "rec_chars": ["救進又動物", "架升救直機", "回得兒動物"], "s": "Yellow 14 動物的船沉了  船要沉了， 動物們跳進海裏， 牠們游到一個小島，在沙上寫「救命」。 一架直升機看到了「救命」， 可是，直升機飛走了， 一會兒，直升機又飛回來了! 牠們得救了!"}, {"id": "YELLOW15", "level": "YELLOW", "number": 15, "title_zh": "不是真的動物", "title_en": "Not real animals", "topic": "動物", "cover": "/covers/YELLOW15.jpg", "top_chars": "看(4次)、不(3次)", "rec_ids": ["YELLOW16", "GREEN11", "GREEN80"], "rec_chars": ["鷹園真兔白", "原頭貓鼠動", "兔原動地物"], "s": "Yellow 15 不是真的動物  有一天，我去公園。 我看到爺爺和袋鼠坐在椅子上看書。 孩子們在草地上和小馬踢球。 媽媽和白兔一起種花。 還有貓頭鷹在樹上，不睡覺。 我再看一看，它們怎麼都不動? 原來它們都是雕像!"}, {"id": "YELLOW16", "level": "YELLOW", "number": 16, "title_zh": "動物的朋友", "title_en": "Animals’ friends", "topic": "動物", "cover": "/covers/YELLOW16.jpg", "top_chars": "帶(6次)、去(6次)", "rec_ids": ["YELLOW15", "GREEN66", "GREEN74"], "rec_chars": ["鷹園真兔白", "麗園美花動", "耍泳游朋友"], "s": "Yellow 16 動物的朋友  有朋友真好! 花貓帶小狗去屋頂玩耍， 白鵝帶小鴨去池塘裏游泳， 兔子帶青蛙去草地上跳繩， 蜜蜂帶蝴蝶去花園裏採蜂蜜， 黃牛帶小馬去農場吃草， 老鷹帶我飛上天，去看美麗的世界。"}, {"id": "YELLOW17", "level": "YELLOW", "number": 17, "title_zh": "狗兒", "title_en": "The dogs", "topic": "動物", "cover": "/covers/YELLOW17.jpg", "top_chars": "狗(7次)、兒(7次)", "rec_ids": ["GREEN34", "GREEN74", "GREEN15"], "rec_chars": ["見友朋跑過", "散步主友朋", "向著就也隻"], "s": "Yellow 17 狗兒  我牽狗兒去散步， 狗兒看見牠的好朋友，就向前跑， 我也跟著牠向前跑， 牠的好朋友向牠跑過來， 那隻狗兒的主人也跟著跑過來， 不是我們牽狗兒，是狗兒牽我們， 狗兒們的主人也做了好朋友!"}, {"id": "YELLOW18", "level": "YELLOW", "number": 18, "title_zh": "老鷹和兔子", "title_en": "The eagle and the hare", "topic": "動物", "cover": "/covers/YELLOW18.jpg", "top_chars": "子(7次)、兔(6次)", "rec_ids": ["GREEN38", "GREEN80", "GREEN19"], "rec_chars": ["然跑快隻地", "只兔跑老地", "轉跑快飛隻"], "s": "Yellow 18 老鷹和兔子  一隻老鷹在天上飛， 牠看到了地上的兔子， 牠飛快地飛向兔子， 兔子也飛快地逃跑， 老鷹的爪子快要抓到兔子了， 聰明的兔子突然轉彎， 老鷹來不及轉彎，只好飛上天了。"}, {"id": "YELLOW19", "level": "YELLOW", "number": 19, "title_zh": "好看的動物", "title_en": "Nice looking animals", "topic": "動物", "cover": "/covers/YELLOW19.jpg", "top_chars": "加(7次)、圖(7次)", "rec_ids": ["GREEN66", "GREEN41", "YELLOW16"], "rec_chars": ["更條星花動", "馬給魚色動", "馬花動物好"], "s": "Yellow 19 好看的動物  給動物塗色，加圖案? 海星，加上圓圈圖案， 海馬，加上線條圖案， 海豚，加上鑽石圖案， 章魚，加上螺旋圖案， 海龜，加上花兒圖案， 有了圖案，動物更加好看!"}, {"id": "YELLOW20", "level": "YELLOW", "number": 20, "title_zh": "會飛的動物", "title_en": "Flying animals", "topic": "動物", "cover": "/covers/YELLOW20.jpg", "top_chars": "飛(11次)、會(7次)", "rec_ids": ["GREEN28", "GREEN11", "GREEN31"], "rec_chars": ["朋友也動人", "拉猴找就把", "找想會動物"], "s": "Yellow 20 會飛的動物  巫婆有掃把就會飛， 阿拉丁有飛毯就會飛， 超人有披風就會飛， 蜘蛛俠有蜘蛛絲就會飛， 人們有飛行傘就會飛。 小猴子也想飛…... 牠只要找個會飛的好朋友「鸚鵡」，就飛了。"}, {"id": "YELLOW21", "level": "YELLOW", "number": 21, "title_zh": "什麼動物最棒", "title_en": "Who is the most powerful animal?", "topic": "動物", "cover": "/covers/YELLOW21.jpg", "top_chars": "最(10次)、我(9次)", "rec_ids": ["GREEN11", "GREEN38", "GREEN70"], "rec_chars": ["掉洞猴快鼠", "嘴跑跳爬快", "從洞跳得鼠"], "s": "Yellow 21 什麼動物最棒  動物們在樹下七嘴八舌。 豹說:「我跑得最快，我最棒!」 鼴鼠說:「我挖洞最快，我最棒!」 袋鼠說:「我跳得最快，我最棒!」 猴子說:「我爬樹最快，我最棒!」 網子從樹上掉下來， 獵人說:「我最棒!」"}, {"id": "YELLOW22", "level": "YELLOW", "number": 22, "title_zh": "說話的魚", "title_en": "The fish that talks", "topic": "動物", "cover": "/covers/YELLOW22.jpg", "top_chars": "魚(14次)、的(8次)", "rec_ids": ["GREEN9", "GREEN46", "GREEN58"], "rec_chars": ["發電回人家", "噴水會人家", "話電會人家"], "s": "Yellow 22 說話的魚  會吃人的魚，鯊魚。 會噴水的魚，鯨魚。 會發電的魚，電鰻。 會清潔的魚，清潔魚。 會發光的魚，燭光魚。 會回家的魚，鮭魚。 會說話的魚，美人魚。"}, {"id": "YELLOW23", "level": "YELLOW", "number": 23, "title_zh": "動物的腳印", "title_en": "Animal Footprints", "topic": ird", "topic": "身體", "cover": "/covers/YELLOW55.jpg", "top_chars": "小(8次)、畫(6次)", "rec_ids": ["YELLOW31", "YELLOW33", "YELLOW72"], "rec_chars": ["睛眼成兩變", "先睛眼兩再", "嘴體睛眼兩"], "s": "Yellow 55 畫小鳥 Yellow 55 畫小鳥  先畫一個大大的身體， 再畫一個頭。 頭上畫兩隻小小的眼睛， 再加上一個小小的嘴。 身體下面畫一個小尾巴， 再加上身體兩邊的翅膀。 變成小鳥!飛了!再見了!"}, {"id": "YELLOW56", "level": "YELLOW", "number": 56, "title_zh": "動物們吃東西", "title_en": "The animals eat food", "topic": "食物", "cover": "/covers/YELLOW56.jpg", "top_chars": "吃(7次)、說(6次)", "rec_ids": ["GREEN80", "GREEN67", "YELLOW15"], "rec_chars": ["蔔蘿吧兔青", "呀貓鼠動物", "真兔貓鼠動"], "s": "Yellow 56 動物們吃東西  兔子看到紅蘿蔔說:「又要吃紅蘿蔔!」 老鼠看到乳酪說:「又要吃乳酪!」 青蛙看見小蟲說:「又要吃小蟲! 」 小雞看見米說:「又要吃米!」 小貓看見魚說:「又要吃魚!」 動物們說: 「我們來交換吧!」 「哎呀!真難吃!」動物們大叫。"}, {"id": "YELLOW57", "level": "YELLOW", "number": 57, "title_zh": "小鱷魚吃東西", "title_en": "The Little crocodile eats food", "topic": "食物", "cover": "/covers/YELLOW57.jpg", "top_chars": "吃(5次)、牠(5次)", "rec_ids": ["GREEN78", "GREEN89", "GREEN90"], "rec_chars": ["脆薯食東片", "淇淋薯食片", "薯食片西多"], "s": "Yellow 57 小鱷魚吃東西  小鱷魚看到很多食物， 牠吃了薯片，脆脆的。 牠吃了漢堡，軟軟的。 牠吃了冰淇淋，冰冰的。 牠喝了汽水，甜甜的。 牠看到很多叉子。 小鱷魚不能吃東西了!"}, {"id": "YELLOW58", "level": "YELLOW", "number": 58, "title_zh": "做餅乾", "title_en": "To make cookies", "topic": "食物", "cover": "/covers/YELLOW58.jpg", "top_chars": "洞(5次)、把(4次)", "rec_ids": ["YELLOW62", "GREEN73", "GREEN83"], "rec_chars": ["揉擀粉麵油", "揉倒糖奶然", "粉麵油烤糖"], "s": "Yellow 58 做餅乾  一堆麵粉，中間挖個洞， 把雞蛋放進洞裏， 把牛油放進洞裏， 把牛奶倒進洞裏， 把糖放進洞裏， 然後，揉麵和擀麵，再切成餅乾形狀去烤一烤。 餅乾烤好了，好香!"}, {"id": "YELLOW59", "level": "YELLOW", "number": 59, "title_zh": "甜餅乾", "title_en": "Cookies", "topic": "食物", "cover": "/covers/YELLOW59.jpg", "top_chars": "弟(8次)、媽(8次)", "rec_ids": ["GREEN48", "GREEN54", "GREEN75"], "rec_chars": ["寫張條怕又", "藏又給多地", "生又給起他"], "s": "Yellow 59 甜餅乾  弟弟愛吃甜餅乾， 媽媽不要弟弟吃太多甜餅乾， 弟弟常常偷吃甜餅乾， 媽媽生氣地藏起甜餅乾。 弟弟又偷吃了，他怕媽媽生氣…... 他寫一張字條給媽媽， 「我只吃了一塊!」"}, {"id": "YELLOW60", "level": "YELLOW", "number": 60, "title_zh": "新鮮的水果", "title_en": "Fresh fruits", "topic": "食物", "cover": "/covers/YELLOW60.jpg", "top_chars": "果(6次)、做(6次)", "rec_ids": ["RED68", "RED76", "GREEN79"], "rec_chars": ["莓蕉淇淋香", "萄莓葡蘋蕉", "蘋成果做水"], "s": "Yellow 60 新鮮的水果  蘋果，做成蘋果派。 鳳梨，做成鳳梨酥。 香蕉，做成香蕉蛋糕。 芒果，做成芒果布丁。 葡萄，做成葡萄冰棍兒。 草莓，做成草莓冰淇淋。 還是新鮮的水果好吃。"}, {"id": "YELLOW61", "level": "YELLOW", "number": 61, "title_zh": "剩下的食物", "title_en": "Leftovers", "topic": "食物", "cover": "/covers/YELLOW61.jpg", "top_chars": "剩(5次)、的(5次)", "rec_ids": ["GREEN85", "YELLOW62", "GREEN82"], "rec_chars": ["肉菜食香飯", "油倒加點進", "肉菜加點它"], "s": "Yellow 61 剩下的食物  剩下的飯， 剩下的肉， 剩下的菜， 把它們全部倒進鍋裏， 加一點油，炒!炒!炒! 香噴噴的炒飯做好了! 炒飯吃光了!一點都不剩!"}, {"id": "YELLOW62", "level": "YELLOW", "number": 62, "title_zh": "蔥油餅", "title_en": "Green onion pancakes", "topic": "食物", "cover": "/covers/YELLOW62.jpg", "top_chars": "麵(6次)、用(5次)", "rec_ids": ["GREEN79", "GREEN82", "YELLOW58"], "rec_chars": ["碗塊成拿後", "蔥餅加點然", "揉擀粉麵油"], "s": "Yellow 62 蔥油餅  把麵粉放進大碗裏， 加點水，用筷子攪一攪， 把攪好的麵粉倒出來，用手揉成一個大麵糰， 拿一小塊麵糰，用擀麵棍擀平， 上面放油、蔥和鹽， 再用手捲起來壓平，然後拿擀麵棍擀平。 最後用油煎一煎，蔥油餅就做好了!"}, {"id": "YELLOW63", "level": "YELLOW", "number": 63, "title_zh": "大水", "title_en": "The flood", "topic": "自然", "cover": "/covers/YELLOW63.jpg", "top_chars": "寶(6次)、子(5次)", "rec_ids": ["GREEN55", "GREEN35", "YELLOW62"], "rec_chars": ["拿起把隻家", "回寶隻家個", "拿起水把個"], "s": "Yellow 63 大水  大水來了， 盆子裏有一個小寶寶， 大樹上有幾隻猴子， 牠們拿起盆子， 牠們摸摸盆子裏的寶寶， 大水退了! 猴子們把寶寶送回家!"}, {"id": "YELLOW64", "level": "YELLOW", "number": 64, "title_zh": "沒有下雨", "title_en": "No rain", "topic": "自然", "cover": "/covers/YELLOW64.jpg", "top_chars": "了(7次)、沒(3次)", "rec_ids": ["YELLOW69", "GREEN28", "GREEN46"], "rec_chars": ["乾頭沒水樹", "死沒可樹地", "龍怕頭沒水"], "s": "Yellow 64 沒有下雨  很久沒有下雨了， 土地，裂了， 玉米，死了， 樹，枯了， 池塘，乾了， 水龍頭，沒水了， 可怕的旱災來了!"}, {"id": "YELLOW65", "level": "YELLOW", "number": 65, "title_zh": "堅果", "title_en": "A nut", "topic": "自然", "cover": "/covers/YELLOW65.jpg", "top_chars": "堅(5次)、果(5次)", "rec_ids": ["GREEN11", "YELLOW15", "GREEN80"], "rec_chars": ["洞松找進出", "種再它鼠起", "誰心找想地"], "s": "Yellow 65 堅果  小松鼠找到一個堅果， 牠在地上挖了一個洞， 把堅果放進去， 再把堅果埋起來。 冬天到了，小松鼠找不到堅果。 春天到了，樹芽出來了， 小松鼠看著它，心裏想:是誰種的小樹?"}, {"id": "YELLOW66", "level": "YELLOW", "number": 66, "title_zh": "寶石", "title_en": "A diamond", "topic": "自然", "cover": "/covers/YELLOW66.jpg", "top_chars": "小(4次)、綠(4次)", "rec_ids": ["GREEN55", "GREEN11", "GREEN23"], "rec_chars": ["窗讓走開鳥", "石躲進出樹", "走出飛多隻"], "s": "Yellow 66 寶石  下大雪，樹枝上好多雪。 一隻小綠鳥躲在樹枝裏， 我開窗讓小綠鳥飛進來。 雪停了，太陽出來了， 我開窗讓小綠鳥飛走。 「叩!叩!」是小綠鳥在敲窗， 我打開窗，哇!一顆寶石!"}, {"id": "YELLOW67", "level": "YELLOW", "number": 67, "title_zh": "鳥蛋", "title_en": "The bird’s eggs", "topic": "自然", "cover": "/covers/YELLOW67.jpg", "top_chars": "鳥(6次)、有(4次)", "rec_ids": ["GREEN32", "GREEN9", "GREEN38"], "rec_chars": ["掉爬想下樹", "蛋下爸裏要", "爬樹裏好要"], "s": "Yellow 67 鳥蛋  有一座山， 山上有一棵樹， 樹上有鳥窩， 鳥窩裏有幾顆鳥蛋。 一條蛇來了，牠爬上樹了， 牠看到鳥蛋，正想要吃，鳥爸爸來了， 「哎呀!好痛!」蛇從樹上掉下來了!"}, {"id": "YELLOW68", "level": "YELLOW", "number": 68, "title_zh": "植物", "title_en": "A plant", "topic": "自然", "cover": "/covers/YELLOW68.jpg", "top_chars": "植(4次)、物(4次)", "rec_ids": ["GREEN11", "GREEN55", "GREEN80"], "rec_chars": ["原聽出面把", "音原聽開面", "原開兒地物"], "s": "Yellow 68 植物  阿姨送我一棵植物， 我把它放在鋼琴上面， 我天天彈鋼琴給它聽， 植物長出新葉， 長出花苞， 花兒一朵朵地開了! 阿姨說:「原來植物也愛聽音樂!」"}, {"id": "YELLOW69", "level": "YELLOW", "number": 69, "title_zh": "星球", "title_en": "The planets", "topic": "自然", "cover": "/covers/YELLOW69.jpg", "top_chars": "球(9次)、星(8次)", "rec_ids": ["GREEN79", "YELLOW43", "GREEN46"], "rec_chars": ["沙都就什多", "石沙頭星都", "頭都什沒多"], "s": "Yellow 69 星球  這個星球光禿禿的，沒有樹。 這個星球平平的，沒有山。 這個星球太乾了，沒有水。 這個星球很多沙，沒有石頭。 這個星球太黑了，沒有光。 這個星球臭臭的，沒有空氣。 這個星球什麼都有，那就是地球。"}, {"id": "YELLOW70", "level": "YELLOW", "number": 70, "title_zh": "彩虹", "title_en": "The rainbows", "topic": "自然", "cover": "/covers/YELLOW70.jpg", "top_chars": "彩(5次)、虹(5次)", "rec_ids": ["GREEN50", "GREEN55", "GREEN77"], "rec_chars": ["那也家你裏", "音聲聽也家", "係關沒也麼"], "s": "Yellow 70 彩虹  你聽!嘩!嘩!嘩! 是什麼聲音? 是瀑布，好大的瀑布! 你看!那裏有一道彩虹! 你看!那裏也有一道彩虹! 咦!彩虹不見了! 「沒關係，我們回家看彩虹!」"}, {"id": "YELLOW71", "level": "YELLOW", "number": 71, "title_zh": "數數看", "title_en": "Let’s count", "topic": "數字", "cover": "/covers/YELLOW71.jpg", "top_chars": "數(16次)、隻(12次)", "rec_ids": ["GREEN6", "YELLOW76", "RED85"], "rec_chars": ["九七八十六", "七六五四隻", "八十六幾四"], "s": "Yellow 71 數數看  數數看，有幾條蛇? 四條。 數數看，有幾隻毛毛蟲? 五隻。 數數看，有幾隻螞蟻? 六隻。 數數看，有幾隻螢火蟲? 七隻。 數數看，有幾隻蜘蛛? 八隻。 數數看，有幾隻蝌蚪? 九隻。 數數看，有幾隻瓢蟲?十隻。"}, {"id": "YELLOW72", "level": "YELLOW", "number": 72, "title_zh": "二四六八十", "title_en": "Two four six eight ten", "topic": "數字", "cover": "/covers/YELLOW72.jpg", "top_chars": "的(6次)、個(4次)", "rec_ids": ["GREEN69", "YELLOW55", "YELLOW76"], "rec_chars": ["體睛四眼身", "嘴體睛眼兩", "六四二兩頭"], "s": "Yellow 72 二四六八十  牠有一個大大的身體， 兩個小小的頭， 四個圓圓的嘴， 六個方方的眼睛， 八隻長長的手， 十隻短短的腳。 牠就是怪物!"}, {"id": "YELLOW73", "level": "YELLOW", "number": 73, "title_zh": "多少", "title_en": "How many?", "topic": "數字", "cover": "/covers/YELLOW73.jpg", "top_chars": "少(6次)、多(5次)", "rec_ids": ["GREEN28", "GREEN83", "GREEN44"], "rec_chars": ["也人物個和", "歲日糕過生", "歲過生人物"], "s": "Yellow 73 多少  過生日，有禮物、蛋糕和蠟燭。 你的禮物有多少? 不多也不少。 你的小蛋糕有多少? 一人一個，剛剛好。 你的蠟燭有多少? 六歲六根，一根也不少。"}, {"id": "YELLOW74", "level": "YELLOW", "number": 74, "title_zh": "第一第二第三", "title_en": "The first, second and third", "topic": "數字", "cover": "/covers/YELLOW74.jpg", "top_chars": "飛(7次)、第(6次)", "rec_ids": ["GREEN20", "GREEN9", "GREEN16"], "rec_chars": ["每二三最又", "第機回都把", "最又得也把"], "s": "Yellow 74 第一第二第三  每個小朋友都摺了紙飛機， 一、二、三，把飛機扔出去。 我的飛得最遠，是第一。 你的飛得不遠也不近，是第二。 他的飛得最近，是第三。 小胖的飛出去又飛回來， 小胖的最棒!"}, {"id": "YELLOW75", "level": "YELLOW", "number": 75, "title_zh": "第四", "title_en": "The fourth one", "topic": "數字", "cover": "/covers/YELLOW75.jpg", "top_chars": "第(5次)、張(4次)", "rec_ids": ["GREEN15", "GREEN74", "YELLOW15"], "rec_chars": ["接舔怎麼地", "怎第二麼地", "怎貓麼地到"], "s": "Yellow 75 第四  第一張餅，翻過來， 掉在地上，狗吃了。 第二張餅，翻過來， 掉在窗台，貓舔了。 第三張餅，翻過來， 怎麼不見了? 第四張餅，翻過來，接到了!"}, {"id": "YELLOW76", "level": "YELLOW", "number": 76, "title_zh": "一二三四五六七", "title_en": "1234567", "topic": "數字", "cover": "/covers/YELLOW76.jpg", "top_chars": "隻(4次)、了(4次)", "rec_ids": ["YELLOW72", "GREEN6", "GREEN20"], "rec_chars": ["六四二兩頭", "陪七六五四", "五四二三隻"], "s": "Yellow 76 一二三四五六七  一隻大豬，跌了一跤， 頭上有了兩個大包， 三隻腳斷了， 四隻熊來抬牠， 五個狗醫生來了， 六隻小豬來看牠， 七顆星星來陪牠!"}, {"id": "YELLOW77", "level": "YELLOW", "number": 77, "title_zh": "四季", "title_en": "The four seasons", "topic": "天氣/季節", "cover": "/covers/YELLOW77.jpg", "top_chars": "天(5次)、四(3次)", "rec_ids": ["GREEN5", "GREEN72", "GREEN29"], "rec_chars": ["為學什麼去", "假為什沒麼", "春冬為都沒"], "s": "Yellow 77 四季  一年有四季， 春天、夏天、秋天和冬天。 新加坡沒有四季， 新加坡一年都是夏天。 我要去那裏! 為什麼? 一年都是暑假，不用上學!"}, {"id": "YELLOW78", "level": "YELLOW", "number": 78, "title_zh": "天氣", "title_en": "The weather", "topic": "天氣/季節", "cover": "/covers/YELLOW78.jpg", "top_chars": "星(7次)、期(7次)", "rec_ids": ["YELLOW76", "RED88", "GREEN4"], "rec_chars": ["六五四二三", "六五四期二", "陰晴沙雨天"], "s": "Yellow 78 天氣  星期一，晴天。 星期二，陰天。 星期三，雨天。 星期四，有冰雹。 星期五，有大霧。 星期六，有大風。 星期天，有沙塵暴!"}, {"id": "YELLOW79", "level": "YELLOW", "number": 79, "title_zh": "冬天和春天", "title_en": "Winter and spring", "topic": "天氣/季節", "cover": "/covers/YELLOW79.jpg", "top_chars": "天(6次)、樹(4次)", "rec_ids": ["GREEN11", "GREEN29", "YELLOW65"], "rec_chars": ["原變樹和天", "春冬原和天", "春冬樹天到"], "s": "Yellow 79 冬天和春天  冬天到了， 樹葉變黑色? 原來是黑鳥在樹上。 冬天的樹，光禿禿的。 春天到了， 是 不是綠鳥在樹上? 啊!原來是春天到，長綠葉了!"}, {"id": "YELLOW80", "level": "YELLOW", "number": 80, "title_zh": "颱風", "title_en": "Typhoon", "topic": "天氣/季節", "cover": "/covers/YELLOW80.jpg", "top_chars": "了(6次)、風(3次)", "rec_ids": ["GREEN55", "GREEN47", "GREEN50"], "rec_chars": ["倒原電房大", "吹雨房風大", "影電房下子"], "s": "Yellow 80 颱風  下大雨了， 吹大風了， 大樹倒了， 房子歪了， 汽車翻了， 颱風來了。 原來是拍電影。"}, {"id": "YELLOW81", "level": "YELLOW", "number": 81, "title_zh": "晴天", "title_en": "Sunny day", "topic": "天氣/季節", "cover": "/covers/YELLOW81.jpg", "top_chars": "天(4次)、陽(3次)", "rec_ids": ["GREEN16", "GREEN98", "GREEN100"], "rec_chars": ["陽公喜歡雨", "喜歡點雨愛", "陽點雨太快"], "s": "Yellow 81 晴天  親愛的太陽公公， 你躲到哪裏去了? 我不喜歡雨天， 我也不喜歡陰天， 我喜歡晴天。 你快點出來，好不好? 想念你的陽陽!"}, {"id": "YELLOW82", "level": "YELLOW", "number": 82, "title_zh": "很酷的顏色", "title_en": "Cool colors", "topic": "顏色", "cover": "/covers/YELLOW82.jpg", "top_chars": "的(8次)、色(8次)", "rec_ids": ["YELLOW85", "YELLOW83", "YEL : "YELLOW88", "level": "YELLOW", "number": 88, "title_zh": "一層一層衣服", "title_en": "Layers of clothes", "topic": "衣物", "cover": "/covers/YELLOW88.jpg", "top_chars": "衣(6次)、一(5次)", "rec_ids": ["GREEN39", "GREEN92", "YELLOW87"], "rec_chars": ["冷加毛衣這", "再這穿長面", "今衣穿長天"], "s": "yellow 88 一層一層衣服  今天天氣非常冷， 我穿上內衣， 穿上長袖衣服， 又穿上毛衣， 外面加一件外套， 再加上大風衣。 這就是洋蔥穿衣法，一層又一層。"}, {"id": "YELLOW89", "level": "YELLOW", "number": 89, "title_zh": "姐姐穿衣服", "title_en": "Elder sister gets dressed", "topic": "衣物", "cover": "/covers/YELLOW89.jpg", "top_chars": "姐(6次)、的(5次)", "rec_ids": ["YELLOW83", "YELLOW87", "YELLOW82"], "rec_chars": ["襪褲紫裙橙", "裙今衣穿姐", "鏡褲紫橙黃"], "s": "Yellow 89 姐姐穿衣服  爸爸的藍褲子， 姐姐的黃裙子， 妹妹的橙上衣， 哥哥的紫襪子。 洗好了，看!我們的彩虹衣。 姐姐看看鏡子說:「我真漂亮!」 媽媽說:「今天要上學，穿校服。」"}, {"id": "YELLOW90", "level": "YELLOW", "number": 90, "title_zh": "害怕", "title_en": "Frightened", "topic": "情緒", "cover": "/covers/YELLOW90.jpg", "top_chars": "躲(7次)、在(7次)", "rec_ids": ["YELLOW12", "YELLOW13", "GREEN51"], "rec_chars": ["心兒妹你在", "哪她兒你裏", "所她你裏在"], "s": "Yellow 90 害怕  害怕時，你躲在哪兒? 躲在棉被裏。 傷心時，你躲在哪兒? 躲在廁所裏。 害羞時，你躲在哪兒? 躲在媽媽的懷裏。 妹妹害羞時，我讓她躲在我的懷裏。"}, {"id": "YELLOW91", "level": "YELLOW", "number": 91, "title_zh": "笑臉", "title_en": "A happy face", "topic": "情緒", "cover": "/covers/YELLOW91.jpg", "top_chars": "臉(5次)、了(5次)", "rec_ids": ["RED60", "GREEN15", "GREEN35"], "rec_chars": ["笑哥都姐妹", "害怕花狗很", "害都家很大"], "s": "Yellow 91 笑臉  萬聖節到了， 哥哥戴了鬼臉， 妹妹很害怕! 姐姐畫了貓臉， 小狗很驚訝! 弟弟畫了花臉， 大家都有了笑臉!"}, {"id": "YELLOW92", "level": "YELLOW", "number": 92, "title_zh": "節日", "title_en": "Festivals (1)", "topic": "節慶", "cover": "/covers/YELLOW92.jpg", "top_chars": "節(4次)", "rec_ids": ["YELLOW93", "GREEN34", "GREEN82"], "rec_chars": ["元端宵秋年", "中過花去看", "年包中拿去"], "s": "Yellow 92 節日 (1)  元宵節， 看花燈。 端午節， 賽龍舟。 中秋節， 去賞月。 過新年，拿紅包。"}, {"id": "YELLOW93", "level": "YELLOW", "number": 93, "title_zh": "節日 (2)", "title_en": "Festivals (2)", "topic": "節慶", "cover": "/covers/YELLOW93.jpg", "top_chars": "節(4次)、吃(4次)", "rec_ids": ["YELLOW92", "GREEN82", "GREEN4"], "rec_chars": ["元端宵秋年", "年餅中吃子", "午中過吃"], "s": "Yellow 93 節日 (2)  元宵節， 吃湯圓。 端午節， 吃粽子。 中秋節， 吃月餅。 過新年，吃年糕。"}, {"id": "YELLOW94", "level": "YELLOW", "number": 94, "title_zh": "醫生", "title_en": "Doctor", "topic": "職業", "cover": "/covers/YELLOW94.jpg", "top_chars": "生(8次)、醫(7次)", "rec_ids": ["GREEN76", "YELLOW95", "GREEN73"], "rec_chars": ["喉嚨針病痛", "針病醫打生", "針痛醫頭打"], "s": "Yellow 94 醫生 醫生，我生病了。 醫生，我頭痛。 醫生，我喉嚨痛。 醫生，我耳朵痛。 醫生，我肚子痛。 護士給我打一針。 醫生，我屁股也痛了。"}, {"id": "YELLOW95", "level": "YELLOW", "number": 95, "title_zh": "醫院", "title_en": "The hospital", "topic": "職業", "cover": "/covers/YELLOW95.jpg", "top_chars": "狗(8次)、醫(5次)", "rec_ids": ["GREEN34", "GREEN43", "GREEN76"], "rec_chars": ["帶這給也狗", "啊帶也動物", "針病醫帶打"], "s": "Yellow 95 醫院  狗狗生病了， 我們帶狗狗去動物醫院， 醫生給狗狗看病， 給狗狗打針、吃藥。 我說: 「醫生，我也要看病!」 他說: 「這是動物醫院。」 我說: 「我也是動物啊!」"}, {"id": "YELLOW96", "level": "YELLOW", "number": 96, "title_zh": "是學生", "title_en": "A student", "topic": "職業", "cover": "/covers/YELLOW96.jpg", "top_chars": "他(12次)、是(8次)", "rec_ids": ["GREEN7", "GREEN54", "GREEN80"], "rec_chars": ["知道服衣就", "筒帽服衣他", "廚就人他看"], "s": "Yellow 96 是學生  看他的鼻子，猜他是小丑。 看他的帽子，猜他是廚師。 看他的聽筒，猜他是醫生。 看他的衣服，猜他是救火員。 看他的徽章，猜他是警察。 看他的腰帶，猜他是工人。 看我的校服，就知道我是學生。"}, {"id": "YELLOW97", "level": "YELLOW", "number": 97, "title_zh": "長大要做什麼", "title_en": "What do you want to be when you grow up?", "topic": "職業", "cover": "/covers/YELLOW97.jpg", "top_chars": "要(8次)、人(7次)", "rec_ids": ["GREEN70", "GREEN84", "GREEN60"], "rec_chars": ["舞問做什麼", "長做什想麼", "舞師當做什"], "s": "Yellow 97 長大要做什麼  大人愛問我們:「你長大要做什麼?」 有的人要當舞蹈家， 有的人要當老師， 有的人要當廚師， 有的人要當畫家， 有的人要當太空人。 我說:「我要當小孩，不想長大!」"}, {"id": "YELLOW98", "level": "YELLOW", "number": 98, "title_zh": "坐直升機", "title_en": "Take a helicopter", "topic": "交通工具", "cover": "/covers/YELLOW98.jpg", "top_chars": "坐(7次)、我(6次)", "rec_ids": ["GREEN50", "GREEN66", "YELLOW99"], "rec_chars": ["真機電房多", "美巴多地很", "纜鐵士山機"], "s": "Yellow 98 坐直升機  這個地方有很多交通工具。 坐電車，我看到很多店。 坐地下鐵，我看到很多人。 坐渡輪，我看到很多船。 坐雙層巴士，我看到很多房子。 坐纜車，我看到高山和的大海。 坐直升機，我看到這個地方，真美!"}, {"id": "YELLOW99", "level": "YELLOW", "number": 99, "title_zh": "不同的車", "title_en": "Different vehicles", "topic": "交通工具", "cover": "/covers/YELLOW99.jpg", "top_chars": "坐(6次)、車(4次)", "rec_ids": ["GREEN12", "GREEN15", "GREEN82"], "rec_chars": ["先站再然後", "先站滑然後", "國先中再然"], "s": "Yellow 99 不同的車  我先坐計程車， 到了地鐵站，去坐地鐵。 再坐機場快線，去機場， 又坐飛機，去中國。 然後，坐機場巴士到纜車站。 最後，坐纜車上山， 我終於可以滑雪了!"}, {"id": "YELLOW100", "level": "YELLOW", "number": 100, "title_zh": "坐什麼車快", "title_en": "Which vehicle is faster?", "topic": "交通工具", "cover": "/covers/YELLOW100.jpg", "top_chars": "車(11次)、坐(10次)", "rec_ids": ["YELLOW32", "YELLOW99", "GREEN7"], "rec_chars": ["汽騎車飛什", "機坐最快車", "路電走什麼"], "s": "Yellow 100坐什麼車快  騎自行車比走路快， 坐電車比騎自行車快， 坐公共汽車比坐電車快， 坐汽車比坐公共汽車快， 坐火車比坐汽車快， 坐飛機比坐火車快， 火箭最快!"}, {"id": "GREEN1", "level": "GREEN", "number": 1, "title_zh": "說秘密", "title_en": "Going to school", "topic": "日常活動", "cover": "/covers/GREEN1.jpg", "top_chars": "秘(7次)、密(7次)", "rec_ids": ["GREEN27", "GREEN80", "GREEN7"], "rec_chars": ["蛙知道青想", "別青原就想", "知道原就人"], "s": "Green 1 說秘密  青蛙有一個秘密，牠把秘密告訴了小蝸牛。 小蝸牛把秘密告訴了小烏龜。 小烏龜又告訴了小金魚。 小金魚看到青蛙說:「我知道你的秘密了!」 青蛙想:「原來，秘密是不能說的，告訴別人就不是秘密了。」"}, {"id": "GREEN2", "level": "GREEN", "number": 2, "title_zh": "上學", "title_en": "Going to school", "topic": "日常活動", "cover": "/covers/GREEN2.jpg", "top_chars": "小(7次)、狗(7次)", "rec_ids": ["GREEN70", "GREEN28", "GREEN74"], "rec_chars": ["從問友朋做", "用友朋沒也", "從常友朋做"], "s": "Green 2 上學  阿姨有隻小狗，我常常抱牠、親牠。 小狗明天要上學了，我從來沒聽過，小狗也要上學。 我問阿姨:「小狗上學，是不是學中文、英文和體育?」 她說:「不是!小狗要學和不同種類、不同大小的狗做朋友。」 我對小狗說:「你真幸運!不用做功課。」"}, {"id": "GREEN3", "level": "GREEN", "number": 3, "title_zh": "數一數", "title_en": "Counting", "topic": "日常活動", "cover": "/covers/GREEN3.jpg", "top_chars": "數(13次)、一(8次)", "rec_ids": ["GREEN7", "GREEN50", "GREEN58"], "rec_chars": ["只為手沒麼", "己只自家去", "己只自給人"], "s": "Green 3 數一數  [ 家裏有幾個人?」 弟弟數一數，少了一個人，因為忘了數自己。 「你有幾枝筆?」 弟弟數一數，少了一枝筆，因為忘了數自己手上的筆。 我們去騎馬，弟弟數一數說:「這裏共有十匹馬。」這次，他沒有忘記數自己騎的馬。 我誇他很聰明，給他十顆糖。 他放了一顆在口裏，又去數一數糖，他說:「咦!怎麼只有九顆糖呢?」"}, {"id": "GREEN4", "level": "GREEN", "number": 4, "title_zh": "誰是書蟲", "title_en": "Who is the bookworm?", "topic": "日常活動", "cover": "/covers/GREEN4.jpg", "top_chars": "讀(13次)、書(6次)", "rec_ids": ["GREEN72", "GREEN7", "GREEN40"], "rec_chars": ["早床嗎見走", "樣走做就會", "躺晚床發中"], "s": "Green 4 誰是書蟲  有個人很愛看書。早上讀，中午讀，晚上讀。晴天讀，陰天讀，雨天讀。 在沙發上讀，在床上讀，在馬桶上讀。坐著讀，走著讀，躺著讀。 最厲害的是把書倒放在地上，他靠著牆壁做倒立，倒著讀。 你見過這樣的人嗎? 他就叫「書蟲」。 我就是一個書蟲，不過，我不是那隻會吃書的蟲。"}, {"id": "GREEN5", "level": "GREEN", "number": 5, "title_zh": "做我喜歡的事", "title_en": "Doing things that I like to do", "topic": "日常活動", "cover": "/covers/GREEN5.jpg", "top_chars": "我(9次)、星(6次)", "rec_ids": ["GREEN7", "GREEN72", "GREEN9"], "rec_chars": ["鋼彈琴泳只", "爺為這什下", "午五飯下去"], "s": "Green 5 做我喜歡的事  星期一到星期五，我要上學，學中文、英文和數學。 星期六上午，我要學游泳和打網球。下午，我要學體操和彈鋼琴。 星期天中午，我要和爺爺、奶奶吃午飯。晚上，我要和外公、外婆吃晚飯。 一個星期為什麼只有七天?我要一個星期八。 這一天，我什麼也不學，哪裏也不去，只做我喜歡的事。"}, {"id": "GREEN6", "level": "GREEN", "number": 6, "title_zh": "捉迷藏", "title_en": "Hide and seek", "topic": "日常活動", "cover": "/covers/GREEN6.jpg", "top_chars": "小(9次)、了(4次)", "rec_ids": ["GREEN74", "GREEN9", "GREEN11"], "rec_chars": ["二原呢友朋", "箱五四藏找", "迷捉原藏躲"], "s": "Green 6 捉迷藏  只有我在家，沒人陪我玩。對了!可以和小狗、小羊和小兔捉迷藏。 「一二三四五六七八九十，躲好了沒有?」 啊! 找到你們了，小狗和小兔在床下。 可是，小羊呢? 「小朋友，你可以幫忙找一找小羊嗎?」 哦! 原來小羊躲在箱子裏面睡著了!"}, {"id": "GREEN7", "level": "GREEN", "number": 7, "title_zh": "練習", "title_en": "Practice", "topic": "日常活動", "cover": "/covers/GREEN7.jpg", "top_chars": "到(5次)、一(5次)", "rec_ids": ["GREEN74", "GREEN29", "GREEN55"], "rec_chars": ["路泳原游走", "原兩走為以", "原電走手得"], "s": "Green 7 練習  我在電腦上，看到一隻只有兩隻腳的狗，可是，牠可以像人一樣走路。 我在電腦上，看到一個沒有手指的女孩，可是，她很會彈鋼琴。 我在電腦上，看到一個沒有雙手的人，可是，他很會用腳做衣服。 我在電腦上，看到一個沒有手和腳的人，可是，他很會游泳。 你知道為他們為什麼做得到? 原來，他們就是練習、練習再練習。"}, {"id": "GREEN8", "level": "GREEN", "number": 8, "title_zh": "玩接龍遊戲", "title_en": "Play a Word Chain game", "topic": "日常活動", "cover": "/covers/GREEN8.jpg", "top_chars": "玩(4次)、接(4次)", "rec_ids": ["GREEN9", "GREEN4", "GREEN6"], "rec_chars": ["椅戲午遊吧", "午中嗎坐過", "嗎朋友找玩"], "s": "Green 8 玩接龍遊戲  接龍遊戲，你玩過吧! 中文接龍遊戲，你玩過嗎? 喝水>水草->草地->地球->球拍->拍手 中國->國家->家人->人山人海->海象 坐下->下午->午飯->飯桌->桌椅->椅子 你要不要找幾個朋友，一起玩中文接龍遊戲?"}, {"id": "GREEN9", "level": "GREEN", "number": 9, "title_zh": "找蛋遊戲", "title_en": "Egg Hunt game", "topic": "日常活動", "cover": "/covers/GREEN9.jpg", "top_chars": "找(7次)、蛋(6次)", "rec_ids": ["GREEN89", "GREEN80", "GREEN61"], "rec_chars": ["買場巧克力", "吧發飯回找", "戲遊吧回面"], "s": "Green 9 找蛋遊戲  復活節到了，我們一家人去商場買了五個巧克力蛋。 回到家，我們一起玩找蛋遊戲，爸爸把巧克力蛋都藏起來。 在電視機面、冰箱裏面、沙發椅墊後面和書架上面，我們找到四個蛋。 但是，我們找來找去都找不到第五個蛋。爸爸說:「吃完午飯，你們再找吧!」 我們坐下來要吃午飯的時候，看到弟弟滿嘴都是巧克力。"}, {"id": "GREEN10", "level": "GREEN", "number": 10, "title_zh": "學游泳", "title_en": "Learning to swim", "topic": "日常活動", "cover": "/covers/GREEN10.jpg", "top_chars": "海(9次)、們(8次)", "rec_ids": ["GREEN15", "GREEN80", "GREEN55"], "rec_chars": ["沖站向害然", "怕跑心這開", "跑後開著把"], "s": "Green 10 學游泳  狗爸爸和狗媽媽帶著小狗們去海邊，想要教牠們游泳。 到了海邊，牠們一個一個下車，開心地在海邊跑來跑去。 狗爸爸在海裏，小狗們站在海邊看，牠們害怕地往後退。 突然，一個大海浪沖向海邊，把小狗們捲進海裏。 牠們拼命地游向海邊，就這樣，牠們學會游泳了。"}, {"id": "GREEN11", "level": "GREEN", "number": 11, "title_zh": "躲貓貓", "title_en": "Duo mao mao(colloquial Chinese for hide-and-seek)", "topic": "日常活動", "cover": "/covers/GREEN11.jpg", "top_chars": "貓(14次)、躲(8次)", "rec_ids": ["GREEN38", "GREEN32", "GREEN67"], "rec_chars": ["忽聲松然快", "但掉然進出", "忽掉松然貓"], "s": "Green 11 躲貓貓  捉迷藏又叫「躲貓貓」。一天，小象、猴子、松鼠和小貓玩「躲貓貓」。 小象躲在石頭後面，猴子躲在樹上，松鼠很快就找到牠們了。 但是，牠找不到小貓。忽然，牠聽到「喵喵」的叫聲。原來，牠躲在洞裏。 小貓說: 「我不是躲在洞裏，我是掉進洞裏!」 於是，動物們一個拉一個，把小貓救出來了。「躲貓貓」變成了「救貓貓」。"}, {"id": "GREEN12", "level": "GREEN", "number": 12, "title_zh": "燙鞦韆", "title_en": "To swing", "topic": "日常活動", "cover": "/covers/GREEN12.jpg", "top_chars": "我(7次)、盪(6次)", "rec_ids": ["GREEN10", "GREEN25", "GREEN80"], "rec_chars": ["教站學然跑", "關然跑後開", "跑心這開就"], "s": "Green 12 燙鞦韆  小胖在盪鞦韆，盪過來又盪遇去。我也想盪鞦韆，可是我不會。 小胖就教我，到遠一點的地方，先站好，然後跑，再跳。 我就學小胖，先站好，然後跑，再跳，結果，我飛過去了。 小胖說:「沒關係，再來一次! 到遠一點的地方。」我又先站好，然後跑，再跳。 這次，剛剛好。我好開心地盪過來又盪過去!"}, {"id": "GREEN13", "level": "GREEN", "number": 13, "title_zh": "怕鬼", "title_en": "Being afraid of ghosts", "topic": "日常活動", "cover": "/covers/GREEN13.jpg", "top_chars": "怕(9次)、我(9次)", "rec_ids": ["GREEN70", "GREEN25", "YELLOW9"], "rec_chars": ["跌因為朋友", "朋友怕開著", "為車著什下"], "s": "Green 13 怕鬼  騎車，我怕跌下來。攀岩，我怕掉下來。 划船，我怕船翻了。沖浪，我怕沈下去。 笨豬跳，我怕高。跳傘，我怕傘不開。 朋友笑著說:「你什麼都怕，你是膽小鬼!」 我說:「不要叫我膽小鬼，因為我怕鬼!」"}, {"id": "GREEN14", "level": "GREEN", "number": 14, "title_zh": "想要有一雙鞋", "title_en": "Imagine that I have a pair of shoes", "topic": "日常活動", "cover": "/covers/GREEN14.jpg", "top_chars": "它(8次)、有(6次)", "rec_ids": ["GREEN55", "GREEN57", "GREEN38"], "rec_chars": ["走跑面得飛", "空以還面想", "跑跳快還面"], "s": "Green 14 想要有一雙鞋  我想要有一雙鞋子，一雙神奇的鞋子。 它有小馬達，穿上它，可以跑得很快。 它有彈簧 穿上它，可以彈起來，跳過去。 它有氣墊，穿上它，可以在水面上走。 它有螺旋槳，穿上它，還可以在空中飛!"}, {"id": "GREEN15", "level": "GREEN", "number": 15, "title_zh": "滑滑梯", "title_en": "Sliding down a slide", "topic": "日常活動", "cover": "/covers/GREEN15.jpg", "top_chars": "滑(11次)、我(9次)", "rec_ids": ["GREEN10", "GREEN29", "GREEN49"], "rec_chars": ["沖站向害然", "向慢後以面", "梯怎爬還就"], "s": "Green 15 滑滑梯  我帶我的小狗去滑滑梯，我們慢慢地向上爬。 爬到滑梯上面，我先滑下，小狗還站在上面。 我滑下來以後，發現滑梯上面的小狗很害怕，我怎麼叫，牠也不肯滑下來! 忽然，我看到一隻大花狗沖上滑梯，牠舔舔我小狗。 接著，大花狗和我的小狗就一起滑下來了!"}, {"id": "GREEN16", "level": "GREEN", "number": 16, "title_zh": "當一把傘", "title_en": "Being an umbrella", "topic": "日常活動", "cover": "/covers/GREEN16.jpg", "top_chars": "我(14次)、把(5次)", "rec_ids": ["GREEN11", "GREEN22", "GREEN55"], "rec_chars": ["變然頭又就", "喜歡然當又", "得也把去和"], "s": "Green 16 當一把傘  我是一把花傘，你把我轉一轉，我就變色了。 有人用我來遮太陽，我就是陽傘。有人用我來遮雨，我就是雨傘。 不過，我喜歡有人用我來跳舞，載我轉來又轉去。 也喜歡有人用我來表演，把我頂在頭上或鼻子上。 當然，我最得意的是老公公和老婆婆把我當他們的拐杖!"}, {"id": "GREEN17", "level": "GREEN", "number": 17, "title_zh": "幫忙", "title_en": "Being helpful", "topic": "日常活動", "cover": "/covers/GREEN17.jpg", "top_chars": "幫(8次)、忙(8次)", "rec_ids": ["GREEN51", "GREEN43", "GREEN81"], "rec_chars": ["問誰得都姐", "滿忙身幫水", "問把地你他"], "s": "Green 17 幫忙  姐姐把牛奶打翻了，弟弟來幫忙，他弄得滿桌都是牛奶。 媽媽把油打翻了，弟弟來幫忙，他弄得滿地都是油。 哥哥把水彩打翻了，弟弟來幫忙，他弄得滿身都是水彩。 媽媽、哥哥和姐姐說:「你不是幫忙，你是越幫越忙!」 弟弟不明白。他問:「誰要我幫忙?我會越幫越忙!」"}, {"id": "GREEN18", "level": "GREEN", "number": 18, "title_zh": "騎車", "title_en": "Riding a bike", "topic": "日常活動", "cover": "/covers/GREEN18.jpg", "top_chars": "車(9次)、猴(9次)", "rec_ids": ["GREEN15", "GREEN38", "GREEN55"], "rec_chars": ["忽然著也隻", "忽然跳著隻", "手著也隻去"], "s": "Green 18 騎車  一隻瘦猴子，想騎腳踏車，牠的手扶著車頭，腳卻踩不到踏板。 一隻胖猴子，也想騎腳踏車，牠的腳踩到踏板，手卻扶不到車頭。 瘦猴子和胖猴子，看著腳踏車，摸摸頭。你看著我，我看著你。忽然….. 胖猴子跳到車上，瘦猴子跳到胖猴子的肩膀上。 胖猴子腳踩踏板，瘦猴子手扶車頭，牠們騎車去了。"}, {"id": "GREEN19", "level": "GREEN", "number": 19, "title_zh": "放風箏", "title_en": "Flying a kite", "topic": "日常活動", "cover": "/covers/GREEN19.jpg", "top_chars": "風(10次)、箏(9次)", "rec_ids": ["GREEN55", "GREEN67", "GREEN11"], "rec_chars": ["跑拿手著飛", "呀吹掉風下", "拉掉快叫又"], "s": "Green 19 放風箏 Green 19 放風箏  我和小胖去放風箏，我用兩隻手把風箏高高地舉起來。 小胖拉著風箏的線，快快地跑。風箏在天上轉了轉，掉下來了。 我又拿起風箏，高高地舉起來，小胖又拉著風箏線要跑。 我說: 「等一等。」一陣大風吹來，我叫小胖快跑….. 小胖跑呀跑，風箏飛呀飛，飛上天空，飛到雲裏，不見了!"}, {"id": "GREEN20", "level": "GREEN", "number": 20, "title_zh": "寫兒歌", "title_en": "Writing nursery rhymes", "topic": "日常活動", "cover": "/covers/GREEN20.jpg", "top_chars": "老(8次)、一(7次)", "rec_ids": ["GREEN55", "GREEN11", "GREEN35"], "rec_chars": ["音聲聽點後", "聲聽松後找", "相每同己自"], "s": "Green 20 寫兒歌  老師教我們唸兒歌，他一邊唸，一邊寫。 白板上寫了: 一二三四五，上山打老虎，老虎打不到，打到小松鼠。  老師說每句話的最後一個字，聲音都有一點相同，唸起來容易又好聽。 老師也要我們試試看，寫一首自己的兒歌。 我就寫了一首兒歌: 五隻小老虎，要找母老虎，找呀找不到，找到小老鼠。"}, {"id": "GREEN21", "level": "GREEN", "number": 21, "title_zh": "樹熊", "title_en": "Koalas", "topic": "動物", "cover": "/covers/GREEN21.jpg", "top_chars": "樹(7次)、熊(6次)", "rec_ids": ["GREEN28", "GREEN43", "GREEN52"], "rec_chars": ["葉覺用像以", "短身腳可也", "眼用身像以"], "s": "Green 21 樹熊  樹熊有胖胖的身體，小小的眼睛和短短的腳。 我也有胖胖的身體，小小的眼睛和短短的腳。 我覺得當樹熊真好，每天就是吃和睡，不用上學。 所以，我告訴媽媽，我長得很像樹熊，我要當樹熊。 媽媽說:「好吧!我把你寄到澳洲當樹熊。記得，你只可以吃樹葉喔!」"}, {"id": "GREEN22", "level": "GREEN", "number": 22, "title_zh": "兩隻豬", "title_en": "Two pigs", "topic": "動物", "cover": "/covers/GREEN22.jpg", "top_chars": "乾(10次)、淨(10次)", "rec_ids": ["GREEN11", "GREEN16", "GREEN85"], "rec_chars": ["然叫又就把", "喜歡然當又", "整道乾豬得"], "s": "Green 22 兩隻豬  豬爸爸和豬媽媽有兩個豬寶寶，一隻叫乾乾淨淨，一隻叫亂七八糟。 乾乾淨淨當然是喜歡把家裏弄得又乾淨又整齊。 可是，亂七八糟來了，就把家裏弄得又髒又亂，很不乾淨。 亂七八糟說:「豬就是不乾淨、不整齊的，我們喜歡又髒又亂。」 乾乾淨淨說:「難道，我們又乾淨又整齊，就不是豬了嗎?」"}, {"id": "GREEN23", "level": "GREEN", "number": 23, "title_zh": "螢火蟲", "title_en": "Fireflies", "topic": "動物", "cover": "/covers/GREEN23.jpg", "top_chars": "螢(6次)、弟(6次)", "rec_ids": ["GREEN38", "GREEN55", "GREEN30"], "rec_chars": ["根忽像然跳", "晚啊走手著", "忽像然跳又"], "s": "Green 23 螢火蟲  弟弟在草地上走著，忽然，草裏飛出好多好多的螢火蟲。 牠們一閃一閃的，好像星星，又好像小燈籠，十分美麗。 弟弟雙手一合，就捉到了一隻螢火蟲。 他仔細地看看螢火蟲，發現牠的屁股會發亮。 晚上，弟弟在屁股上綁了一根螢光棒，他跳啊跳地說:「我是螢火蟲了!」"}, {"id": "GREEN24", "level": "GREEN", "number": 24, "title_zh": "烏鴉", "title_en": "Crows", "topic": "動物", "cover": "/covers/GREEN24.jpg", "top_chars": "烏(8次)、的(8次)", "rec_ids": ["GREEN30", "GREEN41", "GREEN29"], "rec_chars": ["問聽身黑像", "讀聽黑書叫", "為面著都可"], "s": "Green 24 烏鴉  弟弟在讀一本圖畫書，他指著上面的字讀:「\"烏\"鴉。」 哥哥聽到了說:「應該讀\"烏\"鴉，不是\"鳥\"鴉!」 哥哥說:「那個像\"鳥\"的字，它唸\"烏\"，是黑色的意思。」 弟弟看看圖畫上的鳥，牠身上的羽毛都是黑色的。 弟弟問:「是烏龜的\"烏\"嗎? 可是，烏龜不是黑色的，為什麼叫\"烏\"龜?」"}, {"id": "GREEN25", "level": "GREEN", "number": 25, "title_zh": "老鼠和貓兒", "title_en": "The rat and the cat", "topic": "動物", "cover": "/covers/GREEN25.jpg", "top_chars": "老(8次)、鼠(8次)", "rec_ids": ["GREEN80", "GREEN77", "GREEN38"], "rec_chars": ["抖門發怕跑", "關卻友朋出", "直然跑得著"], "s": "Green 25 老鼠和貓兒  老鼠都怕貓兒。可是，我家的老鼠和貓兒是好朋友。 一天，我打開冰箱，沒有看到老鼠跑進去了。 砰!冰箱門關上了。可是，貓兒卻一直抓冰箱的門。 我說:「貓兒，你想吃什麼?」然後，我打開冰箱門，老鼠跑了出來! 老鼠冷得發抖!貓兒來了，牠抱著老鼠，老鼠就緊緊地靠著牠。"}, {"id": "GREEN26", "level": "GREEN", "number": 26, "title_zh": "小鴨找媽媽", "title_en": "A duckling looking for his mom", "topic": "動物", "cover": "/covers/GREEN26.jpg", "top_chars": "媽(12次)、小(10次)", "rec_ids": ["GREEN29", "GREEN43", "GREEN38"], "rec_chars": ["為坐後以面", "笑帶幫可你", "幫面可會你"], "s": "Green 26 小鴨找媽媽  小鴨找媽媽，牠看到一條蟲以為是蚯蚓，小鳥說:「那是蜈蚣，不能吃。」 小鴨看到鱷魚，鱷魚要帶小鴨找媽媽。小鳥說:「那是鱷魚，牠要吃你!」 小鴨看到小鳥後面有大鳥，牠說:「你後面有大鳥，牠要吃你!」 小鳥笑了，牠說:「牠是我媽媽，牠不會吃我!」 小鳥說:「你坐到我媽媽的背上，我們可以飛上天，幫你找媽媽。」"}, {"id": "GREEN27", "level": "GREEN", "number": 27, "title_zh": "小豬不笨", "title_en": "The little pig is not stupid", "topic": "動物", "cover": "/covers/GREEN27.jpg", "top_chars": "小(10次)、豬(10次)", "rec_ids": ["GREEN77", "GREEN80", "GREEN1"], "rec_chars": ["怎起沒麼會", "菜發青黑想", "蛙知道青想"], "s": "Green 27 小豬不笨  小豬媽媽要小豬吃菜。小豬說那個菜看起來黑黑的，不好吃。 媽媽說: 「你沒有吃，怎麼知道不好吃? 」小豬試著吃了，發現很好吃。 小豬看到青蛙，想跟牠玩。青蛙說小豬看起來笨笨的，不會玩。 小豬說:「你沒有跟我玩，怎麼知道我不會玩?」 青蛙試著和小豬玩，牠發現小豬很會玩。"}, {"id": "GREEN28", "level": "GREEN", "number": 28, "title_zh": "動物的叫聲", "title_en": "Animal calls", "topic": "動物", "cover": "/covers/GREEN28.jpg", "top_chars": "叫(7次)、們(5次)", "rec_ids": ["GREEN38", "GREEN74", "GREEN77"], "rec_chars": ["嘴聲巴像得", "覺第二友朋", "住友巴朋以"], "s": "Green 28 動物的叫聲 Green 28 動物的叫聲  一天早上，森林裏的小鳥吱吱吱地叫。青蛙說: 「你們很吵，可以不要叫嗎?」 小鳥說:「可是，晚上你們呱呱呱地叫，你們也很吵啊!」 大樹說:「你們一個早上吵，一個晚上吵，吵死人了!」 於是，大樹用樹葉塞住小鳥和青蛙的嘴巴，不讓牠們叫。 第二天，森林裏很安靜。大樹覺得沒有叫聲，好像沒有朋友了!"}, {"id": "GREEN29", "level": "GREEN", "number": 29, "title_zh": "北極熊", "title_en": "Polar bears", "topic": "動物", "cover": "/covers/GREEN29.jpg", "top_chars": "摩(8次)、熊(6次)", "rec_ids": ["GREEN55", "GREEN26", "GREEN80"], "rec_chars": ["跟原走後面", "為坐後以面", "原打沒地爸"], "s": "Green 29 北極熊  摩摩和爸爸坐雪橇去打魚，他們常常看到一隻北極熊。 摩摩常常丟魚給牠，牠會高興地在地上滾一滾。 冬天到了，摩摩都沒有看到北極熊，以為他冬眠了。可是，爸爸說北極熊不會冬眠。 春天來了，摩摩看到北極熊，後面跟著兩隻熊寶寶，向他慢慢走來。 原來，牠當媽媽了，冬天正牠生小寶寶的時候。"}, {"id": "GREEN30", "level": "GREEN", "number": 30, "title_zh": "黑熊媽媽說話", "title_en": "Mommy black bear was talking", "topic": "動物", "cover": "/covers/GREEN30.jpg", "top_chars": "媽(14次)、哥(8次)", "rec_ids": ["GREEN38", "GREEN11", "GREEN74"], "rec_chars": ["忽話聲像然", "忽聲原聽然", "耍原飯玩麼"], "s": "Green 30 黑熊媽媽說話  黑熊媽媽在樹下休息。黑熊哥哥和妹妹爬到媽媽身上。 牠們又爬到樹幹上，原來，小黑熊是很會爬樹的。 黑熊哥哥和妹妹爬到很高的地方玩耍。忽然，牠們聽到樹下媽媽的吼聲。 黑熊妹妹看著哥哥，好像在問:「媽媽在說什麼?」 哥哥告訴妹妹，媽媽說:「吃飯了，快下來!」牠們快快跳到媽媽身上吃奶。"}, {"id": "GREEN31", "level": "GREEN", "number": 31, "title_zh": "動物幫手", "title_en": "Animal helper", "topic": "動物", "cover": "/covers/GREEN31.jpg", "top_chars": "動(8次)、物(8次)", "rec_ids": ["GREEN80", "GREEN11", "GREEN38"], "rec_chars": ["怕找想老動", "後找出動物", "照園常幫會"], "s": "Green 31 動物幫手  動物園有動物管理員，他要照顧動物園裏的動物。 一天，動物管理員非常忙，因為有小老虎出生了。 他需要一個幫手，幫他照顧剛出生的小老虎。 他想:「我的幫手要不怕小動物，才會是一個好幫手。」 後來，他找到了一個好幫手，牠非常會照顧小動物。"}, {"id": "GREEN32", "level": "GREEN", "number": 32, "title_zh": "蜘蛛", "title_en": "A spider", "topic": "動物", "cover": "/covers/GREEN32.jpg", "top_chars": "蜘(6次)、蛛(6次)", "rec_ids": ["GREEN11", "GREEN38", "GREEN9"], "rec_chars": ["但掉然進出", "枝張然幫爬", "但第發候時"], "s": "Green 32 蜘蛛  一隻蜘蛛掉進浴缸裏了，牠想爬出來，可是，牠爬上去又掉下來了。 雖然我有點怕蜘蛛，但是我還是想幫牠。 蜘蛛又向上爬的時候，我拿了一張報紙，發在浴缸底。 蜘蛛爬到一半，就在報紙上了。我把報紙拿到外面樹下。 第二天，樹枝上有個美麗的蜘蛛網!"}, {"id": "GREEN33", "level": "GREEN", "number": 33, "title_zh": "海獺", "title_en": "Sea otters", "topic": "動物", "cover": "/covers/GREEN33.jpg", "top_chars": "海(7次)、的(5次)", "rec_ids": ["GREEN11", "GREEN42", "GREEN55"], "rec_chars": ["石頭面就玩", "住呢手還海", "覺睡走拿手"], "s": "Green 33 海獺  海獺住在海裏，有胖胖的身體和圓圓的頭。 海獺是很聰明的動物，牠會拿石頭膏開貝殼，吃裏面的肉。 牠們常常一起手牽手，捲在海藻裏睡覺。 這樣，海浪來了，就不會把牠們沖走了。 牠們還常常一起玩遊戲，海獺真的很聰明呢!"}, {"id": "GREEN34", "level": "GREEN", "number": 34, "title_zh": "狗兒一家", "title_en": "The dog family", "topic": "動物", "cover": "/covers/GREEN34.jpg", "top_chars": "狗(11次)、一(7次)", "rec_ids": ["GREEN80", "GREEN39", "GREEN55"], "rec_chars": ["回跑心這兒", "帶心以這給", "讓跑也隻家"], "s": "Green 34 狗兒一家 Green 34 狗兒一家  我和媽媽去「流浪狗中心」，領養了一隻大花狗。 爸爸說再領養一隻，讓牠有個伴。所以，我們就有了兩隻大花狗了。 一天，哥哥帶了兩隻小花狗回家，他說:「這是我朋友送給我的小狗。」 小花狗看見了大花狗，就跑過去舔牠們。 大花狗也舔一舔小花狗，牠們好像是一家人!"}, {"id": "GREEN35", "level": "GREEN", "number": 35, "title_zh": "小藍企鵝", "title_en": "The small blue penguins", "topic": "動物", "cover": "/covers/GREEN35.jpg", "top_chars": "小(8次)、的(8次)", "rec_ids": ["GREEN20", "GREEN95", "GREEN74"], "rec_chars": ["相每同己自", "藍走跳寶叫", "走找都也會"], "s": "Green 35 小藍企鵝  企鵝有很多種，有的大，有的小，顏色也不相同。 在澳洲，有一種小企鵝，有藍色的毛，人們叫牠們小藍企鵝。 海邊岸上有很多小藍企鵝的家，每個家裏都有小寶寶。 天黑了，小藍企鵝會跳上海邊，走回岸上的家，餵牠們的小寶寶。 牠們很厲害，每隻都會找到自己的家，不會走錯的!"}, {"id": "GREEN36", "level": "GREEN", "number": 36, "title_zh": "小動物", "title_en": "Small animals", "topic": "動物", "cover": "/covers/GREEN36.jpg", "top_chars": "小(11次)、鼠(8次)", "rec_ids": ["GREEN70", "GREEN78", "GREEN28"], "rec_chars": ["因能跟覺友", "覺為心還開", "於覺友朋得"], "s": "Green 36 小動物  小老鼠不開心，因為大動物不跟牠玩，說牠太小了。 小老鼠想: 我比蝴蝶、蜻蜓大，可是牠們是昆蟲。 小老鼠覺得小松鼠和牠差不多大小。於是，牠去找小松鼠玩。 牠和小松鼠做了好朋友，還發明了很多遊戲 。 大動物來了，想跟小老鼠和小松鼠玩。牠們說:「你們太大了，不能玩我們的遊戲。」"}, {"id": "GREEN37", "level": "GREEN", "number": 37, "title_zh": "瓢蟲", "title_en": "Ladybugs", "topic": "動物", "cover": "/covers/GREEN37.jpg", "top_chars": "蟲(9次)、我(5次)", "rec_ids": ["GREEN43", "GREEN4", "GREEN84"], "rec_chars": ["身怕它果多", "害蟲誰最愛", "害住怕花也"], "s": "Green 37 瓢蟲  蟲有很多種，有的是益蟲，有的是害蟲。 我是飄蟲，身上有圓圓的斑點，漂亮。 我住在花上、樹上和草上。我最愛吃一種害蟲叫蚜蟲。 我最怕農藥，農藥是用來殺死害蟲的。 結果，它把我也殺死了。現在誰來吃害蟲呢?"}, {"id": "GREEN38", "level": "GREEN", "number": 38, "title_zh": "松鼠", "title_en": "Squirrels", "topic": "動物", "cover": "/covers/GREEN38.jpg", "top_chars": "一(7次)、我(5次)", "rec_ids": ["GREEN28", "GREEN11", "GREEN30"], "rec_chars": ["嘴聲巴像得", "忽聲松然快", "忽話聲像然"], "s": "Green 38 松鼠  在公園裏面，常常有可愛的松鼠，牠們跑得很快。 牠們爬樹更快，還會「咻」地一聲，跳到另一根樹枝上。 有一天，我看到一隻松鼠，嘴巴一直動，好像在和我說話。 忽然，牠不動了，看著我，好像要我幫牠拍照。 「咔」地一聲，我拍了一張照片。「你看! 松鼠很可愛吧!」"}, {"id": "GREEN39", "level": "GREEN", "number": 39, "title_zh": "綿羊", "title_en": "Sheep", "topic": "動物", "cover": "/covers/GREEN39.jpg", "top_chars": "羊(6次)、媽(6次)", "rec_ids": ["GREEN80", "GREEN34", "GREEN29"], "rec_chars": ["主心這兒想", "帶心以這給", "以給著都可"], "s": "Green 39 綿羊  小胖和家人去加拿大度假。爸爸和媽媽帶他去農場，看「剪羊毛」。 農場主人拿著剃刀，一會兒，綿羊身上的毛都被剃光了。 媽媽說我們可以用這些羊毛，織毛衣來穿。 小胖看到綿羊光禿禿的身體，心想:牠們一定很冷。 他對媽媽說: 「你可以織多毛衣，給這些綿羊穿嗎?"}, {"id": "GREEN40", "level": "GREEN", "number": 40, "title_zh": "動物玩偶", "title_en": "Stuffed toys", "topic": "動物", "cover": "/covers/GREEN40.jpg", "top_chars": "我(8次)、動(7次)", "rec_ids": ["GREEN80", "GREEN11", "GREEN55"], "rec_chars": ["間晚發原回", "忽成原聽然", "間晚睡原聽"], "s": "Green 40 動物玩偶  我用動物玩偶，把我的房間佈置成動物園。 我帶弟弟到我的動物園，他開心地摸摸每個動物。 晚上，我回到房間，發現我的動物玩偶都不見了。 忽然，我聽到弟弟在叫:「你們不要吃我!」 原來，動物玩偶都在弟弟床上，他躺在牠們中間睡著了!"}, {"id": "GREEN41", "level": "GREEN", "number": 41, "title_zh": "動物會保護自己", "title_en": "Animals know how to protect themselves", "topic": "動物", "cover": "/covers/GREEN41.jpg", "top_chars": "不(7次)、爸(6次)", "rec_ids": ["GREEN29", "GREEN24", "GREEN80"], "rec_chars": ["給可魚會地", "讀聽黑書叫", "黑找開動地"], "s": "Green 41 動物會保護自己  爸爸讀書給弟弟聽，爸爸說:「變色龍會變色，讓你找不到牠。」 「蝴蝶會不動，讓你看不到牠。」「臭鼬會噴臭氣，讓你躲開牠。」 「刺蝟有刺，讓你不敢捉牠。」「墨魚會噴黑汁，讓你看不見牠。」 弟弟馬上去躲起來，讓爸爸找不到他。 可是，狗狗在弟弟躲的地方，不停地汪汪叫!"}, {"id": "GREEN42", "level": "GREEN", "number": 42, "title_zh": "螃蟹", "title_en": "Crabs", "topic": "動物", "cover": "/covers/GREEN42.jpg", "top_chars": "螃(6次)、蟹(6次)", "rec_ids": ["GREEN11", "GREEN7", "GREEN33"], "rec_chars": ["捉拉洞進快", "指知道以手", "住呢手還海"], "s": "Green 42 螃蟹  在海邊，你可以玩沙、玩水，還可以捉螃蟹。 有一次，我看到一隻螃蟹，可是，牠很快就逃進洞裏。 我把手伸進洞裏捉牠，牠卻夾住我的手指，很痛…... 我趕快把手拉出來，螃蟹也一起被拉出來了。 唉! 不知道是我捉螃蟹，還是螃蟹捉我呢?"}, {"id": "GREEN43", "level": "GREEN", "number": 43, "title_zh": "刺蝟", "title_en": "Hedgehogs", "topic": "動物", "cover": "/covers/GREEN43.jpg", "top_chars": "刺(8次)、的(7次)", "rec_ids": ["GREEN26", "GREEN80", "GREEN99"], "rec_chars": ["笑帶幫可你", "別回怕動家", "滿怕多也隻"], "s": "Green 43 刺蝟  刺蝟的身上有很多刺，別的動物怕牠們的刺。 有一天，刺蝟刺了滿身的水果，要把它們帶回家吃。 別的動物笑牠，你身上有很多水果，可是，你的腳很短，拿不到也吃不到啊! 又來了一隻刺蝟，身上也刺滿了水果。 牠們說:「你們忘了，我們是互相幫忙的動物!」"}, {"id": "GREEN44", "level": "GREEN", "number": 44, "title_zh": "小河馬和大烏龜", "title_en": "The small hippo and the big turtle", "topic": "動物", "cover": "/covers/GREEN44.jpg", "top_chars": "媽(6次)、大(4次)", "rec_ids": ["GREEN34", "GREEN55", "GREEN66"], "rec_chars": ["養領像帶過", "跟原走著把", "靠園那像動"], "s": "Green 44 小河馬和大烏龜  有一天，一隻小河馬失去了媽媽。 有人把牠帶到野生動物園，那裏有一隻三十歲的大烏龜。 小河馬走過靠著牠，牠天天跟著大烏龜。 大烏龜成了牠的新媽媽，原來，動物會領養別的動物孩子。 就好像我的媽媽，領養我一樣。"}, {"id": "GREEN45", "level": "GREEN", "number": 45, "title_zh": "松鼠玩偶", "title_en": "Stuffed toy squirrel", "topic": "動物", "cover": "/covers/GREEN45.jpg", "top_chars": "松(9次)、鼠(7次)", "rec_ids": ["GREEN38", "GREEN55", "GREEN19"], "rec_chars": ["公園松然跑", "走跑拿後手", "跑拿放手又"], "s": "Green 45 松鼠玩偶  我帶著我的松鼠玩偶，去公園玩。 我要盪鞦韆，我把松鼠玩偶放在草地上。 一隻真的松鼠來了，牠看著松鼠玩偶，然後跑走了。 一會兒，牠又回來了，手裏拿著松果， 牠把松果放在松鼠玩偶前面，還輕輕地靠著松鼠玩偶。"}, {"id": "GREEN46", "level": "GREEN", "number": 46, "title_zh": "噴水的龍", "title_en": "The dragon that puffs water", "topic": "動物", "cover": "/covers/GREEN46.jpg", "top_chars": "龍(11次)、水(10次)", "rec_ids": ["GREEN56", "GREEN7", "GREEN25"], "rec_chars": ["別問什想沒", "只為什沒麼", "怕都什想沒"], "s": "Green 46 噴水的龍  龍媽媽生了很多小龍，每隻小龍都會噴火，但是有一隻只會噴水。 噴水龍問媽媽:「為什麼別的龍都噴火，很厲害，我只會噴水?」 龍媽媽告訴牠，噴水的龍才厲害，因為火都怕水。 牠說:「你看! 人人需要水，家家需要水。」 噴水龍想: 難怪，家家都有「水龍頭，但是沒有 「火龍頭」。"}, {"id": "GREEN47", "level": "GREEN", "number": 47, "title_zh": "蓋房子", "title_en": "Building a house", "topic": "家/家人", "cover": "/covers/GREEN47.jpg", "top_chars": "蓋(5次)、子(4次)", "rec_ids": ["GREEN80", "GREEN50", "GREEN55"], "rec_chars": ["門住房怕打", "破房哥做也", "戶窗房也家"], "s": "Green 47 蓋房子  老鼠一家住在破鞋子裏，風吹雨打，更怕大貓來捉。 爸爸說:「我們要蓋個好房子，不怕風吹雨打，也不怕大貓來捉。」 爺爺和奶奶蓋牆壁，爸爸和媽媽蓋屋頂。 哥哥和姊姊做大門，弟弟和妹妹做窗戶。 房子蓋好了，沒有風也沒有雨，大貓來了也不怕。"}, {"id": "GREEN48", "level": "GREEN", "number": 48, "title_zh": "奶奶", "title_en": "Grandma", "topic": "家/家人", "cover": "/covers/GREEN48.jpg", "top_chars": "我(8次)、條(7次)", "rec_ids": ["YELLOW10", "GREEN43", "GREEN56"], "rec_chars": ["送張紙給她", "忘啊怕又多", "於問方放她"], "s": "Green 48 奶奶  奶奶有一條項鏈，她說等我長大了要給我。 可是，她怕忘了放項鍊的地方，要我寫張紙條。 她把紙條放好了。可是，她又怕忘了放紙條的地方，要我寫:「紙條放在…..]  於是我寫了:「紙條放在…...] 。我問奶奶:「那要寫多少張紙條啊?」 我說: 「你還是現在就把項鏈送給我吧!」"}, {"id": "GREEN49", "level": "GREEN", "number": 49, "title_zh": "爸爸沒回家", "title_en": "Dad did not come home", "topic": "家/家人", "cover": "/covers/GREEN49.jpg", "top_chars": "爸(10次)、了(7次)", "rec_ids": ["GREEN80", "GREEN55", "GREEN74"], "rec_chars": ["門原回黑心", "倒覺原拿開", "奇怪傷怎覺"], "s": "Green 49 爸爸沒回家  下雨天，小鴨爸爸看到家裏的屋頂漏水了。 牠拿了工具箱和梯子，爬上去修屋頂了。 小鴨媽媽開門，推倒了梯子，就把梯子放回原來的地方。 天黑了，鴨媽媽覺得很奇怪，鴨爸爸怎麼還沒回家? 爸爸不見了，小鴨們傷心地哭了，牠們不知道原來爸爸就在屋頂上!"}, {"id": "GREEN50", "level": "GREEN", "number": 50, "title_zh": "會飛的房子", "title_en": "Flying house", "topic": "家/家人", "cover": "/covers/GREEN50.jpg", "top_chars": "房(6次)、子(6次)", "rec_ids": ["GREEN55", "GREEN9", "GREEN61"], "rec_chars": ["嚇電房後面", "機電後面起", "那房哥面起"], "s": "Green 50 會飛的房子  我去看電影，電影裏有個房子，綁了很多氣球就飛起來了。 我希望我們家的房子也可以飛。媽媽說那是電影裏的房子，不是真的。 我只好自己做夢，夢裏面的房子，綁了氣球也會飛。 後來，氣球一個一個破了，房子掉下來，我嚇醒了.  哥哥對我說:「現在有飛機旅館，你不用做夢了!」"}, {"id": "GREEN51", "level": "GREEN", "number": 51, "title_zh": "媽媽愛誰多一點", "title_en": "Mom loves whom a bit more?", "topic": "家/家人", "cover": "/covers/GREEN51.jpg", "top_chars": "媽(10次)、我(9次)", "rec_ids": ["GREEN70", "GREEN7", "GREEN50"], "rec_chars": ["從覺問三為", "雙知道兩為", "對現以多個"], "s": "Green 51 媽媽愛誰多一點 姐姐和我是雙胞胎。我問媽媽愛誰多一點? 媽媽說:「你們都是從我肚子裏出來的，我兩個都愛!」 我覺得不對，媽媽應該要愛我多一點。媽媽想知道為什麼?  我說:「姐姐比我早三分鐘出來，你已經多愛她三分鐘了。」 「所以，現在你應該要愛我多一點!」"}, {"id": "GREEN52", "level": "GREEN", "number": 52, "title_zh": "狗狗和我", "title_en": "The doggy and I", "topic": "家/家人", "cover": "/covers/GREEN52.jpg", "top_chars": "狗(12次)、我(8次)", "rec_ids": ["GREEN25", "GREEN80", "GREEN99"], "rec_chars": ["抓門打進開", "間門房心打", "心頭開想也"], "s": "Green 52 狗狗和我  狗狗在門外用爪子抓門，牠想進我的房間。 我打開門對狗狗說:「你今天不乖，不可以進我的房間。」 狗狗在門外嗚嗚地叫，好像很傷心地在哭。 我也傷心地哭了，我去把門打開，讓狗狗進來。 狗狗撲到我的身上，用舌頭舔我的眼淚。"}, {"id": "GREEN53", "level": "GREEN", "number": 53, "title_zh": "家人聽對了嗎", "title_en": "Did my family hear it correctly?", "topic": "家/家人", "cover": "/covers/GREEN53.jpg", "top_chars": "要(5次)、可(5次)", "rec_ids": ["GREEN47", "GREEN55", "GREEN39"], "rec_chars": ["爺奶貓哥妹", "聽拿她飛姐", "對嗎拿給可"], "s": "Green 53 家人聽對了嗎  媽媽要花，可是，妹妹拿畫給她。 爺爺要扇，可是，弟弟拿傘給他。 姐姐要花貓，可是，哥哥拿花帽給她。 奶奶要梳子，可是，弟弟拿樹枝給她。 爸爸要飛機，可是媽媽拿肥雞給他!"}, {"id": "GREEN54", "level": "GREEN", "number": 54, "title_zh": "海盜弟弟", "title_en": "My younger brother being a pirate", "topic": "家/家人", "cover": "/covers/GREEN54.jpg", "top_chars": "弟(10次)、媽(6次)", "rec_ids": ["GREEN11", "GREEN55", "GREEN94"], "rec_chars": ["藏然後進面", "筒跑後面姐", "然後衣穿給"], "s": "Green 54 海盜弟弟  我幫弟弟做了一把劍，姐姐幫他做了一個眼罩。 弟弟穿了橫紋衣服，又戴上媽媽做的海盜帽子。 他跑到媽媽那裏:「我是海盜，把寶藏給我。」 媽媽把很多零錢給了弟弟，他很高興地數錢。 然後，弟弟把錢都放進小豬存錢筒裏面了。"}, {"id": "GREEN55", "level": "GREEN", "number": 55, "title_zh": "家裏有聲音", "title_en": "A sound in the house", "topic": "家/家人", "cover": "/covers/GREEN55.jpg", "top_chars": "到(7次)、爸(7次)", "rec_ids": ["GREEN80", "GREEN29", "GREEN49"], "rec_chars": ["嚇間晚原房", "跟原走後面", "倒覺原拿開"], "s": "Green 55 家裏有聲音  晚上，我在睡覺，聽到一個聲音，嚇得我….. 跑到姐姐的房間去。姐姐也聽到一個聲音，她和我一起…. 跑到爸爸、媽媽的臥房。爸爸、媽媽也聽到了，他們拿著手電筒…... 我們跟在爸媽後面走到客廳，看到桌上的杯子倒了…... 啊! 原來是一隻小鳥困在客廳裏了，爸爸把窗戶開大一點，讓牠飛走了。"}, {"id": "GREEN56", "level": "GREEN", "number": 56, "title_zh": "媽媽出差", "title_en": "Mom on a business trip", "topic": "家/家人", "cover": "/covers/GREEN56.jpg", "top_chars": "媽(12次)、爸(8次)", "rec_ids": ["GREEN80", "GREEN25", "GREEN9"], "rec_chars": ["別晚回兒就", "出兒就什想", "候時回起下"], "s": "Green 56 媽媽出差  放學回家，沒有看到媽媽。我問爸爸:「媽媽呢?」 爸爸說媽媽「出差」了。我問: 「什麼是出差?」 爸爸說「出差」就是要到別的地方工作幾天，不回家。 晚上，爸爸講故事的時候，我有點兒想媽媽。 媽媽終於回家了，我跳到她身上說:「下次，我要和你一起\"出差\"!」"}, {"id": "GREEN57", "level": "GREEN", "number": 57, "title_zh": "花園房子", "title_en": "House with a garden", "topic": "家/家人", "cover": "/covers/GREEN57.jpg", "top_chars": "有(8次)、花(7次)", "rec_ids": ["GREEN84", "GREEN55", "GREEN80"], "rec_chars": ["住高房還想", "聽房後面也", "住房這就想"], "s": "Green 57 花園房子  小胖說他美國的家有花園，裏面有花，也有水果樹。 花園旁邊有個游泳池，後面是空地，可以騎腳踏車。 我聽了，也想有個這樣的花園房子。可是，我住在高樓大廈裏面。 我想想，就畫了一個有花園的家，花園旁邊也有個游泳池…... 當然還要有我，在空地上騎腳踏車!"}, {"id": "GREEN58", "level": "GREEN", "number": 58, "title_zh": "把弟弟送給你", "title_en": "Giving away my younger brother", "topic": "家/家人", "cover": "/covers/GREEN58.jpg", "top_chars": "弟(12次)、我(10次)", "rec_ids": ["GREEN50", "GREEN80", "GREEN7"], "rec_chars": ["現己只自電", "始別吧只打", "只電走以她"], "s": "Green 58 把弟弟送給你  我有一個討厭的弟弟，他總是和我搶玩具。 他還會亂畫我的本子。所以，我決定把他送給別人。 阿姨來我的家，我把弟弟送給她，阿姨把弟弟帶走了。 現在，我只能自己玩了，我開始想弟弟…... 我打電話給阿姨說:「你把弟弟還給我吧!」"}, {"id": "GREEN59", "level": "GREEN", "number": 59, "title_zh": "我不貪心", "title_en": "I am not greedy", "topic": "家/家人", "cover": "/covers/GREEN59.jpg", "top_chars": "爸(10次)、樂(10次)", "rec_ids": ["GREEN56", "GREEN72", "GREEN80"], "rec_chars": ["點回就什想", "嗎拿給什把", "只回心就想"], "s": "Green 59 我不貪心  爸爸常常教樂樂不要貪心，不是每一樣東西都要更好的。 一天，樂樂回家，把成績單拿給爸爸看。 爸爸看到樂樂的成績都是A，只是英文是B。 爸爸說:「樂樂，用功一點，英文成績就會更好的。」 樂樂心裏想:「B不是比C好嗎? 爸爸不是說不要什麼都要更好的，我不貪心!」"}, {"id": "GREEN60", "level": "GREEN", "number": 60, "title_zh": "我的好朋友", "title_en": "My best friend", "topic": "家/家人", "cover": "/covers/GREEN60.jpg", "top_chars": "的(9次)、我(7次)", "rec_ids": ["GREEN25", "GREEN56", "GREEN70"], "rec_chars": ["冷抱友朋後", "候呢時回學", "舞覺友朋跳"], "s": "Green 60 我的好朋友  這是我家的小狗，牠是我的好朋友。 我無聊的時候，喜歡幫牠穿上不同的漂亮衣服。 我高興的時候，喜歡拉著牠的腳跳舞。 放學回家以後，我喜歡當牠的老師。 天冷的時候，我還會抱著牠睡覺。你呢? 你想和小狗做什麼?"}, {"id": "GREEN61", "level": "GREEN", "number": 61, "title_zh": "家裏的好人和壞人", "title_en": "Good guys and bad guys at home", "topic": "家/家人", "cover": "/covers/GREEN61.jpg", "top_chars": "人(9次)、我(9次)", "rec_ids": ["GREEN9", "GREEN55", "GREEN50"], "rec_chars": ["戲遊吧回面", "間走房面著", "那房哥面起"], "s": "Green 61 家裏的好人和壞人  我和弟弟玩遊戲，我當好人，要他當壞人，他哭著說:「我也要當好人!」 我說:「好吧! 我們一起當好人，一起去捉壞人。」 我們輕輕地走進哥哥的房間，在那裏，我們捉到很多壞人。 我們把壞人放在袋子裏面，把他們丟進垃圾桶。 哥哥回來了，他一走進房間， 就大叫:「我的變形金剛呢?」"}, {"id": "GREEN62", "level": "GREEN", "number": 62, "title_zh": "妹妹", "title_en": "Younger sister", "topic": "家/家人", "cover": "/covers/GREEN62.jpg", "top_chars": "妹(8次)、說(8次)", "rec_ids": ["YELLOW4", "GREEN50", "GREEN7"], "rec_chars": ["課功以生做", "真氣以做可", "服衣以手做"], "s": "Green 62 妹妹  妹妹做功課，我說她寫的字不好看。她說:「可以啦!」 妹妹穿衣服，我說她衣服穿反了。她說:「可以啦!」 妹妹洗完手，我說她的手還是髒。她說:「可以啦!」 我生氣地說她真是一個「馬馬虎虎」的人! 她也生氣地說:「我不屬馬，也不屬虎，我屬牛!」"}, {"id": "GREEN63", "level": "GREEN", "number": 63, "title_zh": "媽媽像什麼", "title_en": "What is Mom like?", "topic": "家/家人", "cover": "/covers/GREEN63.jpg", "top_chars": "像(7次)、媽(6次)", "rec_ids": ["GREEN60", "GREEN29", "GREEN56"], "rec_chars": ["興覺睡候高", "興候高時生", "次事候時她"], "s": "Green 63 媽媽像什麼  媽媽像什麼? 我的媽媽什麼都像。 她高興的時候，好像小鳥，嘰嘰喳喳不停地說話。 她生氣 時候，好像老虎，對我兇巴巴地說話。 她忙的時候，好像八爪魚，一次想做八件事情。 她累的時候，好像大棕熊，躲進被窩裏睡大覺。"}, {"id": "GREEN64", "level": "GREEN", "number": 64, "title_zh": "我討厭的事", "title_en": "The things that I hate", "topic": "家/家人", "cover": "/covers/GREEN64.jpg", "top_chars": "我(11次)、討(7次)", "rec_ids": ["GREEN56", "GREEN9", "GREEN77"], "rec_chars": ["事候點呢時", "視候機飯時", "關呢叫出麼"], "s": "Green 64 我討厭的事  我有很多討厭的事。吃飯的時候，我討厭媽媽一直叫我吃青菜。 用電腦的時候，我討厭爸爸一直要我關機。 看電視的時候，我討厭婆婆一直要我轉台。 洗澡的時候，我討厭姐姐一直要我快點出來。 你呢?你有什麼討厭的事? 說來給我聽聽!"}, {"id": "GREEN65", "level": "GREEN", "number": 65, "title_zh": "冬眠的弟弟", "title_en": "Younger brother hibernated", "topic": "家/家人", "cover": "/covers/GREEN65.jpg", "top_chars": "弟(8次)、的(5次)", "rec_ids": ["GREEN80", "GREEN9", "GREEN40"], "rec_chars": ["晚想動物和", "午候時面起", "晚床睡中叫"], "s": "Green 65 冬眠的弟弟  冬天的早上， 弟弟睡在暖和的被子裏面，不肯起床。 媽媽叫他起床，他不要，拉著棉被說:「我冬眠了。」 到了中午，弟弟還是睡在床上，不肯起床。 到了晚上，弟弟起床了，他肚子餓，想要吃東西。 媽媽說: 「動物冬眠的時候，是不需要吃東西的。」"}, {"id": "GREEN66", "level": "GREEN", "number": 66, "title_zh": "尾巴", "title_en": "Tails", "topic": "身體", "cover": "/covers/GREEN66.jpg", "top_chars": "我(7次)、的(6次)", "rec_ids": ["GREEN38", "GREEN28", "GREEN80"], "rec_chars": ["更張園巴像", "讓巴像沒可", "開想沒動地"], "s": "Green 66 尾巴  星期天，我穿了一條美麗的花裙子，和爸爸去動物園。 到了那裏，我們看到大象、棕熊 、獅子，和很多不同的動物。 後來我們去看孔雀，很可惜，牠沒有張開美麗的尾巴。 我靠近籠子，想讓孔雀看看我美麗的花裙子。 牠慢慢地張開尾巴，好像告訴我:「我的尾巴比你的花裙子更美麗!」"}, {"id": "GREEN67", "level": "GREEN", "number": 67, "title_zh": "角、鬍鬚和尾巴", "title_en": "Horns, whiskers, and a tail", "topic": "身體", "cover": "/covers/GREEN67.jpg", "top_chars": "吹(9次)、大(6次)", "rec_ids": ["GREEN11", "GREEN80", "GREEN15"], "rec_chars": ["忽掉松然貓", "住心開就下", "接忽然還就"], "s": "Green 67 角、鬍鬚和尾巴  大風吹呀吹，吹走了羊的角。 吹走了松鼠的尾巴，吹走了小貓的鬍鬚。 動物們說:「大風，大風，不要吹!」可是大風還是吹呀吹…... 大風把我也吹上了天，我看到了角、尾巴和鬍鬚，就去抱住它們。 忽然，大風停了，我從天上掉下來，動物們開心地接住我!"}, {"id": "GREEN68", "level": "GREEN", "number": 68, "title_zh": "腿斷了", "title_en": "Broken leg", "topic": "身體", "cover": "/covers/GREEN68.jpg", "top_chars": "了(7次)、小(7次)", "rec_ids": ["GREEN29", "GREEN11", "GREEN50"], "rec_chars": ["慢走打以給", "救象掉聽進", "綁現掉機電"], "s": "Green 68 腿斷了  一隻小象，掉進的坑，出不來了。 小象媽媽不停地吼叫，很多人聽到，一起救出了小象。 可是，他們發現小象的腿斷了，需要送醫院。 他們打電話，來了一架直升機，把小象吊在空中，送到醫院。 獸醫給小象綁了支架，小象可以慢慢地走路了!"}, {"id": "GREEN69", "level": "GREEN", "number": 69, "title_zh": "熊貓的毛", "title_en": "The panda’s fur", "topic": "身體", "cover": "/covers/GREEN69.jpg", "top_chars": "的(7次)、牠(6次)", "rec_ids": ["GREEN77", "GREEN25", "GREEN36"], "rec_chars": ["卻朋友毛長", "卻朋友貓開", "因為朋友還"], "s": "Green 69 熊貓的毛  小熊貓出生了，很小很小，粉紅色的。 小熊貓開始長毛了，牠有黑色和白色的毛。 但是，牠的耳朵、眼睛和四隻腳是白色的，身體卻是黑色的。 不過，牠看起來還是很可愛，小朋友特別喜歡牠…... 因為，牠長得和別的熊貓不一樣，牠很特別!"}, {"id": "GREEN70", "level": "GREEN", "number": 70, "title_zh": "大熊的背", "title_en": "The big bear’s back", "topic": "身體", "cover": "/covers/GREEN70.jpg", "top_chars": "牠(6次)、背(5次)", "rec_ids": ["GREEN36", "GREEN74", "GREEN77"], "rec_chars": ["因能跟覺友", "此從覺原友", "友朋做鼠起"], "s": "Green 70 大熊的背  大熊趴在洞口，覺得背上癢癢的，牠伸手一抓，原來是小老鼠。 牠問:「你在我背上做什麼?」小老鼠說:「我在跳舞。」 大熊問牠為什麼在牠背上跳舞, 小老鼠說:「因為你的背軟軟的，跌倒也不痛。」 從此，牠們做了好朋友，小老鼠天天來跳舞。一天，大熊說牠要冬眠了。 小老鼠說:「我要等三個月才能跳舞啊!那我跟你一起冬眠吧!」"}, {"id": "GREEN71", "level": "GREEN", "number": 71, "title_zh": "羽毛", "title_en": "Feathers", "topic": "身體", "cover": "/covers/GREEN71.jpg", "top_chars": "羽(8次)、毛(8次)", "rec_ids": ["GREEN77", "GREEN29", "GREEN49"], "rec_chars": ["傷尾巴毛心", "向給沒隻地", "傷覺心得就"], "s": "Green 71 羽毛  一隻孔雀覺得自己的羽毛最美麗。 小鳥們向牠要一根羽毛，孔雀說:「不行!」 一天，孔雀睡完覺醒來 ，發現自己尾巴上美麗的羽毛沒有了。 孔雀很傷心地去找牠的羽毛。小鳥們就給他幾自己身上的羽毛。 孔雀把小鳥們送給牠的羽毛，插在尾巴上，現在牠覺得自己的羽毛更美麗。"}, {"id": "GREEN72", "level": "GREEN", "number": 72, "title_zh": "牙齒", "title_en": "Teeth", "topic": "身體", "cover": "/covers/GREEN72.jpg", "top_chars": "牙(10次)、爺(8次)", "rec_ids": ["GREEN75", "GREEN4", "GREEN9"], "rec_chars": ["嘴對巴然拿", "早床嗎見走", "嘴後面起下"], "s": "Green 72 牙齒  一天早上，小明起床，走進浴室。 他看到爺爺拿者牙齒，然後放進嘴巴裏。 他不明白爺爺為什麼要吃牙齒? 他對爺爺說: 「你不要吃牙齒。」 「你把牙齒放在枕頭下面，小牙仙會給你禮物。」 爺爺問小明:「我沒有牙齒，這是假牙，小牙仙看見假牙，也會給我禮物嗎?」"}, {"id": "GREEN73", "level": "GREEN", "number": 73, "title_zh": "頭上的大包", "title_en": "A lump on the forehead", "topic": "身體", "cover": "/covers/GREEN73.jpg", "top_chars": "弟(10次)、了(7次)", "rec_ids": ["GREEN75", "GREEN55", "GREEN29"], "rec_chars": ["針哭糖然打", "倒讓後著她", "打後生著給"], "s": "Green 73頭上的大包  弟弟跌倒了，頭上腫了個大包。他哭著說:「好痛呀!」 媽媽來了，她幫弟弟揉揉，可是，他還是說痛。 奶奶來了，她給弟弟一顆糖 ，可是，他還是說痛。 爸爸來了，他說:「去讓醫生打一針吧!」弟弟就不哭了。 弟弟說:「不痛了!」然後，趕快把糖放進口裏。"}, {"id": "GREEN74", "level": "GREEN", "number": 74, "title_zh": "腳受傷了", "title_en": "The wounded leg", "topic": "身體", "cover": "/covers/GREEN74.jpg", "top_chars": "一(7次)、牠(6次)", "rec_ids": ["GREEN7", "GREEN77", "GREEN80"], "rec_chars": ["路泳原游走", "傷怎呢友朋", "主原飯找得"], "s": "Green 74 腳受傷了  一隻大狗和主人散步，牠看到一隻猴子，猴子也看到牠。 第二天，猴子來找大狗，牠們一起吃飯和玩耍，從此，牠們做了好朋友。 人們看到，覺得很奇怪，狗怎麼會和猴子做好朋友呢? 可是，牠們天天都在一起，還常常到河裏游泳。一天，猴子沒看到大狗…... 原來，大狗的腳受傷了。猴子也一跛一跛地走路，牠說:「我的腳也受傷了!」"}, {"id": "GREEN75", "level": "GREEN", "number": 75, "title_zh": "熊熊生病了", "title_en": "The bear got sick", "topic": "身體", "cover": "/covers/GREEN75.jpg", "top_chars": "熊(20次)、他(8次)", "rec_ids": ["GREEN72", "GREEN73", "GREEN9"], "rec_chars": ["嘴對巴然拿", "針哭糖然打", "嘴發後起玩"], "s": "Green 75 熊熊生病了  弟弟拿起聽筒，放在他的小熊玩偶的身上。 一會兒，他說:「熊熊生病了! 他拿來溫度計，放進熊熊的嘴巴裏。 一會兒，他說:「熊熊發燒了!」他又拿來針筒，給熊熊打針。 他對熊熊說:「你不哭，我給你吃糖。」一會兒，他拿來了蜜糖給熊熊吃。 然後，他抱起熊熊說: 「我的熊熊是世界上最乖的熊!」"}, {"id": "GREEN76", "level": "GREEN", "number": 76, "title_zh": "生病的公雞", "title_en": "The sick rooster", "topic": "身體", "cover": "/covers/GREEN76.jpg", "top_chars": "雞(7次)、喔(6次)", "rec_ids": ["GREEN25", "GREEN29", "GREEN77"], "rec_chars": ["打出就什沒", "為打以生給", "以叫出沒麼"], "s": "Green 76 生病的公雞  天亮了，太陽出來了，公雞沒有喔喔叫。 母雞很生氣地問牠:「你為什麼沒有喔喔叫?」 公雞說牠生病了，牠的喉嚨很痛，叫不出聲音了。 母雞說:「我帶你去看醫生，打一針，你就會叫了。」 公雞看見醫生說:「你可以給母雞打一針，讓牠喔喔叫嗎?」"}, {"id": "GREEN77", "level": "GREEN", "number": 77, "title_zh": "長毛巴", "title_en": "Regrowing a tail", "topic": "身體", "cover": "/covers/GREEN77.jpg", "top_chars": "巴(7次)、長(6次)", "rec_ids": ["GREEN74", "GREEN25", "GREEN28"], "rec_chars": ["傷怎呢友朋", "關卻友朋出", "住友巴朋以"], "s": "Green 77 長毛巴  老鼠和壁虎住在一起，牠們都有長長的尾巴，所以做了好朋友。 一天，壁虎的尾巴斷了，老鼠很傷心，壁虎卻說: 「沒關係!」 不久，老鼠的尾巴也斷了，牠很傷心地哭了。 壁虎叫牠不要哭，說會長新尾巴的。 小老鼠說:「不會長新尾巴的。 」 壁虎說:「怎麼不會呢? 你看! 我的新尾巴都長出來了!」"}, {"id": "GREEN78", "level": "GREEN", "number": 78, "title_zh": "薯片 Chips", "title_en": "Chips", "topic": "食物", "cover": "/covers/GREEN78.jpg", "top_chars": "吃(8次)、的(8次)", "rec_ids": ["GREEN36", "GREEN85", "GREEN88"], "rec_chars": ["覺為心還開", "薯食片為愛", "健康東覺西"], "s": "Green 78 薯片  世界上最好吃的東西是什麼? 我覺得是薯片 。 薯片有厚的和薄的，有辣的和酸的，還有很多不同的種類。 薯片吃起來脆脆的，越吃越想吃，越吃越開心。 吃了想停下來不吃，很難。有人說薯片是垃圾食物。可是．．．．．． 為什麼大人和小孩，都愛吃這種不健康的食物？"}, {"id": "GREEN79", "level": "GREEN", "number": 79, "title_zh": "水果", "title_en": "Fruit", "topic": "食物", "cover": "/covers/GREEN79.jpg", "top_chars": "果(8次)、水(7次)", "rec_ids": ["GREEN74", "YELLOW62", "GREEN61"], "rec_chars": ["第呢做起都", "碗塊成拿後", "呢進放起就"], "s": "Green 79 水果  籃子裏放了很多水果，它們在吵架，看誰最好吃。 最後大家決定，誰是第一個被吃掉的，誰就是最好吃的。 蘋果先被拿起來，切成了小塊。其他水果也都被拿起來，切成了小塊。 切好的水果被放進了大碗，做成了水果沙拉。 人們大口大口地吃水果沙拉，是什麼水果最好吃呢？"}, {"id": "GREEN80", "level": "GREEN", "number": 80, "title_zh": "青菜和蘿蔔", "title_en": "Vegetables and carrots", "topic": "食物", "cover": "/covers/GREEN80.jpg", "top_chars": "兔(5次)、房(4次)", "rec_ids": ["GREEN25", "GREEN49", "GREEN55"], "rec_chars": ["抖門發怕跑", "門原回黑心", "嚇間晚原房"], "s": "Green 80 青菜和蘿蔔  小兔一家找到一間老房子，小兔們在房子裏開心地跑上跑下。 兔爸爸說：「我們就住在這兒吧！」兔媽媽開始煮青菜和蘿蔔。 天黑了，房子的主人回來了，他看到廚房在冒煙，心裏想：「是誰在煮晚飯？」 牠打開門，小兔們嚇得發抖，原來這是大野狼的家。 大野狼說：「別怕！我老了，沒牙了，不吃動物，只吃青菜和蘿蔔！」"}, {"id": "GREEN81", "level": "GREEN", "number": 81, "title_zh": "冰淇淋", "title_en": "Ice cream", "topic": "食物", "cover": "/covers/GREEN81.jpg", "top_chars": "弟(8次)、手(6次)", "rec_ids": ["GREEN56", "GREEN51", "GREEN70"], "rec_chars": ["問點出什想", "從問點為出", "從伸背問為"], "s": "Green 81 冰淇淋  弟弟從廚房出來，他把手藏在背後。 媽媽問：「你為什麼把手藏在背後？伸出來給我看！」 弟弟不想伸出手，他說：「我手上的東西是．．．．．．］  媽媽要他快點伸出手來！弟弟慢慢地伸出手．．．．．． ［咦!冰淇淋怎麼沒有了?」弟弟奇怪地說。"}, {"id": "GREEN82", "level": "GREEN", "number": 82, "title_zh": "烤鴨", "title_en": "Roast duck", "topic": "食物", "cover": "/covers/GREEN82.jpg", "top_chars": "鴨(8次)、的(8次)", "rec_ids": ["YELLOW62", "GREEN79", "GREEN9"], "rec_chars": ["蔥餅加點然", "切被口先它", "吧候時再後"], "s": "Green 82 烤鴨  北京烤鴨是中國菜，它已經有幾百年的歷史。 烤好的鴨子，外面的皮是黃黃脆脆的，裏面的肉是軟軟嫩嫩的。 烤鴨被推出來以後，廚師會把烤鴨肉連皮，一片一片地切好。 吃烤鴨的時候，要先拿一張薄餅 ，再加一點醬和大蔥，然後把鴨肉片包起來吃。 哎呀! 我的口水要流出來了。「媽媽! 快帶我去吃烤鴨吧!」"}, {"id": "GREEN83", "level": "GREEN", "number": 83, "title_zh": "巧克力蛋糕", "title_en": "Chocolate cake", "topic": "食物", "cover": "/covers/GREEN83.jpg", "top_chars": "姐(6次)、蛋(5次)", "rec_ids": ["GREEN51", "GREEN84", "YELLOW58"], "rec_chars": ["鐘分所點以", "粉送山還過", "粉麵油烤糖"], "s": "Green 83 巧克力蛋糕  姐姐過生日，她八歲了，我要做一個蛋糕送給她。 先放蛋，再放麵粉，還要加牛油和糖。 姐姐愛吃巧克力，所以，要多放一點。 烤了十分鐘，蛋糕還是很小。再烤二十分鐘。 糟糕!蛋糕變成一座巧克力山了，不過，姐姐還是很愛吃。"}, {"id": "GREEN84", "level": "GREEN", "number": 84, "title_zh": "花蜜和花粉", "title_en": "Honey and pollen", "topic": "食物", "cover": "/covers/GREEN84.jpg", "top_chars": "花(13次)、一(6次)", "rec_ids": ["GREEN80", "GREEN99", "GREEN15"], "rec_chars": ["別住房怕想", "山高怕長想", "害怕爬還著"], "s": "Green 84 花蜜和花粉  爬上高高的山，穿過長長的山洞，小山村裏住著一群小矮人。 他們住在花裏，穿花衣，吃花粉，喝花蜜。 有一天，來了一個巨人，他們很害怕，不知道巨人想要做什麼? 巨人說:「別怕!我也想住在花裏，穿花衣，吃花粉，喝花蜜。」 小矮人幫巨人，做了一個大花房，還送他一包包的花粉和一杯杯的花蜜。"}, {"id": "GREEN85", "level": "GREEN", "number": 85, "title_zh": "零食", "title_en": "Snacks", "topic": "食物", "cover": "/covers/GREEN85.jpg", "top_chars": "零(7次)、食(7次)", "rec_ids": ["GREEN80", "GREEN78", "GREEN38"], "rec_chars": ["煮菜住飯打", "薯食片為愛", "更片像愛還"], "s": "Green 85 零食  我們家櫃整裏面，放了很多零食，因為我們家的人都愛吃零食。 姐姐愛吃芒果乾，弟弟愛吃薯片，我愛吃豬肉乾。 我們都知道吃了零食，就不想吃媽媽煮的飯菜後。可是，我們還是忍不住要吃零食。 今天，我們打開櫃子，裏面是空的，沒有零食了。 家裏沒有了零食，媽媽煮的飯菜，好像變得更香了…..."}, {"id": "GREEN86", "level": "GREEN", "number": 86, "title_zh": "西瓜和番茄", "title_en": "Watermelons and tomatoes", "topic": "食物", "cover": "/covers/GREEN86.jpg", "top_chars": "西(8次)、瓜(8次)", "rec_ids": ["GREEN80", "GREEN97", "GREEN39"], "rec_chars": ["住誰想爸和", "紅誰又和你", "定想爸和你"], "s": "Green 86 西瓜和番茄  小西瓜和爸爸媽媽住在一起，他們的鄰居是紅番茄。 一天，小西瓜看到了方西瓜，小紅蕃茄看到了紫番茄。 他們的爸爸說:「方西瓜、紫番茄是你們的表哥、表弟。」 又一天，小西瓜看到了三角西瓜。小紅蕃茄看到了藍番茄。 他們想:他們又是誰?啊! 三角西瓜和藍番茄一定是我們的堂哥、堂弟。"}, {"id": "GREEN87", "level": "GREEN", "number": 87, "title_zh": "香味", "title_en": "Fragrance", "topic": "食物", "cover": "/covers/GREEN87.jpg", "top_chars": "香(6次)、味(6次)", "rec_ids": ["GREEN80", "GREEN29", "GREEN55"], "rec_chars": ["門原飯房打", "原候時打以", "臥客廳原房"], "s": "Green 87 香味  今天媽媽做蛋糕，烤蛋糕的時候，香味飄出來了。 客廳、飯廳、書房和臥室都是香味。聞到香味，我肚子都餓了。 「叩!叩!叩!」有人敲門，我打開門，原來的鄰居小胖。 他說:「你家蛋糕的香味飄到我家了。」我說:「香味是可以分享的呀!」 他說:「那蛋糕可以分享嗎?」"}, {"id": "GREEN88", "level": "GREEN", "number": 88, "title_zh": "好吃的東西", "title_en": "Yummy stuff", "topic": "食物", "cover": "/covers/GREEN88.jpg", "top_chars": "吃(6次)、我(5次)", "rec_ids": ["GREEN78", "GREEN80", "GREEN81"], "rec_chars": ["健康東覺西", "牙菜青得想", "淇淋東冰西"], "s": "Green 88 好吃的東西  為什麼我覺得好吃的東西，大人都說是不健康的。 我愛吃棒棒糖，老師說吃了會蛀牙。 我愛吃冰淇淋，奶奶說吃了會喉嚨痛。 我想喝汽水，爸爸說喝了會變胖。 我說:「媽媽，請你青菜加糖，肉加冰淇淋，湯加汽水，好嗎?」"}, {"id": "GREEN89", "level": "GREEN", "number": 89, "title_zh": "先吃再付錢", "title_en": "Pay after eating", "topic": "食物", "cover": "/covers/GREEN89.jpg", "top_chars": "我(7次)、弟(6次)", "rec_ids": ["GREEN9", "GREEN80", "GREEN29"], "rec_chars": ["買場巧克力", "發飯找這沒", "候時坐都沒"], "s": "Green 89 先吃再付錢  媽媽讓我帶弟弟去超級市場，買我們喜歡吃的零食。 我選了巧克力和冰淇淋，弟弟選了薯片和棒棒糖。 我提籃子去排隊的時候，發現弟弟不見了。 我去找他，看到他坐在地上吃薯片。我說:「我們還沒付錢呀!」 他說:「吃了再付錢，不行嗎? 飯店都是這樣的。」"}, {"id": "GREEN90", "level": "GREEN", "number": 90, "title_zh": "食物夢", "title_en": "Food dream", "topic": "食物", "cover": "/covers/GREEN90.jpg", "top_chars": "的(9次)、做(7次)", "rec_ids": ["GREEN50", "GREEN89", "YELLOW15"], "rec_chars": ["醒夢真做就", "薯巧克力食", "椅真坐還都"], "s": "Green 90 食物夢  我做了一個夢，夢裏都是食物。我坐的船是木瓜做的，河水是牛奶。 河上有橋，橋是香蕉做的。河邊有路，路是麵包做的。 路的兩邊有西瓜做的椅子，還有薯片做的花。 河裏有很多巧克力做的魚，我伸手去抓魚….. 我就醒了，一看!我手裏真的有巧克力魚呢!"}, {"id": "GREEN91", "level": "GREEN", "number": 91, "title_zh": "星星吃月亮", "title_en": "The stars ate the moon", "topic": "自然", "cover": "/covers/GREEN91.jpg", "top_chars": "月(10次)、亮(10次)", "rec_ids": ["GREEN43", "GREEN11", "GREEN21"], "rec_chars": ["它又把很天", "於變又把很", "所以得把很"], "s": "Green 91 星星吃月亮  天上的月亮大又圓，星星看見了，很嫉妒月亮。 於是，它們決定去吃月亮，把月亮吃得彎彎的。 不久，月亮又變得大又圓，星星又嫉妒月亮了。 它們又去吃月亮，月亮又變得彎彎的。 所以，我看到的月亮，有時是圓圓的，有時是彎彎的。"}, {"id": "GREEN92", "level": "GREEN", "number": 92, "title_zh": "找寶藏", "title_en": "A Treasure Hunt", "topic": "自然", "cover": "/covers/GREEN92.jpg", "top_chars": "寶(6次)、藏(6次)", "rec_ids": ["GREEN84", "GREEN55", "GREEN9"], "rec_chars": ["洞山高爬穿", "原讓面起也", "場藏再找面"], "s": "Green 92 找寶藏  這是一張寶藏圖，來!我們一起去找寶藏。 寶藏在哪裏呢?讓我們再看清楚寶藏圖。 先爬上高高的山，再渡過長長的河 。 找到最大的石頭，再穿過下面的小山洞。 「救命呀!」原來是一場夢，什麼寶藏也沒有。"}, {"id": "GREEN93", "level": "GREEN", "number": 93, "title_zh": "我喜歡大自然", "title_en": "I love nature", "topic": "自然", "cover": "/covers/GREEN93.jpg", "top_chars": "的(7次)、我(6次)", "rec_ids": ["GREEN19", "GREEN56", "GREEN74"], "rec_chars": ["箏空高放風", "候呢時放起", "泳游呢朋友"], "s": "Green 93 我喜歡大自然  晴天的時候，我喜歡到大海裏和魚兒游泳。 陰天的時候，我喜歡和朋友爬上高山，一起去探險。 颳風的時候，我喜歡放風箏，讓風箏飛上天空和鳥兒玩。 下雨的時候，我喜歡畫畫，畫什麼呢? 我畫了大海的魚兒，一起爬山的朋友，和天空的鳥兒。"}, {"id": "GREEN94", "level": "GREEN", "number": 94, "title_zh": "遊太空", "title_en": "A space trip", "topic": "自然", "cover": "/covers/GREEN94.jpg", "top_chars": "我(11次)、上(5次)", "rec_ids": ["GREEN39", "GREEN50", "GREEN19"], "rec_chars": ["用帶衣穿給", "破掉氣用球", "雲吹掉空見"], "s": "Green 94 遊太空  老師給我一個氣球，我用力吹，氣球越吹越大。 我飛上了天，小鳥咬破我的氣球。 我掉在白雲上，飄啊飄，我抓住火箭向上飛…... 我看見太空人，他讓我穿上太空衣，坐上太空船，然後帶我回家去 。 媽媽問:「你剛剛去了哪裏?」我說:「我去了很多地方!」"}, {"id": "GREEN95", "level": "GREEN", "number": 95, "title_zh": "寶石", "title_en": "Precious stones", "topic": "自然", "cover": "/covers/GREEN95.jpg", "top_chars": "媽(16次)、魚(7次)", "rec_ids": ["GREEN35", "GREEN55", "GREEN28"], "rec_chars": ["藍走跳寶叫", "走開面得也", "叫得沒也地"], "s": "Green 95 寶石  媽媽的游泳衣上， 有很多漂亮的小魚，媽媽跳進水裏， 小魚游走了。 媽媽追小魚，小魚游得很快，媽媽也游得很快。 小魚游進一個洞裏，媽媽也游進去，媽媽見到了美人魚和沉船， 沉船裏面有很多寶石，有紅寶石，綠寶石和藍寶石。媽媽開心地大叫! 媽媽醒了，沒有美人魚，沒有沉船，只有曬紅的臉。"}, {"id": "GREEN96", "level": "GREEN", "number": 96, "title_zh": "老樹 The old tree", "title_en": "The old tree", "topic": "自然", "cover": "/covers/GREEN96.jpg", "top_chars": "樹(11次)、我(7次)", "rec_ids": ["GREEN74", "GREEN77", "YELLOW15"], "rec_chars": ["傷覺友朋都", "傷哭友朋心", "覺睡白像書"], "s": "Green 96 老樹  我家院子裏有棵很老的大樹，它的樹幹和樹枝都很粗。 白天，我會爬上老樹，坐在粗粗的樹枝上看書和睡覺。 晚上，我也會爬上老樹，躺在粗粗的樹枝上看月亮和數星星。 我傷心的時候，也會爬上老樹，抱著樹枝哭，說出我的心事。 老樹好像是我另外一個家，也是我最好的朋友。"}, {"id": "GREEN97", "level": "GREEN", "number": 97, "title_zh": "美麗的星星", "title_en": "Beautiful stars", "topic": "自然", "cover": "/covers/GREEN97.jpg", "top_chars": "我(8次)、一(7次)", "rec_ids": ["GREEN23", "GREEN38", "GREEN80"], "rec_chars": ["閃麗美像然", "話然像會和", "只兔誰兒和"], "s": "Green 97 美麗的星星  有一天，太陽、白雲和彩虹在說話，它們要比一比，看誰最美麗。 太陽說:「我又大又紅，當然是我最美麗。」 白雲說:「我一會兒像小羊，一會兒像白兔，當然是我最美麗。」 彩虹說:「你們只有一種顏色，我有七種顏色，當然是我最美麗。」 星星聽到了，它說:「只有我一閃一閃的像寶石，我才最美麗。」"}, {"id": "GREEN98", "level": "GREEN", "number": 98, "title_zh": "雨天的積水", "title_en": "Puddles on the rainy days", "topic": "自然", "cover": "/covers/GREEN98.jpg", "top_chars": "我(8次)、雨(7次)", "rec_ids": ["GREEN55", "GREEN49", "GREEN25"], "rec_chars": ["讓點走跑拿", "怎見雨回拿", "友朋跑打得"], "s": "Green 98 雨天的積水  我喜歡雨天，我愛拿著雨傘在雨中慢慢地走。 我也愛在雨中跑來跑去，讓雨點打在我的臉上，打在我的身上。 我更愛踩著雨天的積水，喜歡和朋友比賽，看誰踩積水，把水濺得最高。 糟糕! 全身都濕了，媽媽來了，我看見她生氣的臉，怎麼辦? 趕快回家，洗個熱水澡，再告訴她，我踩積水，把水濺得最高!"}, {"id": "GREEN99", "level": "GREEN", "number": 99, "title_zh": "春夏秋冬", "title_en": "Spring summer autumn winter", "topic": "自然", "cover": "/covers/GREEN99.jpg", "top_chars": "了(9次)、草(8次)", "rec_ids": ["GREEN80", "GREEN74", "GREEN84"], "rec_chars": ["吧青怕心這", "得起沒也麼", "山高怕長想"], "s": "Green 99 春夏秋冬  春天到了，山上長滿了青草，一隻羊在吃草。 一頭牛來了，也想吃草，羊說: 「這麼多草，我們一起吃吧!」 夏天到了，山上的草長高了，牛和羊吃得好飽好飽。 秋天到了，羊的肚子餓了，山上沒草了。牛說:「你來我家吧!」 牛的家裏很多草，羊開心地說:「這麼多草，冬天到了也不怕!」"}, {"id": "GREEN100", "level": "GREEN", "number": 100, "title_zh": "小種子", "title_en": "The little seed", "topic": "自然", "cover": "/covers/GREEN100.jpg", "top_chars": "它(6次)、種(5次)", "rec_ids": ["GREEN55", "YELLOW65", "GREEN32"], "rec_chars": ["戶窗讓點面", "芽種它放果", "外發點面就"], "s": "Green 100 小種子  我把小種子種在土裏，放在窗戶旁邊，讓太陽照著它 天天 給它喝水，一天天的過去了，種子終於發芽了。 我想讓它快點長大，就把它移到窗戶外面， 讓它曬更多太陽，喝更多雨水。 結果，它曬太多太陽，喝太多雨水，我的小種子死了!"}];

, "儿就什想么", "馆就也去你"], "s": "Yellow 13 你想住在哪裏  我想住在图书馆裏， 想看什么书，就看什么书。 我想住在玩具店裏， 想玩什么玩具，就玩什么玩具。 我想住在糖果屋裏， 想吃什么糖，就吃什么糖。 我想住在妈妈口袋裏，她去哪儿，我也去哪儿。"}, {"id": "YELLOW14", "level": "YELLOW", "number": 14, "title_zh": "动物的船沉了", "title_en": "The animals’ boat was sinking", "topic": "动物", "cover": "/covers/YELLOW14.jpg", "top_chars": "了(6次)、们(3次)", "rec_ids": ["GREEN11", "GREEN68", "GREEN80"], "rec_chars": ["救进又动物", "架升救直机", "回得儿动物"], "s": "Yellow 14 动物的船沉了  船要沉了， 动物们跳进海裏， 牠们游到一个小岛，在沙上写「救命」。 一架直升机看到了「救命」， 可是，直升机飞走了， 一会儿，直升机又飞回来了! 牠们得救了!"}, {"id": "YELLOW15", "level": "YELLOW", "number": 15, "title_zh": "不是真的动物", "title_en": "Not real animals", "topic": "动物", "cover": "/covers/YELLOW15.jpg", "top_chars": "看(4次)、不(3次)", "rec_ids": ["YELLOW16", "GREEN11", "GREEN80"], "rec_chars": ["鹰园真兔白", "原头猫鼠动", "兔原动地物"], "s": "Yellow 15 不是真的动物  有一天，我去公园。 我看到爷爷和袋鼠坐在椅子上看书。 孩子们在草地上和小马踢球。 妈妈和白兔一起种花。 还有猫头鹰在树上，不睡觉。 我再看一看，它们怎么都不动? 原来它们都是凋像!"}, {"id": "YELLOW16", "level": "YELLOW", "number": 16, "title_zh": "动物的朋友", "title_en": "Animals’ friends", "topic": "动物", "cover": "/covers/YELLOW16.jpg", "top_chars": "带(6次)、去(6次)", "rec_ids": ["YELLOW15", "GREEN66", "GREEN74"], "rec_chars": ["鹰园真兔白", "丽园美花动", "耍泳游朋友"], "s": "Yellow 16 动物的朋友  有朋友真好! 花猫带小狗去屋顶玩耍， 白鹅带小鸭去池塘裏游泳， 兔子带青蛙去草地上跳绳， 蜜蜂带蝴蝶去花园裏採蜂蜜， 黄牛带小马去农场吃草， 老鹰带我飞上天，去看美丽的世界。"}, {"id": "YELLOW17", "level": "YELLOW", "number": 17, "title_zh": "狗儿", "title_en": "The dogs", "topic": "动物", "cover": "/covers/YELLOW17.jpg", "top_chars": "狗(7次)、儿(7次)", "rec_ids": ["GREEN34", "GREEN74", "GREEN15"], "rec_chars": ["见友朋跑过", "散步主友朋", "向著就也只"], "s": "Yellow 17 狗儿  我牵狗儿去散步， 狗儿看见牠的好朋友，就向前跑， 我也跟着牠向前跑， 牠的好朋友向牠跑过来， 那隻狗儿的主人也跟着跑过来， 不是我们牵狗儿，是狗儿牵我们， 狗儿们的主人也做了好朋友!"}, {"id": "YELLOW18", "level": "YELLOW", "number": 18, "title_zh": "老鹰和兔子", "title_en": "The eagle and the hare", "topic": "动物", "cover": "/covers/YELLOW18.jpg", "top_chars": "子(7次)、兔(6次)", "rec_ids": ["GREEN38", "GREEN80", "GREEN19"], "rec_chars": ["然跑快只地", "只兔跑老地", "转跑快飞只"], "s": "Yellow 18 老鹰和兔子  一隻老鹰在天上飞， 牠看到了地上的兔子， 牠飞快地飞向兔子， 兔子也飞快地逃跑， 老鹰的爪子快要抓到兔子了， 聪明的兔子突然转弯， 老鹰来不及转弯，只好飞上天了。"}, {"id": "YELLOW19", "level": "YELLOW", "number": 19, "title_zh": "好看的动物", "title_en": "Nice looking animals", "topic": "动物", "cover": "/covers/YELLOW19.jpg", "top_chars": "加(7次)、图(7次)", "rec_ids": ["GREEN66", "GREEN41", "YELLOW16"], "rec_chars": ["更条星花动", "马给鱼色动", "马花动物好"], "s": "Yellow 19 好看的动物  给动物涂色，加图案? 海星，加上圆圈图案， 海马，加上线条图案， 海豚，加上鑽石图案， 章鱼，加上螺旋图案， 海龟，加上花儿图案， 有了图案，动物更加好看!"}, {"id": "YELLOW20", "level": "YELLOW", "number": 20, "title_zh": "会飞的动物", "title_en": "Flying animals", "topic": "动物", "cover": "/covers/YELLOW20.jpg", "top_chars": "飞(11次)、会(7次)", "rec_ids": ["GREEN28", "GREEN11", "GREEN31"], "rec_chars": ["朋友也动人", "拉猴找就把", "找想会动物"], "s": "Yellow 20 会飞的动物  巫婆有扫把就会飞， 阿拉丁有飞毯就会飞， 超人有披风就会飞， 蜘蛛侠有蜘蛛丝就会飞， 人们有飞行伞就会飞。 小猴子也想飞…... 牠只要找个会飞的好朋友「鹦鹉」，就飞了。"}, {"id": "YELLOW21", "level": "YELLOW", "number": 21, "title_zh": "什么动物最棒", "title_en": "Who is the most powerful animal?", "topic": "动物", "cover": "/covers/YELLOW21.jpg", "top_chars": "最(10次)、我(9次)", "rec_ids": ["GREEN11", "GREEN38", "GREEN70"], "rec_chars": ["掉洞猴快鼠", "嘴跑跳爬快", "从洞跳得鼠"], "s": "Yellow 21 什么动物最棒  动物们在树下七嘴八舌。 豹说:「我跑得最快，我最棒!」 鼹鼠说:「我挖洞最快，我最棒!」 袋鼠说:「我跳得最快，我最棒!」 猴子说:「我爬树最快，我最棒!」 网子从树上掉下来， 猎人说:「我最棒!」"}, {"id": "YELLOW22", "level": "YELLOW", "number": 22, "title_zh": "说话的鱼", "title_en": "The fish that talks", "topic": "动物", "cover": "/covers/YELLOW22.jpg", "top_chars": "鱼(14次)、的(8次)", "rec_ids": ["GREEN9", "GREEN46", "GREEN58"], "rec_chars": ["发电回人家", "喷水会人家", "话电会人家"], "s": "Yellow 22 说话的鱼  会吃人的鱼，鲨鱼。 会喷水的鱼，鲸鱼。 会发电的鱼，电鳗。 会清洁的鱼，清洁鱼。 会发光的鱼，烛光鱼。 会回家的鱼，鲑鱼。 会说话的鱼，美人鱼。"}, {"id": "YELLOW23", "level": "YELLOW", "number": 23, "title_zh": "动物的脚印", "title_en": "Animal Footprints", "topic": "动物", "cover": "/covers/YELLOW23.png", "top_chars": "们(8次)、的(7次)", "rec_ids": ["GREEN80", "GREEN28", "GREEN66"], "rec_chars": ["谁想动地物", "叶像动地物", "像想熊花动"], "s": "Yellow 23 动物的脚印  地上有大脚印。 「不是我们的脚印，我们的像叶子。」小鸭们说。 「不是我们的脚印，我们的像花。」小狗们说。 「是谁的脚印呢?」牠们想…. [是我的!」大熊说。 「 是大熊，快逃!」小动物们说 。 「不要逃!进来吃蜂蜜!」大熊说。"}, {"id": "YELLOW24", "level": "YELLOW", "number": 24, "title_zh": "猫儿在哪里", "title_en": "Where is the cat?", "topic": "动物", "cover": "/covers/YELLOW24.jpg", "top_chars": "在(5次)、小(5次)", "rec_ids": ["GREEN11", "GREEN80", "GREEN28"], "rec_chars": ["喵洞猫叫树", "这儿天里牠", "吗叫树天里"], "s": "Yellow 24 猫儿在哪裏  这是我的猫， 牠的名字叫小月 。 有一天，牠不见了! 小月在树上吗? 小月在洞裏吗? 小月在哪裏? 「喵!」小月当妈妈了!"}, {"id": "YELLOW25", "level": "YELLOW", "number": 25, "title_zh": "动物宝宝", "title_en": "Animal babies", "topic": "动物", "cover": "/covers/YELLOW25.jpg", "top_chars": "看(8次)、来(7次)", "rec_ids": ["GREEN11", "GREEN80", "YELLOW15"], "rec_chars": ["原松头出鼠", "原回动物爸", "原坐头鼠都"], "s": "Yellow 25 动物宝宝  鸟妈妈坐在鸟巢裏， 蜻蜓飞过来，看一看! 树蛙跳过来，看一看! 小松鼠爬过来，看一看! 小朋友把头伸过来，看一看! 鸟爸爸回来了， 牠说:「原来我的宝宝都出来了!」"}, {"id": "YELLOW26", "level": "YELLOW", "number": 26, "title_zh": "鱼鹰", "title_en": "The fish hawk", "topic": "动物", "cover": "/covers/YELLOW26.jpg", "top_chars": "鱼(6次)、牠(5次)", "rec_ids": ["GREEN32", "GREEN10", "GREEN11"], "rec_chars": ["向进出又就", "站向边进开", "进出又就树"], "s": "Yellow 26 鱼鹰  一隻鱼鹰站在树上， 牠长开翅膀，飞向大海， 牠飞进大海裏， 牠又飞出了大 海， 牠的爪子抓着一条鱼， 牠到海边吃鱼。 鱼鹰就是吃鱼的鹰。"}, {"id": "YELLOW27", "level": "YELLOW", "number": 27, "title_zh": "小鸭", "title_en": "The duckling", "topic": "动物", "cover": "/covers/YELLOW27.jpg", "top_chars": "小(5次)、鸭(5次)", "rec_ids": ["GREEN80", "GREEN12", "GREEN74"], "rec_chars": ["心这儿想下", "心这飞想也", "伤呢走都也"], "s": "Yellow 27 小鸭  老鹰来捉小鸡了， 小鸡都躲到母鸡的翅膀下， 小鸭也躲到母鸭的翅膀下， 老鹰飞走了。 母鸭伤心地说:「一隻小鸭不见了。」 牠想:是不是老鹰抓走了? 「牠在我这儿呢!」母鸡说。"}, {"id": "YELLOW28", "level": "YELLOW", "number": 28, "title_zh": "剪纸", "title_en": "Paper cutting", "topic": "学校/学校活动", "cover": "/covers/YELLOW28.jpg", "top_chars": "一(4次)、折(3次)", "rec_ids": ["YELLOW31", "YELLOW33", "GREEN32"], "rec_chars": ["正半折角张", "角剪形白方", "半枝张纸点"], "s": "Yellow 28 剪纸  一张正方形的白纸， 摺一半是三角形， 在长的一边中间画个点， 右角摺上去， 左角摺上去， 在中间画上树干和树枝。 剪下来，再打开，就是一片雪花!"}, {"id": "YELLOW29", "level": "YELLOW", "number": 29, "title_zh": "比赛", "title_en": "A race", "topic": "学校/学校活动", "cover": "/covers/YELLOW29.jpg", "top_chars": "小(4次)、第(3次)", "rec_ids": ["GREEN15", "GREEN80", "GREEN98"], "rec_chars": ["慢怎爬还就", "始谁跑开就", "赛慢怎比点"], "s": "Yellow 29 比赛  各就各位， 预备， 开始，跑! 加油!加油! 快到终点了! 第一、第二、第三，小乌龟和小蜗牛还在爬， 小乌龟和小蜗牛说: 「怎么不比谁最慢?」"}, {"id": "YELLOW30", "level": "YELLOW", "number": 30, "title_zh": "橡皮", "title_en": "The erasers", "topic": "学校/学校活动", "cover": "/covers/YELLOW30.jpg", "top_chars": "橡(5次)、皮(5次)", "rec_ids": ["GREEN73", "GREEN82", "GREEN75"], "rec_chars": ["口呀包糖打", "皮口呀包拿", "糖打拿进放"], "s": "Yellow 30 橡皮  弟弟打开我的书包， 他拿出我的笔盒， 他打开我的笔盒， 笔盒裏面有橡皮， 他闻一闻橡皮说:「好香！」 他把橡皮放进口裏， 我说：「弟弟！那是橡皮，不是糖呀！」"}, {"id": "YELLOW31", "level": "YELLOW", "number": 31, "title_zh": "折纸 Paper folding", "title_en": "Paper folding", "topic": "学校/学校活动", "cover": "/covers/YELLOW31.jpg", "top_chars": "一(6次)、个(4次)", "rec_ids": ["YELLOW33", "YELLOW28", "YELLOW55"], "rec_chars": ["睛角眼形方", "正半折角张", "睛眼成两变"], "s": "Yellow 31 摺纸  一张正方形的纸，把它摺一半， 变成一个三角形。 再把上面两个角，向下摺， 变成两个耳朵。 然后画一双眼睛， 再画一个小鼻子， 就变成一隻可爱的小狗了。"}, {"id": "YELLOW32", "level": "YELLOW", "number": 32, "title_zh": "少了什么", "title_en": "What’s missing?", "topic": "学校/学校活动", "cover": "/covers/YELLOW32.jpg", "top_chars": "么(9次)、少(8次)", "rec_ids": ["GREEN13", "GREEN18", "GREEN74"], "rec_chars": ["骑开车都什", "踏骑脚车看", "怎脚都玩么"], "s": "Yellow 32 少了什么  风筝少了什么不能飞？ 脚踏车少了什么不能骑？ 汽车少了什么不能开？ 沙坑少了什么不能玩？ 皮球少了什么不能拍？ 风车少了什么不能转？ 怎么都看不清楚？ 我少了什么"}, {"id": "YELLOW33", "level": "YELLOW", "number": 33, "title_zh": "剪剪贴贴", "title_en": "Cut and paste", "topic": "学校/学校活动", "cover": "/covers/YELLOW33.jpg", "top_chars": "剪(9次)、贴(7次)", "rec_ids": ["YELLOW31", "YELLOW28", "GREEN92"], "rec_chars": ["睛角眼形方", "角剪形白方", "先再最长面"], "s": "Yellow 33 剪剪贴贴  先剪一个黑色椭圆形， 再剪一个白色心形，贴在上面。 然后剪一个白色圆形，贴在下面。 在白色心形上面，画两个小眼睛。 再剪三个小的三角形，还有两个大的三角形。 最后再剪两个黑色长方形，都贴上去。 像企鹅吗？ 你也来剪剪贴贴！"}, {"id": "YELLOW34", "level": "YELLOW", "number": 34, "title_zh": "带宝贝到学校", "title_en": "Bring your treasure to school", "topic": "学校/学校活动", "cover": "/covers/YELLOW34.jpg", "top_chars": "带(6次)、的(6次)", "rec_ids": ["GREEN9", "YELLOW10", "GREEN20"], "rec_chars": ["戏游机玩人
