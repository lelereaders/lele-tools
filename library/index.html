hars": ["视饭电起玩", "爷奶哥做妹", "爷奶哥姐妹"], "s": "Yellow 50 全家人  弟弟在玩玩具， 妹妹在跳舞， 姐姐在做功课， 哥哥在踢球， 妈妈和爸爸在看电视， 爷爷和奶奶在看报纸。 全家人在一起吃饭!"}, {"id": "YELLOW51", "level": "YELLOW", "number": 51, "title_zh": "我的家", "title_en": "My home", "topic": "家/家人", "cover": "/covers/YELLOW51.jpg", "top_chars": "我(8次)、小(8次)", "rec_ids": ["GREEN1", "GREEN26", "GREEN70"], "rec_chars": ["蜗牛鱼个看", "鸟鱼会要大", "洞啊熊个要"], "s": "Yellow 51 我的家  小熊说:「我要一个家!」 小鱼说:「来我家!」 小熊说:「我不会游泳啊!」 小蜗牛说:「来我家!」 小熊说:「我太大了!」 小鸟说:「来我家!」小熊说:「…..]  小熊看到山洞说:「啊!我的家!」"}, {"id": "YELLOW52", "level": "YELLOW", "number": 52, "title_zh": "骑在我身上", "title_en": "Ride on me", "topic": "身体", "cover": "/covers/YELLOW52.jpg", "top_chars": "我(7次)、的(6次)", "rec_ids": ["GREEN7", "YELLOW11", "GREEN4"], "rec_chars": ["两只人狗很", "咬爱还狗很", "爱只人很他"], "s": "Yellow 52 骑在我身上  我是一隻狗， 我的主人是两岁的小小。 他爱拉我的耳朵， 他爱咬我的尾巴， 他爱打我的屁股， 他还爱骑在我的身上。 唉! 当狗很辛苦!"}, {"id": "YELLOW53", "level": "YELLOW", "number": 53, "title_zh": "画龙", "title_en": "To draw a dragon", "topic": "身体", "cover": "/covers/YELLOW53.jpg", "top_chars": "的(7次)、两(4次)", "rec_ids": ["YELLOW31", "YELLOW55", "YELLOW33"], "rec_chars": ["鼻耳朵睛角", "体睛眼加两", "睛角眼吗两"], "s": "Yellow 53 画龙  画一个马的脸， 两隻虎的眼睛， 一个狮子的鼻子， 两隻鹿的角， 两隻牛的耳朵， 一个蛇的身体， 两隻鹰的爪子。再加龙鬚，像龙吗?"}, {"id": "YELLOW54", "level": "YELLOW", "number": 54, "title_zh": "用耳朵听", "title_en": "To listen with your ears", "topic": "身体", "cover": "/covers/YELLOW54.jpg", "top_chars": "子(6次)、用(4次)", "rec_ids": ["GREEN66", "YELLOW18", "GREEN11"], "rec_chars": ["狮近动物好", "逃兔快只好", "声听快动物"], "s": "Yellow 54 用耳朵听  一隻兔子，牠听到附近有声音…... 兔子不动，用耳朵听。 牠闻到附近有味道 …… 兔子不动，用鼻子闻。 牠看到附近有动物…. 兔子不动，用眼睛看。 不好了，是狮子!快逃!"}, {"id": "YELLOW55", "level": "YELLOW", "number": 55, "title_zh": "画小鸟", "title_en": "To draw a bird", "topic": "身体", "cover": "/covers/YELLOW55.jpg", "top_chars": "小(8次)、画(6次)", "rec_ids": ["YELLOW31", "YELLOW33", "YELLOW72"], "rec_chars": ["睛眼成两变", "先睛眼两再", "嘴体睛眼两"], "s": "Yellow 55 画小鸟  先画一个大大的身体， 再画一个头。 头上画两隻小小的眼睛， 再加上一个小小的嘴。 身体下面画一个小尾巴， 再加上身体两边的翅膀。 变成小鸟!飞了!再见了!"}, {"id": "YELLOW56", "level": "YELLOW", "number": 56, "title_zh": "动物们吃东西", "title_en": "The animals eat food", "topic": "食物", "cover": "/covers/YELLOW56.jpg", "top_chars": "吃(7次)、说(6次)", "rec_ids": ["GREEN80", "GREEN67", "YELLOW15"], "rec_chars": ["卜萝吧兔青", "呀猫鼠动物", "真兔猫鼠动"], "s": "Yellow 56 动物们吃东西  兔子看到红萝蔔说:「又要吃红萝蔔!」 老鼠看到乳酪说:「又要吃乳酪!」 青蛙看见小虫说:「又要吃小虫! 」 小鸡看见米说:「又要吃米!」 小猫看见鱼说:「又要吃鱼!」 动物们说: 「我们来交换吧!」 「哎呀!真难吃!」动物们大叫。"}, {"id": "YELLOW57", "level": "YELLOW", "number": 57, "title_zh": "小鳄鱼吃东西", "title_en": "The Little crocodile eats food", "topic": "食物", "cover": "/covers/YELLOW57.jpg", "top_chars": "吃(5次)、牠(5次)", "rec_ids": ["GREEN78", "GREEN89", "GREEN90"], "rec_chars": ["脆薯食东片", "淇淋薯食片", "薯食片西多"], "s": "Yellow 57 小鳄鱼吃东西  小鳄鱼看到很多食物， 牠吃了薯片，脆脆的。 牠吃了汉堡，软软的。 牠吃了冰淇淋，冰冰的。 牠喝了汽水，甜甜的。 牠看到很多叉子。 小鳄鱼不能吃东西了!"}, {"id": "YELLOW58", "level": "YELLOW", "number": 58, "title_zh": "做饼干", "title_en": "To make cookies", "topic": "食物", "cover": "/covers/YELLOW58.jpg", "top_chars": "洞(5次)、把(4次)", "rec_ids": ["YELLOW62", "GREEN73", "GREEN83"], "rec_chars": ["揉擀粉面油", "揉倒糖奶然", "粉面油烤糖"], "s": "Yellow 58 做饼乾  一堆麵粉，中间挖个洞， 把鸡蛋放进洞裏， 把牛油放进洞裏， 把牛奶倒进洞裏， 把糖放进洞裏， 然后，揉麵和擀麵，再切成饼乾形状去烤一烤。 饼乾烤好了，好香!"}, {"id": "YELLOW59", "level": "YELLOW", "number": 59, "title_zh": "甜饼干", "title_en": "Cookies", "topic": "食物", "cover": "/covers/YELLOW59.jpg", "top_chars": "弟(8次)、妈(8次)", "rec_ids": ["GREEN48", "GREEN54", "GREEN75"], "rec_chars": ["写张条怕又", "藏又给多地", "生又给起他"], "s": "Yellow 59 甜饼乾  弟弟爱吃甜饼乾， 妈妈不要弟弟吃太多甜饼乾， 弟弟常常偷吃甜饼乾， 妈妈生气地藏起甜饼乾。 弟弟又偷吃了，他怕妈妈生气…... 他写一张字条给妈妈， 「我只吃了一块!」"}, {"id": "YELLOW60", "level": "YELLOW", "number": 60, "title_zh": "新鲜的水果", "title_en": "Fresh fruits", "topic": "食物", "cover": "/covers/YELLOW60.jpg", "top_chars": "果(6次)、做(6次)", "rec_ids": ["RED68", "RED76", "GREEN79"], "rec_chars": ["莓蕉淇淋香", "萄莓葡苹蕉", "苹成果做水"], "s": "Yellow 60 新鲜的水果  苹果，做成苹果派。 凤梨，做成凤梨酥。 香蕉，做成香蕉蛋糕。 芒果，做成芒果布丁。 葡萄，做成葡萄冰棍儿。 草莓，做成草莓冰淇淋。 还是新鲜的水果好吃。"}, {"id": "YELLOW61", "level": "YELLOW", "number": 61, "title_zh": "剩下的食物", "title_en": "Leftovers", "topic": "食物", "cover": "/covers/YELLOW61.jpg", "top_chars": "剩(5次)、的(5次)", "rec_ids": ["GREEN85", "YELLOW62", "GREEN82"], "rec_chars": ["肉菜食香饭", "油倒加点进", "肉菜加点它"], "s": "Yellow 61 剩下的食物  剩下的饭， 剩下的肉， 剩下的菜， 把它们全部倒进锅裏， 加一点油，炒!炒!炒! 香喷喷的炒饭做好了! 炒饭吃光了!一点都不剩!"}, {"id": "YELLOW62", "level": "YELLOW", "number": 62, "title_zh": "葱油饼", "title_en": "Green onion pancakes", "topic": "食物", "cover": "/covers/YELLOW62.jpg", "top_chars": "面(6次)、用(5次)", "rec_ids": ["GREEN79", "GREEN82", "YELLOW58"], "rec_chars": ["碗块成拿后", "葱饼加点然", "揉擀粉面油"], "s": "Yellow 62 葱油饼  把麵粉放进大碗裏， 加点水，用筷子搅一搅， 把搅好的麵粉倒出来，用手揉成一个大麵糰， 拿一小块麵糰，用擀麵棍擀平， 上面放油、葱和盐， 再用手捲起来压平，然后拿擀麵棍擀平。 最后用油煎一煎，葱油饼就做好了!"}, {"id": "YELLOW63", "level": "YELLOW", "number": 63, "title_zh": "大水", "title_en": "The flood", "topic": "自然", "cover": "/covers/YELLOW63.jpg", "top_chars": "宝(6次)、子(5次)", "rec_ids": ["GREEN55", "GREEN35", "YELLOW62"], "rec_chars": ["拿起把只家", "回宝只家个", "拿起水把个"], "s": "Yellow 63 大水  大水来了， 盆子裏有一个小宝宝， 大树上有几隻猴子， 牠们拿起盆子， 牠们摸摸盆子裏的宝宝， 大水退了! 猴子们把宝宝送回家!"}, {"id": "YELLOW64", "level": "YELLOW", "number": 64, "title_zh": "没有下雨", "title_en": "No rain", "topic": "自然", "cover": "/covers/YELLOW64.jpg", "top_chars": "了(7次)、没(3次)", "rec_ids": ["YELLOW69", "GREEN28", "GREEN46"], "rec_chars": ["干头没水树", "死没可树地", "龙怕头没水"], "s": "Yellow 64 没有下雨  很久没有下雨了， 土地，裂了， 玉米，死了， 树，枯了， 池塘，乾了， 水龙头，没水了， 可怕的旱灾来了!"}, {"id": "YELLOW65", "level": "YELLOW", "number": 65, "title_zh": "坚果", "title_en": "A nut", "topic": "自然", "cover": "/covers/YELLOW65.jpg", "top_chars": "坚(5次)、果(5次)", "rec_ids": ["GREEN11", "YELLOW15", "GREEN80"], "rec_chars": ["洞松找进出", "种再它鼠起", "谁心找想地"], "s": "Yellow 65 坚果  小松鼠找到一个坚果， 牠在地上挖了一个洞， 把坚果放进去， 再把坚果埋起来。 冬天到了，小松鼠找不到坚果。 春天到了，树芽出来了， 小松鼠看着它，心裏想:是谁种的小树?"}, {"id": "YELLOW66", "level": "YELLOW", "number": 66, "title_zh": "宝石", "title_en": "A diamond", "topic": "自然", "cover": "/covers/YELLOW66.jpg", "top_chars": "小(4次)、绿(4次)", "rec_ids": ["GREEN55", "GREEN11", "GREEN23"], "rec_chars": ["窗让走开鸟", "石躲进出树", "走出飞多只"], "s": "Yellow 66 宝石  下大雪，树枝上好多雪。 一隻小绿鸟躲在树枝裏， 我开窗让小绿鸟飞进来。 ars": ["喉咙针病痛", "针病医打生", "针痛医头打"], "s": "Yellow 94 医生  医生，我生病了。 医生，我头痛。 医生，我喉咙痛。 医生，我耳朵痛。 医生，我肚子痛。 护士给我打一针。 医生，我屁股也痛了。"}, {"id": "YELLOW95", "level": "YELLOW", "number": 95, "title_zh": "医院", "title_en": "The hospital", "topic": "职业", "cover": "/covers/YELLOW95.jpg", "top_chars": "狗(8次)、医(5次)", "rec_ids": ["GREEN34", "GREEN43", "GREEN76"], "rec_chars": ["带这给也狗", "啊带也动物", "针病医带打"], "s": "Yellow 95 医院  狗狗生病了， 我们带狗狗去动物医院， 医生给狗狗看病， 给狗狗打针、吃药。 我说: 「医生，我也要看病!」 他说: 「这是动物医院。」 我说: 「我也是动物啊!」"}, {"id": "YELLOW96", "level": "YELLOW", "number": 96, "title_zh": "是学生", "title_en": "A student", "topic": "职业", "cover": "/covers/YELLOW96.jpg", "top_chars": "他(12次)、是(8次)", "rec_ids": ["GREEN7", "GREEN54", "GREEN80"], "rec_chars": ["知道服衣就", "筒帽服衣他", "厨就人他看"], "s": "Yellow 96 是学生  看他的鼻子，猜他是小丑。 看他的帽子，猜他是厨师。 看他的听筒，猜他是医生。 看他的衣服，猜他是救火员。 看他的徽章，猜他是警察。 看他的腰带，猜他是工人。 看我的校服，就知道我是学生。"}, {"id": "YELLOW97", "level": "YELLOW", "number": 97, "title_zh": "长大要做什么", "title_en": "What do you want to be when you grow up?", "topic": "职业", "cover": "/covers/YELLOW97.jpg", "top_chars": "要(8次)、人(7次)", "rec_ids": ["GREEN70", "GREEN84", "GREEN60"], "rec_chars": ["舞问做什么", "长做什想么", "舞师当做什"], "s": "Yellow 97 长大要做什么  大人爱问我们:「你长大要做什么?」 有的人要当舞蹈家， 有的人要当老师， 有的人要当厨师， 有的人要当画家， 有的人要当太空人。 我说:「我要当小孩，不想长大!」"}, {"id": "YELLOW98", "level": "YELLOW", "number": 98, "title_zh": "坐直升机", "title_en": "Take a helicopter", "topic": "交通工具", "cover": "/covers/YELLOW98.jpg", "top_chars": "坐(7次)、我(6次)", "rec_ids": ["GREEN50", "GREEN66", "YELLOW99"], "rec_chars": ["真机电房多", "美巴多地很", "缆铁士山机"], "s": "Yellow 98 坐直升机  这个地方有很多交通工具。 坐电车，我看到很多店。 坐地下铁，我看到很多人。 坐渡轮，我看到很多船。 坐双层巴士，我看到很多房子。 坐缆车，我看到高山和的大海。 坐直升机，我看到这个地方，真美!"}, {"id": "YELLOW99", "level": "YELLOW", "number": 99, "title_zh": "不同的车", "title_en": "Different vehicles", "topic": "交通工具", "cover": "/covers/YELLOW99.jpg", "top_chars": "坐(6次)、车(4次)", "rec_ids": ["GREEN12", "GREEN15", "GREEN82"], "rec_chars": ["先站再然后", "先站滑然后", "国先中再然"], "s": "Yellow 99 不同的车  我先坐计程车， 到了地铁站，去坐地铁。 再坐机场快线，去机场， 又坐飞机，去中国。 然后，坐机场巴士到缆车站。 最后，坐缆车上山， 我终于可以滑雪了!"}, {"id": "YELLOW100", "level": "YELLOW", "number": 100, "title_zh": "坐什么车快", "title_en": "Which vehicle is faster?", "topic": "交通工具", "cover": "/covers/YELLOW100.jpg", "top_chars": "车(11次)、坐(10次)", "rec_ids": ["YELLOW32", "YELLOW99", "GREEN7"], "rec_chars": ["汽骑车飞什", "机坐最快车", "路电走什么"], "s": "Yellow 100坐什么车快  骑自行车比走路快， 坐电车比骑自行车快， 坐公共汽车比坐电车快， 坐汽车比坐公共汽车快， 坐火车比坐汽车快， 坐飞机比坐火车快， 火箭最快!"}, {"id": "GREEN1", "level": "GREEN", "number": 1, "title_zh": "说秘密", "title_en": "Going to school", "topic": "日常活动", "cover": "/covers/GREEN1.jpg", "top_chars": "秘(7次)、密(7次)", "rec_ids": ["GREEN27", "GREEN80", "GREEN7"], "rec_chars": ["蛙知道青想", "别青原就想", "知道原就人"], "s": "Green 1 说秘密  青蛙有一个秘密，牠把秘密告诉了小蜗牛。 小蜗牛把秘密告诉了小乌龟。 小乌龟又告诉了小金鱼。 小金鱼看到青蛙说:「我知道你的秘密了!」 青蛙想:「原来，秘密是不能说的，告诉别人就不是秘密了。」"}, {"id": "GREEN2", "level": "GREEN", "number": 2, "title_zh": "上学", "title_en": "Going to school", "topic": "日常活动", "cover": "/covers/GREEN2.jpg", "top_chars": "小(7次)、狗(7次)", "rec_ids": ["GREEN70", "GREEN28", "GREEN74"], "rec_chars": ["从问友朋做", "用友朋没也", "从常友朋做"], "s": "Green 2 上学  阿姨有隻小狗，我常常抱牠、亲牠。 小狗明天要上学了，我从来没听过，小狗也要上学。 我问阿姨:「小狗上学，是不是学中文、英文和体育?」 她说:「不是!小狗要学和不同种类、不同大小的狗做朋友。」 我对小狗说:「你真幸运!不用做功课。」"}, {"id": "GREEN3", "level": "GREEN", "number": 3, "title_zh": "数一数", "title_en": "Counting", "topic": "日常活动", "cover": "/covers/GREEN3.jpg", "top_chars": "数(13次)、一(8次)", "rec_ids": ["GREEN7", "GREEN50", "GREEN58"], "rec_chars": ["只为手没么", "己只自家去", "己只自给人"], "s": "Green 3 数一数  [ 家裏有几个人?」 弟弟数一数，少了一个人，因为忘了数自己。 「你有几枝笔?」 弟弟数一数，少了一枝笔，因为忘了数自己手上的笔。 我们去骑马，弟弟数一数说:「这裏共有十匹马。」这次，他没有忘记数自己骑的马。 我夸他很聪明，给他十颗糖。 他放了一颗在口裏，又去数一数糖，他说:「咦!怎么只有九颗糖呢?」"}, {"id": "GREEN4", "level": "GREEN", "number": 4, "title_zh": "谁是书虫", "title_en": "Who is the bookworm?", "topic": "日常活动", "cover": "/covers/GREEN4.jpg", "top_chars": "读(13次)、书(6次)", "rec_ids": ["GREEN72", "GREEN7", "GREEN40"], "rec_chars": ["早床吗见走", "样走做就会", "躺晚床发中"], "s": "Green 4 谁是书虫  有个人很爱看书。早上读，中午读，晚上读。晴天读，阴天读，雨天读。 在沙发上读，在床上读，在马桶上读。坐着读，走着读，躺着读。 最厉害的是把书倒放在地上，他靠着牆壁做倒立，倒着读。 你见过这样的人吗? 他就叫「书虫」。 我就是一个书虫，不过，我不是那隻会吃书的虫。"}, {"id": "GREEN5", "level": "GREEN", "number": 5, "title_zh": "做我喜欢的事", "title_en": "Doing things that I like to do", "topic": "日常活动", "cover": "/covers/GREEN5.jpg", "top_chars": "我(9次)、星(6次)", "rec_ids": ["GREEN7", "GREEN72", "GREEN9"], "rec_chars": ["钢弹琴泳只", "爷为这什下", "午五饭下去"], "s": "Green 5 做我喜欢的事  星期一到星期五，我要上学，学中文、英文和数学。 星期六上午，我要学游泳和打网球。下午，我要学体操和弹钢琴。 星期天中午，我要和爷爷、奶奶吃午饭。晚上，我要和外公、外婆吃晚饭。 一个星期为什么只有七天?我要一个星期八。 这一天，我什么也不学，哪裏也不去，只做我喜欢的事。"}, {"id": "GREEN6", "level": "GREEN", "number": 6, "title_zh": "捉迷藏", "title_en": "Hide and seek", "topic": "日常活动", "cover": "/covers/GREEN6.jpg", "top_chars": "小(9次)、了(4次)", "rec_ids": ["GREEN74", "GREEN9", "GREEN11"], "rec_chars": ["二原呢友朋", "箱五四藏找", "迷捉原藏躲"], "s": "Green 6 捉迷藏  只有我在家，没人陪我玩。对了!可以和小狗、小羊和小兔捉迷藏。 「一二三四五六七八九十，躲好了没有?」 啊! 找到你们了，小狗和小兔在床下。 可是，小羊呢? 「小朋友，你可以帮忙找一找小羊吗?」 哦! 原来小羊躲在箱子裏面睡着了!"}, {"id": "GREEN7", "level": "GREEN", "number": 7, "title_zh": "练习", "title_en": "Practice", "topic": "日常活动", "cover": "/covers/GREEN7.jpg", "top_chars": "到(5次)、一(5次)", "rec_ids": ["GREEN74", "GREEN29", "GREEN55"], "rec_chars": ["路泳原游走", "原两走为以", "原电走手得"], "s": "Green 7 练习  我在电脑上，看到一隻只有两隻脚的狗，可是，牠可以像人一样走路。 我在电脑上，看到一个没有手指的女孩，可是，她很会弹钢琴。 我在电脑上，看到一个没有双手的人，可是，他很会用脚做衣服。 我在电脑上，看到一个没有手和脚的人，可是，他很会游泳。 你知道为他们为什么做得到? 原来，他们就是练习、练习再练习。"}, {"id": "GREEN8", "level": "GREEN", "number": 8, "title_zh": "玩接龙游戏", "title_en": "Play a Word Chain game", "topic": "日常活动", "cover": "/covers/GREEN8.jpg", "top_chars": "玩(4次)、接(4次)", "rec_ids": ["GREEN9", "GREEN4", "GREEN6"], "rec_chars": ["椅戏午游吧", "午中吗坐过", "吗朋友找玩"], "s": "Green 8 玩接龙游戏  接龙游戏，你玩过吧! 中文接龙游戏，你玩过吗? 喝水>水草->草地->地球->球拍->拍手 中国->国家->家人->人山人海->海象 坐下->下午->午饭->饭桌->桌椅->椅子 你要不要找几个朋友，一起玩中文接龙游戏?"}, {"id": "GREEN9", "level": "GREEN", "number": 9, "title_zh": "找蛋游戏", "title_en": "Egg Hunt game", "topic": "日常活动", "cover": "/covers/GREEN9.jpg", "top_chars": "找(7次)、蛋(6次)", "rec_ids": ["GREEN89", "GREEN80", "GREEN61"], "rec_chars": ["买场巧克力", "吧发饭回找", "戏游吧回面"], "s": "Green 9 找蛋游戏  復活节到了，我们一家人去商场买了五个巧克力蛋。 回到家，我们一起玩找蛋游戏，爸爸把巧克力蛋都藏起来。 在电视机面、冰箱裏面、沙发椅垫后面和书架上面，我们找到四个蛋。 但是，我们找来找去都找不到第五个蛋。爸爸说:「吃完午饭，你们再找吧!」 我们坐下来要吃午饭的时候，看到弟弟满嘴都是巧克力。"}, {"id": "GREEN10", "level": "GREEN", "number": 10, "title_zh": "学游泳", "title_en": "Learning to swim", "topic": "日常活动", "cover": "/covers/GREEN10.jpg", "top_chars": "海(9次)、们(8次)", "rec_ids": ["GREEN15", "GREEN80", "GREEN55"], "rec_chars": ["冲站向害然", "怕跑心这开", "跑后开著把"], "s": "Green 10 学游泳  狗爸爸和狗妈妈带着小狗们去海边，想要教牠们游泳。 到了海边，牠们一个一个下车，开心地在海边跑来跑去。 狗爸爸在海裏，小狗们站在海边看，牠们害怕地往后退。 突然，一个大海浪冲向海边，把小狗们捲进海裏。 牠们拼命地游向海边，就这样，牠们学会游泳了。"}, {"id": "GREEN11", "level": "GREEN", "number": 11, "title_zh": "躲猫猫", "title_en": "Duo mao mao(colloquial Chinese for hide-and-seek)", "topic": "日常活动", "cover": "/covers/GREEN11.jpg", "top_chars": "猫(14次)、躲(8次)", "rec_ids": ["GREEN38", "GREEN32", "GREEN67"], "rec_chars": ["忽声松然快", "但掉然进出", "忽掉松然猫"], "s": "Green 11 躲猫猫  捉迷藏又叫「躲猫猫」。一天，小象、猴子、松鼠和小猫玩「躲猫猫」。 小象躲在石头后面，猴子躲在树上，松鼠很快就找到牠们了。 但是，牠找不到小猫。忽然，牠听到「喵喵」的叫声。原来，牠躲在洞裏。 小猫说: 「我不是躲在洞裏，我是掉进洞裏!」 于是，动物们一个拉一个，把小猫救出来了。「躲猫猫」变成了「救猫猫」。"}, {"id": "GREEN12", "level": "GREEN", "number": 12, "title_zh": "烫秋千", "title_en": "To swing", "topic": "日常活动", "cover": "/covers/GREEN12.jpg", "top_chars": "我(7次)、荡(6次)", "rec_ids": ["GREEN10", "GREEN25", "GREEN80"], "rec_chars": ["教站学然跑", "关然跑后开", "跑心这开就"], "s": "Green 12 烫鞦韆  小胖在盪鞦韆，盪过来又盪遇去。我也想盪鞦韆，可是我不会。 小胖就教我，到远一点的地方，先站好，然后跑，再跳。 我就学小胖，先站好，然后跑，再跳，结果，我飞过去了。 小胖说:「没关係，再来一次! 到远一点的地方。」我又先站好，然后跑，再跳。 这次，刚刚好。我好开心地盪过来又盪过去!"}, {"id": "GREEN13", "level": "GREEN", "number": 13, "title_zh": "怕鬼", "title_en": "Being afraid of ghosts", "topic": "日常活动", "cover": "/covers/GREEN13.jpg", "top_chars": "怕(9次)、我(9次)", "rec_ids": ["GREEN70", "GREEN25", "YELLOW9"], "rec_chars": ["跌因为朋友", "朋友怕开著", "为车著什下"], "s": "Green 13 怕鬼  骑车，我怕跌下来。攀岩，我怕掉下来。 划船，我怕船翻了。冲浪，我怕沉下去。 笨猪跳，我怕高。跳伞，我怕伞不开。 朋友笑着说:「你什么都怕，你是胆小鬼!」 我说:「不要叫我胆小鬼，因为我怕鬼!」"}, {"id": "GREEN14", "level": "GREEN", "number": 14, "title_zh": "想要有一双鞋", "title_en": "Imagine that I have a pair of shoes", "topic": "日常活动", "cover": "/covers/GREEN14.jpg", "top_chars": "它(8次)、有(6次)", "rec_ids": ["GREEN55", "GREEN57", "GREEN38"], "rec_chars": ["走跑面得飞", "空以还面想", "跑跳快还面"], "s": "Green 14 想要有一双鞋  我想要有一双鞋子，一双神奇的鞋子。 它有小马达，穿上它，可以跑得很快。 它有弹簧 穿上它，可以弹起来，跳过去。 它有气垫，穿上它，可以在水面上走。 它有螺旋桨，穿上它，还可以在空中飞!"}, {"id": "GREEN15", "level": "GREEN", "number": 15, "title_zh": "滑滑梯", "title_en": "Sliding down a slide", "topic": "日常活动", "cover": "/covers/GREEN15.jpg", "top_chars": "滑(11次)、我(9次)", "rec_ids": ["GREEN10", "GREEN29", "GREEN49"], "rec_chars": ["冲站向害然", "向慢后以面", "梯怎爬还就"], "s": "Green 15 滑滑梯  我带我的小狗去滑滑梯，我们慢慢地向上爬。 爬到滑梯上面，我先滑下，小狗还站在上面。 我滑下来以后，发现滑梯上面的小狗很害怕，我怎么叫，牠也不肯滑下来! 忽然，我看到一隻大花狗冲上滑梯，牠舔舔我小狗。 接着，大花狗和我的小狗就一起滑下来了!"}, {"id": "GREEN16", "level": "GREEN", "number": 16, "title_zh": "当一把伞", "title_en": "Being an umbrella", "topic": "日常活动", "cover": "/covers/GREEN16.jpg", "top_chars": "我(14次)、把(5次)", "rec_ids": ["GREEN11", "GREEN22", "GREEN55"], "rec_chars": ["变然头又就", "喜欢然当又", "得也把去和"], "s": "Green 16 当一把伞  我是一把花伞，你把我转一转，我就变色了。 有人用我来遮太阳，我就是阳伞。有人用我来遮雨，我就是雨伞。 不过，我喜欢有人用我来跳舞，载我转来又转去。 也喜欢有人用我来表演，把我顶在头上或鼻子上。 当然，我最得意的是老公公和老婆婆把我当他们的拐杖!"}, {"id": "GREEN17", "level": "GREEN", "number": 17, "title_zh": "帮忙", "title_en": "Being helpful", "topic": "日常活动", "cover": "/covers/GREEN17.jpg", "top_chars": "帮(8次)、忙(8次)", "rec_ids": ["GREEN51", "GREEN43", "GREEN81"], "rec_chars": ["问谁得都姐", "满忙身帮水", "问把地你他"], "s": "Green 17 帮忙  姐姐把牛奶打翻了，弟弟来帮忙，他弄得满桌都是牛奶。 妈妈把油打翻了，弟弟来帮忙，他弄得满地都是油。 哥哥把水彩打翻了，弟弟来帮忙，他弄得满身都是水彩。 妈妈、哥哥和姐姐说:「你不是帮忙，你是越帮越忙!」 弟弟不明白。他问:「谁要我帮忙?我会越帮越忙!」"}, {"id": "GREEN18", "level": "GREEN", "number": 18, "title_zh": "骑车", "title_en": "Riding a bike", "topic": "日常活动", "cover": "/covers/GREEN18.jpg", "top_chars": "车(9次)、猴(9次)", "rec_ids": ["GREEN15", "GREEN38", "GREEN55"], "rec_chars": ["忽然著也只", "忽然跳著只", "手著也只去"], "s": "Green 18 骑车  一隻瘦猴子，想骑脚踏车，牠的手扶着车头，脚却踩不到踏板。 一隻胖猴子，也想骑脚踏车，牠的脚踩到踏板，手却扶不到车头。 瘦猴子和胖猴子，看着脚踏车，摸摸头。你看着我，我看着你。忽然….. 胖猴子跳到车上，瘦猴子跳到胖猴子的肩膀上。 胖猴子脚踩踏板，瘦猴子手扶车头，牠们骑车去了。"}, {"id": "GREEN19", "level": "GREEN", "number": 19, "title_zh": "放风筝", "title_en": "Flying a kite", "topic": "日常活动", "cover": "/covers/GREEN19.jpg", "top_chars": "风(10次)、筝(9次)", "rec_ids": ["GREEN55", "GREEN67", "GREEN11"], "rec_chars": ["跑拿手著飞", "呀吹掉风下", "拉掉快叫又"], "s": "Green 19 放风筝  我和小胖去放风筝，我用两隻手把风筝高高地举起来。 小胖拉着风筝的线，快快地跑。风筝在天上转了转，掉下来了。 我又拿起风筝，高高地举起来，小胖又拉着风筝线要跑。 我说: 「等一等。」一阵大风吹来，我叫小胖快跑….. 小胖跑呀跑，风筝飞呀飞，飞上天空，飞到云裏，不见了!"}, {"id": "GREEN20", "level": "GREEN", "number": 20, "title_zh": "写儿歌", "title_en": "Writing nursery rhymes", "topic": "日常活动", "cover": "/covers/GREEN20.jpg", "top_chars": "老(8次)、一(7次)", "rec_ids": ["GREEN55", "GREEN11", "GREEN35"], "rec_chars": ["音声听点后", "声听松后找", "相每同己自"], "s": "Green 20 写儿歌  老师教我们唸儿歌，他一边唸，一边写。 白板上写了: 一二三四五，上山打老虎，老虎打不到，打到小松鼠。  老师说每句话的最后一个字，声音都有一点相同，唸起来容易又好听。 老师也要我们试试看，写一首自己的儿歌。 我就写了一首儿歌: 五隻小老虎，要找母老虎，找呀找不到，找到小老鼠。"}, {"id": "GREEN21", "level": "GREEN", "number": 21, "title_zh": "树熊", "title_en": "Koalas", "topic": "动物", "cover": "/covers/GREEN21.jpg", "top_chars": "树(7次)、熊(6次)", "rec_ids": ["GREEN28", "GREEN43", "GREEN52"], "rec_chars": ["叶觉用像以", "短身脚可也", "眼用身像以"], "s": "Green 21 树熊  树熊有胖胖的身体，小小的眼睛和短短的脚。 我也有胖胖的身体，小小的眼睛和短短的脚。 我觉得当树熊真好，每天就是吃和睡，不用上学。 所以，我告诉妈妈，我长得很像树熊，我要当树熊。 妈妈说:「好吧!我把你寄到澳洲当树熊。记得，你只可以吃树叶喔!」"}, {"id": "GREEN22", "level": "GREEN", "number": 22, "title_zh": "两只猪", "title_en": "Two pigs", "topic": "动物", "cover": "/covers/GREEN22.jpg", "top_chars": "干(10次)、净(10次)", "rec_ids": ["GREEN11", "GREEN16", "GREEN85"], "rec_chars": ["然叫又就把", "喜欢然当又", "整道干猪得"], "s": "Green 22 两隻猪  猪爸爸和猪妈妈有两个猪宝宝，一隻叫乾乾淨淨，一隻叫乱七八糟。 乾乾淨淨当然是喜欢把家裏弄得又乾淨又整齐。 可是，乱七八糟来了，就把家裏弄得又髒又乱，很不乾淨。 乱七八糟说:「猪就是不乾淨、不整齐的，我们喜欢又髒又乱。」 乾乾淨淨说:「难道，我们又乾淨又整齐，就不是猪了吗?」"}, {"id": "GREEN23", "level": "GREEN", "number": 23, "title_zh": "萤火虫", "title_en": "Fireflies", "topic": "动物", "cover": "/covers/GREEN23.jpg", "top_chars": "萤(6次)、弟(6次)", "rec_ids": ["GREEN38", "GREEN55", "GREEN30"], "rec_chars": ["根忽像然跳", "晚啊走手著", "忽像然跳又"], "s": "Green 23 萤火虫  弟弟在草地上走着，忽然，草裏飞出好多好多的萤火虫。 牠们一闪一闪的，好像星星，又好像小灯笼，十分美丽。 弟弟双手一合，就捉到了一隻萤火虫。 他仔细地看看萤火虫，发现牠的屁股会发亮。 晚上，弟弟在屁股上绑了一根萤光棒，他跳啊跳地说:「我是萤火虫了!」"}, {"id": "GREEN24", "level": "GREEN", "number": 24, "title_zh": "乌鸦", "title_en": "Crows", "topic": "动物", "cover": "/covers/GREEN24.jpg", "top_chars": "乌(8次)、的(8次)", "rec_ids": ["GREEN30", "GREEN41", "GREEN29"], "rec_chars": ["问听身黑像", "读听黑书叫", "为面著都可"], "s": "Green 24 乌鸦  弟弟在读一本图画书，他指着上面的字读:「\"乌\"鸦。」 哥哥听到了说:「应该读\"乌\"鸦，不是\"鸟\"鸦!」 哥哥说:「那个像\"鸟\"的字，它唸\"乌\"，是黑色的意思。」 弟弟看看图画上的鸟，牠身上的羽毛都是黑色的。 弟弟问:「是乌龟的\"乌\"吗? 可是，乌龟不是黑色的，为什么叫\"乌\"龟?」"}, {"id": "GREEN25", "level": "GREEN", "number": 25, "title_zh": "老鼠和猫儿", "title_en": "The rat and the cat", "topic": "动物", "cover": "/covers/GREEN25.jpg", "top_chars": "老(8次)、鼠(8次)", "rec_ids": ["GREEN80", "GREEN77", "GREEN38"], "rec_chars": ["抖门发怕跑", "关却友朋出", "直然跑得著"], "s": "Green 25 老鼠和猫儿  老鼠都怕猫儿。可是，我家的老鼠和猫儿是好朋友。 一天，我打开冰箱，没有看到老鼠跑进去了。 砰!冰箱门关上了。可是，猫儿却一直抓冰箱的门。 我说:「猫儿，你想吃什么?」然后，我打开冰箱门，老鼠跑了出来! 老鼠冷得发抖!猫儿来了，牠抱着老鼠，老鼠就紧紧地靠着牠。"}, {"id": "GREEN26", "level": "GREEN", "number": 26, "title_zh": "小鸭找妈妈", "title_en": "A duckling looking for his mom", "topic": "动物", "cover": "/covers/GREEN26.jpg", "top_chars": "妈(12次)、小(10次)", "rec_ids": ["GREEN29", "GREEN43", "GREEN38"], "rec_chars": ["为坐后以面", "笑带帮可你", "帮面可会你"], "s": "Green 26 小鸭找妈妈  小鸭找妈妈，牠看到一条虫以为是蚯蚓，小鸟说:「那是蜈蚣，不能吃。」 小鸭看到鳄鱼，鳄鱼要带小鸭找妈妈。小鸟说:「那是鳄鱼，牠要吃你!」 小鸭看到小鸟后面有大鸟，牠说:「你后面有大鸟，牠要吃你!」 小鸟笑了，牠说:「牠是我妈妈，牠不会吃我!」 小鸟说:「你坐到我妈妈的背上，我们可以飞上天，帮你找妈妈。」"}, {"id": "GREEN27", "level": "GREEN", "number": 27, "title_zh": "小猪不笨", "title_en": "The little pig is not stupid", "topic": "动物", "cover": "/covers/GREEN27.jpg", "top_chars": "小(10次)、猪(10次)", "rec_ids": ["GREEN77", "GREEN80", "GREEN1"], "rec_chars": ["怎起没么会", "菜发青黑想", "蛙知道青想"], "s": "Green 27 小猪不笨  小猪妈妈要小猪吃菜。小猪说那个菜看起来黑黑的，不好吃。 妈妈说: 「你没有吃，怎么知道不好吃? 」小猪试着吃了，发现很好吃。 小猪看到青蛙，想跟牠玩。青蛙说小猪看起来笨笨的，不会玩。 小猪说:「你没有跟我玩，怎么知道我不会玩?」 青蛙试着和小猪玩，牠发现小猪很会玩。"}, {"id": "GREEN28", "level": "GREEN", "number": 28, "title_zh": "动物的叫声", "title_en": "Animal calls", "topic": "动物", "cover": "/covers/GREEN28.jpg", "top_chars": "叫(7次)、们(5次)", "rec_ids": ["GREEN38", "GREEN74", "GREEN77"], "rec_chars": ["嘴声巴像得", "觉第二友朋", "住友巴朋以"], "s": "Green 28 动物的叫声  一天早上，森林裏的小鸟吱吱吱地叫。青蛙说: 「你们很吵，可以不要叫吗?」 小鸟说:「可是，晚上你们呱呱呱地叫，你们也很吵啊!」 大树说:「你们一个早上吵，一个晚上吵，吵死人了!」 于是，大树用树叶塞住小鸟和青蛙的嘴巴，不让牠们叫。 第二天，森林裏很安静。大树觉得没有叫声，好像没有朋友了!"}, {"id": "GREEN29", "level": "GREEN", "number": 29, "title_zh": "北极熊", "title_en": "Polar bears", "topic": "动物", "cover": "/covers/GREEN29.jpg", "top_chars": "摩(8次)、熊(6次)", "rec_ids": ["GREEN55", "GREEN26", "GREEN80"], "rec_chars": ["跟原走后面", "为坐后以面", "原打没地爸"], "s": "Green 29 北极熊  摩摩和爸爸坐雪橇去打鱼，他们常常看到一隻北极熊。 摩摩常常丢鱼给牠，牠会高兴地在地上滚一滚。 冬天到了，摩摩都没有看到北极熊，以为他冬眠了。可是，爸爸说北极熊不会冬眠。 春天来了，摩摩看到北极熊，后面跟着两隻熊宝宝，向他慢慢走来。 原来，牠当妈妈了，冬天正牠生小宝宝的时候。"}, {"id": "GREEN30", "level": "GREEN", "number": 30, "title_zh": "黑熊妈妈说话", "title_en": "Mommy black bear was talking", "topic": "动物", "cover": "/covers/GREEN30.jpg", "top_chars": "妈(14次)、哥(8次)", "rec_ids": ["GREEN38", "GREEN11", "GREEN74"], "rec_chars": ["忽话声像然", "忽声原听然", "耍原饭玩么"], "s": "Green 30 黑熊妈妈说话  黑熊妈妈在树下休息。黑熊哥哥和妹妹爬到妈妈身上。 牠们又爬到树干上，原来，小黑熊是很会爬树的。 黑熊哥哥和妹妹爬到很高的地方玩耍。忽然，牠们听到树下妈妈的吼声。 黑熊妹妹看着哥哥，好像在问:「妈妈在说什么?」 哥哥告诉妹妹，妈妈说:「吃饭了，快下来!」牠们快快跳到妈妈身上吃奶。"}, {"id": "GREEN31", "level": "GREEN", "number": 31, "title_zh": "动物帮手", "title_en": "Animal helper", "topic": "动物", "cover": "/covers/GREEN31.jpg", "top_chars": "动(8次)、物(8次)", "rec_ids": ["GREEN80", "GREEN11", "GREEN38"], "rec_chars": ["怕找想老动", "后找出动物", "照园常帮会"], "s": "Green 31 动物帮手  动物园有动物管理员，他要照顾动物园裏的动物。 一天，动物管理员非常忙，因为有小老虎出生了。 他需要一个帮手，帮他照顾刚出生的小老虎。 他想:「我的帮手要不怕小动物，才会是一个好帮手。」 后来，他找到了一个好帮手，牠非常会照顾小动物。"}, {"id": "GREEN32", "level": "GREEN", "number": 32, "title_zh": "蜘蛛", "title_en": "A spider", "topic": "动物", "cover": "/covers/GREEN32.jpg", "top_chars": "蜘(6次)、蛛(6次)", "rec_ids": ["GREEN11", "GREEN38", "GREEN9"], "rec_chars": ["但掉然进出", "枝张然帮爬", "但第发候时"], "s": "Green 32 蜘蛛  一隻蜘蛛掉进浴缸裏了，牠想爬出来，可是，牠爬上去又掉下来了。 虽然我有点怕蜘蛛，但是我还是想帮牠。 蜘蛛又向上爬的时候，我拿了一张报纸，发在浴缸底。 蜘蛛爬到一半，就在报纸上了。我把报纸拿到外面树下。 第二天，树枝上有个美丽的蜘蛛网!"}, {"id": "GREEN33", "level": "GREEN", "number": 33, "title_zh": "海獭", "title_en": "Sea otters", "topic": "动物", "cover": "/covers/GREEN33.jpg", "top_chars": "海(7次)、的(5次)", "rec_ids": ["GREEN11", "GREEN42", "GREEN55"], "rec_chars": ["石头面就玩", "住呢手还海", "觉睡走拿手"], "s": "Green 33 海獭  海獭住在海裏，有胖胖的身体和圆圆的头。 海獭是很聪明的动物，牠会拿石头膏开贝壳，吃裏面的肉。 牠们常常一起手牵手，捲在海藻裏睡觉。 这样，海浪来了，就不会把牠们冲走了。 牠们还常常一起玩游戏，海獭真的很聪明呢!"}, {"id": "GREEN34", "level": "GREEN", "number": 34, "title_zh": "狗儿一家", "title_en": "The dog family", "topic": "动物", "cover": "/covers/GREEN34.jpg", "top_chars": "狗(11次)、一(7次)", "rec_ids": ["GREEN80", "GREEN39", "GREEN55"], "rec_chars": ["回跑心这儿", "带心以这给", "让跑也只家"], "s": "Green 34 狗儿一家  我和妈妈去「流浪狗中心」，领养了一隻大花狗。 爸爸说再领养一隻，让牠有个伴。所以，我们就有了两隻大花狗了。 一天，哥哥带了两隻小花狗回家，他说:「这是我朋友送给我的小狗。」 小花狗看见了大花狗，就跑过去舔牠们。 大花狗也舔一舔小花狗，牠们好像是一家人!"}, {"id": "GREEN35", "level": "GREEN", "number": 35, "title_zh": "小蓝企鹅", "title_en": "The small blue penguins", "topic": "动物", "cover": "/covers/GREEN35.jpg", "top_chars": "小(8次)、的(8次)", "rec_ids": ["GREEN20", "GREEN95", "GREEN74"], "rec_chars": ["相每同己自", "蓝走跳宝叫", "走找都也会"], "s": "Green 35 小蓝企鹅  企鹅有很多种，有的大，有的小，颜色也不相同。 在澳洲，有一种小企鹅，有蓝色的毛，人们叫牠们小蓝企鹅。 海边岸上有很多小蓝企鹅的家，每个家裏都有小宝宝。 天黑了，小蓝企鹅会跳上海边，走回岸上的家，餵牠们的小宝宝。 牠们很厉害，每隻都会找到自己的家，不会走错的!"}, {"id": "GREEN36", "level": "GREEN", "number": 36, "title_zh": "小动物", "title_en": "Small animals", "topic": "动物", "cover": "/covers/GREEN36.jpg", "top_chars": "小(11次)、鼠(8次)", "rec_ids": ["GREEN70", "GREEN78", "GREEN28"], "rec_chars": ["因能跟觉友", "觉为心还开", "于觉友朋得"], "s": "Green 36 小动物  小老鼠不开心，因为大动物不跟牠玩，说牠太小了。 小老鼠想: 我比蝴蝶、蜻蜓大，可是牠们是昆虫。 小老鼠觉得小松鼠和牠差不多大小。于是，牠去找小松鼠玩。 牠和小松鼠做了好朋友，还发明了很多游戏 。 大动物来了，想跟小老鼠和小松鼠玩。牠们说:「你们太大了，不能玩我们的游戏。」"}, {"id": "GREEN37", "level": "GREEN", "number": 37, "title_zh": "瓢虫", "title_en": "Ladybugs", "topic": "动物", "cover": "/covers/GREEN37.jpg", "top_chars": "虫(9次)、我(5次)", "rec_ids": ["GREEN43", "GREEN4", "GREEN84"], "rec_chars": ["身怕它果多", "害虫谁最爱", "害住怕花也"], "s": "Green 37 瓢虫  虫有很多种，有的是益虫，有的是害虫。 我是飘虫，身上有圆圆的斑点，漂亮。 我住在花上、树上和草上。我最爱吃一种害虫叫蚜虫。 我最怕农药，农药是用来杀死害虫的。 结果，它把我也杀死了。现在谁来吃害虫呢?"}, {"id": "GREEN38", "level": "GREEN", "number": 38, "title_zh": "松鼠", "title_en": "Squirrels", "topic": "动物", "cover": "/covers/GREEN38.jpg", "top_chars": "一(7次)、我(5次)", "rec_ids": ["GREEN28", "GREEN11", "GREEN30"], "rec_chars": ["嘴声巴像得", "忽声松然快", "忽话声像然"], "s": "Green 38 松鼠  在公园裏面，常常有可爱的松鼠，牠们跑得很快。 牠们爬树更快，还会「咻」地一声，跳到另一根树枝上。 有一天，我看到一隻松鼠，嘴巴一直动，好像在和我说话。 忽然，牠不动了，看着我，好像要我帮牠拍照。 「咔」地一声，我拍了一张照片。「你看! 松鼠很可爱吧!」"}, {"id": "GREEN39", "level": "GREEN", "number": 39, "title_zh": "绵羊", "title_en": "Sheep", "topic": "动物", "cover": "/covers/GREEN39.jpg", "top_chars": "羊(6次)、妈(6次)", "rec_ids": ["GREEN80", "GREEN34", "GREEN29"], "rec_chars": ["主心这儿想", "带心以这给", "以给著都可"], "s": "Green 39 綿羊  小胖和家人去加拿大度假。爸爸和妈妈带他去农场，看「剪羊毛」。 农场主人拿着剃刀，一会儿，绵羊身上的毛都被剃光了。 妈妈说我们可以用这些羊毛，织毛衣来穿。 小胖看到绵羊光秃秃的身体，心想:牠们一定很冷。 他对妈妈说: 「你可以织多毛衣，给这些绵羊穿吗?"}, {"id": "GREEN40", "level": "GREEN", "number": 40, "title_zh": "动物玩偶", "title_en": "Stuffed toys", "topic": "动物", "cover": "/covers/GREEN40.jpg", "top_chars": "我(8次)、动(7次)", "rec_ids": ["GREEN80", "GREEN11", "GREEN55"], "rec_chars": ["间晚发原回", "忽成原听然", "间晚睡原听"], "s": "Green 40 动物玩偶  我用动物玩偶，把我的房间佈置成动物园。 我带弟弟到我的动物园，他开心地摸摸每个动物。 晚上，我回到房间，发现我的动物玩偶都不见了。 忽然，我听到弟弟在叫:「你们不要吃我!」 原来，动物玩偶都在弟弟床上，他躺在牠们中间睡着了!"}, {"id": "GREEN41", "level": "GREEN", "number": 41, "title_zh": "动物会保护自己", "title_en": "Animals know how to protect themselves", "topic": "动物", "cover": "/covers/GREEN41.jpg", "top_chars": "不(7次)、爸(6次)", "rec_ids": ["GREEN29", "GREEN24", "GREEN80"], "rec_chars": ["给可鱼会地", "读听黑书叫", "黑找开动地"], "s": "Green 41 动物会保护自己  爸爸读书给弟弟听，爸爸说:「变色龙会变色，让你找不到牠。」 「蝴蝶会不动，让你看不到牠。」「臭鼬会喷臭气，让你躲开牠。」 「刺蝟有刺，让你不敢捉牠。」「墨鱼会喷黑汁，让你看不见牠。」 弟弟马上去躲起来，让爸爸找不到他。 可是，狗狗在弟弟躲的地方，不停地汪汪叫!"}, {"id": "GREEN42", "level": "GREEN", "number": 42, "title_zh": "螃蟹", "title_en": "Crabs", "topic": "动物", "cover": "/covers/GREEN42.jpg", "top_chars": "螃(6次)、蟹(6次)", "rec_ids": ["GREEN11", "GREEN7", "GREEN33"], "rec_chars": ["捉拉洞进快", "指知道以手", "住呢手还海"], "s": "Green 42 螃蟹  在海边，你可以玩沙、玩水，还可以捉螃蟹。 有一次，我看到一隻螃蟹，可是，牠很快就逃进洞裏。 我把手伸进洞裏捉牠，牠却夹住我的手指，很痛…... 我赶快把手拉出来，螃蟹也一起被拉出来了。 唉! 不知道是我捉螃蟹，还是螃蟹捉我呢?"}, {"id": "GREEN43", "level": "GREEN", "number": 43, "title_zh": "刺猬", "title_en": "Hedgehogs", "topic": "动物", "cover": "/covers/GREEN43.jpg", "top_chars": "刺(8次)、的(7次)", "rec_ids": ["GREEN26", "GREEN80", "GREEN99"], "rec_chars": ["笑带帮可你", "别回怕动家", "满怕多也只"], "s": "Green 43 刺蝟  刺蝟的身上有很多刺，别的动物怕牠们的刺。 有一天，刺蝟刺了满身的水果，要把它们带回家吃。 别的动物笑牠，你身上有很多水果，可是，你的脚很短，拿不到也吃不到啊! 又来了一隻刺蝟，身上也刺满了水果。 牠们说:「你们忘了，我们是互相帮忙的动物!」"}, {"id": "GREEN44", "level": "GREEN", "number": 44, "title_zh": "小河马和大乌龟", "title_en": "The small hippo and the big turtle", "topic": "动物", "cover": "/covers/GREEN44.jpg", "top_chars": "妈(6次)、大(4次)", "rec_ids": ["GREEN34", "GREEN55", "GREEN66"], "rec_chars": ["养领像带过", "跟原走著把", "靠园那像动"], "s": "Green 44 小河马和大乌龟  有一天，一隻小河马失去了妈妈。 有人把牠带到野生动物园，那裏有一隻三十岁的大乌龟。 小河马走过靠着牠，牠天天跟着大乌龟。 大乌龟成了牠的新妈妈，原来，动物会领养别的动物孩子。 就好像我的妈妈，领养我一样。"}, {"id": "GREEN45", "level": "GREEN", "number": 45, "title_zh": "松鼠玩偶", "title_en": "Stuffed toy squirrel", "topic": "动物", "cover": "/covers/GREEN45.jpg", "top_chars": "松(9次)、鼠(7次)", "rec_ids": ["GREEN38", "GREEN55", "GREEN19"], "rec_chars": ["公园松然跑", "走跑拿后手", "跑拿放手又"], "s": "Green 45 松鼠玩偶  我带着我的松鼠玩偶，去公园玩。 我要盪鞦韆，我把松鼠玩偶放在草地上。 一隻真的松鼠来了，牠看着松鼠玩偶，然后跑走了。 一会儿，牠又回来了，手裏拿着松果， 牠把松果放在松鼠玩偶前面，还轻轻地靠着松鼠玩偶。"}, {"id": "GREEN46", "level": "GREEN", "number": 46, "title_zh": "喷水的龙", "title_en": "The dragon that puffs water", "topic": "动物", "cover": "/covers/GREEN46.jpg", "top_chars": "龙(11次)、水(10次)", "rec_ids": ["GREEN56", "GREEN7", "GREEN25"], "rec_chars": ["别问什想没", "只为什没么", "怕都什想没"], "s": "Green 46 喷水的龙  龙妈妈生了很多小龙，每隻小龙都会喷火，但是有一隻只会喷水。 喷水龙问妈妈:「为什么别的龙都喷火，很厉害，我只会喷水?」 龙妈妈告诉牠，喷水的龙才厉害，因为火都怕水。 牠说:「你看! 人人需要水，家家需要水。」 喷水龙想: 难怪，家家都有「水龙头，但是没有 「火龙头」。"}, {"id": "GREEN47", "level": "GREEN", "number": 47, "title_zh": "盖房子", "title_en": "Building a house", "topic": "家/家人", "cover": "/covers/GREEN47.jpg", "top_chars": "盖(5次)、子(4次)", "rec_ids": ["GREEN80", "GREEN50", "GREEN55"], "rec_chars": ["门住房怕打", "破房哥做也", "户窗房也家"], "s": "Green 47 盖房子  老鼠一家住在破鞋子裏，风吹雨打，更怕大猫来捉。 爸爸说:「我们要盖个好房子，不怕风吹雨打，也不怕大猫来捉。」 爷爷和奶奶盖牆壁，爸爸和妈妈盖屋顶。 哥哥和姊姊做大门，弟弟和妹妹做窗户。 房子盖好了，没有风也没有雨，大猫来了也不怕。"}, {"id": "GREEN48", "level": "GREEN", "number": 48, "title_zh": "奶奶", "title_en": "Grandma", "topic": "家/家人", "cover": "/covers/GREEN48.jpg", "top_chars": "我(8次)、条(7次)", "rec_ids": ["YELLOW10", "GREEN43", "GREEN56"], "rec_chars": ["送张纸给她", "忘啊怕又多", "于问方放她"], "s": "Green 48 奶奶  奶奶有一条项链，她说等我长大了要给我。 可是，她怕忘了放项鍊的地方，要我写张纸条。 她把纸条放好了。可是，她又怕忘了放纸条的地方，要我写:「纸条放在…..]  于是我写了:「纸条放在…...] 。我问奶奶:「那要写多少张纸条啊?」 我说: 「你还是现在就把项链送给我吧!」"}, {"id": "GREEN49", "level": "GREEN", "number": 49, "title_zh": "爸爸没回家", "title_en": "Dad did not come home", "topic": "家/家人", "cover": "/covers/GREEN49.jpg", "top_chars": "爸(10次)、了(7次)", "rec_ids": ["GREEN80", "GREEN55", "GREEN74"], "rec_chars": ["门原回黑心", "倒觉原拿开", "奇怪伤怎觉"], "s": "Green 49 爸爸没回家  下雨天，小鸭爸爸看到家裏的屋顶漏水了。 牠拿了工具箱和梯子，爬上去修屋顶了。 小鸭妈妈开门，推倒了梯子，就把梯子放回原来的地方。 天黑了，鸭妈妈觉得很奇怪，鸭爸爸怎么还没回家? 爸爸不见了，小鸭们伤心地哭了，牠们不知道原来爸爸就在屋顶上!"}, {"id": "GREEN50", "level": "GREEN", "number": 50, "title_zh": "会飞的房子", "title_en": "Flying house", "topic": "家/家人", "cover": "/covers/GREEN50.jpg", "top_chars": "房(6次)、子(6次)", "rec_ids": ["GREEN55", "GREEN9", "GREEN61"], "rec_chars": ["吓电房后面", "机电后面起", "那房哥面起"], "s": "Green 50 会飞的房子  我去看电影，电影裏有个房子，绑了很多气球就飞起来了。 我希望我们家的房子也可以飞。妈妈说那是电影裏的房子，不是真的。 我只好自己做梦，梦裏面的房子，绑了气球也会飞。 后来，气球一个一个破了，房子掉下来，我吓醒了.  哥哥对我说:「现在有飞机旅馆，你不用做梦了!」"}, {"id": "GREEN51", "level": "GREEN", "number": 51, "title_zh": "妈妈爱谁多一点", "title_en": "Mom loves whom a bit more?", "topic": "家/家人", "cover": "/covers/GREEN51.jpg", "top_chars": "妈(10次)、我(9次)", "rec_ids": ["GREEN70", "GREEN7", "GREEN50"], "rec_chars": ["从觉问三为", "双知道两为", "对现以多个"], "s": "Green 51 妈妈爱谁多一点  姐姐和我是双胞胎。我问妈妈爱谁多一点? 妈妈说:「你们都是从我肚子裏出来的，我两个都爱!」 我觉得不对，妈妈应该要爱我多一点。妈妈想知道为什么?  我说:「姐姐比我早三分钟出来，你已经多爱她三分钟了。」 「所以，现在你应该要爱我多一点!」"}, {"id": "GREEN52", "level": "GREEN", "number": 52, "title_zh": "狗狗和我", "title_en": "The doggy and I", "topic": "家/家人", "cover": "/covers/GREEN52.jpg", "top_chars": "狗(12次)、我(8次)", "rec_ids": ["GREEN25", "GREEN80", "GREEN99"], "rec_chars": ["抓门打进开", "间门房心打", "心头开想也"], "s": "Green 52 狗狗和我  狗狗在门外用爪子抓门，牠想进我的房间。 我打开门对狗狗说:「你今天不乖，不可以进我的房间。」 狗狗在门外呜呜地叫，好像很伤心地在哭。 我也伤心地哭了，我去把门打开，让狗狗进来。 狗狗扑到我的身上，用舌头舔我的眼泪。"}, {"id": "GREEN53", "level": "GREEN", "number": 53, "title_zh": "家人听对了吗", "title_en": "Did my family hear it correctly?", "topic": "家/家人", "cover": "/covers/GREEN53.jpg", "top_chars": "要(5次)、可(5次)", "rec_ids": ["GREEN47", "GREEN55", "GREEN39"], "rec_chars": ["爷奶猫哥妹", "听拿她飞姐", "对吗拿给可"], "s": "Green 53 家人听对了吗  妈妈要花，可是，妹妹拿画给她。 爷爷要扇，可是，弟弟拿伞给他。 姐姐要花猫，可是，哥哥拿花帽给她。 奶奶要梳子，可是，弟弟拿树枝给她。 爸爸要飞机，可是妈妈拿肥鸡给他!"}, {"id": "GREEN54", "level": "GREEN", "number": 54, "title_zh": "海盗弟弟", "title_en": "My younger brother being a pirate", "topic": "家/家人", "cover": "/covers/GREEN54.jpg", "top_chars": "弟(10次)、妈(6次)", "rec_ids": ["GREEN11", "GREEN55", "GREEN94"], "rec_chars": ["藏然后进面", "筒跑后面姐", "然后衣穿给"], "s": "Green 54 海盗弟弟  我帮弟弟做了一把剑，姐姐帮他做了一个眼罩。 弟弟穿了横纹衣服，又戴上妈妈做的海盗帽子。 他跑到妈妈那裏:「我是海盗，把宝藏给我。」 妈妈把很多零钱给了弟弟，他很高兴地数钱。 然后，弟弟把钱都放进小猪存钱筒裏面了。"}, {"id": "GREEN55", "level": "GREEN", "number": 55, "title_zh": "家里有声音", "title_en": "A sound in the house", "topic": "家/家人", "cover": "/covers/GREEN55.jpg", "top_chars": "到(7次)、爸(7次)", "rec_ids": ["GREEN80", "GREEN29", "GREEN49"], "rec_chars": ["吓间晚原房", "跟原走后面", "倒觉原拿开"], "s": "Green 55 家裏有声音  晚上，我在睡觉，听到一个声音，吓得我….. 跑到姐姐的房间去。姐姐也听到一个声音，她和我一起…. 跑到爸爸、妈妈的卧房。爸爸、妈妈也听到了，他们拿着手电筒…... 我们跟在爸妈后面走到客厅，看到桌上的杯子倒了…... 啊! 原来是一隻小鸟困在客厅裏了，爸爸把窗户开大一点，让牠飞走了。"}, {"id": "GREEN56", "level": "GREEN", "number": 56, "title_zh": "妈妈出差", "title_en": "Mom on a business trip", "topic": "家/家人", "cover": "/covers/GREEN56.jpg", "top_chars": "妈(12次)、爸(8次)", "rec_ids": ["GREEN80", "GREEN25", "GREEN9"], "rec_chars": ["别晚回儿就", "出儿就什想", "候时回起下"], "s": "Green 56 媽媽出差  放学回家，没有看到妈妈。我问爸爸:「妈妈呢?」 爸爸说妈妈「出差」了。我问: 「什么是出差?」 爸爸说「出差」就是要到别的地方工作几天，不回家。 晚上，爸爸讲故事的时候，我有点儿想妈妈。 妈妈终于回家了，我跳到她身上说:「下次，我要和你一起\"出差\"!」"}, {"id": "GREEN57", "level": "GREEN", "number": 57, "title_zh": "花园房子", "title_en": "House with a garden", "topic": "家/家人", "cover": "/covers/GREEN57.jpg", "top_chars": "有(8次)、花(7次)", "rec_ids": ["GREEN84", "GREEN55", "GREEN80"], "rec_chars": ["住高房还想", "听房后面也", "住房这就想"], "s": "Green 57 花园房子  小胖说他美国的家有花园，裏面有花，也有水果树。 花园旁边有个游泳池，后面是空地，可以骑脚踏车。 我听了，也想有个这样的花园房子。可是，我住在高楼大厦裏面。 我想想，就画了一个有花园的家，花园旁边也有个游泳池…... 当然还要有我，在空地上骑脚踏车!"}, {"id": "GREEN58", "level": "GREEN", "number": 58, "title_zh": "把弟弟送给你", "title_en": "Giving away my younger brother", "topic": "家/家人", "cover": "/covers/GREEN58.jpg", "top_chars": "弟(12次)、我(10次)", "rec_ids": ["GREEN50", "GREEN80", "GREEN7"], "rec_chars": ["现己只自电", "始别吧只打", "只电走以她"], "s": "Green 58 把弟弟送给你  我有一个讨厌的弟弟，他总是和我抢玩具。 他还会乱画我的本子。所以，我决定把他送给别人。 阿姨来我的家，我把弟弟送给她，阿姨把弟弟带走了。 现在，我只能自己玩了，我开始想弟弟…... 我打电话给阿姨说:「你把弟弟还给我吧!」"}, {"id": "GREEN59", "level": "GREEN", "number": 59, "title_zh": "我不贪心", "title_en": "I am not greedy", "topic": "家/家人", "cover": "/covers/GREEN59.jpg", "top_chars": "爸(10次)、乐(10次)", "rec_ids": ["GREEN56", "GREEN72", "GREEN80"], "rec_chars": ["点回就什想", "吗拿给什把", "只回心就想"], "s": "Green 59 我不贪心  爸爸常常教乐乐不要贪心，不是每一样东西都要更好的。 一天，乐乐回家，把成绩单拿给爸爸看。 爸爸看到乐乐的成绩都是A，只是英文是B。 爸爸说:「乐乐，用功一点，英文成绩就会更好的。」 乐乐心裏想:「B不是比C好吗? 爸爸不是说不要什么都要更好的，我不贪心!」"}, {"id": "GREEN60", "level": "GREEN", "number": 60, "title_zh": "我的好朋友", "title_en": "My best friend", "topic": "家/家人", "cover": "/covers/GREEN60.jpg", "top_chars": "的(9次)、我(7次)", "rec_ids": ["GREEN25", "GREEN56", "GREEN70"], "rec_chars": ["冷抱友朋后", "候呢时回学", "舞觉友朋跳"], "s": "Green 60 我的好朋友  这是我家的小狗，牠是我的好朋友。 我无聊的时候，喜欢帮牠穿上不同的漂亮衣服。 我高兴的时候，喜欢拉着牠的脚跳舞。 放学回家以后，我喜欢当牠的老师。 天冷的时候，我还会抱着牠睡觉。你呢? 你想和小狗做什么?"}, {"id": "GREEN61", "level": "GREEN", "number": 61, "title_zh": "家里的好人和坏人", "title_en": "Good guys and bad guys at home", "topic": "家/家人", "cover": "/covers/GREEN61.jpg", "top_chars": "人(9次)、我(9次)", "rec_ids": ["GREEN9", "GREEN55", "GREEN50"], "rec_chars": ["戏游吧回面", "间走房面著", "那房哥面起"], "s": "Green 61 家裏的好人和坏人  我和弟弟玩遊戲，我當好人，要他當壞人，他哭著說:「我也要當好人!」 我說:「好吧! 我們一起當好人，一起去捉壞人。」 我們輕輕地走進哥哥的房間，在那裏，我們捉到很多壞人。 我們把壞人放在袋子裏面，把他們丟進垃圾桶。 哥哥回來了，他一走進房間， 就大叫:「我的變形金剛呢?」"}, {"id": "GREEN62", "level": "GREEN", "number": 62, "title_zh": "妹妹", "title_en": "Younger sister", "topic": "家/家人", "cover": "/covers/GREEN62.jpg", "top_chars": "妹(8次)、说(8次)", "rec_ids": ["YELLOW4", "GREEN50", "GREEN7"], "rec_chars": ["课功以生做", "真气以做可", "服衣以手做"], "s": "Green 62 妹妹  妹妹做功课，我说她写的字不好看。她说:「可以啦!」 妹妹穿衣服，我说她衣服穿反了。她说:「可以啦!」 妹妹洗完手，我说她的手还是髒。她说:「可以啦!」 我生气地说她真是一个「马马虎虎」的人! 她也生气地说:「我不属马，也不属虎，我属牛!」"}, {"id": "GREEN63", "level": "GREEN", "number": 63, "title_zh": "妈妈像什么", "title_en": "What is Mom like?", "topic": "家/家人", "cover": "/covers/GREEN63.jpg", "top_chars": "像(7次)、妈(6次)", "rec_ids": ["GREEN60", "GREEN29", "GREEN56"], "rec_chars": ["兴觉睡候高", "兴候高时生", "次事候时她"], "s": "Green 63 妈妈像什么  妈妈像什么? 我的妈妈什么都像。 她高兴的时候，好像小鸟，叽叽喳喳不停地说话。 她生气 时候，好像老虎，对我凶巴巴地说话。 她忙的时候，好像八爪鱼，一次想做八件事情。 她累的时候，好像大棕熊，躲进被窝裏睡大觉。"}, {"id": "GREEN64", "level": "GREEN", "number": 64, "title_zh": "我讨厌的事", "title_en": "The things that I hate", "topic": "家/家人", "cover": "/covers/GREEN64.jpg", "top_chars": "我(11次)、讨(7次)", "rec_ids": ["GREEN56", "GREEN9", "GREEN77"], "rec_chars": ["事候点呢时", "视候机饭时", "关呢叫出么"], "s": "Green 64 我討厭的事  我有很多讨厌的事。吃饭的时候，我讨厌妈妈一直叫我吃青菜。 用电脑的时候，我讨厌爸爸一直要我关机。 看电视的时候，我讨厌婆婆一直要我转台。 洗澡的时候，我讨厌姐姐一直要我快点出来。 你呢?你有什么讨厌的事? 说来给我听听!"}, {"id": "GREEN65", "level": "GREEN", "number": 65, "title_zh": "冬眠的弟弟", "title_en": "Younger brother hibernated", "topic": "家/家人", "cover": "/covers/GREEN65.jpg", "top_chars": "弟(8次)、的(5次)", "rec_ids": ["GREEN80", "GREEN9", "GREEN40"], "rec_chars": ["晚想动物和", "午候时面起", "晚床睡中叫"], "s": "Green 65 冬眠的弟弟  冬天的早上， 弟弟睡在暖和的被子裏面，不肯起床。 妈妈叫他起床，他不要，拉着棉被说:「我冬眠了。」 到了中午，弟弟还是睡在床上，不肯起床。 到了晚上，弟弟起床了，他肚子饿，想要吃东西。 妈妈说: 「动物冬眠的时候，是不需要吃东西的。」"}, {"id": "GREEN66", "level": "GREEN", "number": 66, "title_zh": "尾巴", "title_en": "Tails", "topic": "身体", "cover": "/covers/GREEN66.jpg", "top_chars": "我(7次)、的(6次)", "rec_ids": ["GREEN38", "GREEN28", "GREEN80"], "rec_chars": ["更张园巴像", "让巴像没可", "开想没动地"], "s": "Green 66 尾巴  星期天，我穿了一条美丽的花裙子，和爸爸去动物园。 到了那裏，我们看到大象、棕熊 、狮子，和很多不同的动物。 后来我们去看孔雀，很可惜，牠没有张开美丽的尾巴。 我靠近笼子，想让孔雀看看我美丽的花裙子。 牠慢慢地张开尾巴，好像告诉我:「我的尾巴比你的花裙子更美丽!」"}, {"id": "GREEN67", "level": "GREEN", "number": 67, "title_zh": "角、胡须和尾巴", "title_en": "Horns, whiskers, and a tail", "topic": "身体", "cover": "/covers/GREEN67.jpg", "top_chars": "吹(9次)、大(6次)", "rec_ids": ["GREEN11", "GREEN80", "GREEN15"], "rec_chars": ["忽掉松然猫", "住心开就下", "接忽然还就"], "s": "Green 67 角、鬍鬚和尾巴  大风吹呀吹，吹走了羊的角。 吹走了松鼠的尾巴，吹走了小猫的鬍鬚。 动物们说:「大风，大风，不要吹!」可是大风还是吹呀吹…... 大风把我也吹上了天，我看到了角、尾巴和鬍鬚，就去抱住它们。 忽然，大风停了，我从天上掉下来，动物们开心地接住我!"}, {"id": "GREEN68", "level": "GREEN", "number": 68, "title_zh": "腿断了", "title_en": "Broken leg", "topic": "身体", "cover": "/covers/GREEN68.jpg", "top_chars": "了(7次)、小(7次)", "rec_ids": ["GREEN29", "GREEN11", "GREEN50"], "rec_chars": ["慢走打以给", "救象掉听进", "绑现掉机电"], "s": "Green 68 腿断了  一隻小象，掉进的坑，出不来了。 小象妈妈不停地吼叫，很多人听到，一起救出了小象。 可是，他们发现小象的腿断了，需要送医院。 他们打电话，来了一架直升机，把小象吊在空中，送到医院。 兽医给小象绑了支架，小象可以慢慢地走路了!"}, {"id": "GREEN69", "level": "GREEN", "number": 69, "title_zh": "熊猫的毛", "title_en": "The panda’s fur", "topic": "身体", "cover": "/covers/GREEN69.jpg", "top_chars": "的(7次)、牠(6次)", "rec_ids": ["GREEN77", "GREEN25", "GREEN36"], "rec_chars": ["却朋友毛长", "却朋友猫开", "因为朋友还"], "s": "Green 69 熊猫的毛  小熊猫出生了，很小很小，粉红色的。 小熊猫开始长毛了，牠有黑色和白色的毛。 但是，牠的耳朵、眼睛和四隻脚是白色的，身体却是黑色的。 不过，牠看起来还是很可爱，小朋友特别喜欢牠…... 因为，牠长得和别的熊猫不一样，牠很特别!"}, {"id": "GREEN70", "level": "GREEN", "number": 70, "title_zh": "大熊的背", "title_en": "The big bear’s back", "topic": "身体", "cover": "/covers/GREEN70.jpg", "top_chars": "牠(6次)、背(5次)", "rec_ids": ["GREEN36", "GREEN74", "GREEN77"], "rec_chars": ["因能跟觉友", "此从觉原友", "友朋做鼠起"], "s": "Green 70 大熊的背  大熊趴在洞口，觉得背上痒痒的，牠伸手一抓，原来是小老鼠。 牠问:「你在我背上做什么?」小老鼠说:「我在跳舞。」 大熊问牠为什么在牠背上跳舞, 小老鼠说:「因为你的背软软的，跌倒也不痛。」 从此，牠们做了好朋友，小老鼠天天来跳舞。一天，大熊说牠要冬眠了。 小老鼠说:「我要等三个月才能跳舞啊!那我跟你一起冬眠吧!」"}, {"id": "GREEN71", "level": "GREEN", "number": 71, "title_zh": "羽毛", "title_en": "Feathers", "topic": "身体", "cover": "/covers/GREEN71.jpg", "top_chars": "羽(8次)、毛(8次)", "rec_ids": ["GREEN77", "GREEN29", "GREEN49"], "rec_chars": ["伤尾巴毛心", "向给没只地", "伤觉心得就"], "s": "Green 71 羽毛   一隻孔雀觉得自己的羽毛最美丽。 小鸟们向牠要一根羽毛，孔雀说:「不行!」 一天，孔雀睡完觉醒来 ，发现自己尾巴上美丽的羽毛没有了。 孔雀很伤心地去找牠的羽毛。小鸟们就给他几自己身上的羽毛。 孔雀把小鸟们送给牠的羽毛，插在尾巴上，现在牠觉得自己的羽毛更美丽。"}, {"id": "GREEN72", "level": "GREEN", "number": 72, "title_zh": "牙齿", "title_en": "Teeth", "topic": "身体", "cover": "/covers/GREEN72.jpg", "top_chars": "牙(10次)、爷(8次)", "rec_ids": ["GREEN75", "GREEN4", "GREEN9"], "rec_chars": ["嘴对巴然拿", "早床吗见走", "嘴后面起下"], "s": "Green 72 牙齿  一天早上，小明起床，走进浴室。 他看到爷爷拿者牙齿，然后放进嘴巴裏。 他不明白爷爷为什么要吃牙齿? 他对爷爷说: 「你不要吃牙齿。」 「你把牙齿放在枕头下面，小牙仙会给你礼物。」 爷爷问小明:「我没有牙齿，这是假牙，小牙仙看见假牙，也会给我礼物吗?」"}, {"id": "GREEN73", "level": "GREEN", "number": 73, "title_zh": "头上的大包", "title_en": "A lump on the forehead", "topic": "身体", "cover": "/covers/GREEN73.jpg", "top_chars": "弟(10次)、了(7次)", "rec_ids": ["GREEN75", "GREEN55", "GREEN29"], "rec_chars": ["针哭糖然打", "倒让后著她", "打后生著给"], "s": "Green 73头上的大包  弟弟跌倒了，头上肿了个大包。他哭着说:「好痛呀!」 妈妈来了，她帮弟弟揉揉，可是，他还是说痛。 奶奶来了，她给弟弟一颗糖 ，可是，他还是说痛。 爸爸来了，他说:「去让医生打一针吧!」弟弟就不哭了。 弟弟说:「不痛了!」然后，赶快把糖放进口裏。"}, {"id": "GREEN74", "level": "GREEN", "number": 74, "title_zh": "脚受伤了", "title_en": "The wounded leg", "topic": "身体", "cover": "/covers/GREEN74.jpg", "top_chars": "一(7次)、牠(6次)", "rec_ids": ["GREEN7", "GREEN77", "GREEN80"], "rec_chars": ["路泳原游走", "伤怎呢友朋", "主原饭找得"], "s": "Green 74 脚受伤了  一隻大狗和主人散步，牠看到一隻猴子，猴子也看到牠。 第二天，猴子来找大狗，牠们一起吃饭和玩耍，从此，牠们做了好朋友。 人们看到，觉得很奇怪，狗怎么会和猴子做好朋友呢? 可是，牠们天天都在一起，还常常到河裏游泳。一天，猴子没看到大狗…... 原来，大狗的脚受伤了。猴子也一跛一跛地走路，牠说:「我的脚也受伤了!」"}, {"id": "GREEN75", "level": "GREEN", "number": 75, "title_zh": "熊熊生病了", "title_en": "The bear got sick", "topic": "身体", "cover": "/covers/GREEN75.jpg", "top_chars": "熊(20次)、他(8次)", "rec_ids": ["GREEN72", "GREEN73", "GREEN9"], "rec_chars": ["嘴对巴然拿", "针哭糖然打", "嘴发后起玩"], "s": "Green 75 熊熊生病了  弟弟拿起听筒，放在他的小熊玩偶的身上。 一会儿，他说:「熊熊生病了! 他拿来温度计，放进熊熊的嘴巴裏。 一会儿，他说:「熊熊发烧了!」他又拿来针筒，给熊熊打针。 他对熊熊说:「你不哭，我给你吃糖。」一会儿，他拿来了蜜糖给熊熊吃。 然后，他抱起熊熊说: 「我的熊熊是世界上最乖的熊!」"}, {"id": "GREEN76", "level": "GREEN", "number": 76, "title_zh": "生病的公鸡", "title_en": "The sick rooster", "topic": "身体", "cover": "/covers/GREEN76.jpg", "top_chars": "鸡(7次)、喔(6次)", "rec_ids": ["GREEN25", "GREEN29", "GREEN77"], "rec_chars": ["打出就什没", "为打以生给", "以叫出没么"], "s": "Green 76 生病的公鸡  天亮了，太阳出来了，公鸡没有喔喔叫。 母鸡很生气地问牠:「你为什么没有喔喔叫?」 公鸡说牠生病了，牠的喉咙很痛，叫不出声音了。 母鸡说:「我带你去看医生，打一针，你就会叫了。」 公鸡看见医生说:「你可以给母鸡打一针，让牠喔喔叫吗?」"}, {"id": "GREEN77", "level": "GREEN", "number": 77, "title_zh": "长毛巴", "title_en": "Regrowing a tail", "topic": "身体", "cover": "/covers/GREEN77.jpg", "top_chars": "巴(7次)、长(6次)", "rec_ids": ["GREEN74", "GREEN25", "GREEN28"], "rec_chars": ["伤怎呢友朋", "关却友朋出", "住友巴朋以"], "s": "Green 77 长毛巴  老鼠和壁虎住在一起，牠们都有长长的尾巴，所以做了好朋友。 一天，壁虎的尾巴断了，老鼠很伤心，壁虎却说: 「没关係!」 不久，老鼠的尾巴也断了，牠很伤心地哭了。 壁虎叫牠不要哭，说会长新尾巴的。 小老鼠说:「不会长新尾巴的。 」 壁虎说:「怎么不会呢? 你看! 我的新尾巴都长出来了!」"}, {"id": "GREEN78", "level": "GREEN", "number": 78, "title_zh": "薯片 Chips", "title_en": "Chips", "topic": "食物", "cover": "/covers/GREEN78.jpg", "top_chars": "吃(8次)、的(8次)", "rec_ids": ["GREEN36", "GREEN85", "GREEN88"], "rec_chars": ["觉为心还开", "薯食片为爱", "健康东觉西"], "s": "Green 78 薯片  世界上最好吃的东西是什么? 我觉得是薯片 。 薯片有厚的和薄的，有辣的和酸的，还有很多不同的种类。 薯片吃起来脆脆的，越吃越想吃，越吃越开心。 吃了想停下来不吃，很难。有人说薯片是垃圾食物。可是．．．．．． 为什么大人和小孩，都爱吃这种不健康的食物？"}, {"id": "GREEN79", "level": "GREEN", "number": 79, "title_zh": "水果", "title_en": "Fruit", "topic": "食物", "cover": "/covers/GREEN79.jpg", "top_chars": "果(8次)、水(7次)", "rec_ids": ["GREEN74", "YELLOW62", "GREEN61"], "rec_chars": ["第呢做起都", "碗块成拿后", "呢进放起就"], "s": "Green 79 水果  篮子裏放了很多水果，它们在吵架，看谁最好吃。 最后大家决定，谁是第一个被吃掉的，谁就是最好吃的。 苹果先被拿起来，切成了小块。其他水果也都被拿起来，切成了小块。 切好的水果被放进了大碗，做成了水果沙拉。 人们大口大口地吃水果沙拉，是什麽水果最好吃呢？"}, {"id": "GREEN80", "level": "GREEN", "number": 80, "title_zh": "青菜和萝卜", "title_en": "Vegetables and carrots", "topic": "食物", "cover": "/covers/GREEN80.jpg", "top_chars": "兔(5次)、房(4次)", "rec_ids": ["GREEN25", "GREEN49", "GREEN55"], "rec_chars": ["抖门发怕跑", "门原回黑心", "吓间晚原房"], "s": "Green 80 青菜和萝蔔  小兔一家找到一间老房子，小兔们在房子裏开心地跑上跑下。 兔爸爸说：「我们就住在这儿吧！」兔妈妈开始煮青菜和萝蔔。 天黑了，房子的主人回来了，他看到厨房在冒烟，心裏想：「是谁在煮晚饭？」 牠打开门，小兔们吓得发抖，原来这是大野狼的家。 大野狼说：「别怕！我老了，没牙了，不吃动物，只吃青菜和萝蔔！」"}, {"id": "GREEN81", "level": "GREEN", "number": 81, "title_zh": "冰淇淋", "title_en": "Ice cream", "topic": "食物", "cover": "/covers/GREEN81.jpg", "top_chars": "弟(8次)、手(6次)", "rec_ids": ["GREEN56", "GREEN51", "GREEN70"], "rec_chars": ["问点出什想", "从问点为出", "从伸背问为"], "s": "Green 81 冰淇淋  弟弟从厨房出来，他把手藏在背后。 妈妈问：「你为什么把手藏在背后？伸出来给我看！」 弟弟不想伸出手，他说：「我手上的东西是．．．．．．］  妈妈要他快点伸出手来！弟弟慢慢地伸出手．．．．．． ［咦!冰淇淋怎么没有了?」弟弟奇怪地说。"}, {"id": "GREEN82", "level": "GREEN", "number": 82, "title_zh": "烤鸭", "title_en": "Roast duck", "topic": "食物", "cover": "/covers/GREEN82.jpg", "top_chars": "鸭(8次)、的(8次)", "rec_ids": ["YELLOW62", "GREEN79", "GREEN9"], "rec_chars": ["葱饼加点然", "切被口先它", "吧候时再后"], "s": "Green 82 烤鸭  北京烤鸭是中国菜，它已经有几百年的历史。 烤好的鸭子，外面的皮是黄黄脆脆的，裏面的肉是软软嫩嫩的。 烤鸭被推出来以后，厨师会把烤鸭肉连皮，一片一片地切好。 吃烤鸭的时候，要先拿一张薄饼 ，再加一点酱和大葱，然后把鸭肉片包起来吃。 哎呀! 我的口水要流出来了。「妈妈! 快带我去吃烤鸭吧!」"}, {"id": "GREEN83", "level": "GREEN", "number": 83, "title_zh": "巧克力蛋糕", "title_en": "Chocolate cake", "topic": "食物", "cover": "/covers/GREEN83.jpg", "top_chars": "姐(6次)、蛋(5次)", "rec_ids": ["GREEN51", "GREEN84", "YELLOW58"], "rec_chars": ["钟分所点以", "粉送山还过", "粉面油烤糖"], "s": "Green 83 巧克力蛋糕  姐姐过生日，她八岁了，我要做一个蛋糕送给她。 先放蛋，再放麵粉，还要加牛油和糖。 姐姐爱吃巧克力，所以，要多放一点。 烤了十分钟，蛋糕还是很小。再烤二十分钟。 糟糕!蛋糕变成一座巧克力山了，不过，姐姐还是很爱吃。"}, {"id": "GREEN84", "level": "GREEN", "number": 84, "title_zh": "花蜜和花粉", "title_en": "Honey and pollen", "topic": "食物", "cover": "/covers/GREEN84.jpg", "top_chars": "花(13次)、一(6次)", "rec_ids": ["GREEN80", "GREEN99", "GREEN15"], "rec_chars": ["别住房怕想", "山高怕长想", "害怕爬还著"], "s": "Green 84 花蜜和花粉  爬上高高的山，穿过长长的山洞，小山村裏住着一群小矮人。 他们住在花裏，穿花衣，吃花粉，喝花蜜。 有一天，来了一个巨人，他们很害怕，不知道巨人想要做什么? 巨人说:「别怕!我也想住在花裏，穿花衣，吃花粉，喝花蜜。」 小矮人帮巨人，做了一个大花房，还送他一包包的花粉和一杯杯的花蜜。"}, {"id": "GREEN85", "level": "GREEN", "number": 85, "title_zh": "零食", "title_en": "Snacks", "topic": "食物", "cover": "/covers/GREEN85.jpg", "top_chars": "零(7次)、食(7次)", "rec_ids": ["GREEN80", "GREEN78", "GREEN38"], "rec_chars": ["煮菜住饭打", "薯食片为爱", "更片像爱还"], "s": "Green 85 零食  我们家柜整裏面，放了很多零食，因为我们家的人都爱吃零食。 姐姐爱吃芒果乾，弟弟爱吃薯片，我爱吃猪肉乾。 我们都知道吃了零食，就不想吃妈妈煮的饭菜后。可是，我们还是忍不住要吃零食。 今天，我们打开柜子，裏面是空的，没有零食了。 家裏没有了零食，妈妈煮的饭菜，好像变得更香了…..."}, {"id": "GREEN86", "level": "GREEN", "number": 86, "title_zh": "西瓜和番茄", "title_en": "Watermelons and tomatoes", "topic": "食物", "cover": "/covers/GREEN86.jpg", "top_chars": "西(8次)、瓜(8次)", "rec_ids": ["GREEN80", "GREEN97", "GREEN39"], "rec_chars": ["住谁想爸和", "红谁又和你", "定想爸和你"], "s": "Green 86 西瓜和番茄  小西瓜和爸爸妈妈住在一起，他们的邻居是红番茄。 一天，小西瓜看到了方西瓜，小红蕃茄看到了紫番茄。 他们的爸爸说:「方西瓜、紫番茄是你们的表哥、表弟。」 又一天，小西瓜看到了三角西瓜。小红蕃茄看到了蓝番茄。 他们想:他们又是谁?啊! 三角西瓜和蓝番茄一定是我们的堂哥、堂弟。"}, {"id": "GREEN87", "level": "GREEN", "number": 87, "title_zh": "香味", "title_en": "Fragrance", "topic": "食物", "cover": "/covers/GREEN87.jpg", "top_chars": "香(6次)、味(6次)", "rec_ids": ["GREEN80", "GREEN29", "GREEN55"], "rec_chars": ["门原饭房打", "原候时打以", "卧客厅原房"], "s": "Green 87 香味  今天妈妈做蛋糕，烤蛋糕的时候，香味飘出来了。 客厅、饭厅、书房和卧室都是香味。闻到香味，我肚子都饿了。 「叩!叩!叩!」有人敲门，我打开门，原来的邻居小胖。 他说:「你家蛋糕的香味飘到我家了。」我说:「香味是可以分享的呀!」 他说:「那蛋糕可以分享吗?」"}, {"id": "GREEN88", "level": "GREEN", "number": 88, "title_zh": "好吃的东西", "title_en": "Yummy stuff", "topic": "食物", "cover": "/covers/GREEN88.jpg", "top_chars": "吃(6次)、我(5次)", "rec_ids": ["GREEN78", "GREEN80", "GREEN81"], "rec_chars": ["健康东觉西", "牙菜青得想", "淇淋东冰西"], "s": "Green 88 好吃的东西  为什么我觉得好吃的东西，大人都说是不健康的。 我爱吃棒棒糖，老师说吃了会蛀牙。 我爱吃冰淇淋，奶奶说吃了会喉咙痛。 我想喝汽水，爸爸说喝了会变胖。 我说:「妈妈，请你青菜加糖，肉加冰淇淋，汤加汽水，好吗?」"}, {"id": "GREEN89", "level": "GREEN", "number": 89, "title_zh": "先吃再付钱", "title_en": "Pay after eating", "topic": "食物", "cover": "/covers/GREEN89.jpg", "top_chars": "我(7次)、弟(6次)", "rec_ids": ["GREEN9", "GREEN80", "GREEN29"], "rec_chars": ["买场巧克力", "发饭找这没", "候时坐都没"], "s": "Green 89 先吃再付钱  妈妈让我带弟弟去超级市场，买我们喜欢吃的零食。 我选了巧克力和冰淇淋，弟弟选了薯片和棒棒糖。 我提篮子去排队的时候，发现弟弟不见了。 我去找他，看到他坐在地上吃薯片。我说:「我们还没付钱呀!」 他说:「吃了再付钱，不行吗? 饭店都是这样的。」"}, {"id": "GREEN90", "level": "GREEN", "number": 90, "title_zh": "食物梦", "title_en": "Food dream", "topic": "食物", "cover": "/covers/GREEN90.jpg", "top_chars": "的(9次)、做(7次)", "rec_ids": ["GREEN50", "GREEN89", "YELLOW15"], "rec_chars": ["醒梦真做就", "薯巧克力食", "椅真坐还都"], "s": "Green 90 食物梦  我做了一个梦，梦裏都是食物。我坐的船是木瓜做的，河水是牛奶。 河上有桥，桥是香蕉做的。河边有路，路是麵包做的。 路的两边有西瓜做的椅子，还有薯片做的花。 河裏有很多巧克力做的鱼，我伸手去抓鱼….. 我就醒了，一看!我手裏真的有巧克力鱼呢!"}, {"id": "GREEN91", "level": "GREEN", "number": 91, "title_zh": "星星吃月亮", "title_en": "The stars ate the moon", "topic": "自然", "cover": "/covers/GREEN91.jpg", "top_chars": "月(10次)、亮(10次)", "rec_ids": ["GREEN43", "GREEN11", "GREEN21"], "rec_chars": ["它又把很天", "于变又把很", "所以得把很"], "s": "Green 91 星星吃月亮  天上的月亮大又圆，星星看见了，很嫉妒月亮。 于是，它们决定去吃月亮，把月亮吃得弯弯的。 不久，月亮又变得大又圆，星星又嫉妒月亮了。 它们又去吃月亮，月亮又变得弯弯的。 所以，我看到的月亮，有时是圆圆的，有时是弯弯的。"}, {"id": "GREEN92", "level": "GREEN", "number": 92, "title_zh": "找宝藏", "title_en": "A Treasure Hunt", "topic": "自然", "cover": "/covers/GREEN92.jpg", "top_chars": "宝(6次)、藏(6次)", "rec_ids": ["GREEN84", "GREEN55", "GREEN9"], "rec_chars": ["洞山高爬穿", "原让面起也", "场藏再找面"], "s": "Green 92 找宝藏  这是一张宝藏图，来!我们一起去找宝藏。 宝藏在哪裏呢?让我们再看清楚宝藏图。 先爬上高高的山，再渡过长长的河 。 找到最大的石头，再穿过下面的小山洞。 「救命呀!」原来是一场梦，什么宝藏也没有。"}, {"id": "GREEN93", "level": "GREEN", "number": 93, "title_zh": "我喜欢大自然", "title_en": "I love nature", "topic": "自然", "cover": "/covers/GREEN93.jpg", "top_chars": "的(7次)、我(6次)", "rec_ids": ["GREEN19", "GREEN56", "GREEN74"], "rec_chars": ["筝空高放风", "候呢时放起", "泳游呢朋友"], "s": "Green 93 我喜欢大自然  晴天的时候，我喜欢到大海裏和鱼儿游泳。 阴天的时候，我喜欢和朋友爬上高山，一起去探险。 颳风的时候，我喜欢放风筝，让风筝飞上天空和鸟儿玩。 下雨的时候，我喜欢画画，画什么呢? 我画了大海的鱼儿，一起爬山的朋友，和天空的鸟儿。"}, {"id": "GREEN94", "level": "GREEN", "number": 94, "title_zh": "游太空", "title_en": "A space trip", "topic": "自然", "cover": "/covers/GREEN94.jpg", "top_chars": "我(11次)、上(5次)", "rec_ids": ["GREEN39", "GREEN50", "GREEN19"], "rec_chars": ["用带衣穿给", "破掉气用球", "云吹掉空见"], "s": "Green 94 游太空  老师给我一个气球，我用力吹，气球越吹越大。 我飞上了天，小鸟咬破我的气球。 我掉在白云上，飘啊飘，我抓住火箭向上飞…... 我看见太空人，他让我穿上太空衣，坐上太空船，然后带我回家去 。 妈妈问:「你刚刚去了哪裏?」我说:「我去了很多地方!」"}, {"id": "GREEN95", "level": "GREEN", "number": 95, "title_zh": "宝石", "title_en": "Precious stones", "topic": "自然", "cover": "/covers/GREEN95.jpg", "top_chars": "妈(16次)、鱼(7次)", "rec_ids": ["GREEN35", "GREEN55", "GREEN28"], "rec_chars": ["蓝走跳宝叫", "走开面得也", "叫得没也地"], "s": "Green 95 宝石  妈妈的游泳衣上， 有很多漂亮的小鱼，妈妈跳进水裏， 小鱼游走了。 妈妈追小鱼，小鱼游得很快，妈妈也游得很快。 小鱼游进一个洞裏，妈妈也游进去，妈妈见到了美人鱼和沉船， 沉船裏面有很多宝石，有红宝石，绿宝石和蓝宝石。妈妈开心地大叫! 妈妈醒了，没有美人鱼，没有沉船，只有晒红的脸。"}, {"id": "GREEN96", "level": "GREEN", "number": 96, "title_zh": "老树 The old tree", "title_en": "The old tree", "topic": "自然", "cover": "/covers/GREEN96.jpg", "top_chars": "树(11次)、我(7次)", "rec_ids": ["GREEN74", "GREEN77", "YELLOW15"], "rec_chars": ["伤觉友朋都", "伤哭友朋心", "觉睡白像书"], "s": "Green 96 老树  我家院子裏有棵很老的大树，它的树干和树枝都很粗。 白天，我会爬上老树，坐在粗粗的树枝上看书和睡觉。 晚上，我也会爬上老树，躺在粗粗的树枝上看月亮和数星星。 我伤心的时候，也会爬上老树，抱着树枝哭，说出我的心事。 老树好像是我另外一个家，也是我最好的朋友。"}, {"id": "GREEN97", "level": "GREEN", "number": 97, "title_zh": "美丽的星星", "title_en": "Beautiful stars", "topic": "自然", "cover": "/covers/GREEN97.jpg", "top_chars": "我(8次)、一(7次)", "rec_ids": ["GREEN23", "GREEN38", "GREEN80"], "rec_chars": ["闪丽美像然", "话然像会和", "只兔谁儿和"], "s": "Green 97 美丽的星星  有一天，太阳、白云和彩虹在说话，它们要比一比，看谁最美丽。 太阳说:「我又大又红，当然是我最美丽。」 白云说:「我一会儿像小羊，一会儿像白兔，当然是我最美丽。」 彩虹说:「你们只有一种颜色，我有七种颜色，当然是我最美丽。」 星星听到了，它说:「只有我一闪一闪的像宝石，我才最美丽。」"}, {"id": "GREEN98", "level": "GREEN", "number": 98, "title_zh": "雨天的积水", "title_en": "Puddles on the rainy days", "topic": "自然", "cover": "/covers/GREEN98.jpg", "top_chars": "我(8次)、雨(7次)", "rec_ids": ["GREEN55", "GREEN49", "GREEN25"], "rec_chars": ["让点走跑拿", "怎见雨回拿", "友朋跑打得"], "s": "Green 98 雨天的积水  我喜欢雨天，我爱拿着雨伞在雨中慢慢地走。 我也爱在雨中跑来跑去，让雨点打在我的脸上，打在我的身上。 我更爱踩着雨天的积水，喜欢和朋友比赛，看谁踩积水，把水溅得最高。 糟糕! 全身都湿了，妈妈来了，我看见她生气的脸，怎么办? 赶快回家，洗个热水澡，再告诉她，我踩积水，把水溅得最高!"}, {"id": "GREEN99", "level": "GREEN", "number": 99, "title_zh": "春夏秋冬", "title_en": "Spring summer autumn winter", "topic": "自然", "cover": "/covers/GREEN99.jpg", "top_chars": "了(9次)、草(8次)", "rec_ids": ["GREEN80", "GREEN74", "GREEN84"], "rec_chars": ["吧青怕心这", "得起没也么", "山高怕长想"], "s": "Green 99 春夏秋冬  春天到了，山上长满了青草，一隻羊在吃草。 一头牛来了，也想吃草，羊说: 「这么多草，我们一起吃吧!」 夏天到了，山上的草长高了，牛和羊吃得好饱好饱。 秋天到了，羊的肚子饿了，山上没草了。牛说:「你来我家吧!」 牛的家裏很多草，羊开心地说:「这么多草，冬天到了也不怕!」"}, {"id": "GREEN100", "level": "GREEN", "number": 100, "title_zh": "小种子", "title_en": "The little seed", "topic": "自然", "cover": "/covers/GREEN100.jpg", "top_chars": "它(6次)、种(5次)", "rec_ids": ["GREEN55", "YELLOW65", "GREEN32"], "rec_chars": ["户窗让点面", "芽种它放果", "外发点面就"], "s": "Green 100 小种子  我把小种子种在土裏，放在窗户旁边，让太阳照着它 天天 给它喝水，一天天的过去了，种子终于发芽了。 我想让它快点长大，就把它移到窗户外面， 让它晒更多太阳，喝更多雨水。 结果，它晒太多太阳，喝太多雨水，我的小种子死了!"}];

function hl(t,q){if(!q||!t)return t;try{return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<m>$1</m>')}catch(e){return t}}
function getTopics(){var s=new Set();(curL==='ALL'?BOOKS:BOOKS.filter(function(b){return b.level===curL})).forEach(function(b){if(b.topic)s.add(b.topic)});return Array.from(s)}
function renderTopics(){var L=labels[variant];var t=getTopics(),r=document.getElementById('topicRow');if(!t.length){r.innerHTML='';return}r.innerHTML='<button class="tb '+(curT==='ALL'?'active':'')+'" onclick="setT(\'ALL\')">'+L.allTopic+'</button>'+t.map(function(x){return'<button class="tb '+(curT===x?'active':'')+'" onclick="setT(\''+x.replace(/'/g,"\\'")+'\')">'+x+'</button>'}).join('')}
function filter(){var q=query.toLowerCase().trim();return BOOKS.filter(function(b){if(curL!=='ALL'&&b.level!==curL)return false;if(curT!=='ALL'&&b.topic!==curT)return false;if(!q)return true;return[b.title_zh,b.title_en,b.id,b.topic,b.s].join(' ').toLowerCase().indexOf(q)>=0})}
function render(){var L=labels[variant];var f=filter();document.getElementById('cnt').textContent=f.length+' '+L.unit;var g=document.getElementById('grid');if(!f.length){g.innerHTML='<div class="empty"><div class="ico">📚</div><h3>'+L.noResult+'</h3></div>';return}g.innerHTML=f.map(function(b){var c=lc(b.level);return'<div class="card" onclick="openM(\''+b.id+'\')"><div class="cbar '+c+'"></div><div class="cover-wrap"><img src="'+b.cover+'" alt="'+b.title_zh+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="cover-placeholder">📖</div></div><div class="cbody"><span class="badge '+c+'">'+b.level+' '+ll[b.level]+'</span>'+(b.topic?'<span class="topic-tag">'+b.topic+'</span>':'')+'<div class="cnum">#'+b.number+'</div><div class="ctitle">'+(query?hl(b.title_zh,query):b.title_zh)+'</div>'+(b.top_chars?'<div class="cfreq">'+L.freq+b.top_chars+'</div>':'')+'</div></div>'}).join('')}
