N28", "level": "GREEN", "number": 28, "title_zh": "動物的叫聲", "title_en": "Animal calls", "cover": "/covers/GREEN28.jpg", "en_content": "One morning, some little birds were chirping in the forest. The little birds said: “But you are croaking at night. The big tree said: “You little birds are noisy in the morning. Therefore, the big tree used its leaves to stuff the mouths of the little birds and the The next day it was very quiet in the forest. The big tree felt that without the noise he felt"}, {"id": "GREEN29", "level": "GREEN", "number": 29, "title_zh": "北極熊", "title_en": "Polar bears", "cover": "/covers/GREEN29.jpg", "en_content": "Mo Mo and his daddy went fishing on a sled. Mo Mo often threw fish to her. Winter came. Mo Mo did not see the polar bear and thought Spring came. Mo Mo saw the polar bear followed by two baby polar bears It turned out that she had become a mom."}, {"id": "GREEN30", "level": "GREEN", "number": 30, "title_zh": "黑熊媽媽說話", "title_en": "Mommy black bear was talking", "cover": "/covers/GREEN30.jpg", "en_content": "Mommy black bear was having a rest under the tree. Then they continued to climb up the tree trunk. It turned out that little black bears are Elder brother black bear and younger sister black bear climbed up Younger sister black bear stared at her elder brother as if she were asking him: Elder brother black bear told his younger sister that mom said:"}, {"id": "GREEN31", "level": "GREEN", "number": 31, "title_zh": "動物幫手", "title_en": "Animal helper", "cover": "/covers/GREEN31.jpg", "en_content": "The zoo has a zookeeper. One day the zookeeper was extremely busy because of a tiger He needed a helper to help him look after the new-born cub. He was thinking: “My helper must not be afraid of baby animals Afterwards he found a good helper. He knew how to look after"}, {"id": "GREEN32", "level": "GREEN", "number": 32, "title_zh": "蜘蛛", "title_en": "A spider", "cover": "/covers/GREEN32.jpg", "en_content": "A spider fell into the bathtub. He wanted to climb out but he fell down Although I was scared of spiders, I wanted to help him. When the spider was climbing up, I took a piece of newspaper The spider was halfway up when he fell onto the newspaper. The next day there was a beautiful spider web on the tree branches."}, {"id": "GREEN33", "level": "GREEN", "number": 33, "title_zh": "海獺", "title_en": "Sea otters", "cover": "/covers/GREEN33.jpg", "en_content": "Sea otters live in the ocean. Sea otters are very smart animals. They often hold hands and curl up inside the seaweed to sleep. This way they won’t be washed away when the They also play games together very often."}, {"id": "GREEN34", "level": "GREEN", "number": 34, "title_zh": "狗兒一家", "title_en": "The dog family", "cover": "/covers/GREEN34.jpg", "en_content": "Mom and I went to a “Center for Homeless Dogs”. Dad said that we should adopt one more so that he has company. One day my elder brother brought home two little dogs with light brown markings. The two little dogs with light brown markings saw the two big dogs with light brown The two big dogs with light brown markings licked the two little dogs with light brown"}, {"id": "GREEN35", "level": "GREEN", "number": 35, "title_zh": "小藍企鵝", "title_en": "The small blue penguins", "cover": "/covers/GREEN35.jpg", "en_content": "There are many kinds of penguins. Some are big and some are small. In Australia there is a kind of small penguin. They have blue feathers. There are many small blue penguins’ homes on the shore. When it’s getting dark the small blue penguins would jump on the shore The small blue penguins are really smart. Every one of them can find their own"}, {"id": "GREEN36", "level": "GREEN", "number": 36, "title_zh": "小動物", "title_en": "Small animals", "cover": "/covers/GREEN36.jpg", "en_content": "The small rat was unhappy because the big animals would not play with him. The small rat thought: I am bigger than butterflies and dragonflies. The small rat felt that the small squirrel was a similar size to him. So, he and the small squirrel became very good friends. They also made up many The big animals came and wanted to join them. The small rat and the small squirrel"}, {"id": "GREEN37", "level": "GREEN", "number": 37, "title_zh": "瓢蟲", "title_en": "Ladybugs", "cover": "/covers/GREEN37.jpg", "en_content": "There are many kinds of insects. Some are helpful insects. I am a ladybug. There are many round spots on my body making me look very pretty. I live on flowers, trees and grass. My favorite food is a kind of harmful insects What I am afraid of most is pesticides. As a result, pesticides can kill me too. Then, who is going to eat the"}, {"id": "GREEN38", "level": "GREEN", "number": 38, "title_zh": "松鼠", "title_en": "Squirrels", "cover": "/covers/GREEN38.jpg", "en_content": "You can often see cute squirrels in the park. They climb tress even faster. One day, I saw a squirrel. His mouth was moving non-stop which looked Suddenly he froze there looking at me. He seemed to want me to take “Click!” I took a picture of him. “Look! The squirrel looks really cute!”"}, {"id": "GREEN39", "level": "GREEN", "number": 39, "title_zh": "綿羊", "title_en": "Sheep", "cover": "/covers/GREEN39.jpg", "en_content": "Xiao Pang went to Canada with his family. Mom and Dad took him to The farmer held a razor and shaved all the wool from Mom said that we could use the wool to knit sweaters to wear. Xiao Pang looked at the bare body of the sheep thinking: He said to his mom: “Would you knit lots of sweaters to give"}, {"id": "GREEN40", "level": "GREEN", "number": 40, "title_zh": "動物玩偶", "title_en": "Stuffed toys", "cover": "/covers/GREEN40.jpg", "en_content": "I used my stuffed animal toys to decorate my room. I made it into a zoo. I took my younger brother to my zoo. He was so happy that he patted At night I went back to my room and found all my stuffed animal toys were gone. Suddenly, I heard my younger brother yelling: “Please don’t eat me!” It turned out that all the stuffed animal toys were on my younger brother’s bed."}, {"id": "GREEN41", "level": "GREEN", "number": 41, "title_zh": "動物會保護自己", "title_en": "Animals know how to protect themselves", "cover": "/covers/GREEN41.jpg", "en_content": "Dad was reading books to my younger brother. “Butterflies can remain still so that they can’t be found.” “Hedgehogs have spikes so that you dare not catch them.” My younger brother went to hide immediately so that he can’t be found by Dad. But our doggy kept barking towards the place where he hid."}, {"id": "GREEN42", "level": "GREEN", "number": 42, "title_zh": "螃蟹", "title_en": "Crabs", "cover": "/covers/GREEN42.jpg", "en_content": "You can play with sand and play with water at the beach. Once I saw a crab. But he escaped back to his hole quickly. I stretched my arm inside the hole to catch him. I quickly pulled out my arm. The crab was pulled out at the same time. Ai! I don’t know if I caught the crab or the crab caught me!"}, {"id": "GREEN43", "level": "GREEN", "number": 43, "title_zh": "刺蝟", "title_en": "Hedgehogs", "cover": "/covers/GREEN43.jpg", "en_content": "Hedgehogs have many spikes on their bodies. One day a hedgehog used the spikes on his body to pierce many fruits. All the other animals laughed at him saying: “You do have a lot of fruits on your body. Another hedgehog came along and also used the spikes on his body to pierce many fruits. They said: “You forgot that we are animals who help each other!”"}, {"id": "GREEN44", "level": "GREEN", "number": 44, "title_zh": "小河馬和大烏龜", "title_en": "The small hippo and the big turtle", "cover": "/covers/GREEN44.jpg", "en_content": "One day a small hippo lost his mom. Someone took him to the wild animal zoo. The small hippo went to lean on the big turtle. The big turtle became his new mom. That’s that! Just like my mom adopted me."}, {"id": "GREEN45", "level": "GREEN", "number": 45, "title_zh": "松鼠玩偶", "title_en": "Stuffed toy squirrel", "cover": "/covers/GREEN45.jpg", "en_content": "I took my stuffed toy squirrel to the park to play. I wanted to play on the swing and put my stuffed toy squirrel on the grass. A real squirrel came. He stared at the stuffed toy squirrel and ran away. After a while, the real squirrel came back holding a pinecone in his hands. He put the pinecone in front of the stuffed toy squirrel and gently leaned against"}, {"id": "GREEN46", "level": "GREEN", "number": 46, "title_zh": "噴水的龍", "title_en": "The dragon that puffs water", "cover": "/covers/GREEN46.jpg", "en_content": "Mom dragon bore many baby dragons. Every one of them could puff fire except The dragon puffing water asked mom: “Why can the other dragons all puff fire and be Mom dragon told him: “A dragon that can puff water is really sharp. She said: “Look! Everyone needs water. Every family needs water.” The dragon puffing water was thinking: “No wonder every family has"}, {"id": "GREEN47", "level": "GREEN", "number": 47, "title_zh": "蓋房子", "title_en": "Building a house", "cover": "/covers/GREEN47.jpg", "en_content": "The rat family lived inside a broken shoe which could not resist the strong wind and Daddy rat said: “We have to build a good house which can resist the strong wind and Grandpa rat and Grandma rat built the walls. The elder brother rat and the elder sister rat built the door. The house was done. No wind and no rain were able to get inside the house."}, {"id": "GREEN48", "level": "GREEN", "number": 48, "title_zh": "奶奶", "title_en": "Grandma", "cover": "/covers/GREEN48.jpg", "en_content": "Grandma has a necklace. She said that she will give it to me when I grow up. But she is afraid that she will forget where she keeps the necklace. She put the note aside. But she is afraid that she will forget where she keeps the note. And I wrote: “The note is kept---------“. I asked Grandma: “Then, how many I said: “You’d better give the necklace to me now!”"}, {"id": "GREEN49", "level": "GREEN", "number": 49, "title_zh": "爸爸沒回家", "title_en": "Dad did not come home", "cover": "/covers/GREEN49.jpg", "en_content": "It’s a rainy day. Daddy duck saw the house’s roof was leaking. He took the tool box and went up on the roof to fix it. Mommy duck opened the door and pushed down the ladder. It’s getting dark. Mommy duck felt weird. Daddy duck was missing. The ducklings were crying sadly."}, {"id": "GREEN50", "level": "GREEN", "number": 50, "title_zh": "會飛的房子", "title_en": "Flying house", "cover": "/covers/GREEN50.jpg", "en_content": "I went to see a movie. In the movie there were many balloons tied up to a house so the I hoped our house could fly too. Mom said that’s only the house in the movie. I could only make up it in my dream. The house in my dream can fly Then, one by one, the balloons burst. The house was falling down. My elder brother said to me: “Nowadays there is an airplane hotel."}, {"id": "GREEN51", "level": "GREEN", "number": 51, "title_zh": "媽媽愛誰多一點", "title_en": "Mom loves whom a bit more?", "cover": "/covers/GREEN51.jpg", "en_content": "My elder sister and I are twins. Mom said: “You both came out of my tummy. I love you both the same.” I did not feel that was right. Mom should love me a bit more. I said: “My elder sister came out three minutes earlier than I did. “So, you should love me a bit more now!”"}, {"id": "GREEN52", "level": "GREEN", "number": 52, "title_zh": "狗狗和我", "title_en": "The doggy and I", "cover": "/covers/GREEN52.jpg", "en_content": "The doggy was outside and used his claws to scratch the door. I opened the door and said to him: “Today you did not behave yourself. The doggy was sobbing outside the door and seemed to be crying sadly. I also cried sadly. I went to open the door and let him in. The doggy jumped on me and used his tongue to lick my tears."}, {"id": "GREEN53", "level": "GREEN", "number": 53, "title_zh": "家人聽對了嗎", "title_en": "Did my family hear it correctly?", "cover": "/covers/GREEN53.jpg", "en_content": "Mom wanted a flower. But my younger sister took her a picture. Grandpa wanted a fan. But my younger brother took him an umbrella. My elder sister wanted a cat with different colored markings. But my elder brother Grandma wanted a comb. But my younger brother took her a tree branch. Dad wanted an airplane. But mom took him a fat chicken."}, {"id": "GREEN54", "level": "GREEN", "number": 54, "title_zh": "海盜弟弟", "title_en": "My younger brother being a pirate", "cover": "/covers/GREEN54.jpg", "en_content": "I made a sword for my younger brother. My younger brother wore a stripy T-shirt. He ran to mom and said: “I am a pirate. Give me your treasure.” Mom gave him lots of coins. He was very happy to count his coins. Afterwards, my younger brother put all the money inside his piggy bank"}, {"id": "GREEN55", "level": "GREEN", "number": 55, "title_zh": "家裏有聲音", "title_en": "A sound in the house", "cover": "/covers/GREEN55.jpg", "en_content": "At night I was sleeping. I heard a sound. ran to my elder sister’s room. My elder sister also heard a sound. ran to mommy and daddy’s room. Mom and Dad also heard it. We followed Mom and Dad and walked to the living room. Ah! It turned there was a small bird trapped in our living room."}, {"id": "GREEN56", "level": "GREEN", "number": 56, "title_zh": "媽媽出差", "title_en": "Mom on a business trip", "cover": "/covers/GREEN56.jpg", "en_content": "I went home after school and did not see my mom there. Dad said that Mom went on a “business trip”. Dad said “business trip” meant to work in a different place At night when Dad read stories to me I missed Mom a little bit. Finally, Mom came home. I jumped on her and said: “I want to go on a"}, {"id": "GREEN57", "level": "GREEN", "number": 57, "title_zh": "花園房子", "title_en": "House with a garden", "cover": "/covers/GREEN57.jpg", "en_content": "Xiao Pang (Chinese nickname for a chubby boy) said that his house in America There is a swimming pool next to the garden. Behind it is a big empty space where you can On hearing that, I also wanted a house with such a garden. I gave it some thought and then drew a picture of a home with a flower garden. Of course, it included me riding a bike on the big empty space."}, {"id": "GREEN58", "level": "GREEN", "number": 58, "title_zh": "把弟弟送給你", "title_en": "Giving away my younger brother", "cover": "/covers/GREEN58.jpg", "en_content": "I have an annoying younger brother. He always fights for toys with me. He also scribbled on my workbook. So, I decided to give him away. Auntie came to our home. I gave away my younger brother to her. Now I could only play by myself. I began to miss my younger brother------ I called Auntie up and said: “Please give me back my younger brother!”"}, {"id": "GREEN59", "level": "GREEN", "number": 59, "title_zh": "我不貪心", "title_en": "I am not greedy", "cover": "/covers/GREEN59.jpg", "en_content": "Dad often taught Le Le not to be greedy and not to expect One day Le Le came home and gave dad her school report. Dad looked at Le Le’s school report. All the grades were As except for Dad said: “Le Le, work harder and your English grade will be better.” Le Le was thinking: Isn’t B better than C? Didn’t Dad teach me not to be greedy and not to"}, {"id": "GREEN60", "level": "GREEN", "number": 60, "title_zh": "我的好朋友", "title_en": "My best friend", "cover": "/covers/GREEN60.jpg", "en_content": "This is my doggy of our home. She is my best friend. When I am bored, I like to dress her in different pretty clothes. When I am happy, I like to hold her legs to dance. I went home after school and enjoyed pretending to be her teacher. When it’s getting cold, I also cuddle her to sleep. What about you?"}, {"id": "GREEN61", "level": "GREEN", "number": 61, "title_zh": "家裏的好人和壞人", "title_en": "Good guys and bad guys at home", "cover": "/covers/GREEN61.jpg", "en_content": "I played a game with my younger brother. I said: “Fine! We will both be good guys and we will go We tiptoed into our elder brother’s room. We put all the bad guys inside a bag and threw them into Our elder brother came home. He walked into his room and yelled:"}, {"id": "GREEN62", "level": "GREEN", "number": 62, "title_zh": "妹妹", "title_en": "Younger sister", "cover": "/covers/GREEN62.jpg", "en_content": "My younger sister was doing her homework. My younger sister was putting on her clothes. My younger sister washed her hands. I said to her angrily that she was really a “so-so” person. She also said angrily: “I am not a horse. I am not a tiger either. I am an ox.”"}, {"id": "GREEN63", "level": "GREEN", "number": 63, "title_zh": "媽媽像什麼", "title_en": "What is Mom like?", "cover": "/covers/GREEN63.jpg", "en_content": "What is Mom like? My mom can be like anything. When she is happy, she will chirp nonstop like a little bird. When she is mad, she will talk to me fiercely like a tiger. When she is busy, she hoped she can do eight things at one time, like an octopus. When she is tired, she will dive under the quilt to have a sound sleep, like a big"}, {"id": "GREEN64", "level": "GREEN", "number": 64, "title_zh": "我討厭的事", "title_en": "The things that I hate", "cover": "/covers/GREEN64.jpg", "en_content": "There are quite a few things that I hate. When using the computer, I hate it when dad keeps asking me to turn it off. When watching TV, I hate it when Grandma keeps asking me to change the channel. When taking a bath, I hate it when my elder sister keeps asking me to come out quickly. How about you? What are the things that you hate?"}, {"id": "GREEN65", "level": "GREEN", "number": 65, "title_zh": "冬眠的弟弟", "title_en": "Younger brother hibernated", "cover": "/covers/GREEN65.jpg", "en_content": "One morning in the winter younger brother wanted to Mom woke him up. He did not want to. He pulled up the quilt and said: At noon younger brother was still in bed sleeping. At night younger brother got up. Mom said: “When animals hibernate they don’t need to eat any food.”"}, {"id": "GREEN66", "level": "GREEN", "number": 66, "title_zh": "尾巴", "title_en": "Tails", "cover": "/covers/GREEN66.jpg", "en_content": "On Sunday I went to a zoo with Dad. After getting there we saw elephants, brown bears, Then we went to see the peacock. It was a shame that she did not I walked close to the cage and wanted the peacock to see my The peacock opened her tail slowly and seemed to tell me:"}, {"id": "GREEN67", "level": "GREEN", "number": 67, "title_zh": "角、鬍鬚和尾巴", "title_en": "Horns, whiskers, and a tail", "cover": "/covers/GREEN67.jpg", "en_content": "A strong wind was blowing. It blew away the horns of the sheep. It blew away the tail of the squirrel and the whiskers of the cat. All the animals said: “Strong wind, strong wind, please stop blowing!” The strong wind blew me up to the sky too. I saw the horns, the tail Suddenly the strong wind stopped. I fell from the sky."}, {"id": "GREEN68", "level": "GREEN", "number": 68, "title_zh": "腿斷了", "title_en": "Broken leg", "cover": "/covers/GREEN68.jpg", "en_content": "A small elephant fell down into a big hole and could not come out. The mommy elephant was howling nonstop. Many people heard her howling But they found the small elephant had a broken leg. They made a phone call. A helicopter came and lifted up the small elephant The vet tied a brace to the leg. The small elephant could walk slowly again"}, {"id": "GREEN69", "level": "GREEN", "number": 69, "title_zh": "熊貓的毛", "title_en": "The panda’s fur", "cover": "/covers/GREEN69.jpg", "en_content": "A panda cub was born. She was very, very tiny and pink. The cub began to grow fur. Her fur was black and white. But her ears, eyes and four legs were white. Her body turned out to be black. However, she looked cute and all the kids especially liked her--------- because she looked different from other pandas. She is so special!"}, {"id": "GREEN70", "level": "GREEN", "number": 70, "title_zh": "大熊的背", "title_en": "The big bear’s back", "cover": "/covers/GREEN70.jpg", "en_content": "A big bear was lying on his stomach in front of his cave and felt his back was itchy. He asked: “What are you doing on my back?” The big bear asked him why he was dancing on his back. Ever since then, they became good friends. The small rat came to dance every day. The small rat said: “I have to wait three months to be able to dance again!"}, {"id": "GREEN71", "level": "GREEN", "number": 71, "title_zh": "羽毛", "title_en": "Feathers", "cover": "/covers/GREEN71.jpg", "en_content": "A peacock felt that her feathers were extremely pretty. The little birds all asked her for one feather. One day the peacock woke up from her sleep and found all the feathers on The peacock wept sadly while she searched for her feathers. The peacock stuck the feathers given by all the little birds into her tail."}, {"id": "GREEN72", "level": "GREEN", "number": 72, "title_zh": "牙齒", "title_en": "Teeth", "cover": "/covers/GREEN72.jpg", "en_content": "One morning Xiao Ming got up and He saw grandpa holding his teeth and then putting them into his mouth. He could not figure out why grandpa ate teeth. “You put your teeth under your pillow so the tooth fairy will Grandpa asked Xiao Ming: “I’ve got no teeth. These are false teeth."}, {"id": "GREEN73", "level": "GREEN", "number": 73, "title_zh": "頭上的大包", "title_en": "A lump on the forehead", "cover": "/covers/GREEN73.jpg", "en_content": "My younger brother fell down and a big lump appeared on his forehead. Mom came to rub his forehead but he said it was still very painful. Grandma came to give him a candy. Dad came and said: “Let the doctor give him a shot!” He said: “It’s not painful anymore.”"}, {"id": "GREEN74", "level": "GREEN", "number": 74, "title_zh": "腳受傷了", "title_en": "The wounded leg", "cover": "/covers/GREEN74.jpg", "en_content": "A big dog walked with his owner. He saw a monkey. The next day, the monkey went to find the big dog to play. People saw them and felt weird and puzzled that a dog and a monkey could be friends. But they were together every day. They even swam in the river together. It turned out that the big dog had wounded his leg."}, {"id": "GREEN75", "level": "GREEN", "number": 75, "title_zh": "熊熊生病了", "title_en": "The bear got sick", "cover": "/covers/GREEN75.jpg", "en_content": "My younger brother took a stethoscope and put the chest piece on the chest of his After a while, he said: “The bear is sick.” After a while, he said: “The bear has a fever.” He said to the teddy bear: “I will give you candies if you don’t cry.” Then he held up the teddy bear and said: “My bear is the most well-behaved bear"}, {"id": "GREEN76", "level": "GREEN", "number": 76, "title_zh": "生病的公雞", "title_en": "The sick rooster", "cover": "/covers/GREEN76.jpg", "en_content": "Early in the morning the sun came out. The hen got mad and asked him: “Why didn’t you crow?” The rooster said that he was sick. The hen said: “I’ll take you to see a doctor. You can get a shot and then The rooster saw the doctor and said:"}, {"id": "GREEN77", "level": "GREEN", "number": 77, "title_zh": "長毛巴", "title_en": "Regrowing a tail", "cover": "/covers/GREEN77.jpg", "en_content": "The rat and the house lizard lived together. One day, the house lizard broke his tail. Not long after, the rat’s tail got broken. He was very sad and cried. The house lizard asked him not to cry and said the tail will regrow. The house lizard said: “How can that be? Look! Here is my regrown tail!”"}, {"id": "GREEN78", "level": "GREEN", "number": 78, "title_zh": "薯片 Chips", "title_en": "Chips", "cover": "/covers/GREEN78.jpg", "en_content": "What’s the best food in the world? Some chips are thick and some are thin. Chips are crunchy. The more you eat them, the more you want to eat. Once you have started eating them it’s very hard to stop eating them. why do all the adults and children like this kind of unhealthy food"}, {"id": "GREEN79", "level": "GREEN", "number": 79, "title_zh": "水果", "title_en": "Fruit", "cover": "/covers/GREEN79.jpg", "en_content": "There were many kinds of fruit in the basket. They finally agreed that whichever one is picked up to be eaten first Apples were picked up first and cut into small pieces. All the small pieces fruit were put into a big bowl and became a fruit salad. People stuffed the fruit salad into their mouths."}, {"id": "GREEN80", "level": "GREEN", "number": 80, "title_zh": "青菜和蘿蔔", "title_en": "Vegetables and carrots", "cover": "/covers/GREEN80.jpg", "en_content": "The rabbit family found an old house. The daddy rabbit said: “Let’s live here!” It was getting dark. The owner of the house came home. He opened the door. All the rabbits were scared and shook. The big wolf said: “Don’t be afraid. I am getting old and have"}, {"id": "GREEN81", "level": "GREEN", "number": 81, "title_zh": "冰淇淋", "title_en": "Ice cream", "cover": "/covers/GREEN81.jpg", "en_content": "My younger brother came out of the kitchen with his two hands hiding behind his back. Mom asked him: “Why are your hands behand your back? Stretch them out My younger brother did not want to stretch out his two hands. Mom asked him to stretch out his hands quickly. “Yi! What happened? Where is the ice cream?”"}, {"id": "GREEN82", "level": "GREEN", "number": 82, "title_zh": "烤鴨", "title_en": "Roast duck", "cover": "/covers/GREEN82.jpg", "en_content": "Roast Peking duck is a very famous dish. The roast duck has crispy yellow skin outside and soft and tender meat inside. After bringing out the roast duck, the chef usually slices the duck meat along with the skin When you eat the roast duck, you take a piece of thin pastry first. Ai Ya!(Chinese expression similar to Oh My God) My mouth is watery."}, {"id": "GREEN83", "level": "GREEN", "number": 83, "title_zh": "巧克力蛋糕", "title_en": "Chocolate cake", "cover": "/covers/GREEN83.jpg", "en_content": "It’s my elder sister’s birthday. Put the eggs in a bowl first and then add flour. You also need to add butter and oil. My elder sister loves chocolate. So, I will add more chocolate. After baking for 10 minutes the cake is still small. Oh No! The cake has become a chocolate mountain."}, {"id": "GREEN84", "level": "GREEN", "number": 84, "title_zh": "花蜜和花粉", "title_en": "Honey and pollen", "cover": "/covers/GREEN84.jpg", "en_content": "Up on a high mountain and through a long tunnel, They lived among flowers, wore flower-made clothes, ate pollen and drank honey. One day a giant came. All the dwarfs were frightened. The giant said: “Don’t be afraid. I also want to live among the flowers,"}, {"id": "GREEN85", "level": "GREEN", "number": 85, "title_zh": "零食", "title_en": "Snacks", "cover": "/covers/GREEN85.jpg", "en_content": "My elder sister loves eating dry mangos. We all know that having snacks between meals will make us lose our appetite Today we opened the cupboards and saw they were all empty. Having no snacks at home, we felt that"}, {"id": "GREEN86", "level": "GREEN", "number": 86, "title_zh": "西瓜和番茄", "title_en": "Watermelons and tomatoes", "cover": "/covers/GREEN86.jpg", "en_content": "The little watermelon lived with his parents. One day, the little watermelon saw some square watermelons. Their daddy said: “The square watermelons and the purple tomatoes are your biao ge and Another day, the small watermelon saw some triangular watermelons. They were thinking: “Who are they?” The triangular watermelons and the blue tomatoes"}, {"id": "GREEN87", "level": "GREEN", "number": 87, "title_zh": "香味", "title_en": "Fragrance", "cover": "/covers/GREEN87.jpg", "en_content": "Mom is making cakes today. The living room, the dining room, the study and the bedrooms were all “Knock! Knock! Knock!” someone was knocking the door. I opened the door. He said: “The fragrance from the cakes has drifted into our home.” He said: “Then, can the cakes be shared?”"}, {"id": "GREEN88", "level": "GREEN", "number": 88, "title_zh": "好吃的東西", "title_en": "Yummy stuff", "cover": "/covers/GREEN88.jpg", "en_content": "Why is the stuff which I think yummy is said unhealthy by the adults? I like to eat lollipops. The teachers say they cause cavities. I like to eat ice-creams. Grandma says they cause sore throats. I want         // State
        let currentFilter = 'all';
        let searchTerm = '';
        let filteredBooks = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderBooks();
            setupEventListeners();
        });

        // Setup Event Listeners
        function setupEventListeners() {
            // Search input
            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchTerm = e.target.value.toLowerCase();
                filterAndRender();
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    filterAndRender();
                });
            });

            // Close modal when clicking outside
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        }

        // Filter and Render
        function filterAndRender() {
            filteredBooks = BOOKS.filter(book => {
                // Apply level filter
                if (currentFilter !== 'all' && book.level !== currentFilter) {
                    return false;
                }

                // Apply search filter
                if (searchTerm) {
                    const titleZh = book.title_zh.toLowerCase();
                    const titleEn = book.title_en.toLowerCase();
                    const bookId = book.id.toLowerCase();
                    const content = book.en_content.toLowerCase();

                    return titleZh.includes(searchTerm) ||
                           titleEn.includes(searchTerm) ||
                           bookId.includes(searchTerm) ||
                           content.includes(searchTerm);
                }

                return true;
            });

            renderBooks();
        }

        // Render Books
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            if (filteredBooks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: #999;">No books found</div>';
                document.getElementById('resultCount').textContent = '0';
                return;
            }

            filteredBooks.forEach(book => {
                const card = createCard(book);
                grid.appendChild(card);
            });

            document.getElementById('resultCount').textContent = filteredBooks.length;
        }

        // Create Card
        function createCard(book) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(book);

            const levelClass = book.level.toLowerCase();
            const badgeText = `${book.level}${book.number}`;

            card.innerHTML = `
                <div class="card-cover">
                    <img src="${book.cover}" alt="${book.title_zh}" onerror="this.src='/covers/placeholder.png'">
                </div>
                <div class="card-color-bar ${levelClass}"></div>
                <div class="card-body">
                    <div class="card-badge ${levelClass}">${badgeText}</div>
                    <div class="card-title-zh">${book.title_zh}</div>
                    <div class="card-title-en">${book.title_en}</div>
                </div>
            `;

            return card;
        }

        // Open Modal
        function openModal(book) {
            const levelClass = book.level.toLowerCase();
            const badgeText = `${book.level}${book.number}`;

            document.getElementById('modalCover').src = book.cover;
            document.getElementById('modalCover').onerror = function() {
                this.src = '/covers/placeholder.png';
            };
            
            const badgeEl = document.getElementById('modalBadge');
            badgeEl.textContent = badgeText;
            badgeEl.className = `modal-badge ${levelClass}`;
            
            document.getElementById('modalTitle').textContent = book.title_zh;
            document.getElementById('modalSubtitle').textContent = book.title_en;
            document.getElementById('modalTranslation').textContent = book.en_content;

            document.getElementById('modal').classList.add('active');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>
</body>
