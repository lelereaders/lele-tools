<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樂樂翻譯查找器 | Le Le Translation Finder</title>
    <meta name="description" content="Can't read Chinese? Search by book name, number, or keyword to find the English translation instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #E74C3C;
            --yellow: #E8A317;
            --green: #27AE60;
            --brand: #4A90D9;
            --light-gray: #f5f5f5;
            --dark-gray: #333;
            --border-gray: #ddd;
        }

        body {
            font-family: 'Noto Sans TC', 'Noto Sans SC', sans-serif;
            background-color: #fff;
            color: var(--dark-gray);
            line-height: 1.6;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px 20px;
            background: #fff;
        }

        .header img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .header-text {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-text h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark-gray);
        }

        .header-text p {
            font-size: 1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Search Section */
        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-gray);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--brand);
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-gray);
            background: #fff;
            color: var(--dark-gray);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--brand);
            color: var(--brand);
        }

        .filter-btn.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }

        .filter-btn.red.active {
            background: var(--red);
            border-color: var(--red);
        }

        .filter-btn.yellow.active {
            background: var(--yellow);
            border-color: var(--yellow);
        }

        .filter-btn.green.active {
            background: var(--green);
            border-color: var(--green);
        }

        /* Search Count */
        .search-count {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        /* Card */
        .card {
            background: #fff;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .card-cover {
            width: 100%;
            aspect-ratio: 1;
            background: var(--light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #999;
            overflow: hidden;
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-color-bar {
            height: 4px;
            background: var(--red);
        }

        .card-color-bar.yellow {
            background: var(--yellow);
        }

        .card-color-bar.green {
            background: var(--green);
        }

        .card-body {
            padding: 12px;
        }

        .card-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 3px;
            margin-bottom: 8px;
            color: #fff;
            background: var(--red);
        }

        .card-badge.yellow {
            background: var(--yellow);
        }

        .card-badge.green {
            background: var(--green);
        }

        .card-title-zh {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--dark-gray);
            line-height: 1.3;
        }

        .card-title-en {
            font-size: 0.75rem;
            color: #999;
            font-weight: 400;
            line-height: 1.2;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--dark-gray);
        }

        .modal-cover {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 20px;
            aspect-ratio: 1;
            background: var(--light-gray);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            color: #fff;
            background: var(--red);
        }

        .modal-badge.yellow {
            background: var(--yellow);
        }

        .modal-badge.green {
            background: var(--green);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--dark-gray);
        }

        .modal-subtitle {
            font-size: 0.95rem;
            color: #999;
            margin-bottom: 20px;
        }

        .modal-translation {
            border-top: 1px solid var(--border-gray);
            padding-top: 20px;
        }

        .modal-translation-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-translation-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--dark-gray);
        }

        /* Footer */
        .footer {
            background: var(--light-gray);
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
        }

        .footer-links {
            margin-bottom: 20px;
        }

        .footer-links a {
            display: inline-block;
            margin: 0 15px;
            color: var(--brand);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--dark-gray);
        }

        .footer-copyright {
            font-size: 0.85rem;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .header-text h1 {
                font-size: 1.8rem;
            }

            .search-box {
                flex-direction: column;
            }

            .filter-buttons {
                justify-content: center;
            }

            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .header-text h1 {
                font-size: 1.4rem;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <img src="/covers/header-translate.png" alt="樂樂翻譯查找器">
        <div class="header-text">

            <p>Can't read Chinese? Search by book name, number, or keyword to find the English translation instantly.</p>

    <!-- Main Container -->

            <a href="https://www.youtube.com/@leleculture" target="_blank">YouTube</a>
        </div>
        <div class="footer-copyright">© 2026 樂樂文化 Le Le Culture</div>
    </div>

    <script>
var BOOKS=[{"id": "RED1", "level": "RED", "number": 1, "title_zh": "溜冰", "title_en": "Ice skating", "cover": "/covers/RED1.png", "en_content": "Left leg. Right leg. Moving forward. Turning around. Jumping up. Landing. Applaud!"}, {"id": "RED2", "level": "RED", "number": 2, "title_zh": "坐過山車", "title_en": "Roller coaster ride", "cover": "/covers/RED2.png", "en_content": "Getting on. Going up. Making a turn. Flipping upside down. Rushing down. Getting off. Fainting!"}, {"id": "RED3", "level": "RED", "number": 3, "title_zh": "玩滑板", "title_en": "Skateboarding", "cover": "/covers/RED3.png", "en_content": "A little child. Holding a skateboard. Standing on the skateboard. Falling off. Standing on it again. Falling off again. Lying on his tummy, rowing with his hands!"}, {"id": "RED4", "level": "RED", "number": 4, "title_zh": "收玩具", "title_en": "Putting away the toys", "cover": "/covers/RED4.png", "en_content": "A big car. A big airplane. A big dinosaur. A big doll. Finished putting away toys! Wa! Wa! Baby brother cried! Oops, sorry!"}, {"id": "RED5", "level": "RED", "number": 5, "title_zh": "機器人幫我", "title_en": "A robot helps me", "cover": "/covers/RED5.png", "en_content": "My robot. helps me put on my shoes, helps me put away toys, helps me study, helps me do my homework, helps me scold people. The robot is being scolded!"}, {"id": "RED6", "level": "RED", "number": 6, "title_zh": "玩什麼", "title_en": "What to play?", "cover": "/covers/RED6.png", "en_content": "No electricity. A shadow/ A shadow of a person. Who’s there? (picture: sound of knocking the door) A ghost? It’s Xiao Pang! (the nick name of a friend) “No electricity. What do we play?” “Playing hide and seek!” (picture: where is he hiding?)"}, {"id": "RED7", "level": "RED", "number": 7, "title_zh": "救火", "title_en": "Fire fighting", "cover": "/covers/RED7.png", "en_content": "Fire fighters. Putting on fireman suit. Putting on helmet. Sliding down. Getting on the fire engine, Ready to put out fire. It’s B.B.Q."}, {"id": "RED8", "level": "RED", "number": 8, "title_zh": "生日", "title_en": "Birthday", "cover": "/covers/RED8.png", "en_content": "Birthday cake. Candles. Good friends. Singing. Blowing out the candles. Cutting the cakes. I am six years old."}, {"id": "RED9", "level": "RED", "number": 9, "title_zh": "當媽媽", "title_en": "Being a mom", "cover": "/covers/RED9.png", "en_content": "Dad is being a horse. Being a bridge. Being a slide. Being a wheel. Being a monkey bar. Being an airplane. Dad is being a mom!"}, {"id": "RED10", "level": "RED", "number": 10, "title_zh": "誰在運動", "title_en": "Who is exercising?", "cover": "/covers/RED10.png", "en_content": "Exercising. Who’s swimming? Who’s running? Who’s skiing? Who’s playing ball? Who’s surfing? Who is not exercising?"}, {"id": "RED11", "level": "RED", "number": 11, "title_zh": "今天", "title_en": "Today", "cover": "/covers/RED11.png", "en_content": "Putting on clothes. Having a meal. Reading. Playing with toys. Watching TV. Riding a bike. Today is a holiday, feeling good!"}, {"id": "RED12", "level": "RED", "number": 12, "title_zh": "沖浪", "title_en": "Surfing", "cover": "/covers/RED12.png", "en_content": "Surfing! Surf board. Lying on his tummy on it. Hand paddling. Wave is coming. Standing on the board. My pants!"}, {"id": "RED13", "level": "RED", "number": 13, "title_zh": "停車", "title_en": "Stop the car", "cover": "/covers/RED13.png", "en_content": "It’s raining. Get in the car. Shut the door. Fasten the seatbelt. Drive the car. Stop the car. What’s wrong?"}, {"id": "RED14", "level": "RED", "number": 14, "title_zh": "比賽", "title_en": "A race", "cover": "/covers/RED14.png", "en_content": "Go! Running. Walking. Jumping. Crawling. Cycling. I am the first!"}, {"id": "RED15", "level": "RED", "number": 15, "title_zh": "藏起來", "title_en": "Hiding", "cover": "/covers/RED15.png", "en_content": "Little hands. Raise them. Stretch them out. Make a fist. Open them. Turn them over. Hide them."}, {"id": "RED16", "level": "RED", "number": 16, "title_zh": "怎麼了", "title_en": "What’s wrong?", "cover": "/covers/RED16.png", "en_content": "Howling. Yelling. Not eating. Kicking things. Throwing things. Ignoring people. Being angry!"}, {"id": "RED17", "level": "RED", "number": 17, "title_zh": "行不行", "title_en": "Is it OK?", "cover": "/covers/RED17.png", "en_content": "“I want to eat----” Mom says, “No!” “I want to jump----” Mom says, “No!” “I want to play----” Mom says, “No!” “I want to watch----” Mom says, “No!” “I want to climb----” Mom says, “No!” “I want to kick----” Mom says, “No!” “I want to go to----” Mom says, “OK!”"}, {"id": "RED18", "level": "RED", "number": 18, "title_zh": "去公園", "title_en": "Going to the park", "cover": "/covers/RED18.png", "en_content": "Going to the park. This is a swing. This is a slide. These are monkey bars. This is a sand pit. This is a see-saw. Thud! This is a big tree!"}, {"id": "RED19", "level": "RED", "number": 19, "title_zh": "小熊", "title_en": "The little bear", "cover": "/covers/RED19.png", "en_content": "Mom bear. Little bear follows mom bear. Little bear slips and falls. He tries to stand up. Little bear slips and falls again. He tries to climb up mom. Mom is so good!"}, {"id": "RED20", "level": "RED", "number": 20, "title_zh": "牠是誰", "title_en": "What is it?", "cover": "/covers/RED20.png", "en_content": "What is it? Is it a snake? Is it a wolf? Is it a leopard? Is it a lion? ah! It’s a tiger! Everyone runs away! (picture: run?)"}, {"id": "RED21", "level": "RED", "number": 21, "title_zh": "吃草的動物", "title_en": "Grass-eating animals", "cover": "/covers/RED21.png", "en_content": "Come and eat grass. Horses eat grass. Dogs do not eat grass. Ox eat grass. Tigers do not eat grass. Sheep eat grass, snakes do not eat grass. Do you eat grass?"}, {"id": "RED22", "level": "RED", "number": 22, "title_zh": "動物花紋", "title_en": "Animals with colored markings", "cover": "/covers/RED22.png", "en_content": "Cats with colored markings. (colored marking in Chinese is floral patterns) Dogs with colored markings. Deer with colored markings. Leopards with colored markings. Snakes with colored markings. Where are flowers? (colored markings in Chinese is floral patterns) No flowers. They are colored markings."}, {"id": "RED23", "level": "RED", "number": 23, "title_zh": "動物和泰山", "title_en": "Animals and Tarzan", "cover": "/covers/RED23.png", "en_content": "Little Tarzan. Hippos. Giraffes. Leopard. Lion. Crocodile. Daddy!"}, {"id": "RED24", "level": "RED", "number": 24, "title_zh": "動物拍照", "title_en": "Taking photos of animals", "cover": "/covers/RED24.png", "en_content": "A camera. Taking a photo of zebras. Taking a photo of rhinos. Taking a photo of hippos. Taking a photo of a black bear. The black bear goes back into the cave. Oh! She wants to take a photo with her babies."}, {"id": "RED25", "level": "RED", "number": 25, "title_zh": "爬樹的動物", "title_en": "Animals climb a tree", "cover": "/covers/RED25.png", "en_content": "A tree. Monkey climbs the tree. Squirrel climbs the tree. Koala climbs the tree. Leopard climbs the tree. Elephant comes along. Elephant uproots the tree."}, {"id": "RED26", "level": "RED", "number": 26, "title_zh": "魚和蝦", "title_en": "Fish and shrimps", "cover": "/covers/RED26.png", "en_content": "In the big ocean, There are small shrimps. The small fish eat the small shrimps. The big fish eat the small fish. The sharks eat the big fish. Here is the fish net. Who eats the fish and shrimps?"}, {"id": "RED27", "level": "RED", "number": 27, "title_zh": "烏鴉", "title_en": "The crows", "cover": "/covers/RED27.png", "en_content": "A farmer planted corn. The plants were getting bigger. The crows came to eat the corn. A scarecrow. The crows came along. The scarecrow caught a crow."}, {"id": "RED28", "level": "RED", "number": 28, "title_zh": "動物的叫聲", "title_en": "Animals sounds", "cover": "/covers/RED28.png", "en_content": "Birds tweeting, tweet, tweet, tweet (zhi zhi zhi in Chinese) Calves mooing, moo, moo, moo. (mou mou mou in Chinese) Lambs bleating, baa, baa, baa. (mie mie mie in Chinese) Ducklings quacking, quack, quack, quack. (ga ga ga in Chinese) Kittens meowing, meow, meow, meow. (miao miao miao in Chinese) Puppies barking, woof, woof, woof. (wang wang wang in Chinese) A snake came and they all stopped."}, {"id": "RED29", "level": "RED", "number": 29, "title_zh": "不一樣的動物", "title_en": "The unique animals", "cover": "/covers/RED29.png", "en_content": "A unique fish. A unique elephant. A unique frog. A unique zebra. A unique mouse. A unique fox. Which is the unique one?"}, {"id": "RED30", "level": "RED", "number": 30, "title_zh": "斑馬過河", "title_en": "The zebras crossed the river", "cover": "/covers/RED30.png", "en_content": "A river. The zebras were crossing the river. A big crocodile. chased after the zebras. He almost caught one zebra. The zebra jumped onto the river bank!"}, {"id": "RED31", "level": "RED", "number": 31, "title_zh": "動物在哪裏", "title_en": "Where are the animals?", "cover": "/covers/RED31.png", "en_content": "Where are the rabbits? Where are the little deer? Where are the little birds? Where are the monkeys? Where is the bear? Where are the foxes? Where is the hunter?"}, {"id": "RED32", "level": "RED", "number": 32, "title_zh": "動物變變變", "title_en": "Animals change", "cover": "/covers/RED32.png", "en_content": "Tadpoles change into frogs. Caterpillars. change into butterflies. Chicken eggs. change into chicks. Children change into dads? moms"}, {"id": "RED33", "level": "RED", "number": 33, "title_zh": "動物的蛋", "title_en": "Animals’ eggs", "cover": "/covers/RED33.png", "en_content": "This is a penguin’s egg. These are snake’s eggs. These are bird’s eggs. These are butterfly’s eggs. These are frog’s eggs. Whose eggs are these? These are mine chocolate eggs."}, {"id": "RED34", "level": "RED", "number": 34, "title_zh": "書", "title_en": "Books", "cover": "/covers/RED34.png", "en_content": "My classmates have-------- different shaped books, lift the flap books, touch and feel books, pop-up books many legs?", "cover": "/covers/RED85.png", "en_content": "Animals. Two legged animals. Four legged animals. Six legged animals. Eight legged animals. Ten legged animals. How many-legged animals are these?"}, {"id": "RED86", "level": "RED", "number": 86, "title_zh": "十五隻小鳥", "title_en": "Fifteen little birds", "cover": "/covers/RED86.png", "en_content": "One little bird. Two little birds. Three little birds. Four little birds. Five little birds. Fifteen little birds. No little birds!"}, {"id": "RED87", "level": "RED", "number": 87, "title_zh": "好多錢", "title_en": "Lots of money", "cover": "/covers/RED87.png", "en_content": "One cent. Two cents. Five cents. One dollar. Two dollars. Five dollars. Lots of money. Donate them!"}, {"id": "RED88", "level": "RED", "number": 88, "title_zh": "一星期", "title_en": "One week", "cover": "/covers/RED88.png", "en_content": "Monday. Tuesday. Wednesday. Thursday. Friday. Saturday. Sunday."}, {"id": "RED89", "level": "RED", "number": 89, "title_zh": "下雪", "title_en": "It’s snowing", "cover": "/covers/RED89.png", "en_content": "It’s winter. it’s snowing. A lot of snow. Foot prints. Whose? Open the door. Santa Claus!"}, {"id": "RED90", "level": "RED", "number": 90, "title_zh": "雲", "title_en": "The clouds", "cover": "/covers/RED90.png", "en_content": "Sunny days, there are white clouds. Cloudy days, there are grey clouds. Raining days, there are black clouds. There are no clouds on windy days"}, {"id": "RED91", "level": "RED", "number": 91, "title_zh": "閃電", "title_en": "The lightning", "cover": "/covers/RED91.png", "en_content": "It’s windy. It’s raining. It’s lightning. It’s thundering. It’s scary. The door opens. Dad comes home."}, {"id": "RED92", "level": "RED", "number": 92, "title_zh": "雨天", "title_en": "The rainy days", "cover": "/covers/RED92.png", "en_content": "The sunny days, go to swim. The cloudy days, go on a hike. The windy days, go to fly kites. The rainy days, play at home."}, {"id": "RED93", "level": "RED", "number": 93, "title_zh": "什麼顏色", "title_en": "What color is it?", "cover": "/covers/RED93.png", "en_content": "No color. Blue. Red. Green. Orange. Black. It’s colorful!"}, {"id": "RED94", "level": "RED", "number": 94, "title_zh": "果汁的顏色", "title_en": "The colored juice", "cover": "/covers/RED94.png", "en_content": "The red juice. Very sweet. The yellow juice. Very sour. The green juice. Not sour not sweet. Is it white juice? It’s soya milk"}, {"id": "RED95", "level": "RED", "number": 95, "title_zh": "顏色豆", "title_en": "The colored beans", "cover": "/covers/RED95.png", "en_content": "The white beans. The black beans. The red beans. The green beans. The yellow beans. The coffee beans. A picture made from the colored beans."}, {"id": "RED96", "level": "RED", "number": 96, "title_zh": "變顏色", "title_en": "Change colors", "cover": "/covers/RED96.png", "en_content": "Red. Yellow. Red plus yellow change into orange. Blue. Red plus blue change into purple. Yellow plus blue change into green. It’s colorful."}, {"id": "RED97", "level": "RED", "number": 97, "title_zh": "鞋子", "title_en": "Shoes", "cover": "/covers/RED97.png", "en_content": "Wearing sport shoes. Wearing water-proof boots. Wearing dancing shoes. Wearing ice-skating shoes. Wearing sandals. Wearing high-heeled shoes. Wearing shoes is very tiring."}, {"id": "RED98", "level": "RED", "number": 98, "title_zh": "毛線", "title_en": "Yarns", "cover": "/covers/RED98.png", "en_content": "Yarns. Knitting yarns. Knitting yarn-hat. Knitting yarn-scarf. Knitting yarn-vest. Knitting yarn-socks. The dog is not cold anymore!"}, {"id": "RED99", "level": "RED", "number": 99, "title_zh": "雨衣", "title_en": "The rain coat", "cover": "/covers/RED99.png", "en_content": "It’s raining. Wearing rain coat. Wearing rain boots. Wearing rain hat. The sun comes out. Take off all of them. It’s pouring down!"}, {"id": "RED100", "level": "RED", "number": 100, "title_zh": "衣服", "title_en": "The clothes", "cover": "/covers/RED100.png", "en_content": "The underwear. The underpants. The top. The skirt. The trousers. The socks. All the clothes got dirty"}, {"id": "YELLOW1", "level": "YELLOW", "number": 1, "title_zh": "忘了", "title_en": "Forgot", "cover": "/covers/YELLOW1.jpg", "en_content": "The day before yesterday I forgot to bring my football home. Yesterday I forgot to bring my jacket home. Today I forgot to bring my skateboard home. Mom got angry. Oh! No! Mom found she forgot our house keys. She said to me, “We can’t get into our home.” I took out my keys."}, {"id": "YELLOW2", "level": "YELLOW", "number": 2, "title_zh": "我沒空", "title_en": "I am not free.", "cover": "/covers/YELLOW2.jpg", "en_content": "The son said, “You promised to play football with me today.” The father said, “I am not free today.” The son said, “You promised to ride a bike with me today.” The father said, “I am not free today.” The son said, “You promised to skate with me today.” The father said, “I am not free today. You are supposed to practice The son said, “I am not free today.”"}, {"id": "YELLOW3", "level": "YELLOW", "number": 3, "title_zh": "找什麼", "title_en": "", "cover": "/covers/YELLOW3.jpg", "en_content": "What are you looking for? It is not on the desk. It’s not in the drawer. It’s not in my pocket.4 It’s not in my purse. I asked, “Mom, what are you looking for?” “My glasses!” she said. “It’s right on your head!” I said."}, {"id": "YELLOW4", "level": "YELLOW", "number": 4, "title_zh": "生病", "title_en": "", "cover": "/covers/YELLOW4.jpg", "en_content": "Being sick I was sick. Mom did not want me to go to school. She did not want me to do my homework. She wanted me to drink a lot of water. She let me sleep in her bed. She let me watch TV in bed. My younger sister said, “I want to be sick too!”"}, {"id": "YELLOW5", "level": "YELLOW", "number": 5, "title_zh": "拉吊床", "title_en": "Pulling the hammock", "cover": "/covers/YELLOW5.jpg", "en_content": "I climbed into the hammock. I lay down in it and felt great. My little brother came. He pulled the hammock with force. He said, “I want to lie inside too.” I said, “Stop pulling it. Stop pulling it!”. Thud! I fell off the hammock lying on the floor and my little brother lay"}, {"id": "YELLOW6", "level": "YELLOW", "number": 6, "title_zh": "下不來", "title_en": "Could not come down", "cover": "/covers/YELLOW6.jpg", "en_content": "Little cat, where are you? Little cat, lunch time! She was not in her bed. She was not on the balcony sunbathing. She was not in the yard catching mice. “Miao! Miao!” I heard the catty’s calling. Oh! She climbed up the tree but could not come down."}, {"id": "YELLOW7", "level": "YELLOW", "number": 7, "title_zh": "禮物在哪兒", "title_en": "", "cover": "/covers/YELLOW7.jpg", "en_content": "Where is my gift? Where is my birthday gift? Is it on the chair? Is it inside the school bag? Is it under the desk? Is it on the bed? Is it in mom’s hands? Ah ha, my gift is a bird."}, {"id": "YELLOW8", "level": "YELLOW", "number": 8, "title_zh": "夢到什麼", "title_en": "What did I dream of?", "cover": "/covers/YELLOW8.jpg", "en_content": "I put on my pajamas. I climbed on my bed. I opened my dinosaur story book. I was reading it. Then I fell asleep. I dreamed of the dinosaur saying, “It is snowing!” I opened the window. It really was snowing outside!"}, {"id": "YELLOW9", "level": "YELLOW", "number": 9, "title_zh": "我們很無聊", "title_en": "We are bored", "cover": "/covers/YELLOW9.jpg", "en_content": "The elder brother was bored. He looked at his computer. The younger brother was bored. He watched TV. Dad said, “You two cannot look at the computer and TV” “But, we are bored!” they said. Dad said, “You two come and help me wash the car!” “That is even more boring!” they said. “Why?” dad asked. “It’s raining. The rain will wash it. Why do we need to wash it?”"}, {"id": "YELLOW10", "level": "YELLOW", "number": 10, "title_zh": "做拼圖", "title_en": "Making puzzles", "cover": "/covers/YELLOW10.jpg", "en_content": "Take one beautiful picture. Paste it on a piece of cardboard. Turn it over and draw a grid with nine parts. Use the scissors to cut it. A nine-piece puzzle is done. I gave it to my younger sister to play with. She said, “I will make a 12-piece puzzle for you to play with.”"}, {"id": "YELLOW11", "level": "YELLOW", "number": 11, "title_zh": "我還是很愛你", "title_en": "I still love you", "cover": "/covers/YELLOW11.jpg", "en_content": "My puppy is a trouble maker. He loves to pee on the carpet. He loves to bite the sofa at home. He loves to drink the dirty water in the yard. He loves to dig in the grass. I said, “You are a very naughty puppy!” “But I still love you!”"}, {"id": "YELLOW12", "level": "YELLOW", "number": 12, "title_zh": "照顧寵物", "title_en": "Looking after a pet", "cover": "/covers/YELLOW12.jpg", "en_content": "The dog is my elder brother’s pet. Mom has to walk the dog. The turtle is my younger sister’s pet. The fish are my younger brother’s pets. Mom has to feed the turtle and the fish and change the water for them. Mom said, “How come I am looking after all your pets?” We said happily, “Because we are your pets!”"}, {"id": "YELLOW13", "level": "YELLOW", "number": 13, "title_zh": "你想住在哪裏", "title_en": "Where do you want to live?", "cover": "/covers/YELLOW13.jpg", "en_content": "I want to live in the Library. Whatever books I want to read, I can read. I want to live in a toy shop. Whatever toys I want to play with, I can play with. I want to live in a candy house. Whatever candies I want to eat, I can eat. I want to live in Mom’s pocket. Wherever she goes, I go too."}, {"id": "YELLOW14", "level": "YELLOW", "number": 14, "title_zh": "動物的船沉了", "title_en": "The animals’ boat was sinking", "cover": "/covers/YELLOW14.jpg", "en_content": "The boat was sinking. All the animals were jumping into the sea. They swam to an island and made the word “HELP” A helicopter saw the word “HELP”. But the helicopter flew away. After a while, the helicopter came back. All the animals were saved."}, {"id": "YELLOW15", "level": "YELLOW", "number": 15, "title_zh": "不是真的動物", "title_en": "Not real animals", "cover": "/covers/YELLOW15.jpg", "en_content": "One day I went to the park and saw---- Grandpa sitting on a bench with a kangaroo reading a book. Children kicking a ball with a little horse on the grass. Mom planting flowers with a rabbit. There was an owl sitting on a tree. He was waking up . I took another look at them one more time. Why weren’t they moving? Oh, they were statues. No wonder!"}, {"id": "YELLOW16", "level": "YELLOW", "number": 16, "title_zh": "動物的朋友", "title_en": "Animals’ friends", "cover": "/covers/YELLOW16.jpg", "en_content": "It’s good to have friends. The Siamese cat took the puppy to play on the roof. The white goose took the ducklings to swim in the pond. The rabbit took the frog to jump the rope on the grass. The bee took the butterfly to get honey in the flower garden. The ox took the little horse to eat grass on the farm. The eagle took me to the sky to see the beautiful world."}, {"id": "YELLOW17", "level": "YELLOW", "number": 17, "title_zh": "狗兒", "title_en": "The dogs", "cover": "/covers/YELLOW17.jpg", "en_content": "I leashed my dog and went for a walk with him. My dog ran forwards when he saw his good friend. I could only run after him towards his friend. So I ran forwards with him. His friend also ran towards him. The dog’s owner also ran towards us. We were not leading our dogs. Instead, we were being dragged by our So, the two dog owners became good friends too."}, {"id": "YELLOW18", "level": "YELLOW", "number": 18, "title_zh": "老鷹和兔子", "title_en": "The eagle and the hare", "cover": "/covers/YELLOW18.jpg", "en_content": "An eagle was flying in the sky. He saw a hare on the ground. He swooped towards the hare. The hare ran away in a flash. The eagle’s claws were almost on the hare. The smart hare suddenly made a turn. The eagle could not turn in time and was forced to fly up to the sky again."}, {"id": "YELLOW19", "level": "YELLOW", "number": 19, "title_zh": "好看的動物", "title_en": "Nice looking animals", "cover": "/covers/YELLOW19.jpg", "en_content": "Color animal pictures. Add some patterns. Starfish. Add a pattern of dots. Sea horses. Add a pattern of lines. Dolphins. Add a pattern of diamonds. Octopuses. Add a pattern of spirals. Sea turtles. Add a pattern of flowers. The animals with patterns look even prettier."}, {"id": "YELLOW20", "level": "YELLOW", "number": 20, "title_zh": "會飛的動物", "title_en": "Flying animals", "cover": "/covers/YELLOW20.jpg", "en_content": "With a broom, the witch can fly. With a flying carpet, Aladdin can fly. With a cape, Superman can fly. With a spider silk thread, Spiderman can fly. With a parachute, people can fly. The little monkey also wants to fly---- With his good friend the parrot, the little monkey could fly."}, {"id": "YELLOW21", "level": "YELLOW", "number": 21, "title_zh": "什麼動物最棒", "title_en": "Who is the most powerful animal?", "cover": "/covers/YELLOW21.jpg", "en_content": "Many animals under the tree were arguing about who is the most powerful The leopard said he runs the fastest and should be the most powerful animal. The mole said he digs the fastest and should be the most powerful animal. The monkey said he climbs trees the fastest and should be the most powerful A net was thrown down from the tree. The hunter said, “I am the most powerful animal.”"}, {"id": "YELLOW22", "level": "YELLOW", "number": 22, "title_zh": "說話的魚", "title_en": "The fish that talks", "cover": "/covers/YELLOW22.jpg", "en_content": "The fish that eats people is the shark. The fish that sprays water is the whale. The fish that generates electricity is the electric eel. The fish that cleans is the clown anemonefish. The fish that shines is the candlelight fish. The fish that swims home is the salmon. The fish that talks is the Mermaid."}, {"id": "YELLOW23", "level": "YELLOW", "number": 23, "title_zh": "動物的腳印", "title_en": "Animal Footprints", "cover": "/covers/YELLOW23.png", "en_content": "There are big footprints on the ground. “They are not mine. Mine look like leaves,” said the ducklings. “They are not mine. Mine look like flowers,” said the little dogs. “Then, whose footprints are they?” They were thinking------- “They are mine,” said the big bear. “It’s Big Bear. Quickly, run!” said the little animals. ” Don’t run! Come in and have some honey!” said the big bear."}, {"id": "YELLOW24", "level": "YELLOW", "number": 24, "title_zh": "貓兒在哪裏", "title_en": "Where is the cat?", "cover": "/covers/YELLOW24.jpg", "en_content": "This is my cat. Her name is Little Moon. One day she was gone! Was she on the tree? Was she in the cave? Where was she? “Miao!” She had become a Mom!"}, {"id": "YELLOW25", "level": "YELLOW", "number": 25, "title_zh": "動物寶寶", "title_en": "Animal babies", "cover": "/covers/YELLOW25.jpg", "en_content": "Mommy bird was sitting in her nest. The dragonfly flew over to have a look! The tree frog jumped over to have a look! The squirrel crawled over to have a look! The kid stretched out his head to have a look! Daddy bird came home! Ah! All my babies have hatched."}, {"id": "YELLOW26", "level": "YELLOW", "number": 26, "title_zh": "魚鷹", "title_en": "The fish hawk", "cover": "/covers/YELLOW26.jpg", "en_content": "A fish hawk was sitting on a tree. He opened his wings and flew to the sea. He flew into the sea. He flew out of the sea again. His claws were holding a fish. He flew to the seashore to eat the fish. The fish hawk is a hawk that eats fish"}, {"id": "YELLOW27", "level": "YELLOW", "number": 27, "title_zh": "小鴨", "title_en": "The duckling", "cover": "/covers/YELLOW27.jpg", "en_content": "An eagle was coming to catch the chicks. All the chicks hid under hen’s wings. All the ducklings hid under mother duck’s wings. The eagle flew away. Mommy duck was sobbing and said, “One duckling is gone!” She thought that the duckling had been taken by the eagle. “She is here!” said the hen."}, {"id": "YELLOW28", "level": "YELLOW", "number": 28, "title_zh": "剪紙", "title_en": "Paper cutting", "cover": "/covers/YELLOW28.jpg", "en_content": "Take one piece of square white paper. Fold it in half to be a triangle. Draw a dot in the middle of the long side. Fold the right corner upwards. Fold the left corner upwards. Draw a tree trunk and branches in the middle of the folded paper. Cut it out. Open it. It has become a snowflake!"}, {"id": "YELLOW29", "level": "YELLOW", "number": 29, "title_zh": "比賽", "title_en": "A race", "cover": "/covers/YELLOW29.jpg", "en_content": "On your marks. Get set. Go! Run! Go! Animals Go! Get to the finishing line! The first, second and third. The little turtle and snail were still crawling. They were saying, “How come they don’t race whoever is the slowest?”"}, {"id": "YELLOW30", "level": "YELLOW", "number": 30, "title_zh": "橡皮", "title_en": "The erasers", "cover": "/covers/YELLOW30.jpg", "en_content": "My younger brother opened my school bag. He took out my pencil box. He opened my pencil box. There were erasers in my pencil box. He smelt the erasers and said, “They smell good!” He put the erasers into his mouth. Oh! No! My dear younger brother, the erasers are not candies."}, {"id": "YELLOW31", "level": "YELLOW", "number": 31, "title_zh": "摺紙 Paper folding", "title_en": "Paper folding", "cover": "/covers/YELLOW31.jpg", "en_content": "Fold a square paper into half. It becomes a triangle. Fold two pointy corners downwards. They become the two ears. Then, draw two eyes. Draw a small nose too. It turns into a cute little dog."}, {"id": "YELLOW32", "level": "YELLOW", "number": 32, "title_zh": "少了什麼", "title_en": "What’s missing?", "cover": "/covers/YELLOW32.jpg", "en_content": "Cannot fly the kite. What’s missing? Cannot ride the bike. What’s missing? Cannot drive the car. What’s missing? Cannot play in the sandpit. What’s missing? Cannot bounce the ball. What’s missing? Cannot turn the windmill. What’s missing? I cannot see clearly. What’s missing?"}, {"id": "YELLOW33", "level": "YELLOW", "number": 33, "title_zh": "剪剪貼貼", "title_en": "Cut and paste", "cover": "/covers/YELLOW33.jpg", "en_content": "Cut an oval shape from a sheet of black paper. Cut a heart shape from a sheet of white paper and paste it on the upper Cut a circle from the white paper and paste it on the lower part of the Draw two small eyes on the white heart shape. Cut three small and two big triangles from the black paper. Lastly, cut two more small rectangles and paste them all on. Does it look like a penguin? You can try to cut and paste one too!"}, {"id": "YELLOW34", "level": "YELLOW", "number": 34, "title_zh": "帶寶貝到學校", "title_en": "Bring your treasure to school", "cover": "/covers/YELLOW34.jpg", "en_content": "The teacher asked us to bring our treasure to school. Some brought their pets. Some brought their portable game players. Some brought their stickers. Some brought their favorite stuffed toys. The teacher asked me, “Where is your treasure?” I said, “She is coming!” My baby sister was crawling to us. Lastly, cut two more small rectangles and paste them all on. Does it look like a penguin? You can try to cut and paste one too!"}, {"id": "YELLOW35", "level": "YELLOW", "number": 35, "title_zh": "新書包", "title_en": "A New School Bag", "cover": "/covers/YELLOW35.jpg", "en_content": "Mom gave the younger brother a new school bag. The younger brother said, “A new school bag needs a pencil box inside.” He got the pencil box and said, “The pencil box needs some pencils inside.” He got the pencils and said, “The pencils need some paper to draw a He got the paper and said, “The picture needs some colored pencils to He got the colored pencils and said-------- “Mom, this picture is for you.”"}, {"id": "YELLOW36", "level": "YELLOW", "number": 36, "title_zh": "破了", "title_en": "It’s broken", "cover": "/covers/YELLOW36.jpg", "en_content": "A little ping pong ball A round ping pong bat A square ping pong table A long ping pong net I hit the ping pong ball hard. The ball bounced very high and then dropped quickly, Crack! The ball was broken!"}, {"id": "YELLOW37", "level": "YELLOW", "number": 37, "title_zh": "不一樣", "title_en": "Different", "cover": "/covers/YELLOW37.jpg", "en_content": "The hair clips on the left side and the right side are different, The earrings on the left ear and the right ear are different, The nail polish color on the left hand fingers and the right hand fingers The socks on the left foot and the right foot are different, The shoes on the left foot and the right foot are different. Mom said, “Things on your left side and right side are different!” Elder sister said, “It looks pretty when the two sides are different!”"}, {"id": "YELLOW38", "level": "YELLOW", "number": 38, "title_zh": "甜蜜蜜", "title_en": "So sweet", "cover": "/covers/YELLOW38.jpg", "en_content": "A little black rat was looking for a friend. He saw---- a small dog looking fierce, a small cat looking lazy, a small duck looking dirty, a small pig looking stinky, and a small white rat looking smiley. The two rats looked so sweet clinging to each other."}, {"id": "YELLOW39", "level": "YELLOW", "number": 39, "title_zh": "還是好朋友", "title_en": "Still close friends", "cover": "/covers/YELLOW39.jpg", "en_content": "The little horse eats less, the little pig eats more. The little horse runs fast, the little pig runs slowly. The little horse is tall, the little pig is short. The little horse and the little pig are still close friends."}, {"id": "YELLOW40", "level": "YELLOW", "number": 40, "title_zh": "不見了", "title_en": "Disappeared", "cover": "/covers/YELLOW40.jpg", "en_content": "a small island the clear ocean water the white seagulls the cool ocean wind the layers of ocean waves here comes the huge tsunami The island has disappeared!"}, {"id": "YELLOW41", "level": "YELLOW", "number": 41, "title_zh": "一堆什麼", "title_en": "A pile of what?", "cover": "/covers/YELLOW41.jpg", "en_content": "A hen is going to lay eggs. She is trying to find ----- a pile of stones, too hard a pile of mud, too dirty a pile of sand, too soft a pile of tree branches, too spiky a pile of hay, just right! The hen is laying her eggs!"}, {"id": "YELLOW42", "level": "YELLOW", "number": 42, "title_zh": "撞到了", "title_en": "Bumped into something", "cover": "/covers/YELLOW42.jpg", "en_content": "The speedboat was getting started, It passed by a park, It went around an island, It went under a big bridge, It flew over a rock, It dodged a whale, Bang! It bumped into the pier!"}, {"id": "YELLOW43", "level": "YELLOW", "number": 43, "title_zh": "知道和不知道", "title_en": "Knowing 、not knowing", "cover": "/covers/YELLOW43.jpg", "en_content": "I really want to know------- How many stars are there in the sky? How much sand is there on the beach? How many fish are there in the sea? How many stones are there on the ground? All the adults said, “I don’t know.” I really want to know “How come adults don’t know?”"}, {"id": "YELLOW44", "level": "YELLOW", "number": 44, "title_zh": "真假恐龍", "title_en": "Real and fake dinosaurs", "cover": "/covers/YELLOW44.jpg", "en_content": "An An has many toy dinosaurs. Wen Wen said, “There are no dinosaurs now.” An An said, “There were many dinosaurs before” Wen Wen said, “I am scared of dinosaurs.” An An said, “I like dinosaurs.” Wen Wen said, “What you like are dinosaur toys. They are not real.” An An said, “What you are scared of are not real dinosaurs. They are"}, {"id": "YELLOW45", "level": "YELLOW", "number": 45, "title_zh": "我是美美", "title_en": "I am Mei Mei", "cover": "/covers/YELLOW45.jpg", "en_content": "Mei Mei is a girl. Grandpa always kisses her. Grandma always hugs her. Dad always plays with her. Mom always reads with her. She said, “Everyone loves me. Whom do I love?” She touched Mom’s big belly and said, “I love my younger brother!”"}, {"id": "YELLOW46", "level": "YELLOW", "number": 46, "title_zh": "不是雙胞胎", "title_en": "Not twins", "cover": "/covers/YELLOW46.jpg", "en_content": "We look the same. Wear the same clothes. Carry the same school bag. Go to the same school. Have the same parents. We are not twins. We are triplets."}, {"id": "YELLOW47", "level": "YELLOW", "number": 47, "title_zh": "老大老二", "title_en": "The eldest one and the second eldest one", "cover": "/covers/YELLOW47.jpg", "en_content": "The younger sister said, “Why do I always have to wear my elder sister’s old The elder sister said, “That’s because I am growing up and you are younger The younger sister said, “I don’t want to be the second eldest. I want to be the The elder sister said, “Why did Dad always carry my younger sister?” The younger sister said, “That’s because you are growing up and I am younger The elder sister said, “I don’t want to be the eldest. I want to be the second The younger sister said, “Then you will have to wear the old clothes!”"}, {"id": "YELLOW48", "level": "YELLOW", "number": 48, "title_zh": "抱妹妹", "title_en": "Hugging my younger sister", "cover": "/covers/YELLOW48.jpg", "en_content": "My younger sister likes to hug many things. The doll on the bed, she hugs it. The cushion on the chair, she hugs it. The dog on the floor, she hugs it. The cat on the window sills, she hugs it. The big tree in front of the door, she hugs it. When I come home, she wants me to hug her!"}, {"id": "YELLOW49", "level": "YELLOW", "number": 49, "title_zh": "我也很好", "title_en": "I am good too", "cover": "/covers/YELLOW49.jpg", "en_content": "My elder brother studies very well. My elder sister dances very well. My younger brother swims very well. My younger sister skates very well. What do I do very well? Our dog jumps on me and licks me. I look after our dog very well. I am good too!"}, {"id": "YELLOW50", "level": "YELLOW", "number": 50, "title_zh": "全家人", "title_en": "The whole family", "cover": "/covers/YELLOW50.jpg", "en_content": "The younger brother is playing with toys. The younger sister is dancing. The elder sister is doing homework. The elder brother is kicking a ball. Mom and Dad are watching TV. Grandpa and Grandma are reading newspapers. The whole family is having a meal together!"}, {"id": "YELLOW51", "level": "YELLOW", "number": 51, "title_zh": "我的家", "title_en": "My home", "cover": "/covers/YELLOW51.jpg", "en_content": "The little bear said, “I need a home.” The little fish said, “Come to my home.” The little bear said, “But I can’t swim.” The snail said, “Come to my home.” The little bear said, “I am too big!” The little bird said, “Come to my home.” The little bear said, “I---“ The little bear saw a cave and said:” Ah! My home!”"}, {"id": "YELLOW52", "level": "YELLOW", "number": 52, "title_zh": "騎在我身上", "title_en": "Ride on me", "cover": "/covers/YELLOW52.jpg", "en_content": "I am a dog. My owner is a two-year old boy named Xiao Xiao (a Chinese nickname). He loves to pull my ears. He loves to bite my tail. He loves to slap my bottom. He also likes to ride on me."}, {"id": "YELLOW53", "level": "YELLOW", "number": 53, "title_zh": "畫龍", "title_en": "To draw a dragon", "cover": "/covers/YELLOW53.jpg", "en_content": "Draw a horse face, a tiger’s eyes, a lion’s nose, a deer’s horns, an ox’s ears, a snake’s body, an eagles’ claws. Does it look like a dragon?"}, {"id": "YELLOW54", "level": "YELLOW", "number": 54, "title_zh": "用耳朵聽", "title_en": "To listen with your ears", "cover": "/covers/YELLOW54.jpg", "en_content": "There was a sound nearby. The rabbit remained still. He listened with his ears. There was a smell nearby. The rabbit remained still. He smelt with his nose. There was an animal nearby. The rabbit remained still. He watched with his eyes. Oh, No. It was a lion. Run! Quickly run!"}, {"id": "YELLOW55", "level": "YELLOW", "number": 55, "title_zh": "畫小鳥", "title_en": "To draw a bird", "cover": "/covers/YELLOW55.jpg", "en_content": "Draw a big body first. Then draw a head. Draw two little eyes on the head. Add a small mouth. Draw a tail joining the body. Add two wings, one on each side of the body. It has turned into a bird. Flying away! Bye Bye!"}, {"id": "YELLOW56", "level": "YELLOW", "number": 56, "title_zh": "動物們吃東西", "title_en": "The animals eat food", "cover": "/covers/YELLOW56.jpg", "en_content": "The rabbit saw the carrots and said, “Carrots again!” The mouse saw the cheese and said, “Cheese again!” The frog saw the worms and said, “Worms again!” The little chick saw the rice and said, “Rice again!” The cat saw the fish and said, “Fish again!” All the animals said, “Let’s swap!” “Oh, No, it tastes really terrible!” all the animals yelled"}, {"id": "YELLOW57", "level": "YELLOW", "number": 57, "title_zh": "小鱷魚吃東西", "title_en": "The Little crocodile eats food", "cover": "/covers/YELLOW57.jpg", "en_content": "The little crocodile saw a lot of food. He ate potato chips. They were crunchy. He ate hamburgers. They were soft. He ate some ice creams. They were icy cold. He drank a soft drink. It was sweet. He saw many forks. The little crocodile could not eat anything anymore."}, {"id": "YELLOW58", "level": "YELLOW", "number": 58, "title_zh": "做餅乾", "title_en": "To make cookies", "cover": "/covers/YELLOW58.jpg", "en_content": "Flour. Make a hole in the middle. Eggs. Put them in the hole. Butter. Put it in the hole. Milk. Pour it into the hole. Sugar. Pour it into the hole. Then, begin to knead the dough and use the cutter to make a cookie shape. The cookies are well-baked. They smell really good."}, {"id": "YELLOW59", "level": "YELLOW", "number": 59, "title_zh": "甜餅乾", "title_en": "Cookies", "cover": "/covers/YELLOW59.jpg", "en_content": "My younger brother loves cookies. Mom doesn’t like my younger brother to eat too many cookies. My younger brother often sneaked cookies to eat. Mom got angry and hid the cookies. My younger brother did it again. He was afraid that mom would find out He left a note to mom. “I only ate one!”"}, {"id": "YELLOW60", "level": "YELLOW", "number": 60, "title_zh": "新鮮的水果", "title_en": "Fresh fruits", "cover": "/covers/YELLOW60.jpg", "en_content": "Apples, made into an apple pie. Pineapples, made into pineapple cakes. Bananas, made into a banana cake. Mangos, made into mango pudding. Grapes, made into grape ice-lolly. Strawberries, made into strawberry ice cream. Fruits, I think the fresh ones taste the best."}, {"id": "YELLOW61", "level": "YELLOW", "number": 61, "title_zh": "剩下的食物", "title_en": "Leftovers", "cover": "/covers/YELLOW61.jpg", "en_content": "Leftover rice. Leftover meat. Leftover vegetables. Put them all into a wok. Add a bit of oil and fry it. The fried rice smelt good and was ready to eat. Fried rice was all eaten up. Not even a bit of rice was left."}, {"id": "YELLOW62", "level": "YELLOW", "number": 62, "title_zh": "蔥油餅", "title_en": "Green onion pancakes", "cover": "/covers/YELLOW62.jpg", "en_content": "Put the flour into a big bowl. Add a bit of water, then use chopsticks to stir it up. Use your hands to knead the dough. Use a rolling pin to flatten the dough. Put the chopped green onions, oil and salt on top of it. Use your hands to roll it up and press it flat. Then roll it out again. Use the oil to fry it. Then the green onion pancake is done"}, {"id": "YELLOW63", "level": "YELLOW", "number": 63, "title_zh": "大水", "title_en": "The flood", "cover": "/covers/YELLOW63.jpg", "en_content": "It was flooding. There was a baby in the basin. There were a few monkeys on the big tree. They lifted up the basin. They touched the baby in the basin. The flood subsided. The monkeys took the baby home."}, {"id": "YELLOW64", "level": "YELLOW", "number": 64, "title_zh": "沒有下雨", "title_en": "No rain", "cover": "/covers/YELLOW64.jpg", "en_content": "There had been no rain for a long time. The earth cracked. The rice paddies died. The trees withered. The pond dried up. The faucet had no water. A horrible drought is coming."}, {"id": "YELLOW65", "level": "YELLOW", "number": 65, "title_zh": "堅果", "title_en": "A nut", "cover": "/covers/YELLOW65.jpg", "en_content": "A squirrel found a nut. He dug a hole on the ground. He put the nut into the hole. Then he buried the nut. Winter came. The squirrel could not find his nut. Spring came. A sprout came out from the earth. The squirrel stared at the little plant and thought, “I wonder who planted"}, {"id": "YELLOW66", "level": "YELLOW", "number": 66, "title_zh": "寶石", "title_en": "A diamond", "cover": "/covers/YELLOW66.jpg", "en_content": "It snowed heavily. The tree branches were covered in snow. A little green bird was hiding in the branches. I opened the window to let the little green bird in. The snow stopped. The sun came out. I opened the window to let the little green bird out. ” Knock! Knock!” It was the little green bird knocking the window. I opened the window. Wah! There was a diamond!"}, {"id": "YELLOW67", "level": "YELLOW", "number": 67, "title_zh": "鳥蛋", "title_en": "The bird’s eggs", "cover": "/covers/YELLOW67.jpg", "en_content": "There was a mountain. There was a tree on the mountain. There was a bird nest on the tree. There were bird’s eggs in the nest. A snake crawled up to the tree. The snake saw the eggs and wanted to eat them. “Ouch! It hurts!” The snake fell down from the tree."}, {"id": "YELLOW68", "level": "YELLOW", "number": 68, "title_zh": "植物", "title_en": "A plant", "cover": "/covers/YELLOW68.jpg", "en_content": "My aunt gave me a plant. I put it on the top of the piano. I played the piano for the plant to listen to every day. New leaves grew from the plant. New buds grew from the plant too. The flowers blossomed one by one. My aunt said, “I’ve got it. The plant loves music too!”"}, {"id": "YELLOW69", "level": "YELLOW", "number": 69, "title_zh": "星球", "title_en": "The planets", "cover": "/covers/YELLOW69.jpg", "en_content": "This planet is bare. No trees. This planet is flat. No mountains. This planet is dry. No water. This planet is dark. No light. This planet is stinky. No air. This planet is sandy. No rocks. This planet has everything. It is the earth."}, {"id": "YELLOW70", "level": "YELLOW", "number": 70, "title_zh": "彩虹", "title_en": "The rainbows", "cover": "/covers/YELLOW70.jpg", "en_content": "Listen, Hua! Hua! Hua! What sound was that? It’s a waterfall. What a big waterfall! Look! Over there, there is a rainbow! Look! There’s another rainbow over there. Eh! The rainbows disappeared. “It doesn’t matter. I will make a rainbow when we go home,” Dad said."}, {"id": "YELLOW71", "level": "YELLOW", "number": 71, "title_zh": "數數看", "title_en": "Let’s count", "cover": "/covers/YELLOW71.jpg", "en_content": "Let’s count. How many snakes are there? Four Let’s count. How many caterpillars are there? Five Let’s count. How many ants are there? Six Let’s count. How many fireflies are there? Seven Let’s count. How many spiders are there? Eight Let’s count. How many tadpoles are there? Nine Let’s count. How many ladybugs are there? Ten"}, {"id": "YELLOW72", "level": "YELLOW", "number": 72, "title_zh": "二四六八十", "title_en": "Two four six eight ten", "cover": "/covers/YELLOW72.jpg", "en_content": "He has a very big body, two very little heads, four round mouths, six square eyes, eight very long arms, and ten very short legs. He is a monster!"}, {"id": "YELLOW73", "level": "YELLOW", "number": 73, "title_zh": "多少", "title_en": "How many?", "cover": "/covers/YELLOW73.jpg", "en_content": "It’s a birthday celebration. There are gifts, cakes and candles. How many gifts do you have? Not many not few. How many cupcakes do you have? One for each of us. Just right. How many candles do you have? Six for six years old. Not even one less."}, {"id": "YELLOW74", "level": "YELLOW", "number": 74, "title_zh": "第一第二第三", "title_en": "The first, second and third", "cover": "/covers/YELLOW74.jpg", "en_content": "Every child folded his own paper airplane. 1, 2, 3. Every one threw their airplane. Mine was the furthest. The first. Yours was the second furthest. The second. His was the third furthest. The third. Xiao Pang’s airplane flew back and forth. Xiao Pang’s airplane was the best."}, {"id": "YELLOW75", "level": "YELLOW", "number": 75, "title_zh": "第四", "title_en": "The fourth one", "cover": "/covers/YELLOW75.jpg", "en_content": "The first pancake flipped over. It fell on the ground. The dog ate it. The second pancake flipped over. It fell on the window sill. The cat licked it. The third pancake flipped over. Where did it go? The fourth pancake flipped over. I got it."}, {"id": "YELLOW76", "level": "YELLOW", "number": 76, "title_zh": "一二三四五六七", "title_en": "1234567", "cover": "/covers/YELLOW76.jpg", "en_content": "One big pig fell down. Two big bumps were on his head. Three legs were broken. Four bears carried him. Five doctors came over. Six little pigs visited him. Seven stars were his companions!"}, {"id": "YELLOW77", "level": "YELLOW", "number": 77, "title_zh": "四季", "title_en": "The four seasons", "cover": "/covers/YELLOW77.jpg", "en_content": "There are four seasons in a year. Spring, summer, autumn, winter. Singapore does not have four seasons. All year around is summer in Singapore. I want to go there. Why? All year round is the summer holiday. I don’t need to go to school."}, {"id": "YELLOW78", "level": "YELLOW", "number": 78, "title_zh": "天氣", "title_en": "The weather", "cover": "/covers/YELLOW78.jpg", "en_content": "Monday, it’s a sunny day. Tuesday, it’s a cloudy day. Wednesday, it’s a rainy day. Thursday, there is hail. Friday, there is heavy fog. Saturday, there is a strong wind. Sunday, there is a sand storm."}, {"id": "YELLOW79", "level": "YELLOW", "number": 79, "title_zh": "冬天和春天", "title_en": "Winter and spring", "cover": "/covers/YELLOW79.jpg", "en_content": "Winter has come. Have all the leaves turned black? Ah, there are black birds sitting on the tree. The trees are bare in the winter. Spring has come. Are those green birds sitting on the tree? Ah, spring has come and many green leaves have grown on the tree."}, {"id": "YELLOW80", "level": "YELLOW", "number": 80, "title_zh": "颱風", "title_en": "Typhoon", "cover": "/covers/YELLOW80.jpg", "en_content": "It’s raining heavily. The wind’s blowing wildly. The big tree has fallen down. The house is tilting. The car has turned over. A typhoon has come. Ah! It turns out they’re making a movie"}, {"id": "YELLOW81", "level": "YELLOW", "number": 81, "title_zh": "晴天", "title_en": "Sunny day", "cover": "/covers/YELLOW81.jpg", "en_content": "Dear Grandpa Sun, Where have you been? I don’t like rainy days. I don’t like cloudy days either. I like sunny days. Would you please come out soon? Missing you, Xiao Pang (a Chinese nickname for a chubby boy)"}, {"id": "YELLOW82", "level": "YELLOW", "number": 82, "title_zh": "很酷的顏色", "title_en": "Cool colors", "cover": "/covers/YELLOW82.jpg", "en_content": "Wearing a blue hat, Wearing black glasses, Wearing a red top, Wearing green pants, Eating an orange lollipop, Wearing purple shoes, Playing with a yellow skateboard. I look cool!"}, {"id": "YELLOW83", "level": "YELLOW", "number": 83, "title_zh": "彩虹衣", "title_en": "The rainbow clothes", "cover": "/covers/YELLOW83.jpg", "en_content": "Mom was going to wash clothes. Younger brother’s red hat, Dad’s blue trousers, Elder sister’s yellow skirt, Younger sister’s orange top, Elder brother’s purple socks, The washing was done. Look at our rainbow clothes!"}, {"id": "YELLOW84", "level": "YELLOW", "number": 84, "title_zh": "顏色變了", "title_en": "Changing colors", "cover": "/covers/YELLOW84.jpg", "en_content": "There is a chameleon in the forest. He ate a red apple. He ate orange oranges. He ate yellow bananas. He ate purple grapes. He ate green leaves. Wah! The chameleon disappeared."}, {"id": "YELLOW85", "level": "YELLOW", "number": 85, "title_zh": "彩虹糖果屋", "title_en": "The colorful candy house", "cover": "/covers/YELLOW85.jpg", "en_content": "One yellow star, One green wand, Walking through a blue door, Seeing a red chest, Picking up the white key, Putting on black clothes, Abracadabra, change! There appeared a colorful candy house!"}, {"id": "YELLOW86", "level": "YELLOW", "number": 86, "title_zh": "拐杖和帽子", "title_en": "The cane and the hat", "cover": "/covers/YELLOW86.jpg", "en_content": "Grandpa wanted to go out. I helped him put on his shoes and tie his shoe laces. I helped him get the cane and the hat. I helped him open the door. He said, ”I don’t want to go out!” I helped him put away the cane and the hat. I helped him untie shoelaces and take off the shoes. He stood up and said again, “I want to go out!”"}, {"id": "YELLOW87", "level": "YELLOW", "number": 87, "title_zh": "女孩子的衣物", "title_en": "Girls’ clothes", "cover": "/covers/YELLOW87.jpg", "en_content": "I am a boy. I have an elder sister. Today I wore her long skirt. I wore her high hill shoes. I wore her lipstick. I carried her purse. Mom said, “You are a girl now.” I said, “Elder sister said she will only play with girls today.”"}, {"id": "YELLOW88", "level": "YELLOW", "number": 88, "title_zh": "一層一層衣服", "title_en": "Layers of clothes", "cover": "/covers/YELLOW88.jpg", "en_content": "Today is very cold. I put on my underwear. I put on a long sleeve shirt. I put on a sweater too. I put on a coat outside. I put on an extra windbreaker. This is called wearing clothes like an onion, layer upon layer"}, {"id": "YELLOW89", "level": "YELLOW", "number": 89, "title_zh": "姐姐穿衣服", "title_en": "Elder sister gets dressed", "cover": "/covers/YELLOW89.jpg", "en_content": "This top is too long. I will change into another one. This skirt is too short. I will change into another one. This pair of socks is too colorful. I will change into another pair. This pair of shoes is too old. I will change into another pair. This coat just fits. Elder sister looked at herself in the mirror and said, “I look really pretty.” Mom came and said, “Today is a school day. You have to put on your"}, {"id": "YELLOW90", "level": "YELLOW", "number": 90, "title_zh": "害怕", "title_en": "Frightened", "cover": "/covers/YELLOW90.jpg", "en_content": "Where did you hide when you were frightened? I hid under the quilt. Where did you hide when you were upset? I hid in the bathroom. Where did you hide when you were shy? I hid in mom’s bosom. When my younger sister was shy I let her hide in my bosom."}, {"id": "YELLOW91", "level": "YELLOW", "number": 91, "title_zh": "笑臉", "title_en": "A happy face", "cover": "/covers/YELLOW91.jpg", "en_content": "Halloween came. The elder brother wore a ghost mask. The younger sister was frightened. The elder sister painted her face like a cat. The little dog was surprised. The younger brother painted his face messy. All of us had a happy face."}, {"id": "YELLOW92", "level": "YELLOW", "number": 92, "title_zh": "節日", "title_en": "Festivals (1)", "cover": "/covers/YELLOW92.jpg", "en_content": "The Lantern Festival. We appreciate different lanterns. The Dragon Boat Festival. We watch the Dragon Boat Race. The Moon Festival. We hold different lanterns. The Chinese New Year. We get Red Packets."}, {"id": "YELLOW93", "level": "YELLOW", "number": 93, "title_zh": "節日 (2)", "title_en": "Festivals (2)", "cover": "/covers/YELLOW93.jpg", "en_content": "The Lantern Festival. We eat round dumplings. The Dragon Boat Festival. We eat sticky rice dumplings. The Moon Festival. We eat moon cakes. The Chinese New Year. We eat sticky rice cakes."}, {"id": "YELLOW94", "level": "YELLOW", "number": 94, "title_zh": "醫生", "title_en": "Doctor", "cover": "/covers/YELLOW94.jpg", "en_content": "Doctor, I am sick. Doctor, my head is aching. Doctor, my throat is sore. Doctor, my ears are painful. Doctor, my tummy is in pain. The nurse gave me a shot. Doctor, now my bottom hurts too."}, {"id": "YELLOW95", "level": "YELLOW", "number": 95, "title_zh": "醫院", "title_en": "The hospital", "cover": "/covers/YELLOW95.jpg", "en_content": "My dog was sick. I took her to the animal hospital. The vet examined her. The vet gave her a shot and some medicine. I said, “Doctor, I am sick and need you to examine me too!” The vet said, “But this is an animal hospital!” I said, “But I am an animal too!”"}, {"id": "YELLOW96", "level": "YELLOW", "number": 96, "title_zh": "是學生", "title_en": "A student", "cover": "/covers/YELLOW96.jpg", "en_content": "Looking at his nose, I guess he is a clown. Looking at his hat, I guess he is a chef. Looking at his stethoscope, I guess he is a doctor. Looking at his clothes, I guess he is a firefighter. Looking at his badge, I guess he is a policeman. Looking at his tool belt, I guess he is a worker. Looking at my uniform, you know I am a student."}, {"id": "YELLOW97", "level": "YELLOW", "number": 97, "title_zh": "長大要做什麼", "title_en": "What do you want to be when you grow up?", "cover": "/covers/YELLOW97.jpg", "en_content": "Adults like to ask us: “What do you want to be when you grow up?” Some people want to be dancers. Some people want to be teachers. Some people want to be chefs. Some people want to be painters. Some people want to be astronauts. I said, “I want to be a kid. I don’t want to grow up.”"}, {"id": "YELLOW98", "level": "YELLOW", "number": 98, "title_zh": "坐直升機", "title_en": "Take a helicopter", "cover": "/covers/YELLOW98.jpg", "en_content": "There are many kinds of transport in this place. Taking a tram, you get to see many shops. Taking the subway, you get to see many people. Taking a ferry, you get to see many ships. Taking a double-decker bus, you get to see many houses. Taking a cable car, you get to see the mountains and the ocean. Taking a helicopter, you get to see this beautiful place."}, {"id": "YELLOW99", "level": "YELLOW", "number": 99, "title_zh": "不同的車", "title_en": "Different vehicles", "cover": "/covers/YELLOW99.jpg", "en_content": "I took a taxi first, arrived at the subway station and took the subway. Then I took the airport express to the airport, and took the airplane to China. I took the airport bus to the cable car station afterwards. Lastly, I took the cable car up to the mountain."}, {"id": "YELLOW100", "level": "YELLOW", "number": 100, "title_zh": "坐什麼車快", "title_en": "Which vehicle is faster?", "cover": "/covers/YELLOW100.jpg", "en_content": "Riding a bike is faster than walking. Taking a tram is faster than riding a bike. Taking a bus is faster than taking a tram. Taking a car is faster than taking a bus. Taking a train is faster than taking a car. Taking an airplane is faster than taking a train. The rocket is the fastest!"}, {"id": "GREEN1", "level": "GREEN", "number": 1, "title_zh": "說秘密", "title_en": "Going to school", "cover": "/covers/GREEN1.jpg", "en_content": "My auntie has a little dog. The little dog will be going to school tomorrow. I asked my Auntie: “Are dogs going to school to learn She said: “No! Little dogs have to learn how to make friends I said to the little dog:"}, {"id": "GREEN2", "level": "GREEN", "number": 2, "title_zh": "上學", "title_en": "Going to school", "cover": "/covers/GREEN2.jpg", "en_content": "My auntie has a little dog. The little dog will be going to school tomorrow. I asked my Auntie: “Are dogs going to school to learn She said: “No! Little dogs have to learn how to make friends I said to the little dog:"}, {"id": "GREEN3", "level": "GREEN", "number": 3, "title_zh": "數一數", "title_en": "Counting", "cover": "/covers/GREEN3.jpg", "en_content": "“How many people are there in the family?” “How many pencils do you have?” We went to ride horse. My younger brother counted the horses and I praised him for being so smart and gave him 10 pieces of candy. He put one piece of candy in his mouth and went to count the rest of the candies."}, {"id": "GREEN4", "level": "GREEN", "number": 4, "title_zh": "誰是書蟲", "title_en": "Who is the bookworm?", "cover": "/covers/GREEN4.jpg", "en_content": "There is a person who loves reading. He reads on the sofa, reads in the bed, reads on the toilet. Most incredible of all is that he is able to read books upside-down on the floor Have you ever met a person like this? I, myself, am a bookworm."}, {"id": "GREEN5", "level": "GREEN", "number": 5, "title_zh": "做我喜歡的事", "title_en": "Doing things that I like to do", "cover": "/covers/GREEN5.jpg", "en_content": "From Monday to Friday, I have to go to school to learn On Saturday morning, I have swimming and tennis lessons. On Sunday morning, I have to have lunch with Grandad and Grandma. Why are there only seven days in a week? On the 8th day, I am not having any lessons."}, {"id": "GREEN6", "level": "GREEN", "number": 6, "title_zh": "捉迷藏", "title_en": "Hide and seek", "cover": "/covers/GREEN6.jpg", "en_content": "I was the only one at home and had no one to play with me. “One, two, three, four, five, six, seven, eight, nine, ten, Ah! I found you. The toy dog and toy rabbit were under the bed. But, where was the toy lamb? “Children, can you help me find E! The toy lamb fell asleep inside the box."}, {"id": "GREEN7", "level": "GREEN", "number": 7, "title_zh": "練習", "title_en": "Practice", "cover": "/covers/GREEN7.jpg", "en_content": "On my computer, I saw a dog with only two legs. On my computer, I saw a girl with no fingers. On my computer, I saw a person with no hands. On my computer, I saw a person who had no hands and legs. Do you know how they could do these things? Actually, they just practiced,"}, {"id": "GREEN8", "level": "GREEN", "number": 8, "title_zh": "玩接龍遊戲", "title_en": "Play a Word Chain game", "cover": "/covers/GREEN8.jpg", "en_content": "Word chain games! You may have played them before! he shui(drink water)→shui cao(sea weed)→cao di( grass land) Zhong guo(China)→guo jia(country)→jia ren(family member) zuo xia(sit down)→xia wu(afternoon)→wu fan(lunch) Would you like to find a few friends to play a word chain game in Chinese?"}, {"id": "GREEN9", "level": "GREEN", "number": 9, "title_zh": "找蛋遊戲", "title_en": "Egg Hunt game", "cover": "/covers/GREEN9.jpg", "en_content": "Easter is coming. Our family went to the shopping mall and When we got home, we played the egg hunt game. We found the 4 eggs that were behind the TV, inside the refrigerator, However, we could not find the fifth one after searching everywhere. When we all sat down to eat lunch, we saw our younger brother had"}, {"id": "GREEN10", "level": "GREEN", "number": 10, "title_zh": "學游泳", "title_en": "Learning to swim", "cover": "/covers/GREEN10.jpg", "en_content": "Daddy dog and Mommy dog took their puppies to the beach. When they arrived at the beach, all the puppies got out of their pushchair one by one. Daddy dog was in the sea, but the puppies stared at him from the shore and Suddenly, a big wave rushed to the shore and carried all the puppies The puppies swam with all their might to the shore. That was that!"}, {"id": "GREEN11", "level": "GREEN", "number": 11, "title_zh": "躲貓貓", "title_en": "Duo mao mao(colloquial Chinese for hide-and-seek)", "cover": "/covers/GREEN11.jpg", "en_content": "Hide-and-seek is also called “duo mao mao”. One day, The little elephant hid behind the rock and the monkey hid on the tree. But he could not find the kitten (xiao mao). Suddenly, he heard the sound The kitten said, “I am not hiding inside the hole. I fell into the hole!” And then all the animals held on to one another to pull the kitten out."}, {"id": "GREEN12", "level": "GREEN", "number": 12, "title_zh": "燙鞦韆", "title_en": "To swing", "cover": "/covers/GREEN12.jpg", "en_content": "xiao pang(Chinese nickname of a chubby boy) was playing on the swing. Xiao Pang taught me how to swing. He told me to stand back a bit from the I followed Xiao Pang’s instructions. I stood well back and then ran and jumped. Xiao Pang said, “Never mind. Try again! Move further back.” This time I made it. I swung back and forth happily!"}, {"id": "GREEN13", "level": "GREEN", "number": 13, "title_zh": "怕鬼", "title_en": "Being afraid of ghosts", "cover": "/covers/GREEN13.jpg", "en_content": "Riding a bike, I am afraid of tumbling down. Rowing a boat, I am afraid of overturning it. Bungee jumping, I am afraid of the height. My friends teased me and said: I said, “Don’t call me a timid ghost. I am afraid of ghosts.”"}, {"id": "GREEN14", "level": "GREEN", "number": 14, "title_zh": "想要有一雙鞋", "title_en": "Imagine that I have a pair of shoes", "cover": "/covers/GREEN14.jpg", "en_content": "I imagine that I have a pair of shoes, a pair of magical shoes. They have a built-in motor. They have a spring attached. They have an air cushion at the bottom. They have a propellor. Wearing them I can fly in the sky!"}, {"id": "GREEN15", "level": "GREEN", "number": 15, "title_zh": "滑滑梯", "title_en": "Sliding down a slide", "cover": "/covers/GREEN15.jpg", "en_content": "I brought my little dog to play on the slide. When we reached the top of the slide, I slid down first. After sliding down, I discovered my little dog was scared on the top of the slide. Suddenly I saw a big dog with white patches rush up to the top of the slide. And then the big dog with white patches and my little dog slid down together!"}, {"id": "GREEN16", "level": "GREEN", "number": 16, "title_zh": "當一把傘", "title_en": "Being an umbrella", "cover": "/covers/GREEN16.jpg", "en_content": "I am a colorful umbrella. When you spin me I will change colors. Some people use me to protect themselves from the sunlight. But I like it when people use me to dance and spin round and round. I also like it when people use me to perform."}, {"id": "GREEN17", "level": "GREEN", "number": 17, "title_zh": "幫忙", "title_en": "Being helpful", "cover": "/covers/GREEN17.jpg", "en_content": "Elder sister overturned the cup of milk. Younger brother came to help. Mom overturned the oil. The younger brother came to help. Elder brother overturned the watercolor paints. Younger brother came to help. Mom, elder brother and elder sister said, ‟ You are not being helpful. Younger brother did not understand. He asked, “Who needs my help﹖"}, {"id": "GREEN18", "level": "GREEN", "number": 18, "title_zh": "騎車", "title_en": "Riding a bike", "cover": "/covers/GREEN18.jpg", "en_content": "A skinny monkey was wanting to ride a bike. A fat monkey was wanting to ride the bike too. The skinny monkey and fat monkey looked at the bike and stroked their heads. The fat monkey used his feet to turn the pedals and"}, {"id": "GREEN19", "level": "GREEN", "number": 19, "title_zh": "放風箏", "title_en": "Flying a kite", "cover": "/covers/GREEN19.jpg", "en_content": "Xiao Pang(Chinese nickname for chubby boys)and I went to fly a kite. Xiao Pang pulled the kite’s string and ran as quickly as he could. I picked up the kite and raised it up high again. I said, “Wait a while.” Xiao Pang ran and ran. The kite flew and flew. It flew up to the sky,"}, {"id": "GREEN20", "level": "GREEN", "number": 20, "title_zh": "寫兒歌", "title_en": "Writing nursery rhymes", "cover": "/covers/GREEN20.jpg", "en_content": "The teacher taught us to read a nursery rhyme. On the whiteboard, it’s written: The teacher said that the last character of each sentence sounds similar. The teacher also asked us to try to write a nursery rhyme of our own. I did one nursery rhyme:"}, {"id": "GREEN21", "level": "GREEN", "number": 21, "title_zh": "樹熊", "title_en": "Koalas", "cover": "/covers/GREEN21.jpg", "en_content": "Koalas have a chubby body, small eyes and short legs. I also have a chubby body, small eyes and short legs. I feel being a koala is a real nice thing. Therefore, I told mommy I look like a koala and Mom said: “Fine! I will ship you to Australia to be a koala."}, {"id": "GREEN22", "level": "GREEN", "number": 22, "title_zh": "兩隻豬", "title_en": "Two pigs", "cover": "/covers/GREEN22.jpg", "en_content": "Mommy pig and Daddy pig have two little piglets. Clean always likes to keep the house clean and neat. But when Messy comes he always messes up the house Messy said, “Pigs are untidy and messy. Clean said, “Are we not pigs any more when we are clean and tidy ?”"}, {"id": "GREEN23", "level": "GREEN", "number": 23, "title_zh": "螢火蟲", "title_en": "Fireflies", "cover": "/covers/GREEN23.jpg", "en_content": "Younger brother was walking on the grass. They were flashing like stars and like small lanterns too. Younger brother cupped his two hands and caught a firefly. He had a close look at the firefly and found her bottom was glowing. At night younger brother tied a fluorescent light stick to his bottom."}, {"id": "GREEN24", "level": "GREEN", "number": 24, "title_zh": "烏鴉", "title_en": "Crows", "cover": "/covers/GREEN24.jpg", "en_content": "Younger brother was reading a picture storybook. Elder brother heard it and said: “It should be read 烏鴉『wu ya』(crows in Chinese), Elder brother continued: “That character 烏 『wu』 looking like character 鳥 『niao』 Younger brother looked at the bird in the picture. The bird had black feathers Younger brother asked: “Is the character 烏『wu』the same as the character"}, {"id": "GREEN25", "level": "GREEN", "number": 25, "title_zh": "老鼠和貓兒", "title_en": "The rat and the cat", "cover": "/covers/GREEN25.jpg", "en_content": "All rats are afraid of cats. But the rat and the cat in our home One day I opened the refrigerator and did not see our rat run inside. Peng! The refrigerator door closed. I said: “Catty, do you want to eat something?” The rat was cold and shaking! Our cat came over and hugged the rat."}, {"id": "GREEN26", "level": "GREEN", "number": 26, "title_zh": "小鴨找媽媽", "title_en": "A duckling looking for his mom", "cover": "/covers/GREEN26.jpg", "en_content": "A duckling was looking for his mom. The duckling saw a crocodile. The crocodile wanted to take him to look The duckling saw a big bird behind the little bird. The little bird smiled and said: “That’s my mom. She won’t eat me!” The little bird said: “Come and sit on my mom’s back. We can fly in the sky and"}, {"id": "GREEN27", "level": "GREEN", "number": 27, "title_zh": "小豬不笨", "title_en": "The little pig is not stupid", "cover": "/covers/GREEN27.jpg", "en_content": "Mommy pig wanted the little pig to eat more vegetables. Mommy pig said: “You have not even tried them yet, how do you know they don’t taste The little pig met a frog and wanted to play with him. The little pig said: “You have not even played with me. How do you know if I The frog tried to play with the little pig and he found that the little pig"}, {"id": "GREE
