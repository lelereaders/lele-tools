et to turn the pedals and"}, {"id": "GREEN19", "level": "GREEN", "number": 19, "title_zh": "放風箏", "title_en": "Flying a kite", "cover": "/covers/GREEN19.jpg", "en_content": "Xiao Pang(Chinese nickname for chubby boys)and I went to fly a kite. Xiao Pang pulled the kite’s string and ran as quickly as he could. I picked up the kite and raised it up high again. I said, “Wait a while.” Xiao Pang ran and ran. The kite flew and flew. It flew up to the sky,"}, {"id": "GREEN20", "level": "GREEN", "number": 20, "title_zh": "寫兒歌", "title_en": "Writing nursery rhymes", "cover": "/covers/GREEN20.jpg", "en_content": "The teacher taught us to read a nursery rhyme. On the whiteboard, it’s written: The teacher said that the last character of each sentence sounds similar. The teacher also asked us to try to write a nursery rhyme of our own. I did one nursery rhyme:"}, {"id": "GREEN21", "level": "GREEN", "number": 21, "title_zh": "樹熊", "title_en": "Koalas", "cover": "/covers/GREEN21.jpg", "en_content": "Koalas have a chubby body, small eyes and short legs. I also have a chubby body, small eyes and short legs. I feel being a koala is a real nice thing. Therefore, I told mommy I look like a koala and Mom said: “Fine! I will ship you to Australia to be a koala."}, {"id": "GREEN22", "level": "GREEN", "number": 22, "title_zh": "兩隻豬", "title_en": "Two pigs", "cover": "/covers/GREEN22.jpg", "en_content": "Mommy pig and Daddy pig have two little piglets. Clean always likes to keep the house clean and neat. But when Messy comes he always messes up the house Messy said, “Pigs are untidy and messy. Clean said, “Are we not pigs any more when we are clean and tidy ?”"}, {"id": "GREEN23", "level": "GREEN", "number": 23, "title_zh": "螢火蟲", "title_en": "Fireflies", "cover": "/covers/GREEN23.jpg", "en_content": "Younger brother was walking on the grass. They were flashing like stars and like small lanterns too. Younger brother cupped his two hands and caught a firefly. He had a close look at the firefly and found her bottom was glowing. At night younger brother tied a fluorescent light stick to his bottom."}, {"id": "GREEN24", "level": "GREEN", "number": 24, "title_zh": "烏鴉", "title_en": "Crows", "cover": "/covers/GREEN24.jpg", "en_content": "Younger brother was reading a picture storybook. Elder brother heard it and said: “It should be read 烏鴉『wu ya』(crows in Chinese), Elder brother continued: “That character 烏 『wu』 looking like character 鳥 『niao』 Younger brother looked at the bird in the picture. The bird had black feathers Younger brother asked: “Is the character 烏『wu』the same as the character"}, {"id": "GREEN25", "level": "GREEN", "number": 25, "title_zh": "老鼠和貓兒", "title_en": "The rat and the cat", "cover": "/covers/GREEN25.jpg", "en_content": "All rats are afraid of cats. But the rat and the cat in our home One day I opened the refrigerator and did not see our rat run inside. Peng! The refrigerator door closed. I said: “Catty, do you want to eat something?” The rat was cold and shaking! Our cat came over and hugged the rat."}, {"id": "GREEN26", "level": "GREEN", "number": 26, "title_zh": "小鴨找媽媽", "title_en": "A duckling looking for his mom", "cover": "/covers/GREEN26.jpg", "en_content": "A duckling was looking for his mom. The duckling saw a crocodile. The crocodile wanted to take him to look The duckling saw a big bird behind the little bird. The little bird smiled and said: “That’s my mom. She won’t eat me!” The little bird said: “Come and sit on my mom’s back. We can fly in the sky and"}, {"id": "GREEN27", "level": "GREEN", "number": 27, "title_zh": "小豬不笨", "title_en": "The little pig is not stupid", "cover": "/covers/GREEN27.jpg", "en_content": "Mommy pig wanted the little pig to eat more vegetables. Mommy pig said: “You have not even tried them yet, how do you know they don’t taste The little pig met a frog and wanted to play with him. The little pig said: “You have not even played with me. How do you know if I The frog tried to play with the little pig and he found that the little pig"}, {"id": "GREEN28", "level": "GREEN", "number": 28, "title_zh": "動物的叫聲", "title_en": "Animal calls", "cover": "/covers/GREEN28.jpg", "en_content": "One morning, some little birds were chirping in the forest. The little birds said: “But you are croaking at night. The big tree said: “You little birds are noisy in the morning. Therefore, the big tree used its leaves to stuff the mouths of the little birds and the The next day it was very quiet in the forest. The big tree felt that without the noise he felt"}, {"id": "GREEN29", "level": "GREEN", "number": 29, "title_zh": "北極熊", "title_en": "Polar bears", "cover": "/covers/GREEN29.jpg", "en_content": "Mo Mo and his daddy went fishing on a sled. Mo Mo often threw fish to her. Winter came. Mo Mo did not see the polar bear and thought Spring came. Mo Mo saw the polar bear followed by two baby polar bears It turned out that she had become a mom."}, {"id": "GREEN30", "level": "GREEN", "number": 30, "title_zh": "黑熊媽媽說話", "title_en": "Mommy black bear was talking", "cover": "/covers/GREEN30.jpg", "en_content": "Mommy black bear was having a rest under the tree. Then they continued to climb up the tree trunk. It turned out that little black bears are Elder brother black bear and younger sister black bear climbed up Younger sister black bear stared at her elder brother as if she were asking him: Elder brother black bear told his younger sister that mom said:"}, {"id": "GREEN31", "level": "GREEN", "number": 31, "title_zh": "動物幫手", "title_en": "Animal helper", "cover": "/covers/GREEN31.jpg", "en_content": "The zoo has a zookeeper. One day the zookeeper was extremely busy because of a tiger He needed a helper to help him look after the new-born cub. He was thinking: “My helper must not be afraid of baby animals Afterwards he found a good helper. He knew how to look after"}, {"id": "GREEN32", "level": "GREEN", "number": 32, "title_zh": "蜘蛛", "title_en": "A spider", "cover": "/covers/GREEN32.jpg", "en_content": "A spider fell into the bathtub. He wanted to climb out but he fell down Although I was scared of spiders, I wanted to help him. When the spider was climbing up, I took a piece of newspaper The spider was halfway up when he fell onto the newspaper. The next day there was a beautiful spider web on the tree branches."}, {"id": "GREEN33", "level": "GREEN", "number": 33, "title_zh": "海獺", "title_en": "Sea otters", "cover": "/covers/GREEN33.jpg", "en_content": "Sea otters live in the ocean. Sea otters are very smart animals. They often hold hands and curl up inside the seaweed to sleep. This way they won’t be washed away when the They also play games together very often."}, {"id": "GREEN34", "level": "GREEN", "number": 34, "title_zh": "狗兒一家", "title_en": "The dog family", "cover": "/covers/GREEN34.jpg", "en_content": "Mom and I went to a “Center for Homeless Dogs”. Dad said that we should adopt one more so that he has company. One day my elder brother brought home two little dogs with light brown markings. The two little dogs with light brown markings saw the two big dogs with light brown The two big dogs with light brown markings licked the two little dogs with light brown"}, {"id": "GREEN35", "level": "GREEN", "number": 35, "title_zh": "小藍企鵝", "title_en": "The small blue penguins", "cover": "/covers/GREEN35.jpg", "en_content": "There are many kinds of penguins. Some are big and some are small. In Australia there is a kind of small penguin. They have blue feathers. There are many small blue penguins’ homes on the shore. When it’s getting dark the small blue penguins would jump on the shore The small blue penguins are really smart. Every one of them can find their own"}, {"id": "GREEN36", "level": "GREEN", "number": 36, "title_zh": "小動物", "title_en": "Small animals", "cover": "/covers/GREEN36.jpg", "en_content": "The small rat was unhappy because the big animals would not play with him. The small rat thought: I am bigger than butterflies and dragonflies. The small rat felt that the small squirrel was a similar size to him. So, he and the small squirrel became very good friends. They also made up many The big animals came and wanted to join them. The small rat and the small squirrel"}, {"id": "GREEN37", "level": "GREEN", "number": 37, "title_zh": "瓢蟲", "title_en": "Ladybugs", "cover": "/covers/GREEN37.jpg", "en_content": "There are many kinds of insects. Some are helpful insects. I am a ladybug. There are many round spots on my body making me look very pretty. I live on flowers, trees and grass. My favorite food is a kind of harmful insects What I am afraid of most is pesticides. As a result, pesticides can kill me too. Then, who is going to eat the"}, {"id": "GREEN38", "level": "GREEN", "number": 38, "title_zh": "松鼠", "title_en": "Squirrels", "cover": "/covers/GREEN38.jpg", "en_content": "You can often see cute squirrels in the park. They climb tress even faster. One day, I saw a squirrel. His mouth was moving non-stop which looked Suddenly he froze there looking at me. He seemed to want me to take “Click!” I took a picture of him. “Look! The squirrel looks really cute!”"}, {"id": "GREEN39", "level": "GREEN", "number": 39, "title_zh": "綿羊", "title_en": "Sheep", "cover": "/covers/GREEN39.jpg", "en_content": "Xiao Pang went to Canada with his family. Mom and Dad took him to The farmer held a razor and shaved all the wool from Mom said that we could use the wool to knit sweaters to wear. Xiao Pang looked at the bare body of the sheep thinking: He said to his mom: “Would you knit lots of sweaters to give"}, {"id": "GREEN40", "level": "GREEN", "number": 40, "title_zh": "動物玩偶", "title_en": "Stuffed toys", "cover": "/covers/GREEN40.jpg", "en_content": "I used my stuffed animal toys to decorate my room. I made it into a zoo. I took my younger brother to my zoo. He was so happy that he patted At night I went back to my room and found all my stuffed animal toys were gone. Suddenly, I heard my younger brother yelling: “Please don’t eat me!” It turned out that all the stuffed animal toys were on my younger brother’s bed."}, {"id": "GREEN41", "level": "GREEN", "number": 41, "title_zh": "動物會保護自己", "title_en": "Animals know how to protect themselves", "cover": "/covers/GREEN41.jpg", "en_content": "Dad was reading books to my younger brother. “Butterflies can remain still so that they can’t be found.” “Hedgehogs have spikes so that you dare not catch them.” My younger brother went to hide immediately so that he can’t be found by Dad. But our doggy kept barking towards the place where he hid."}, {"id": "GREEN42", "level": "GREEN", "number": 42, "title_zh": "螃蟹", "title_en": "Crabs", "cover": "/covers/GREEN42.jpg", "en_content": "You can play with sand and play with water at the beach. Once I saw a crab. But he escaped back to his hole quickly. I stretched my arm inside the hole to catch him. I quickly pulled out my arm. The crab was pulled out at the same time. Ai! I don’t know if I caught the crab or the crab caught me!"}, {"id": "GREEN43", "level": "GREEN", "number": 43, "title_zh": "刺蝟", "title_en": "Hedgehogs", "cover": "/covers/GREEN43.jpg", "en_content": "Hedgehogs have many spikes on their bodies. One day a hedgehog used the spikes on his body to pierce many fruits. All the other animals laughed at him saying: “You do have a lot of fruits on your body. Another hedgehog came along and also used the spikes on his body to pierce many fruits. They said: “You forgot that we are animals who help each other!”"}, {"id": "GREEN44", "level": "GREEN", "number": 44, "title_zh": "小河馬和大烏龜", "title_en": "The small hippo and the big turtle", "cover": "/covers/GREEN44.jpg", "en_content": "One day a small hippo lost his mom. Someone took him to the wild animal zoo. The small hippo went to lean on the big turtle. The big turtle became his new mom. That’s that! Just like my mom adopted me."}, {"id": "GREEN45", "level": "GREEN", "number": 45, "title_zh": "松鼠玩偶", "title_en": "Stuffed toy squirrel", "cover": "/covers/GREEN45.jpg", "en_content": "I took my stuffed toy squirrel to the park to play. I wanted to play on the swing and put my stuffed toy squirrel on the grass. A real squirrel came. He stared at the stuffed toy squirrel and ran away. After a while, the real squirrel came back holding a pinecone in his hands. He put the pinecone in front of the stuffed toy squirrel and gently leaned against"}, {"id": "GREEN46", "level": "GREEN", "number": 46, "title_zh": "噴水的龍", "title_en": "The dragon that puffs water", "cover": "/covers/GREEN46.jpg", "en_content": "Mom dragon bore many baby dragons. Every one of them could puff fire except The dragon puffing water asked mom: “Why can the other dragons all puff fire and be Mom dragon told him: “A dragon that can puff water is really sharp. She said: “Look! Everyone needs water. Every family needs water.” The dragon puffing water was thinking: “No wonder every family has"}, {"id": "GREEN47", "level": "GREEN", "number": 47, "title_zh": "蓋房子", "title_en": "Building a house", "cover": "/covers/GREEN47.jpg", "en_content": "The rat family lived inside a broken shoe which could not resist the strong wind and Daddy rat said: “We have to build a good house which can resist the strong wind and Grandpa rat and Grandma rat built the walls. The elder brother rat and the elder sister rat built the door. The house was done. No wind and no rain were able to get inside the house."}, {"id": "GREEN48", "level": "GREEN", "number": 48, "title_zh": "奶奶", "title_en": "Grandma", "cover": "/covers/GREEN48.jpg", "en_content": "Grandma has a necklace. She said that she will give it to me when I grow up. But she is afraid that she will forget where she keeps the necklace. She put the note aside. But she is afraid that she will forget where she keeps the note. And I wrote: “The note is kept---------“. I asked Grandma: “Then, how many I said: “You’d better give the necklace to me now!”"}, {"id": "GREEN49", "level": "GREEN", "number": 49, "title_zh": "爸爸沒回家", "title_en": "Dad did not come home", "cover": "/covers/GREEN49.jpg", "en_content": "It’s a rainy day. Daddy duck saw the house’s roof was leaking. He took the tool box and went up on the roof to fix it. Mommy duck opened the door and pushed down the ladder. It’s getting dark. Mommy duck felt weird. Daddy duck was missing. The ducklings were crying sadly."}, {"id": "GREEN50", "level": "GREEN", "number": 50, "title_zh": "會飛的房子", "title_en": "Flying house", "cover": "/covers/GREEN50.jpg", "en_content": "I went to see a movie. In the movie there were many balloons tied up to a house so the I hoped our house could fly too. Mom said that’s only the house in the movie. I could only make up it in my dream. The house in my dream can fly Then, one by one, the balloons burst. The house was falling down. My elder brother said to me: “Nowadays there is an airplane hotel."}, {"id": "GREEN51", "level": "GREEN", "number": 51, "title_zh": "媽媽愛誰多一點", "title_en": "Mom loves whom a bit more?", "cover": "/covers/GREEN51.jpg", "en_content": "My elder sister and I are twins. Mom said: “You both came out of my tummy. I love you both the same.” I did not feel that was right. Mom should love me a bit more. I said: “My elder sister came out three minutes earlier than I did. “So, you should love me a bit more now!”"}, {"id": "GREEN52", "level": "GREEN", "number": 52, "title_zh": "狗狗和我", "title_en": "The doggy and I", "cover": "/covers/GREEN52.jpg", "en_content": "The doggy was outside and used his claws to scratch the door. I opened the door and said to him: “Today you did not behave yourself. The doggy was sobbing outside the door and seemed to be crying sadly. I also cried sadly. I went to open the door and let him in. The doggy jumped on me and used his tongue to lick my tears."}, {"id": "GREEN53", "level": "GREEN", "number": 53, "title_zh": "家人聽對了嗎", "title_en": "Did my family hear it correctly?", "cover": "/covers/GREEN53.jpg", "en_content": "Mom wanted a flower. But my younger sister took her a picture. Grandpa wanted a fan. But my younger brother took him an umbrella. My elder sister wanted a cat with different colored markings. But my elder brother Grandma wanted a comb. But my younger brother took her a tree branch. Dad wanted an airplane. But mom took him a fat chicken."}, {"id": "GREEN54", "level": "GREEN", "number": 54, "title_zh": "海盜弟弟", "title_en": "My younger brother being a pirate", "cover": "/covers/GREEN54.jpg", "en_content": "I made a sword for my younger brother. My younger brother wore a stripy T-shirt. He ran to mom and said: “I am a pirate. Give me your treasure.” Mom gave him lots of coins. He was very happy to count his coins. Afterwards, my younger brother put all the money inside his piggy bank"}, {"id": "GREEN55", "level": "GREEN", "number": 55, "title_zh": "家裏有聲音", "title_en": "A sound in the house", "cover": "/covers/GREEN55.jpg", "en_content": "At night I was sleeping. I heard a sound. ran to my elder sister’s room. My elder sister also heard a sound. ran to mommy and daddy’s room. Mom and Dad also heard it. We followed Mom and Dad and walked to the living room. Ah! It turned there was a small bird trapped in our living room."}, {"id": "GREEN56", "level": "GREEN", "number": 56, "title_zh": "媽媽出差", "title_en": "Mom on a business trip", "cover": "/covers/GREEN56.jpg", "en_content": "I went home after school and did not see my mom there. Dad said that Mom went on a “business trip”. Dad said “business trip” meant to work in a different place At night when Dad read stories to me I missed Mom a little bit. Finally, Mom came home. I jumped on her and said: “I want to go on a"}, {"id": "GREEN57", "level": "GREEN", "number": 57, "title_zh": "花園房子", "title_en": "House with a garden", "cover": "/covers/GREEN57.jpg", "en_content": "Xiao Pang (Chinese nickname for a chubby boy) said that his house in America There is a swimming pool next to the garden. Behind it is a big empty space where you can On hearing that, I also wanted a house with such a garden. I gave it some thought and then drew a picture of a home with a flower garden. Of course, it included me riding a bike on the big empty space."}, {"id": "GREEN58", "level": "GREEN", "number": 58, "title_zh": "把弟弟送給你", "title_en": "Giving away my younger brother", "cover": "/covers/GREEN58.jpg", "en_content": "I have an annoying younger brother. He always fights for toys with me. He also scribbled on my workbook. So, I decided to give him away. Auntie came to our home. I gave away my younger brother to her. Now I could only play by myself. I began to miss my younger brother------ I called Auntie up and said: “Please give me back my younger brother!”"}, {"id": "GREEN59", "level": "GREEN", "number": 59, "title_zh": "我不貪心", "title_en": "I am not greedy", "cover": "/covers/GREEN59.jpg", "en_content": "Dad often taught Le Le not to be greedy and not to expect One day Le Le came home and gave dad her school report. Dad looked at Le Le’s school report. All the grades were As except for Dad said: “Le Le, work harder and your English grade will be better.” Le Le was thinking: Isn’t B better than C? Didn’t Dad teach me not to be greedy and not to"}, {"id": "GREEN60", "level": "GREEN", "number": 60, "title_zh": "我的好朋友", "title_en": "My best friend", "cover": "/covers/GREEN60.jpg", "en_content": "This is my doggy of our home. She is my best friend. When I am bored, I like to dress her in different pretty clothes. When I am happy, I like to hold her legs to dance. I went home after school and enjoyed pretending to be her teacher. When it’s getting cold, I also cuddle her to sleep. What about you?"}, {"id": "GREEN61", "level": "GREEN", "number": 61, "title_zh": "家裏的好人和壞人", "title_en": "Good guys and bad guys at home", "cover": "/covers/GREEN61.jpg", "en_content": "I played a game with my younger brother. I said: “Fine! We will both be good guys and we will go We tiptoed into our elder brother’s room. We put all the bad guys inside a bag and threw them into Our elder brother came home. He walked into his room and yelled:"}, {"id": "GREEN62", "level": "GREEN", "number": 62, "title_zh": "妹妹", "title_en": "Younger sister", "cover": "/covers/GREEN62.jpg", "en_content": "My younger sister was doing her homework. My younger sister was putting on her clothes. My younger sister washed her hands. I said to her angrily that she was really a “so-so” person. She also said angrily: “I am not a horse. I am not a tiger either. I am an ox.”"}, {"id": "GREEN63", "level": "GREEN", "number": 63, "title_zh": "媽媽像什麼", "title_en": "What is Mom like?", "cover": "/covers/GREEN63.jpg", "en_content": "What is Mom like? My mom can be like anything. When she is happy, she will chirp nonstop like a little bird. When she is mad, she will talk to me fiercely like a tiger. When she is busy, she hoped she can do eight things at one time, like an octopus. When she is tired, she will dive under the quilt to have a sound sleep, like a big"}, {"id": "GREEN64", "level": "GREEN", "number": 64, "title_zh": "我討厭的事", "title_en": "The things that I hate", "cover": "/covers/GREEN64.jpg", "en_content": "There are quite a few things that I hate. When using the computer, I hate it when dad keeps asking me to turn it off. When watching TV, I hate it when Grandma keeps asking me to change the channel. When taking a bath, I hate it when my elder sister keeps asking me to come out quickly. How about you? What are the things that you hate?"}, {"id": "GREEN65", "level": "GREEN", "number": 65, "title_zh": "冬眠的弟弟", "title_en": "Younger brother hibernated", "cover": "/covers/GREEN65.jpg", "en_content": "One morning in the winter younger brother wanted to Mom woke him up. He did not want to. He pulled up the quilt and said: At noon younger brother was still in bed sleeping. At night younger brother got up. Mom said: “When animals hibernate they don’t need to eat any food.”"}, {"id": "GREEN66", "level": "GREEN", "number": 66, "title_zh": "尾巴", "title_en": "Tails", "cover": "/covers/GREEN66.jpg", "en_content": "On Sunday I went to a zoo with Dad. After getting there we saw elephants, brown bears, Then we went to see the peacock. It was a shame that she did not I walked close to the cage and wanted the peacock to see my The peacock opened her tail slowly and seemed to tell me:"}, {"id": "GREEN67", "level": "GREEN", "number": 67, "title_zh": "角、鬍鬚和尾巴", "title_en": "Horns, whiskers, and a tail", "cover": "/covers/GREEN67.jpg", "en_content": "A strong wind was blowing. It blew away the horns of the sheep. It blew away the tail of the squirrel and the whiskers of the cat. All the animals said: “Strong wind, strong wind, please stop blowing!” The strong wind blew me up to the sky too. I saw the horns, the tail Suddenly the strong wind stopped. I fell from the sky."}, {"id": "GREEN68", "level": "GREEN", "number": 68, "title_zh": "腿斷了", "title_en": "Broken leg", "cover": "/covers/GREEN68.jpg", "en_content": "A small elephant fell down into a big hole and could not come out. The mommy elephant was howling nonstop. Many people heard her howling But they found the small elephant had a broken leg. They made a phone call. A helicopter came and lifted up the small elephant The vet tied a brace to the leg. The small elephant could walk slowly again"}, {"id": "GREEN69", "level": "GREEN", "number": 69, "title_zh": "熊貓的毛", "title_en": "The panda’s fur", "cover": "/covers/GREEN69.jpg", "en_content": "A panda cub was born. She was very, very tiny and pink. The cub began to grow fur. Her fur was black and white. But her ears, eyes and four legs were white. Her body turned out to be black. However, she looked cute and all the kids especially liked her--------- because she looked different from other pandas. She is so special!"}, {"id": "GREEN70", "level": "GREEN", "number": 70, "title_zh": "大熊的背", "title_en": "The big bear’s back", "cover": "/covers/GREEN70.jpg", "en_content": "A big bear was lying on his stomach in front of his cave and felt his back was itchy. He asked: “What are you doing on my back?” The big bear asked him why he was dancing on his back. Ever since then, they became good friends. The small rat came to dance every day. The small rat said: “I have to wait three months to be able to dance again!"}, {"id": "GREEN71", "level": "GREEN", "number": 71, "title_zh": "羽毛", "title_en": "Feathers", "cover": "/covers/GREEN71.jpg", "en_content": "A peacock felt that her feathers were extremely pretty. The little birds all asked her for one feather. One day the peacock woke up from her sleep and found all the feathers on The peacock wept sadly while she searched for her feathers. The peacock stuck the feathers given by all the little birds into her tail."}, {"id": "GREEN72", "level": "GREEN", "number": 72, "title_zh": "牙齒", "title_en": "Teeth", "cover": "/covers/GREEN72.jpg", "en_content": "One morning Xiao Ming got up and He saw grandpa holding his teeth and then putting them into his mouth. He could not figure out why grandpa ate teeth. “You put your teeth under your pillow so the tooth fairy will Grandpa asked Xiao Ming: “I’ve got no teeth. These are false teeth."}, {"id": "GREEN73", "level": "GREEN", "number": 73, "title_zh": "頭上的大包", "title_en": "A lump on the forehead", "cover": "/covers/GREEN73.jpg", "en_content": "My younger brother fell down and a big lump appeared on his forehead. Mom came to rub his forehead but he said it was still very painful. Grandma came to give him a candy. Dad came and said: “Let the doctor give him a shot!” He said: “It’s not painful anymore.”"}, {"id": "GREEN74", "level": "GREEN", "number": 74, "title_zh": "腳受傷了", "title_en": "The wounded leg", "cover": "/covers/GREEN74.jpg", "en_content": "A big dog walked with his owner. He saw a monkey. The next day, the monkey went to find the big dog to play. People saw them and felt weird and puzzled that a dog and a monkey could be friends. But they were together every day. They even swam in the river together. It turned out that the big dog had wounded his leg."}, {"id": "GREEN75", "level": "GREEN", "number": 75, "title_zh": "熊熊生病了", "title_en": "The bear got sick", "cover": "/covers/GREEN75.jpg", "en_content": "My younger brother took a stethoscope and put the chest piece on the chest of his After a while, he said: “The bear is sick.” After a while, he said: “The bear has a fever.” He said to the teddy bear: “I will give you candies if you don’t cry.” Then he held up the teddy bear and said: “My bear is the most well-behaved bear"}, {"id": "GREEN76", "level": "GREEN", "number": 76, "title_zh": "生病的公雞", "title_en": "The sick rooster", "cover": "/covers/GREEN76.jpg", "en_content": "Early in the morning the sun came out. The hen got mad and asked him: “Why didn’t you crow?” The rooster said that he was sick. The hen said: “I’ll take you to see a doctor. You can get a shot and then The rooster saw the doctor and said:"}, {"id": "GREEN77", "level": "GREEN", "number": 77, "title_zh": "長毛巴", "title_en": "Regrowing a tail", "cover": "/covers/GREEN77.jpg", "en_content": "The rat and the house lizard lived together. One day, the house lizard broke his tail. Not long after, the rat’s tail got broken. He was very sad and cried. The house lizard asked him not to cry and said the tail will regrow. The house lizard said: “How can that be? Look! Here is my regrown tail!”"}, {"id": "GREEN78", "level": "GREEN", "number": 78, "title_zh": "薯片 Chips", "title_en": "Chips", "cover": "/covers/GREEN78.jpg", "en_content": "What’s the best food in the world? Some chips are thick and some are thin. Chips are crunchy. The more you eat them, the more you want to eat. Once you have started eating them it’s very hard to stop eating them. why do all the adults and children like this kind of unhealthy food"}, {"id": "GREEN79", "level": "GREEN", "number": 79, "title_zh": "水果", "title_en": "Fruit", "cover": "/covers/GREEN79.jpg", "en_content": "There were many kinds of fruit in the basket. They finally agreed that whichever one is picked up to be eaten first Apples were picked up first and cut into small pieces. All the small pieces fruit were put into a big bowl and became a fruit salad. People stuffed the fruit salad into their mouths."}, {"id": "GREEN80", "level": "GREEN", "number": 80, "title_zh": "青菜和蘿蔔", "title_en": "Vegetables and carrots", "cover": "/covers/GREEN80.jpg", "en_content": "The rabbit family found an old house. The daddy rabbit said: “Let’s live here!” It was getting dark. The owner of the house came home. He opened the door. All the rabbits were scared and shook. The big wolf said: “Don’t be afraid. I am getting old and have"}, {"id": "GREEN81", "level": "GREEN", "number": 81, "title_zh": "冰淇淋", "title_en": "Ice cream", "cover": "/covers/GREEN81.jpg", "en_content": "My younger brother came out of the kitchen with his two hands hiding behind his back. Mom asked him: “Why are your hands behand your back? Stretch them out My younger brother did not want to stretch out his two hands. Mom asked him to stretch out his hands quickly. “Yi! What happened? Where is the ice cream?”"}, {"id": "GREEN82", "level": "GREEN", "number": 82, "title_zh": "烤鴨", "title_en": "Roast duck", "cover": "/covers/GREEN82.jpg", "en_content": "Roast Peking duck is a very famous dish. The roast duck has crispy yellow skin outside and soft and tender meat inside. After bringing out the roast duck, the chef usually slices the duck meat along with the skin When you eat the roast duck, you take a piece of thin pastry first. Ai Ya!(Chinese expression similar to Oh My God) My mouth is watery."}, {"id": "GREEN83", "level": "GREEN", "number": 83, "title_zh": "巧克力蛋糕", "title_en": "Chocolate cake", "cover": "/covers/GREEN83.jpg", "en_content": "It’s my elder sister’s birthday. Put the eggs in a bowl first and then add flour. You also need to add butter and oil. My elder sister loves chocolate. So, I will add more chocolate. After baking for 10 minutes the cake is still small. Oh No! The cake has become a chocolate mountain."}, {"id": "GREEN84", "level": "GREEN", "number": 84, "title_zh": "花蜜和花粉", "title_en": "Honey and pollen", "cover": "/covers/GREEN84.jpg", "en_content": "Up on a high mountain and through a long tunnel, They lived among flowers, wore flower-made clothes, ate pollen and drank honey. One day a giant came. All the dwarfs were frightened. The giant said: “Don’t be afraid. I also want to live among the flowers,"}, {"id": "GREEN85", "level": "GREEN", "number": 85, "title_zh": "零食", "title_en": "Snacks", "cover": "/covers/GREEN85.jpg", "en_content": "My elder sister loves eating dry mangos. We all know that having snacks between meals will make us lose our appetite Today we opened the cupboards and saw they were all empty. Having no snacks at home, we felt that"}, {"id": "GREEN86", "level": "GREEN", "number": 86, "title_zh": "西瓜和番茄", "title_en": "Watermelons and tomatoes", "cover": "/covers/GREEN86.jpg", "en_content": "The little watermelon lived with his parents. One day, the little watermelon saw some square watermelons. Their daddy said: “The square watermelons and the purple tomatoes are your biao ge and Another day, the small watermelon saw some triangular watermelons. They were thinking: “Who are they?” The triangular watermelons and the blue tomatoes"}, {"id": "GREEN87", "level": "GREEN", "number": 87, "title_zh": "香味", "title_en": "Fragrance", "cover": "/covers/GREEN87.jpg", "en_content": "Mom is making cakes today. The living room, the dining room, the study and the bedrooms were all “Knock! Knock! Knock!” someone was knocking the door. I opened the door. He said: “The fragrance from the cakes has drifted into our home.” He said: “Then, can the cakes be shared?”"}, {"id": "GREEN88", "level": "GREEN", "number": 88, "title_zh": "好吃的東西", "title_en": "Yummy stuff", "cover": "/covers/GREEN88.jpg", "en_content": "Why is the stuff which I think yummy is said unhealthy by the adults? I like to eat lollipops. The teachers say they cause cavities. I like to eat ice-creams. Grandma says they cause sore throats. I want to drink soft drinks. Dad says they make you fat. I say: “Mom, please add sugar to the vegetables, add ice-cream to the meat,"}, {"id": "GREEN89", "level": "GREEN", "number": 89, "title_zh": "先吃再付錢", "title_en": "Pay after eating", "cover": "/covers/GREEN89.jpg", "en_content": "Mom asked me to take my younger brother to the supermarket I chose chocolates and ice-creams. My younger brother chose chips and lollipops. When I took the baskets to line up, I found my younger brother was missing. I went to find him and saw him sitting on the floor eating chips. He said: “We can pay after eating, can’t we? That’s what we do at restaurants.”"}, {"id": "GREEN90", "level": "GREEN", "number": 90, "title_zh": "食物夢", "title_en": "Food dream", "cover": "/covers/GREEN90.jpg", "en_content": "I had a dream about food. I sat in a boat made from papaya. There was a bridge over the river. The bridge was made from banana. There were chairs on the two sides of the road. They were made from watermelons. There were many fish made of chocolate. I stretched out my hands Then I woke up. There were chocolate fish in my hand!"}, {"id": "GREEN91", "level": "GREEN", "number": 91, "title_zh": "星星吃月亮", "title_en": "The stars ate the moon", "cover": "/covers/GREEN91.jpg", "en_content": "There is a big and round moon in the sky. So, they decided to eat the moon until the moon became a crescent moon. Not long after, the moon became a full moon again. They went to eat the moon again. Therefore, sometimes we see the moon being round"}, {"id": "GREEN92", "level": "GREEN", "number": 92, "title_zh": "找寶藏", "title_en": "A Treasure Hunt", "cover": "/covers/GREEN92.jpg", "en_content": "This is a treasure map. Come on! Let’s go hunting for treasure. Where is the treasure? Let’s have a close look at the treasure map. First we climbed up the high mountain and then crossed over the long river. We found the biggest rock and went through a small tunnel under it. “Help!” It turned out to be a nightmare. There was no treasure at all."}, {"id": "GREEN93", "level": "GREEN", "number": 93, "title_zh": "我喜歡大自然", "title_en": "I love nature", "cover": "/covers/GREEN93.jpg", "en_content": "When it’s sunny I love to be in the ocean and swim with the fish. When it’s cloudy I love to hike on a high mountain with a friend to have When it’s windy I love to fly kites and let them be high in the sky to play with the birds. When it’s rainy I love to draw. What shall I draw? I drew the fish in the ocean, my friend and I hiking on the mountain and"}, {"id": "GREEN94", "level": "GREEN", "number": 94, "title_zh": "遊太空", "title_en": "A space trip", "cover": "/covers/GREEN94.jpg", "en_content": "The teacher gave me a balloon. I blew it with all my force and the balloon became I flew up to the sky. A small bird bit the balloon and it burst. I fell down on the clouds and drifted into space. Then I got hold of a rocket I saw an astronaut. He let me put on a spacesuit, sit inside the spaceship Mom asked me: “Where have you been just now?”"}, {"id": "GREEN95", "level": "GREEN", "number": 95, "title_zh": "寶石", "title_en": "Precious stones", "cover": "/covers/GREEN95.jpg", "en_content": "There are many pretty small fish on my mom’s swimming suit. Mom chased after the small fish. The small fish swam very fast The small fish swam into a small hole and mom swam into it too. There were many precious stones in the shipwreck. There were red precious stones, Mom woke up. There was no mermaid. No shipwreck."}, {"id": "GREEN96", "level": "GREEN", "number": 96, "title_zh": "老樹 The old tree", "title_en": "The old tree", "cover": "/covers/GREEN96.jpg", "en_content": "There is a big old tree in our yard. The tree trunk and branches are very thick. I often climb up the old tree during the day, I also climb up the old tree very often at night, When I was upset I also climbed up the old tree, The big old tree is like another home to me. She is also my best friend."}, {"id" 直升機看到了「救命」， 可是，直升機飛走了， 一會兒，直升機又飛回來了! 牠們得救了! Yellow 14 动物的船沉了  船要沉了， 动物们跳进海裏， 牠们游到一个小岛，在沙上写「救命」。 一架直升机看到了「救命」， 可是，直升机飞走了， 一会儿，直升机又飞回来了! 牠们得救了!", "YELLOW15": "不是真的動物 不是真的动物 動物 动物 Yellow 15 不是真的動物  有一天，我去公園。 我看到爺爺和袋鼠坐在椅子上看書。 孩子們在草地上和小馬踢球。 媽媽和白兔一起種花。 還有貓頭鷹在樹上，不睡覺。 我再看一看，它們怎麼都不動? 原來它們都是雕像! Yellow 15 不是真的动物  有一天，我去公园。 我看到爷爷和袋鼠坐在椅子上看书。 孩子们在草地上和小马踢球。 妈妈和白兔一起种花。 还有猫头鹰在树上，不睡觉。 我再看一看，它们怎么都不动? 原来它们都是凋像!", "YELLOW16": "動物的朋友 动物的朋友 動物 动物 Yellow 16 動物的朋友  有朋友真好! 花貓帶小狗去屋頂玩耍， 白鵝帶小鴨去池塘裏游泳， 兔子帶青蛙去草地上跳繩， 蜜蜂帶蝴蝶去花園裏採蜂蜜， 黃牛帶小馬去農場吃草， 老鷹帶我飛上天，去看美麗的世界。 Yellow 16 动物的朋友  有朋友真好! 花猫带小狗去屋顶玩耍， 白鹅带小鸭去池塘裏游泳， 兔子带青蛙去草地上跳绳， 蜜蜂带蝴蝶去花园裏採蜂蜜， 黄牛带小马去农场吃草， 老鹰带我飞上天，去看美丽的世界。", "YELLOW17": "狗兒 狗儿 動物 动物 Yellow 17 狗兒  我牽狗兒去散步， 狗兒看見牠的好朋友，就向前跑， 我也跟著牠向前跑， 牠的好朋友向牠跑過來， 那隻狗兒的主人也跟著跑過來， 不是我們牽狗兒，是狗兒牽我們， 狗兒們的主人也做了好朋友! Yellow 17 狗儿  我牵狗儿去散步， 狗儿看见牠的好朋友，就向前跑， 我也跟着牠向前跑， 牠的好朋友向牠跑过来， 那隻狗儿的主人也跟着跑过来， 不是我们牵狗儿，是狗儿牵我们， 狗儿们的主人也做了好朋友!", "YELLOW18": "老鷹和兔子 老鹰和兔子 動物 动物 Yellow 18 老鷹和兔子  一隻老鷹在天上飛， 牠看到了地上的兔子， 牠飛快地飛向兔子， 兔子也飛快地逃跑， 老鷹的爪子快要抓到兔子了， 聰明的兔子突然轉彎， 老鷹來不及轉彎，只好飛上天了。 Yellow 18 老鹰和兔子  一隻老鹰在天上飞， 牠看到了地上的兔子， 牠飞快地飞向兔子， 兔子也飞快地逃跑， 老鹰的爪子快要抓到兔子了， 聪明的兔子突然转弯， 老鹰来不及转弯，只好飞上天了。", "YELLOW19": "好看的動物 好看的动物 動物 动物 Yellow 19 好看的動物  給動物塗色，加圖案? 海星，加上圓圈圖案， 海馬，加上線條圖案， 海豚，加上鑽石圖案， 章魚，加上螺旋圖案， 海龜，加上花兒圖案， 有了圖案，動物更加好看! Yellow 19 好看的动物  给动物涂色，加图案? 海星，加上圆圈图案， 海马，加上线条图案， 海豚，加上鑽石图案， 章鱼，加上螺旋图案， 海龟，加上花儿图案， 有了图案，动物更加好看!", "YELLOW20": "會飛的動物 会飞的动物 動物 动物 Yellow 20 會飛的動物  巫婆有掃把就會飛， 阿拉丁有飛毯就會飛， 超人有披風就會飛， 蜘蛛俠有蜘蛛絲就會飛， 人們有飛行傘就會飛。 小猴子也想飛…... 牠只要找個會飛的好朋友「鸚鵡」，就飛了。 Yellow 20 会飞的动物  巫婆有扫把就会飞， 阿拉丁有飞毯就会飞， 超人有披风就会飞， 蜘蛛侠有蜘蛛丝就会飞， 人们有飞行伞就会飞。 小猴子也想飞…... 牠只要找个会飞的好朋友「鹦鹉」，就飞了。", "YELLOW21": "什麼動物最棒 什么动物最棒 動物 动物 Yellow 21 什麼動物最棒  動物們在樹下七嘴八舌。 豹說:「我跑得最快，我最棒!」 鼴鼠說:「我挖洞最快，我最棒!」 袋鼠說:「我跳得最快，我最棒!」 猴子說:「我爬樹最快，我最棒!」 網子從樹上掉下來， 獵人說:「我最棒!」 Yellow 21 什么动物最棒  动物们在树下七嘴八舌。 豹说:「我跑得最快，我最棒!」 鼹鼠说:「我挖洞最快，我最棒!」 袋鼠说:「我跳得最快，我最棒!」 猴子说:「我爬树最快，我最棒!」 网子从树上掉下来， 猎人说:「我最棒!」", "YELLOW22": "說話的魚 说话的鱼 動物 动物 Yellow 22 說話的魚  會吃人的魚，鯊魚。 會噴水的魚，鯨魚。 會發電的魚，電鰻。 會清潔的魚，清潔魚。 會發光的魚，燭光魚。 會回家的魚，鮭魚。 會說話的魚，美人魚。 Yellow 22 说话的鱼  会吃人的鱼，鲨鱼。 会喷水的鱼，鲸鱼。 会发电的鱼，电鳗。 会清洁的鱼，清洁鱼。 会发光的鱼，烛光鱼。 会回家的鱼，鲑鱼。 会说话的鱼，美人鱼。", "YELLOW23": "動物的腳印 动物的脚印 動物 动物 Yellow 23 動物的腳印  地上有大腳印。 「不是我們的腳印，我們的像葉子。」小鴨們說。 「不是我們的腳印，我們的像花。」小狗們說。 「是誰的腳印呢?」牠們想…. [是我的!」大熊說。 「 是大熊，快逃!」小動物們說 。 「不要逃!進來吃蜂蜜!」大熊說。 Yellow 23 动物的脚印  地上有大脚印。 「不是我们的脚印，我们的像叶子。」小鸭们说。 「不是我们的脚印，我们的像花。」小狗们说。 「是谁的脚印呢?」牠们想…. [是我的!」大熊说。 「 是大熊，快逃!」小动物们说 。 「不要逃!进来吃蜂蜜!」大熊说。", "YELLOW24": "貓兒在哪裏 猫儿在哪里 動物 动物 Yellow 24 貓兒在哪裏 Yellow 24 貓兒在哪裏  這是我的貓， 牠的名字叫小月 。 有一天，牠不見了! 小月在樹上嗎? 小月在洞裏嗎? 小月在哪裏? 「喵!」小月當媽媽了! Yellow 24 猫儿在哪裏  这是我的猫， 牠的名字叫小月 。 有一天，牠不见了! 小月在树上吗? 小月在洞裏吗? 小月在哪裏? 「喵!」小月当妈妈了!", "YELLOW25": "動物寶寶 动物宝宝 動物 动物 Yellow 25 動物寶寶  鳥媽媽坐在鳥巢裏， 蜻蜓飛過來，看一看! 樹蛙跳過來，看一看! 小松鼠爬過來，看一看! 小朋友把頭伸過來，看一看! 鳥爸爸回來了， 牠說:「原來我的寶寶都出來了!」 Yellow 25 动物宝宝  鸟妈妈坐在鸟巢裏， 蜻蜓飞过来，看一看! 树蛙跳过来，看一看! 小松鼠爬过来，看一看! 小朋友把头伸过来，看一看! 鸟爸爸回来了， 牠说:「原来我的宝宝都出来了!」", "YELLOW26": "魚鷹 鱼鹰 動物 动物 Yellow 26 魚鷹  一隻魚鷹站在樹上， 牠長開翅膀，飛向大海， 牠飛進大海裏， 牠又飛出了大 海， 牠的爪子抓著一條魚， 牠到海邊吃魚。 魚鷹就是吃魚的鷹。 Yellow 26 鱼鹰  一隻鱼鹰站在树上， 牠长开翅膀，飞向大海， 牠飞进大海裏， 牠又飞出了大 海， 牠的爪子抓着一条鱼， 牠到海边吃鱼。 鱼鹰就是吃鱼的鹰。", "YELLOW27": "小鴨 小鸭 動物 动物 Yellow 27 小鴨  老鷹來捉小雞了， 小雞都躲到母雞的翅膀下， 小鴨也躲到母鴨的翅膀下， 老鷹飛走了。 母鴨傷心地說:「一隻小鴨不見了。」 牠想:是不是老鷹抓走了? 「牠在我這兒呢!」母雞說。 Yellow 27 小鸭  老鹰来捉小鸡了， 小鸡都躲到母鸡的翅膀下， 小鸭也躲到母鸭的翅膀下， 老鹰飞走了。 母鸭伤心地说:「一隻小鸭不见了。」 牠想:是不是老鹰抓走了? 「牠在我这儿呢!」母鸡说。", "YELLOW28": "剪紙 剪纸 學校/學校活動 学校/学校活动 Yellow 28 剪紙  一張正方形的白紙， 摺一半是三角形， 在長的一邊中間畫個點， 右角摺上去， 左角摺上去， 在中間畫上樹幹和樹枝。 剪下來，再打開，就是一片雪花! Yellow 28 剪纸  一张正方形的白纸， 摺一半是三角形， 在长的一边中间画个点， 右角摺上去， 左角摺上去， 在中间画上树干和树枝。 剪下来，再打开，就是一片雪花!", "YELLOW29": "比賽 比赛 學校/學校活動 学校/学校活动 Yellow 29 比賽  各就各位， 預備， 開始，跑! 加油!加油! 快到終點了! 第一、第二、第三，小烏龜和小蝸牛還在爬， 小烏龜和小蝸牛說: 「怎麼不比誰最慢?」 Yellow 29 比赛  各就各位， 预备， 开始，跑! 加油!加油! 快到终点了! 第一、第二、第三，小乌龟和小蜗牛还在爬， 小乌龟和小蜗牛说: 「怎么不比谁最慢?」", "YELLOW30": "橡皮 橡皮 學校/學校活動 学校/学校活动 Yellow 30 橡皮  弟弟打開我的書包， 他拿出我的筆盒， 他打開我的筆盒， 筆盒裏面有橡皮， 他聞一聞橡皮說:「好香！」 他把橡皮放進口裏， 我說：「弟弟！那是橡皮，不是糖呀！」 Yellow 30 橡皮  弟弟打开我的书包， 他拿出我的笔盒， 他打开我的笔盒， 笔盒裏面有橡皮， 他闻一闻橡皮说:「好香！」 他把橡皮放进口裏， 我说：「弟弟！那是橡皮，不是糖呀！」", "YELLOW31": "摺紙 Paper folding 折纸 Paper folding 學校/學校活動 学校/学校活动 Yellow 31 摺紙  一張正方形的紙，把它摺一半， 變成一個三角形。 再把上面兩個角，向下摺， 變成兩個耳朵。 然後畫一雙眼睛， 再畫一個小鼻子， 就變成一隻可愛的 开窗让小绿鸟飞走。 「叩!叩!」是小绿鸟在敲窗， 我打开窗，哇!一颗宝石", "YELLOW67": "鳥蛋 鸟蛋 自然 自然 Yellow 67 鳥蛋  有一座山， 山上有一棵樹， 樹上有鳥窩， 鳥窩裏有幾顆鳥蛋。 一條蛇來了，牠爬上樹了， 牠看到鳥蛋，正想要吃，鳥爸爸來了， 「哎呀!好痛!」蛇從樹上掉下來了! Yellow 67 鸟蛋  有一座山， 山上有一棵树， 树上有鸟窝， 鸟窝裏有几颗鸟蛋。 一条蛇来了，牠爬上树了， 牠看到鸟蛋，正想要吃，鸟爸爸来了， 「哎呀!好痛!」蛇从树上掉下来了!", "YELLOW68": "植物 植物 自然 自然 Yellow 68 植物  阿姨送我一棵植物， 我把它放在鋼琴上面， 我天天彈鋼琴給它聽， 植物長出新葉， 長出花苞， 花兒一朵朵地開了! 阿姨說:「原來植物也愛聽音樂!」 Yellow 68 植物  阿姨送我一棵植物， 我把它放在钢琴上面， 我天天弹钢琴给它听， 植物长出新叶， 长出花苞， 花儿一朵朵地开了! 阿姨说:「原来植物也爱听音乐!」", "YELLOW69": "星球 星球 自然 自然 Yellow 69 星球  這個星球光禿禿的，沒有樹。 這個星球平平的，沒有山。 這個星球太乾了，沒有水。 這個星球很多沙，沒有石頭。 這個星球太黑了，沒有光。 這個星球臭臭的，沒有空氣。 這個星球什麼都有，那就是地球。 Yellow 69 星球  这个星球光秃秃的，没有树。 这个星球平平的，没有山。 这个星球太乾了，没有水。 这个星球很多沙，没有石头。 这个星球太黑了，没有光。 这个星球臭臭的，没有空气。 这个星球什么都有，那就是地球。", "YELLOW70": "彩虹 彩虹 自然 自然 Yellow 70 彩虹  你聽!嘩!嘩!嘩! 是什麼聲音? 是瀑布，好大的瀑布! 你看!那裏有一道彩虹! 你看!那裏也有一道彩虹! 咦!彩虹不見了! 「沒關係，我們回家看彩虹!」 Yellow 70 彩虹  你听!哗!哗!哗! 是什么声音? 是瀑布，好大的瀑布! 你看!那裏有一道彩虹! 你看!那裏也有一道彩虹! 咦!彩虹不见了! 「没关係，我们回家看彩虹!」", "YELLOW71": "數數看 数数看 數字 数字 Yellow 71 數數看  數數看，有幾條蛇? 四條。 數數看，有幾隻毛毛蟲? 五隻。 數數看，有幾隻螞蟻? 六隻。 數數看，有幾隻螢火蟲? 七隻。 數數看，有幾隻蜘蛛? 八隻。 數數看，有幾隻蝌蚪? 九隻。 數數看，有幾隻瓢蟲?十隻。 Yellow 71 数数看  数数看，有几条蛇? 四条。 数数看，有几隻毛毛虫? 五隻。 数数看，有几隻蚂蚁? 六隻。 数数看，有几隻萤火虫? 七隻。 数数看，有几隻蜘蛛? 八隻。 数数看，有几隻蝌蚪? 九隻。 数数看，有几隻瓢虫?十隻", "YELLOW72": "二四六八十 二四六八十 數字 数字 Yellow 72 二四六八十  牠有一個大大的身體， 兩個小小的頭， 四個圓圓的嘴， 六個方方的眼睛， 八隻長長的手， 十隻短短的腳。 牠就是怪物! Yellow 72 二四六八十  牠有一个大大的身体， 两个小小的头， 四个圆圆的嘴， 六个方方的眼睛， 八隻长长的手， 十隻短短的脚。 牠就是怪物!", "YELLOW73": "多少 多少 數字 数字 Yellow 73 多少  過生日，有禮物、蛋糕和蠟燭。 你的禮物有多少? 不多也不少。 你的小蛋糕有多少? 一人一個，剛剛好。 你的蠟燭有多少? 六歲六根，一根也不少。 Yellow 73 多少  过生日，有礼物、蛋糕和蜡烛。 你的礼物有多少? 不多也不少。 你的小蛋糕有多少? 一人一个，刚刚好。 你的蜡烛有多少? 六岁六根，一根也不少。", "YELLOW74": "第一第二第三 第一第二第三 數字 数字 Yellow 74 第一第二第三  每個小朋友都摺了紙飛機， 一、二、三，把飛機扔出去。 我的飛得最遠，是第一。 你的飛得不遠也不近，是第二。 他的飛得最近，是第三。 小胖的飛出去又飛回來， 小胖的最棒! Yellow 74 第一第二第三  每个小朋友都摺了纸飞机， 一、二、三，把飞机扔出去。 我的飞得最远，是第一。 你的飞得不远也不近，是第二。 他的飞得最近，是第三。 小胖的飞出去又飞回来， 小胖的最棒!", "YELLOW75": "第四 第四 數字 数字 Yellow 75 第四  第一張餅，翻過來， 掉在地上，狗吃了。 第二張餅，翻過來， 掉在窗台，貓舔了。 第三張餅，翻過來， 怎麼不見了? 第四張餅，翻過來，接到了! Yellow 75 第四  第一张饼，翻过来， 掉在地上，狗吃了。 第二张饼，翻过来， 掉在窗台，猫舔了。 第三张饼，翻过来， 怎么不见了? 第四张饼，翻过来，接到了! 是小丑。 看他的帽子，猜他是厨师。 看他的听筒，猜他是医生。 看他的衣服，猜他是救火员。 看他的徽章，猜他是警察。 看他的腰带，猜他是工人。 看我的校服，就知道我是学生。", "YELLOW97": "長大要做什麼 长大要做什么 職業 职业 Yellow 97 長大要做什麼  大人愛問我們:「你長大要做什麼?」 有的人要當舞蹈家， 有的人要當老師， 有的人要當廚師， 有的人要當畫家， 有的人要當太空人。 我說:「我要當小孩，不想長大!」 Yellow 97 长大要做什么  大人爱问我们:「你长大要做什么?」 有的人要当舞蹈家， 有的人要当老师， 有的人要当厨师， 有的人要当画家， 有的人要当太空人。 我说:「我要当小孩，不想长大!」", "YELLOW98": "坐直升機 坐直升机 交通工具 交通工具 Yellow 98 坐直升機  這個地方有很多交通工具。 坐電車，我看到很多店。 坐地下鐵，我看到很多人。 坐渡輪，我看到很多船。 坐雙層巴士，我看到很多房子。 坐纜車，我看到高山和的大海。 坐直升機，我看到這個地方，真美! Yellow 98 坐直升机  这个地方有很多交通工具。 坐电车，我看到很多店。 坐地下铁，我看到很多人。 坐渡轮，我看到很多船。 坐双层巴士，我看到很多房子。 坐缆车，我看到高山和的大海。 坐直升机，我看到这个地方，真美!", "YELLOW99": "不同的車 不同的车 交通工具 交通工具 Yellow 99 不同的車  我先坐計程車， 到了地鐵站，去坐地鐵。 再坐機場快線，去機場， 又坐飛機，去中國。 然後，坐機場巴士到纜車站。 最後，坐纜車上山， 我終於可以滑雪了! Yellow 99 不同的车  我先坐计程车， 到了地铁站，去坐地铁。 再坐机场快线，去机场， 又坐飞机，去中国。 然后，坐机场巴士到缆车站。 最后，坐缆车上山， 我终于可以滑雪了!", "YELLOW100": "坐什麼車快 坐什么车快 交通工具 交通工具 Yellow 100坐什麼車快  騎自行車比走路快， 坐電車比騎自行車快， 坐公共汽車比坐電車快， 坐汽車比坐公共汽車快， 坐火車比坐汽車快， 坐飛機比坐火車快， 火箭最快! Yellow 100坐什么车快  骑自行车比走路快， 坐电车比骑自行车快， 坐公共汽车比坐电车快， 坐汽车比坐公共汽车快， 坐火车比坐汽车快， 坐飞机比坐火车快， 火箭最快!", "GREEN1": "說秘密 说秘密 日常活動 日常活动 Green 1 說秘密  青蛙有一個秘密，牠把秘密告訴了小蝸牛。 小蝸牛把秘密告訴了小烏龜。 小烏龜又告訴了小金魚。 小金魚看到青蛙說:「我知道你的秘密了!」 青蛙想:「原來，秘密是不能說的，告訴別人就不是秘密了。」 Green 1 说秘密  青蛙有一个秘密，牠把秘密告诉了小蜗牛。 小蜗牛把秘密告诉了小乌龟。 小乌龟又告诉了小金鱼。 小金鱼看到青蛙说:「我知道你的秘密了!」 青蛙想:「原来，秘密是不能说的，告诉别人就不是秘密了。」", "GREEN2": "上學 上学 日常活動 日常活动 Green 2 上學  阿姨有隻小狗，我常常抱牠、親牠。 小狗明天要上學了，我從來沒聽過，小狗也要上學。 我問阿姨:「小狗上學，是不是學中文、英文和體育?」 她說:「不是!小狗要學和不同種類、不同大小的狗做朋友。」 我對小狗說:「你真幸運!不用做功課。」 Green 2 上学  阿姨有隻小狗，我常常抱牠、亲牠。 小狗明天要上学了，我从来没听过，小狗也要上学。 我问阿姨:「小狗上学，是不是学中文、英文和体育?」 她说:「不是!小狗要学和不同种类、不同大小的狗做朋友。」 我对小狗说:「你真幸运!不用做功课。」", "GREEN3": "數一數 数一数 日常活動 日常活动 Green 3 數一數  [ 家裏有幾個人?」 弟弟數一數，少了一個人，因為忘了數自己。 「你有幾枝筆?」 弟弟數一數，少了一枝筆，因為忘了數自己手上的筆。 我們去騎馬，弟弟數一數說:「這裏共有十匹馬。」這次，他沒有忘記數自己騎的馬。 我誇他很聰明，給他十顆糖。 他放了一顆在口裏，又去數一數糖，他說:「咦!怎麼只有九顆糖呢?」 Green 3 数一数  [ 家裏有几个人?」 弟弟数一数，少了一个人，因为忘了数自己。 「你有几枝笔?」 弟弟数一数，少了一枝笔，因为忘了数自己手上的笔。 我们去骑马，弟弟数一数说:「这裏共有十匹马。」这次，他没有忘记数自己骑的马。 我夸他很聪明，给他十颗糖。 他放了一颗在口裏，又去数一数糖，他说:「咦!怎么只有九颗糖呢?」", "GREEN4": "誰是書蟲 谁是书虫 日常活動 日常活动 Green 4 誰是書蟲  有個人很愛看書。早上讀，中午讀，晚上讀。晴天讀，陰天讀，雨天讀。 在沙發上讀，在床上讀，在馬桶上讀。坐著讀，走著讀，躺著讀。 最厲害的是把書倒放在地上，他靠著牆壁做倒立，倒著讀。 你見過這樣的人嗎? 他就叫「書蟲」。 我就是一個書蟲，不過，我不是那隻會吃書的蟲。 Green 4 谁是书虫  有个人很爱看书。早上读，中午读，晚上读。晴天读，阴天读，雨天读。 在沙发上读，在床上读，在马桶上读。坐着读，走着读，躺着读。 最厉害的是把书倒放在地上，他靠着牆壁做倒立，倒着读。 你见过这样的人吗? 他就叫「书虫」。 我就是一个书虫，不过，我不是那隻会吃书的虫。", "GREEN5": "做我喜歡的事 做我喜欢的事 日常活動 日常活动 Green 5 做我喜歡的事  星期一到星期五，我要上學，學中文、英文和數學。 星期六上午，我要學游泳和打網球。下午，我要學體操和彈鋼琴。 星期天中午，我要和爺爺、奶奶吃午飯。晚上，我要和外公、外婆吃晚飯。 一個星期為什麼只有七天?我要一個星期八。 這一天，我什麼也不學，哪裏也不去，只做我喜歡的事。 Green 5 做我喜欢的事  星期一到星期五，我要上学，学中文、英文和数学。 星期六上午，我要学游泳和打网球。下午，我要学体操和弹钢琴。 星期天中午，我要和爷爷、奶奶吃午饭。晚上，我要和外公、外婆吃晚饭。 一个星期为什么只有七天?我要一个星期八。 这一天，我什么也不学，哪裏也不去，只做我喜欢的事。", "GREEN6": "捉迷藏 捉迷藏 日常活動 日常活动 Green 6 捉迷藏  只有我在家，沒人陪我玩。對了!可以和小狗、小羊和小兔捉迷藏。 「一二三四五六七八九十，躲好了沒有?」 啊! 找到你們了，小狗和小兔在床下。 可是，小羊呢? 「小朋友，你可以幫忙找一找小羊嗎?」 哦! 原來小羊躲在箱子裏面睡著了! Green 6 捉迷藏  只有我在家，没人陪我玩。对了!可以和小狗、小羊和小兔捉迷藏。 「一二三四五六七八九十，躲好了没有?」 啊! 找到你们了，小狗和小兔在床下。 可是，小羊呢? 「小朋友，你可以帮忙找一找小羊吗?」 哦! 原来小羊躲在箱子裏面睡着了!", "GREEN7": "練習 练习 日常活動 日常活动 Green 7 練習  我在電腦上，看到一隻只有兩隻腳的狗，可是，牠可以像人一樣走路。 我在電腦上，看到一個沒有手指的女孩，可是，她很會彈鋼琴。 我在電腦上，看到一個沒有雙手的人，可是，他很會用腳做衣服。 我在電腦上，看到一個沒有手和腳的人，可是，他很會游泳。 你知道為他們為什麼做得到? 原來，他們就是練習、練習再練習。 Green 7 练习  我在电脑上，看到一隻只有两隻脚的狗，可是，牠可以像人一样走路。 我在电脑上，看到一个没有手指的女孩，可是，她很会弹钢琴。 我在电脑上，看到一个没有双手的人，可是，他很会用脚做衣服。 我在电脑上，看到一个没有手和脚的人，可是，他很会游泳。 你知道为他们为什么做得到? 原来，他们就是练习、练习再练习。", "GREEN8": "玩接龍遊戲 玩接龙游戏 日常活動 日常活动 Green 8 玩接龍遊戲  接龍遊戲，你玩過吧! 中文接龍遊戲，你玩過嗎? 喝水>水草->草地->地球->球拍->拍手 中國->國家->家人->人山人海->海象 坐下->下午->午飯->飯桌->桌椅->椅子 你要不要找幾個朋友，一起玩中文接龍遊戲? Green 8 玩接龙游戏  接龙游戏，你玩过吧! 中文接龙游戏，你玩过吗? 喝水>水草->草地->地球->球拍->拍手 中国->国家->家人->人山人海->海象 坐下->下午->午饭->饭桌->桌椅->椅子 你要不要找几个朋友，一起玩中文接龙游戏?", "GREEN9": "找蛋遊戲 找蛋游戏 日常活動 日常活动 Green 9 找蛋遊戲  復活節到了，我們一家人去商場買了五個巧克力蛋。 回到家，我們一起玩找蛋遊戲，爸爸把巧克力蛋都藏起來。 在電視機面、冰箱裏面、沙發椅墊後面和書架上面，我們找到四個蛋。 但是，我們找來找去都找不到第五個蛋。爸爸說:「吃完午飯，你們再找吧!」 我們坐下來要吃午飯的時候，看到弟弟滿嘴都是巧克力。 Green 9 找蛋游戏  復活节到了，我们一家人去商场买了五个巧克力蛋。 回到家，我们一起玩找蛋游戏，爸爸把巧克力蛋都藏起来。 在电视机面、冰箱裏面、沙发椅垫后面和书架上面，我们找到四个蛋。 但是，我们找来找去都找不到第五个蛋。爸爸说:「吃完午饭，你们再找吧!」 我们坐下来要吃午饭的时候，看到弟弟满嘴都是巧克力。", "GREEN10": "學游泳 学游泳 日常活動 日常活动 Green 10 學游泳  狗爸爸和狗媽媽帶著小狗們去海邊，想要教牠們游泳。 到了海邊，牠們一個一個下車，開心地在海邊跑來跑去。 狗爸爸在海裏，小狗們站在海邊看，牠們害怕地往後退。 突然，一個大海浪沖向海邊，把小狗們捲進海裏。 牠們拼命地游向海邊，就這樣，牠們學會游泳了。 Green 10 学游泳  狗爸爸和狗妈妈带着小狗们去海边，想要教牠们游泳。 到了海边，牠们一个一个下车，开心地在海边跑来跑去。 狗爸爸在海裏，小狗们站在海边看，牠们害怕地往后退。 突然，一个大海浪冲向海边，把小狗们捲进海裏。 牠们拼命地游向海边，就这样，牠们学会游泳了。", "GREEN11": "躲貓貓 躲猫猫 日常活動 日常活动 Green 11 躲貓貓  捉迷藏又叫「躲貓貓」。一天，小象、猴子、松鼠和小貓玩「躲貓貓」。 小象躲在石頭後面，猴子躲在樹上，松鼠很快就找到牠們了。 但是，牠找不到小貓。忽然，牠聽到「喵喵」的叫聲。原來，牠躲在洞裏。 小貓說: 「我不是躲在洞裏，我是掉進洞裏!」 於是，動物們一個拉一個，把小貓救出來了。「躲貓貓」變成了「救貓貓」。 Green 11 躲猫猫  捉迷藏又叫「躲猫猫」。一天，小象、猴子、松鼠和小猫玩「躲猫猫」。 小象躲在石头后面，猴子躲在树上，松鼠很快就找到牠们了。 但是，牠找不到小猫。忽然，牠听到「喵喵」的叫声。原来，牠躲在洞裏。 小猫说: 「我不是躲在洞裏，我是掉进洞裏!」 于是，动物们一个拉一个，把小猫救出来了。「躲猫猫」变成了「救猫猫」。", "GREEN12": "燙鞦韆 烫秋千 日常活動 日常活动 Green 12 燙鞦韆  小胖在盪鞦韆，盪過來又盪遇去。我也想盪鞦韆，可是我不會。 小胖就教我，到遠一點的地方，先站好，然後跑，再跳。 我就學小胖，先站好，然後跑，再跳，結果，我飛過去了。 小胖說:「沒關係，再來一次! 到遠一點的地方。」我又先站好，然後跑，再跳。 這次，剛剛好。我好開心地盪過來又盪過去! Green 12 烫鞦韆  小胖在盪鞦韆，盪过来又盪遇去。我也想盪鞦韆，可是我不会。 小胖就教我，到远一点的地方，先站好，然后跑，再跳。 我就学小胖，先站好，然后跑，再跳，结果，我飞过去了。 小胖说:「没关係，再来一次! 到远一点的地方。」我又先站好，然后跑，再跳。 这次，刚刚好。我好开心地盪过来又盪过去!", "GREEN13": "怕鬼 怕鬼 日常活動 日常活动 Green 13 怕鬼  騎車，我怕跌下來。攀岩，我怕掉下來。 划船，我怕船翻了。沖浪，我怕沈下去。 笨豬跳，我怕高。跳傘，我怕傘不開。 朋友笑著說:「你什麼都怕，你是膽小鬼!」 我說:「不要叫我膽小鬼，因為我怕鬼!」 Green 13 怕鬼  骑车，我怕跌下来。攀岩，我怕掉下来。 划船，我怕船翻了。冲浪，我怕沉下去。 笨猪跳，我怕高。跳伞，我怕伞不开。 朋友笑着说:「你什么都怕，你是胆小鬼!」 我说:「不要叫我胆小鬼，因为我怕鬼!」", "GREEN14": "想要有一雙鞋 想要有一双鞋 日常活動 日常活动 Green 14 想要有一雙鞋  我想要有一雙鞋子，一雙神奇的鞋子。 它有小馬達，穿上它，可以跑得很快。 它有彈簧 穿上它，可以彈起來，跳過去。 它有氣墊，穿上它，可以在水面上走。 它有螺旋槳，穿上它，還可以在空中飛! Green 14 想要有一双鞋  我想要有一双鞋子，一双神奇的鞋子。 它有小马达，穿上它，可以跑得很快。 它有弹簧 穿上它，可以弹起来，跳过去。 它有气垫，穿上它，可以在水面上走。 它有螺旋桨，穿上它，还可以在空中飞!", "GREEN15": "滑滑梯 滑滑梯 日常活動 日常活动 Green 15 滑滑梯  我帶我的小狗去滑滑梯，我們慢慢地向上爬。 爬到滑梯上面，我先滑下，小狗還站在上面。 我滑下來以後，發現滑梯上面的小狗很害怕，我怎麼叫，牠也不肯滑下來! 忽然，我看到一隻大花狗沖上滑梯，牠舔舔我小狗。 接著，大花狗和我的小狗就一起滑下來了! Green 15 滑滑梯  我带我的小狗去滑滑梯，我们慢慢地向上爬。 爬到滑梯上面，我先滑下，小狗还站在上面。 我滑下来以后，发现滑梯上面的小狗很害怕，我怎么叫，牠也不肯滑下来! 忽然，我看到一隻大花狗冲上滑梯，牠舔舔我小狗。 接着，大花狗和我的小狗就一起滑下来了!", "GREEN16": "當一把傘 当一把伞 日常活動 日常活动 Green 16 當一把傘  我是一把花傘，你把我轉一轉，我就變色了。 有人用我來遮太陽，我就是陽傘。有人用我來遮雨，我就是雨傘。 不過，我喜歡有人用我來跳舞，載我轉來又轉去。 也喜歡有人用我來表演，把我頂在頭上或鼻子上。 當然，我最得意的是老公公和老婆婆把我當他們的拐杖! Green 16 当一把伞  我是一把花伞，你把我转一转，我就变色了。 有人用我来遮太阳，我就是阳伞。有人用我来遮雨，我就是雨伞。 不过，我喜欢有人用我来跳舞，载我转来又转去。 也喜欢有人用我来表演，把我顶在头上或鼻子上。 当然，我最得意的是老公公和老婆婆把我当他们的拐杖!", "GREEN17": "幫忙 帮忙 日常活動 日常活动 Green 17 幫忙  姐姐把牛奶打翻了，弟弟來幫忙，他弄得滿桌都是牛奶。 媽媽把油打翻了，弟弟來幫忙，他弄得滿地都是油。 哥哥把水彩打翻了，弟弟來幫忙，他弄得滿身都是水彩。 媽媽、哥哥和姐姐說:「你不是幫忙，你是越幫越忙!」 弟弟不明白。他問:「誰要我幫忙?我會越幫越忙!」 Green 17 帮忙  姐姐把牛奶打翻了，弟弟来帮忙，他弄得满桌都是牛奶。 妈妈把油打翻了，弟弟来帮忙，他弄得满地都是油。 哥哥把水彩打翻了，弟弟来帮忙，他弄得满身都是水彩。 妈妈、哥哥和姐姐说:「你不是帮忙，你是越帮越忙!」 弟弟不明白。他问:「谁要我帮忙?我会越帮越忙!」", "GREEN18": "騎車 骑车 日常活動 日常活动 Green 18 騎車  一隻瘦猴子，想騎腳踏車，牠的手扶著車頭，腳卻踩不到踏板。 一隻胖猴子，也想騎腳踏車，牠的腳踩到踏板，手卻扶不到車頭。 瘦猴子和胖猴子，看著腳踏車，摸摸頭。你看著我，我看著你。忽然….. 胖猴子跳到車上，瘦猴子跳到胖猴子的肩膀上。 胖猴子腳踩踏板，瘦猴子手扶車頭，牠們騎車去了。 Green 18 骑车  一隻瘦猴子，想骑脚踏车，牠的手扶着车头，脚却踩不到踏板。 一隻胖猴子，也想骑脚踏车，牠的脚踩到踏板，手却扶不到车头。 瘦猴子和胖猴子，看着脚踏车，摸摸头。你看着我，我看着你。忽然….. 胖猴子跳到车上，瘦猴子跳到胖猴子的肩膀上。 胖猴子脚踩踏板，瘦猴子手扶车头，牠们骑车去了。", "GREEN19": "放風箏 放风筝 日常活動 日常活动 Green 19 放風箏 Green 19 放風箏  我和小胖去放風箏，我用兩隻手把風箏高高地舉起來。 小胖拉著風箏的線，快快地跑。風箏在天上轉了轉，掉下來了。 我又拿起風箏，高高地舉起來，小胖又拉著風箏線要跑。 我說: 「等一等。」一陣大風吹來，我叫小胖快跑….. 小胖跑呀跑，風箏飛呀飛，飛上天空，飛到雲裏，不見了! Green 19 放风筝  我和小胖去放风筝，我用两隻手把风筝高高地举起来。 小胖拉着风筝的线，快快地跑。风筝在天上转了转，掉下来了。 我又拿起风筝，高高地举起来，小胖又拉着风筝线要跑。 我说: 「等一等。」一阵大风吹来，我叫小胖快跑….. 小胖跑呀跑，风筝飞呀飞，飞上天空，飞到云裏，不见了!", "GREEN20": "寫兒歌 写儿歌 日常活動 日常活动 Green 20 寫兒歌  老師教我們唸兒歌，他一邊唸，一邊寫。 白板上寫了: 一二三四五，上山打老虎，老虎打不到，打到小松鼠。  老師說每句話的最後一個字，聲音都有一點相同，唸起來容易又好聽。 老師也要我們試試看，寫一首自己的兒歌。 我就寫了一首兒歌: 五隻小老虎，要找母老虎，找呀找不到，找到小老鼠。 Green 20 写儿歌  老师教我们唸儿歌，他一边唸，一边写。 白板上写了: 一二三四五，上山打老虎，老虎打不到，打到小松鼠。  老师说每句话的最后一个字，声音都有一点相同，唸起来容易又好听。 老师也要我们试试看，写一首自己的儿歌。 我就写了一首儿歌: 五隻小老虎，要找母老虎，找呀找不到，找到小老鼠。", "GREEN21": "樹熊 树熊 動物 动物 Green 21 樹熊  樹熊有胖胖的身體，小小的眼睛和短短的腳。 我也有胖胖的身體，小小的眼睛和短短的腳。 我覺得當樹熊真好，每天就是吃和睡，不用上學。 所以，我告訴媽媽，我長得很像樹熊，我要當樹熊。 媽媽說:「好吧!我把你寄到澳洲當樹熊。記得，你只可以吃樹葉喔!」 Green 21 树熊  树熊有胖胖的身体，小小的眼睛和短短的脚。 我也有胖胖的身体，小小的眼睛和短短的脚。 我觉得当树熊真好，每天就是吃和睡，不用上学。 所以，我告诉妈妈，我长得很像树熊，我要当树熊。 妈妈说:「好吧!我把你寄到澳洲当树熊。记得，你只可以吃树叶喔!」", "GREEN22": "兩隻豬 两只猪 動物 动物 Green 22 兩隻豬  豬爸爸和豬媽媽有兩個豬寶寶，一隻叫乾乾淨淨，一隻叫亂七八糟。 乾乾淨淨當然是喜歡把家裏弄得又乾淨又整齊。 可是，亂七八糟來了，就把家裏弄得又髒又亂，很不乾淨。 亂七八糟說:「豬就是不乾淨、不整齊的，我們喜歡又髒又亂。」 乾乾淨淨說:「難道，我們又乾淨又整齊，就不是豬了嗎?」 Green 22 两隻猪  猪爸爸和猪妈妈有两个猪宝宝，一隻叫乾乾淨淨，一隻叫乱七八糟。 乾乾淨淨当然是喜欢把家裏弄得又乾淨又整齐。 可是，乱七八糟来了，就把家裏弄得又髒又乱，很不乾淨。 乱七八糟说:「猪就是不乾淨、不整齐的，我们喜欢又髒又乱。」 乾乾淨淨说:「难道，我们又乾淨又整齐，就不是猪了吗?」", "GREEN23": "螢火蟲 萤火虫 動物 动物 Green 23 螢火蟲  弟弟在草地上走著，忽然，草裏飛出好多好多的螢火蟲。 牠們一閃一閃的，好像星星，又好像小燈籠，十分美麗。 弟弟雙手一合，就捉到了一隻螢火蟲。 他仔細地看看螢火蟲，發現牠的屁股會發亮。 晚上，弟弟在屁股上綁了一根螢光棒，他跳啊跳地說:「我是螢火蟲了!」 Green 23 萤火虫  弟弟在草地上走着，忽然，草裏飞出好多好多的萤火虫。 牠们一闪一闪的，好像星星，又好像小灯笼，十分美丽。 弟弟双手一合，就捉到了一隻萤火虫。 他仔细地看看萤火虫，发现牠的屁股会发亮。 晚上，弟弟在屁股上绑了一根萤光棒，他跳啊跳地说:「我是萤火虫了!」", "GREEN24": "烏鴉 乌鸦 動物 动物 Green 24 烏鴉  弟弟在讀一本圖畫書，他指著上面的字讀:「\"烏\"鴉。」 哥哥聽到了說:「應該讀\"烏\"鴉，不是\"鳥\"鴉!」 哥哥說:「那個像\"鳥\"的字，它唸\"烏\"，是黑色的意思。」 弟弟看看圖畫上的鳥，牠身上的羽毛都是黑色的。 弟弟問:「是烏龜的\"烏\"嗎? 可是，烏龜不是黑色的，為什麼叫\"烏\"龜?」 Green 24 乌鸦  弟弟在读一本图画书，他指着上面的字读:「\"乌\"鸦。」 哥哥听到了说:「应该读\"乌\"鸦，不是\"鸟\"鸦!」 哥哥说:「那个像\"鸟\"的字，它唸\"乌\"，是黑色的意思。」 弟弟看看图画上的鸟，牠身上的羽毛都是黑色的。 弟弟问:「是乌龟的\"乌\"吗? 可是，乌龟不是黑色的，为什么叫\"乌\"龟?」", "GREEN25": "老鼠和貓兒 老鼠和猫儿 動物 动物 Green 25 老鼠和貓兒  老鼠都怕貓兒。可是，我家的老鼠和貓兒是好朋友。 一天，我打開冰箱，沒有看到老鼠跑進去了。 砰!冰箱門關上了。可是，貓兒卻一直抓冰箱的門。 我說:「貓兒，你想吃什麼?」然後，我打開冰箱門，老鼠跑了出來! 老鼠冷得發抖!貓兒來了，牠抱著老鼠，老鼠就緊緊地靠著牠。 Green 25 老鼠和猫儿  老鼠都怕猫儿。可是，我家的老鼠和猫儿是好朋友。 一天，我打开冰箱，没有看到老鼠跑进去了。 砰!冰箱门关上了。可是，猫儿却一直抓冰箱的门。 我说:「猫儿，你想吃什么?」然后，我打开冰箱门，老鼠跑了出来! 老鼠冷得发抖!猫儿来了，牠抱着老鼠，老鼠就紧紧地靠着牠。", "GREEN26": "小鴨找媽媽 小鸭找妈妈 動物 动物 Green 26 小鴨找媽媽  小鴨找媽媽，牠看到一條蟲以為是蚯蚓，小鳥說:「那是蜈蚣，不能吃。」 小鴨看到鱷魚，鱷魚要帶小鴨找媽媽。小鳥說:「那是鱷魚，牠要吃你!」 小鴨看到小鳥後面有大鳥，牠說:「你後面有大鳥，牠要吃你!」 小鳥笑了，牠說:「牠是我媽媽，牠不會吃我!」 小鳥說:「你坐到我媽媽的背上，我們可以飛上天，幫你找媽媽。」 Green 26 小鸭找妈妈  小鸭找妈妈，牠看到一条虫以为是蚯蚓，小鸟说:「那是蜈蚣，不能吃。」 小鸭看到鳄鱼，鳄鱼要带小鸭找妈妈。小鸟说:「那是鳄鱼，牠要吃你!」 小鸭看到小鸟后面有大鸟，牠说:「你后面有大鸟，牠要吃你!」 小鸟笑了，牠说:「牠是我妈妈，牠不会吃我!」 小鸟说:「你坐到我妈妈的背上，我们可以飞上天，帮你找妈妈。」", "GREEN27": "小豬不笨 小猪不笨 動物 动物 Green 27 小豬不笨  小豬媽媽要小豬吃菜。小豬說那個菜看起來黑黑的，不好吃。 媽媽說: 「你沒有吃，怎麼知道不好吃? 」小豬試著吃了，發現很好吃。 小豬看到青蛙，想跟牠玩。青蛙說小豬看起來笨笨的，不會玩。 小豬說:「你沒有跟我玩，怎麼知道我不會玩?」 青蛙試著和小豬玩，牠發現小豬很會玩。 Green 27 小猪不笨  小猪妈妈要小猪吃菜。小猪说那个菜看起来黑黑的，不好吃。 妈妈说: 「你没有吃，怎么知道不好吃? 」小猪试着吃了，发现很好吃。 小猪看到青蛙，想跟牠玩。青蛙说小猪看起来笨笨的，不会玩。 小猪说:「你没有跟我玩，怎么知道我不会玩?」 青蛙试着和小猪玩，牠发现小猪很会玩。", "GREEN28": "動物的叫聲 动物的叫声 動物 动物 Green 28 動物的叫聲 Green 28 動物的叫聲  一天早上，森林裏的小鳥吱吱吱地叫。青蛙說: 「你們很吵，可以不要叫嗎?」 小鳥說:「可是，晚上你們呱呱呱地叫，你們也很吵啊!」 大樹說:「你們一個早上吵，一個晚上吵，吵死人了!」 於是，大樹用樹葉塞住小鳥和青蛙的嘴巴，不讓牠們叫。 第二天，森林裏很安靜。大樹覺得沒有叫聲，好像沒有朋友了! Green 28 动物的叫声  一天早上，森林裏的小鸟吱吱吱地叫。青蛙说: 「你们很吵，可以不要叫吗?」 小鸟说:「可是，晚上你们呱呱呱地叫，你们也很吵啊!」 大树说:「你们一个早上吵，一个晚上吵，吵死人了!」 于是，大树用树叶塞住小鸟和青蛙的嘴巴，不让牠们叫。 第二天，森林裏很安静。大树觉得没有叫声，好像没有朋友了!", "GREEN29": "北極熊 北极熊 動物 动物 Green 29 北極熊  摩摩和爸爸坐雪橇去打魚，他們常常看到一隻北極熊。 摩摩常常丟魚給牠，牠會高興地在地上滾一滾。 冬天到了，摩摩都沒有看到北極熊，以為他冬眠了。可是，爸爸說北極熊不會冬眠。 春天來了，摩摩看到北極熊，後面跟著兩隻熊寶寶，向他慢慢走來。 原來，牠當媽媽了，冬天正牠生小寶寶的時候。 Green 29 北极熊  摩摩和爸爸坐雪橇去打鱼，他们常常看到一隻北极熊。 摩摩常常丢鱼给牠，牠会高兴地在地上滚一滚。 冬天到了，摩摩都没有看到北极熊，以为他冬眠了。可是，爸爸说北极熊不会冬眠。 春天来了，摩摩看到北极熊，后面跟着两隻熊宝宝，向他慢慢走来。 原来，牠当妈妈了，冬天正牠生小宝宝的时候。", "GREEN30": "黑熊媽媽說話 黑熊妈妈说话 動物 动物 Green 30 黑熊媽媽說話  黑熊媽媽在樹下休息。黑熊哥哥和妹妹爬到媽媽身上。 牠們又爬到樹幹上，原來，小黑熊是很會爬樹的。 黑熊哥哥和妹妹爬到很高的地方玩耍。忽然，牠們聽到樹下媽媽的吼聲。 黑熊妹妹看著哥哥，好像在問:「媽媽在說什麼?」 哥哥告訴妹妹，媽媽說:「吃飯了，快下來!」牠們快快跳到媽媽身上吃奶。 Green 30 黑熊妈妈说话  黑熊妈妈在树下休息。黑熊哥哥和妹妹爬到妈妈身上。 牠们又爬到树干上，原来，小黑熊是很会爬树的。 黑熊哥哥和妹妹爬到很高的地方玩耍。忽然，牠们听到树下妈妈的吼声。 黑熊妹妹看着哥哥，好像在问:「妈妈在说什么?」 哥哥告诉妹妹，妈妈说:「吃饭了，快下来!」牠们快快跳到妈妈身上吃奶。", "GREEN31": "動物幫手 动物帮手 動物 动物 Green 31 動物幫手  動物園有動物管理員，他要照顧動物園裏的動物。 一天，動物管理員非常忙，因為有小老虎出生了。 他需要一個幫手，幫他照顧剛出生的小老虎。 他想:「我的幫手要不怕小動物，才會是一個好幫手。」 後來，他找到了一個好幫手，牠非常會照顧小動物。 Green 31 动物帮手  动物园有动物管理员，他要照顾动物园裏的动物。 一天，动物管理员非常忙，因为有小老虎出生了。 他需要一个帮手，帮他照顾刚出生的小老虎。 他想:「我的帮手要不怕小动物，才会是一个好帮手。」 后来，他找到了一个好帮手，牠非常会照顾小动物。", "GREEN32": "蜘蛛 蜘蛛 動物 动物 Green 32 蜘蛛  一隻蜘蛛掉進浴缸裏了，牠想爬出來，可是，牠爬上去又掉下來了。 雖然我有點怕蜘蛛，但是我還是想幫牠。 蜘蛛又向上爬的時候，我拿了一張報紙，發在浴缸底。 蜘蛛爬到一半，就在報紙上了。我把報紙拿到外面樹下。 第二天，樹枝上有個美麗的蜘蛛網! Green 32 蜘蛛  一隻蜘蛛掉进浴缸裏了，牠想爬出来，可是，牠爬上去又掉下来了。 虽然我有点怕蜘蛛，但是我还是想帮牠。 蜘蛛又向上爬的时候，我拿了一张报纸，发在浴缸底。 蜘蛛爬到一半，就在报纸上了。我把报纸拿到外面树下。 第二天，树枝上有个美丽的蜘蛛网!", "GREEN33": "海獺 海獭 動物 动物 Green 33 海獺  海獺住在海裏，有胖胖的身體和圓圓的頭。 海獺是很聰明的動物，牠會拿石頭膏開貝殼，吃裏面的肉。 牠們常常一起手牽手，捲在海藻裏睡覺。 這樣，海浪來了，就不會把牠們沖走了。 牠們還常常一起玩遊戲，海獺真的很聰明呢! Green 33 海獭  海獭住在海裏，有胖胖的身体和圆圆的头。 海獭是很聪明的动物，牠会拿石头膏开贝壳，吃裏面的肉。 牠们常常一起手牵手，捲在海藻裏睡觉。 这样，海浪来了，就不会把牠们冲走了。 牠们还常常一起玩游戏，海獭真的很聪明呢!", "GREEN34": "狗兒一家 狗儿一家 動物 动物 Green 34 狗兒一家 Green 34 狗兒一家  我和媽媽去「流浪狗中心」，領養了一隻大花狗。 爸爸說再領養一隻，讓牠有個伴。所以，我們就有了兩隻大花狗了。 一天，哥哥帶了兩隻小花狗回家，他說:「這是我朋友送給我的小狗。」 小花狗看見了大花狗，就跑過去舔牠們。 大花狗也舔一舔小花狗，牠們好像是一家人! Green 34 狗儿一家  我和妈妈去「流浪狗中心」，领养了一隻大花狗。 爸爸说再领养一隻，让牠有个伴。所以，我们就有了两隻大花狗了。 一天，哥哥带了两隻小花狗回家，他说:「这是我朋友送给我的小狗。」 小花狗看见了大花狗，就跑过去舔牠们。 大花狗也舔一舔小花狗，牠们好像是一家人!", "GREEN35": "小藍企鵝 小蓝企鹅 動物 动物 Green 35 小藍企鵝  企鵝有很多種，有的大，有的小，顏色也不相同。 在澳洲，有一種小企鵝，有藍色的毛，人們叫牠們小藍企鵝。 海邊岸上有很多小藍企鵝的家，每個家裏都有小寶寶。 天黑了，小藍企鵝會跳上海邊，走回岸上的家，餵牠們的小寶寶。 牠們很厲害，每隻都會找到自己的家，不會走錯的! Green 35 小蓝企鹅  企鹅有很多种，有的大，有的小，颜色也不相同。 在澳洲，有一种小企鹅，有蓝色的毛，人们叫牠们小蓝企鹅。 海边岸上有很多小蓝企鹅的家，每个家裏都有小宝宝。 天黑了，小蓝企鹅会跳上海边，走回岸上的家，餵牠们的小宝宝。 牠们很厉害，每隻都会找到自己的家，不会走错的!", "GREEN36": "小動物 小动物 動物 动物 Green 36 小動物  小老鼠不開心，因為大動物不跟牠玩，說牠太小了。 小老鼠想: 我比蝴蝶、蜻蜓大，可是牠們是昆蟲。 小老鼠覺得小松鼠和牠差不多大小。於是，牠去找小松鼠玩。 牠和小松鼠做了好朋友，還發明了很多遊戲 。 大動物來了，想跟小老鼠和小松鼠玩。牠們說:「你們太大了，不能玩我們的遊戲。」 Green 36 小动物  小老鼠不开心，因为大动物不跟牠玩，说牠太小了。 小老鼠想: 我比蝴蝶、蜻蜓大，可是牠们是昆虫。 小老鼠觉得小松鼠和牠差不多大小。于是，牠去找小松鼠玩。 牠和小松鼠做了好朋友，还发明了很多游戏 。 大动物来了，想跟小老鼠和小松鼠玩。牠们说:「你们太大了，不能玩我们的游戏。」", "GREEN37": "瓢蟲 瓢虫 動物 动物 Green 37 瓢蟲  蟲有很多種，有的是益蟲，有的是害蟲。 我是飄蟲，身上有圓圓的斑點，漂亮。 我住在花上、樹上和草上。我最愛吃一種害蟲叫蚜蟲。 我最怕農藥，農藥是用來殺死害蟲的。 結果，它把我也殺死了。現在誰來吃害蟲呢? Green 37 瓢虫  虫有很多种，有的是益虫，有的是害虫。 我是飘虫，身上有圆圆的斑点，漂亮。 我住在花上、树上和草上。我最爱吃一种害虫叫蚜虫。 我最怕农药，农药是用来杀死害虫的。 结果，它把我也杀死了。现在谁来吃害虫呢?", "GREEN38": "松鼠 松鼠 動物 动物 Green 38 松鼠  在公園裏面，常常有可愛的松鼠，牠們跑得很快。 牠們爬樹更快，還會「咻」地一聲，跳到另一根樹枝上。 有一天，我看到一隻松鼠，嘴巴一直動，好像在和我說話。 忽然，牠不動了，看著我，好像要我幫牠拍照。 「咔」地一聲，我拍了一張照片。「你看! 松鼠很可愛吧!」 Green 38 松鼠  在公园裏面，常常有可爱的松鼠，牠们跑得很快。 牠们爬树更快，还会「咻」地一声，跳到另一根树枝上。 有一天，我看到一隻松鼠，嘴巴一直动，好像在和我说话。 忽然，牠不动了，看着我，好像要我帮牠拍照。 「咔」地一声，我拍了一张照片。「你看! 松鼠很可爱吧!」", "GREEN39": "綿羊 绵羊 動物 动物 Green 39 綿羊  小胖和家人去加拿大度假。爸爸和媽媽帶他去農場，看「剪羊毛」。 農場主人拿著剃刀，一會兒，綿羊身上的毛都被剃光了。 媽媽說我們可以用這些羊毛，織毛衣來穿。 小胖看到綿羊光禿禿的身體，心想:牠們一定很冷。 他對媽媽說: 「你可以織多毛衣，給這些綿羊穿嗎? Green 39 綿羊  小胖和家人去加拿大度假。爸爸和妈妈带他去农场，看「剪羊毛」。 农场主人拿着剃刀，一会儿，绵羊身上的毛都被剃光了。 妈妈说我们可以用这些羊毛，织毛衣来穿。 小胖看到绵羊光秃秃的身体，心想:牠们一定很冷。 他对妈妈说: 「你可以织多毛衣，给这些绵羊穿吗?", "GREEN40": "動物玩偶 动物玩偶 動物 动物 Green 40 動物玩偶  我用動物玩偶，把我的房間佈置成動物園。 我帶弟弟到我的動物園，他開心地摸摸每個動物。 晚上，我回到房間，發現我的動物玩偶都不見了。 忽然，我聽到弟弟在叫:「你們不要吃我!」 原來，動物玩偶都在弟弟床上，他躺在牠們中間睡著了! Green 40 动物玩偶  我用动物玩偶，把我的房间佈置成动物园。 我带弟弟到我的动物园，他开心地摸摸每个动物。 晚上，我回到房间，发现我的动物玩偶都不见了。 忽然，我听到弟弟在叫:「你们不要吃我!」 原来，动物玩偶都在弟弟床上，他躺在牠们中间睡着了!", "GREEN41": "動物會保護自己 动物会保护自己 動物 动物 Green 41 動物會保護自己  爸爸讀書給弟弟聽，爸爸說:「變色龍會變色，讓你找不到牠。」 「蝴蝶會不動，讓你看不到牠。」「臭鼬會噴臭氣，讓你躲開牠。」 「刺蝟有刺，讓你不敢捉牠。」「墨魚會噴黑汁，讓你看不見牠。」 弟弟馬上去躲起來，讓爸爸找不到他。 可是，狗狗在弟弟躲的地方，不停地汪汪叫! Green 41 动物会保护自己  爸爸读书给弟弟听，爸爸说:「变色龙会变色，让你找不到牠。」 「蝴蝶会不动，让你看不到牠。」「臭鼬会喷臭气，让你躲开牠。」 「刺蝟有刺，让你不敢捉牠。」「墨鱼会喷黑汁，让你看不见牠。」 弟弟马上去躲起来，让爸爸找不到他。 可是，狗狗在弟弟躲的地方，不停地汪汪叫!", "GREEN42": "螃蟹 螃蟹 動物 动物 Green 42 螃蟹  在海邊，你可以玩沙、玩水，還可以捉螃蟹。 有一次，我看到一隻螃蟹，可是，牠很快就逃進洞裏。 我把手伸進洞裏捉牠，牠卻夾住我的手指，很痛…... 我趕快把手拉出來，螃蟹也一起被拉出來了。 唉! 不知道是我捉螃蟹，還是螃蟹捉我呢? Green 42 螃蟹  在海边，你可以玩沙、玩水，还可以捉螃蟹。 有一次，我看到一隻螃蟹，可是，牠很快就逃进洞裏。 我把手伸进洞裏捉牠，牠却夹住我的手指，很痛…... 我赶快把手拉出来，螃蟹也一起被拉出来了。 唉! 不知道是我捉螃蟹，还是螃蟹捉我呢?", "GREEN43": "刺蝟 刺猬 動物 动物 Green 43 刺蝟  刺蝟的身上有很多刺，別的動物怕牠們的刺。 有一天，刺蝟刺了滿身的水果，要把它們帶回家吃。 別的動物笑牠，你身上有很多水果，可是，你的腳很短，拿不到也吃不到啊! 又來了一隻刺蝟，身上也刺滿了水果。 牠們說:「你們忘了，我們是互相幫忙的動物!」 Green 43 刺蝟  刺蝟的身上有很多刺，别的动物怕牠们的刺。 有一天，刺蝟刺了满身的水果，要把它们带回家吃。 别的动物笑牠，你身上有很多水果，可是，你的脚很短，拿不到也吃不到啊! 又来了一隻刺蝟，身上也刺满了水果。 牠们说:「你们忘了，我们是互相帮忙的动物!」", "GREEN44": "小河馬和大烏龜 小河马和大乌龟 動物 动物 Green 44 小河馬和大烏龜  有一天，一隻小河馬失去了媽媽。 有人把牠帶到野生動物園，那裏有一隻三十歲的大烏龜。 小河馬走過靠著牠，牠天天跟著大烏龜。 大烏龜成了牠的新媽媽，原來，動物會領養別的動物孩子。 就好像我的媽媽，領養我一樣。 Green 44 小河马和大乌龟  有一天，一隻小河马失去了妈妈。 有人把牠带到野生动物园，那裏有一隻三十岁的大乌龟。 小河马走过靠着牠，牠天天跟着大乌龟。 大乌龟成了牠的新妈妈，原来，动物会领养别的动物孩子。 就好像我的妈妈，领养我一样。", "GREEN45": "松鼠玩偶 松鼠玩偶 動物 动物 Green 45 松鼠玩偶  我帶著我的松鼠玩偶，去公園玩。 我要盪鞦韆，我把松鼠玩偶放在草地上。 一隻真的松鼠來了，牠看著松鼠玩偶，然後跑走了。 一會兒，牠又回來了，手裏拿著松果， 牠把松果放在松鼠玩偶前面，還輕輕地靠著松鼠玩偶。 Green 45 松鼠玩偶  我带着我的松鼠玩偶，去公园玩。 我要盪鞦韆，我把松鼠玩偶放在草地上。 一隻真的松鼠来了，牠看着松鼠玩偶，然后跑走了。 一会儿，牠又回来了，手裏拿着松果， 牠把松果放在松鼠玩偶前面，还轻轻地靠着松鼠玩偶。", "GREEN46": "噴水的龍 喷水的龙 動物 动物 Green 46 噴水的龍  龍媽媽生了很多小龍，每隻小龍都會噴火，但是有一隻只會噴水。 噴水龍問媽媽:「為什麼別的龍都噴火，很厲害，我只會噴水?」 龍媽媽告訴牠，噴水的龍才厲害，因為火都怕水。 牠說:「你看! 人人需要水，家家需要水。」 噴水龍想: 難怪，家家都有「水龍頭，但是沒有 「火龍頭」。 Green 46 喷水的龙  龙妈妈生了很多小龙，每隻小龙都会喷火，但是有一隻只会喷水。 喷水龙问妈妈:「为什么别的龙都喷火，很厉害，我只会喷水?」 龙妈妈告诉牠，喷水的龙才厉害，因为火都怕水。 牠说:「你看! 人人需要水，家家需要水。」 喷水龙想: 难怪，家家都有「水龙头，但是没有 「火龙头」。", "GREEN47": "蓋房子 盖房子 家/家人 家/家人 Green 47 蓋房子  老鼠一家住在破鞋子裏，風吹雨打，更怕大貓來捉。 爸爸說:「我們要蓋個好房子，不怕風吹雨打，也不怕大貓來捉。」 爺爺和奶奶蓋牆壁，爸爸和媽媽蓋屋頂。 哥哥和姊姊做大門，弟弟和妹妹做窗戶。 房子蓋好了，沒有風也沒有雨，大貓來了也不怕。 Green 47 盖房子  老鼠一家住在破鞋子裏，风吹雨打，更怕大猫来捉。 爸爸说:「我们要盖个好房子，不怕风吹雨打，也不怕大猫来捉。」 爷爷和奶奶盖牆壁，爸爸和妈妈盖屋顶。 哥哥和姊姊做大门，弟弟和妹妹做窗户。 房子盖好了，没有风也没有雨，大猫来了也不怕。", "GREEN48": "奶奶 奶奶 家/家人 家/家人 Green 48 奶奶  奶奶有一條項鏈，她說等我長大了要給我。 可是，她怕忘了放項鍊的地方，要我寫張紙條。 她把紙條放好了。可是，她又怕忘了放紙條的地方，要我寫:「紙條放在…..]  於是我寫了:「紙條放在…...] 。我問奶奶:「那要寫多少張紙條啊?」 我說: 「你還是現在就把項鏈送給我吧!」 Green 48 奶奶  奶奶有一条项链，她说等我长大了要给我。 可是，她怕忘了放项鍊的地方，要我写张纸条。 她把纸条放好了。可是，她又怕忘了放纸条的地方，要我写:「纸条放在…..]  于是我写了:「纸条放在…...] 。我问奶奶:「那要写多少张纸条啊?」 我说: 「你还是现在就把项链送给我吧!」", "GREEN49": "爸爸沒回家 爸爸没回家 家/家人 家/家人 Green 49 爸爸沒回家  下雨天，小鴨爸爸看到家裏的屋頂漏水了。 牠拿了工具箱和梯子，爬上去修屋頂了。 小鴨媽媽開門，推倒了梯子，就把梯子放回原來的地方。 天黑了，鴨媽媽覺得很奇怪，鴨爸爸怎麼還沒回家? 爸爸不見了，小鴨們傷心地哭了，牠們不知道原來爸爸就在屋頂上! Green 49 爸爸没回家  下雨天，小鸭爸爸看到家裏的屋顶漏水了。 牠拿了工具箱和梯子，爬上去修屋顶了。 小鸭妈妈开门，推倒了梯子，就把梯子放回原来的地方。 天黑了，鸭妈妈觉得很奇怪，鸭爸爸怎么还没回家? 爸爸不见了，小鸭们伤心地哭了，牠们不知道原来爸爸就在屋顶上!", "GREEN50": "會飛的房子 会飞的房子 家/家人 家/家人 Green 50 會飛的房子  我去看電影，電影裏有個房子，綁了很多氣球就飛起來了。 我希望我們家的房子也可以飛。媽媽說那是電影裏的房子，不是真的。 我只好自己做夢，夢裏面的房子，綁了氣球也會飛。 後來，氣球一個一個破了，房子掉下來，我嚇醒了.  哥哥對我說:「現在有飛機旅館，你不用做夢了!」 Green 50 会飞的房子  我去看电影，电影裏有个房子，绑了很多气球就飞起来了。 我希望我们家的房子也可以飞。妈妈说那是电影裏的房子，不是真的。 我只好自己做梦，梦裏面的房子，绑了气球也会飞。 后来，气球一个一个破了，房子掉下来，我吓醒了.  哥哥对我说:「现在有飞机旅馆，你不用做梦了!」", "GREEN51": "媽媽愛誰多一點 妈妈爱谁多一点 家/家人 家/家人 Green 51 媽媽愛誰多一點 姐姐和我是雙胞胎。我問媽媽愛誰多一點? 媽媽說:「你們都是從我肚子裏出來的，我兩個都愛!」 我覺得不對，媽媽應該要愛我多一點。媽媽想知道為什麼?  我說:「姐姐比我早三分鐘出來，你已經多愛她三分鐘了。」 「所以，現在你應該要愛我多一點!」 Green 51 妈妈爱谁多一点  姐姐和我是双胞胎。我问妈妈爱谁多一点? 妈妈说:「你们都是从我肚子裏出来的，我两个都爱!」 我觉得不对，妈妈应该要爱我多一点。妈妈想知道为什么?  我说:「姐姐比我早三分钟出来，你已经多爱她三分钟了。」 「所以，现在你应该要爱我多一点!」", "GREEN52": "狗狗和我 狗狗和我 家/家人 家/家人 Green 52 狗狗和我  狗狗在門外用爪子抓門，牠想進我的房間。 我打開門對狗狗說:「你今天不乖，不可以進我的房間。」 狗狗在門外嗚嗚地叫，好像很傷心地在哭。 我也傷心地哭了，我去把門打開，讓狗狗進來。 狗狗撲到我的身上，用舌頭舔我的眼淚。 Green 52 狗狗和我  狗狗在门外用爪子抓门，牠想进我的房间。 我打开门对狗狗说:「你今天不乖，不可以进我的房间。」 狗狗在门外呜呜地叫，好像很伤心地在哭。 我也伤心地哭了，我去把门打开，让狗狗进来。 狗狗扑到我的身上，用舌头舔我的眼泪。", "GREEN53": "家人聽對了嗎 家人听对了吗 家/家人 家/家人 Green 53 家人聽對了嗎  媽媽要花，可是，妹妹拿畫給她。 爺爺要扇，可是，弟弟拿傘給他。 姐姐要花貓，可是，哥哥拿花帽給她。 奶奶要梳子，可是，弟弟拿樹枝給她。 爸爸要飛機，可是媽媽拿肥雞給他! Green 53 家人听对了吗  妈妈要花，可是，妹妹拿画给她。 爷爷要扇，可是，弟弟拿伞给他。 姐姐要花猫，可是，哥哥拿花帽给她。 奶奶要梳子，可是，弟弟拿树枝给她。 爸爸要飞机，可是妈妈拿肥鸡给他!", "GREEN54": "海盜弟弟 海盗弟弟 家/家人 家/家人 Green 54 海盜弟弟  我幫弟弟做了一把劍，姐姐幫他做了一個眼罩。 弟弟穿了橫紋衣服，又戴上媽媽做的海盜帽子。 他跑到媽媽那裏:「我是海盜，把寶藏給我。」 媽媽把很多零錢給了弟弟，他很高興地數錢。 然後，弟弟把錢都放進小豬存錢筒裏面了。 Green 54 海盗弟弟  我帮弟弟做了一把剑，姐姐帮他做了一个眼罩。 弟弟穿了横纹衣服，又戴上妈妈做的海盗帽子。 他跑到妈妈那裏:「我是海盗，把宝藏给我。」 妈妈把很多零钱给了弟弟，他很高兴地数钱。 然后，弟弟把钱都放进小猪存钱筒裏面了。", "GREEN55": "家裏有聲音 家里有声音 家/家人 家/家人 Green 55 家裏有聲音  晚上，我在睡覺，聽到一個聲音，嚇得我….. 跑到姐姐的房間去。姐姐也聽到一個聲音，她和我一起…. 跑到爸爸、媽媽的臥房。爸爸、媽媽也聽到了，他們拿著手電筒…... 我們跟在爸媽後面走到客廳，看到桌上的杯子倒了…... 啊! 原來是一隻小鳥困在客廳裏了，爸爸把窗戶開大一點，讓牠飛走了。 Green 55 家裏有声音  晚上，我在睡觉，听到一个声音，吓得我….. 跑到姐姐的房间去。姐姐也听到一个声音，她和我一起…. 跑到爸爸、妈妈的卧房。爸爸、妈妈也听到了，他们拿着手电筒…... 我们跟在爸妈后面走到客厅，看到桌上的杯子倒了…... 啊! 原来是一隻小鸟困在客厅裏了，爸爸把窗户开大一点，让牠飞走了。", "GREEN56": "媽媽出差 妈妈出差 家/家人 家/家人 Green 56 媽媽出差  放學回家，沒有看到媽媽。我問爸爸:「媽媽呢?」 爸爸說媽媽「出差」了。我問: 「什麼是出差?」 爸爸說「出差」就是要到別的地方工作幾天，不回家。 晚上，爸爸講故事的時候，我有點兒想媽媽。 媽媽終於回家了，我跳到她身上說:「下次，我要和你一起\"出差\"!」 Green 56 媽媽出差  放学回家，没有看到妈妈。我问爸爸:「妈妈呢?」 爸爸说妈妈「出差」了。我问: 「什么是出差?」 爸爸说「出差」就是要到别的地方工作几天，不回家。 晚上，爸爸讲故事的时候，我有点儿想妈妈。 妈妈终于回家了，我跳到她身上说:「下次，我要和你一起\"出差\"!」", "GREEN57": "花園房子 花园房子 家/家人 家/家人 Green 57 花園房子  小胖說他美國的家有花園，裏面有花，也有水果樹。 花園旁邊有個游泳池，後面是空地，可以騎腳踏車。 我聽了，也想有個這樣的花園房子。可是，我住在高樓大廈裏面。 我想想，就畫了一個有花園的家，花園旁邊也有個游泳池…... 當然還要有我，在空地上騎腳踏車! Green 57 花园房子  小胖说他美国的家有花园，裏面有花，也有水果树。 花园旁边有个游泳池，后面是空地，可以骑脚踏车。 我听了，也想有个这样的花园房子。可是，我住在高楼大厦裏面。 我想想，就画了一个有花园的家，花园旁边也有个游泳池…... 当然还要有我，在空地上骑脚踏车!", "GREEN58": "把弟弟送給你 把弟弟送给你 家/家人 家/家人 Green 58 把弟弟送給你  我有一個討厭的弟弟，他總是和我搶玩具。 他還會亂畫我的本子。所以，我決定把他送給別人。 阿姨來我的家，我把弟弟送給她，阿姨把弟弟帶走了。 現在，我只能自己玩了，我開始想弟弟…... 我打電話給阿姨說:「你把弟弟還給我吧!」 Green 58 把弟弟送给你  我有一个讨厌的弟弟，他总是和我抢玩具。 他还会乱画我的本子。所以，我决定把他送给别人。 阿姨来我的家，我把弟弟送给她，阿姨把弟弟带走了。 现在，我只能自己玩了，我开始想弟弟…... 我打电话给阿姨说:「你把弟弟还给我吧!」", "GREEN59": "我不貪心 我不贪心 家/家人 家/家人 Green 59 我不貪心  爸爸常常教樂樂不要貪心，不是每一樣東西都要更好的。 一天，樂樂回家，把成績單拿給爸爸看。 爸爸看到樂樂的成績都是A，只是英文是B。 爸爸說:「樂樂，用功一點，英文成績就會更好的。」 樂樂心裏想:「B不是比C好嗎? 爸爸不是說不要什麼都要更好的，我不貪心!」 Green 59 我不贪心  爸爸常常教乐乐不要贪心，不是每一样东西都要更好的。 一天，乐乐回家，把成绩单拿给爸爸看。 爸爸看到乐乐的成绩都是A，只是英文是B。 爸爸说:「乐乐，用功一点，英文成绩就会更好的。」 乐乐心裏想:「B不是比C好吗? 爸爸不是说不要什么都要更好的，我不贪心!」", "GREEN60": "我的好朋友 我的好朋友 家/家人 家/家人 Green 60 我的好朋友  這是我家的小狗，牠是我的好朋友。 我無聊的時候，喜歡幫牠穿上不同的漂亮衣服。 我高興的時候，喜歡拉著牠的腳跳舞。 放學回家以後，我喜歡當牠的老師。 天冷的時候，我還會抱著牠睡覺。你呢? 你想和小狗做什麼? Green 60 我的好朋友  这是我家的小狗，牠是我的好朋友。 我无聊的时候，喜欢帮牠穿上不同的漂亮衣服。 我高兴的时候，喜欢拉着牠的脚跳舞。 放学回家以后，我喜欢当牠的老师。 天冷的时候，我还会抱着牠睡觉。你呢? 你想和小狗做什么?", "GREEN61": "家裏的好人和壞人 家里的好人和坏人 家/家人 家/家人 Green 61 家裏的好人和壞人  我和弟弟玩遊戲，我當好人，要他當壞人，他哭著說:「我也要當好人!」 我說:「好吧! 我們一起當好人，一起去捉壞人。」 我們輕輕地走進哥哥的房間，在那裏，我們捉到很多壞人。 我們把壞人放在袋子裏面，把他們丟進垃圾桶。 哥哥回來了，他一走進房間， 就大叫:「我的變形金剛呢?」 Green 61 家裏的好人和坏人  我和弟弟玩遊戲，我當好人，要他當壞人，他哭著說:「我也要當好人!」 我說:「好吧! 我們一起當好人，一起去捉壞人。」 我們輕輕地走進哥哥的房間，在那裏，我們捉到很多壞人。 我們把壞人放在袋子裏面， 来这是大野狼的家。 大野狼说：「别怕！我老了，没牙了，不吃动物，只吃青菜和萝蔔！」", "GREEN81": "冰淇淋 冰淇淋 食物 食物 Green 81 冰淇淋  弟弟從廚房出來，他把手藏在背後。 媽媽問：「你為什麼把手藏在背後？伸出來給我看！」 弟弟不想伸出手，他說：「我手上的東西是．．．．．．］  媽媽要他快點伸出手來！弟弟慢慢地伸出手．．．．．． ［咦!冰淇淋怎麼沒有了?」弟弟奇怪地說。 Green 81 冰淇淋  弟弟从厨房出来，他把手藏在背后。 妈妈问：「你为什么把手藏在背后？伸出来给我看！」 弟弟不想伸出手，他说：「我手上的东西是．．．．．．］  妈妈要他快点伸出手来！弟弟慢慢地伸出手．．．．．． ［咦!冰淇淋怎么没有了?」弟弟奇怪地说。", "GREEN82": "烤鴨 烤鸭 食物 食物 Green 82 烤鴨  北京烤鴨是中國菜，它已經有幾百年的歷史。 烤好的鴨子，外面的皮是黃黃脆脆的，裏面的肉是軟軟嫩嫩的。 烤鴨被推出來以後，廚師會把烤鴨肉連皮，一片一片地切好。 吃烤鴨的時候，要先拿一張薄餅 ，再加一點醬和大蔥，然後把鴨肉片包起來吃。 哎呀! 我的口水要流出來了。「媽媽! 快帶我去吃烤鴨吧!」 Green 82 烤鸭  北京烤鸭是中国菜，它已经有几百年的历史。 烤好的鸭子，外面的皮是黄黄脆脆的，裏面的肉是软软嫩嫩的。 烤鸭被推出来以后，厨师会把烤鸭肉连皮，一片一片地切好。 吃烤鸭的时候，要先拿一张薄饼 ，再加一点酱和大葱，然后把鸭肉片包起来吃。 哎呀! 我的口水要流出来了。「妈妈! 快带我去吃烤鸭吧!」", "GREEN83": "巧克力蛋糕 巧克力蛋糕 食物 食物 Green 83 巧克力蛋糕  姐姐過生日，她八歲了，我要做一個蛋糕送給她。 先放蛋，再放麵粉，還要加牛油和糖。 姐姐愛吃巧克力，所以，要多放一點。 烤了十分鐘，蛋糕還是很小。再烤二十分鐘。 糟糕!蛋糕變成一座巧克力山了，不過，姐姐還是很愛吃。 Green 83 巧克力蛋糕  姐姐过生日，她八岁了，我要做一个蛋糕送给她。 先放蛋，再放麵粉，还要加牛油和糖。 姐姐爱吃巧克力，所以，要多放一点。 烤了十分钟，蛋糕还是很小。再烤二十分钟。 糟糕!蛋糕变成一座巧克力山了，不过，姐姐还是很爱吃。", "GREEN84": "花蜜和花粉 花蜜和花粉 食物 食物 Green 84 花蜜和花粉  爬上高高的山，穿過長長的山洞，小山村裏住著一群小矮人。 他們住在花裏，穿花衣，吃花粉，喝花蜜。 有一天，來了一個巨人，他們很害怕，不知道巨人想要做什麼? 巨人說:「別怕!我也想住在花裏，穿花衣，吃花粉，喝花蜜。」 小矮人幫巨人，做了一個大花房，還送他一包包的花粉和一杯杯的花蜜。 Green 84 花蜜和花粉  爬上高高的山，穿过长长的山洞，小山村裏住着一群小矮人。 他们住在花裏，穿花衣，吃花粉，喝花蜜。 有一天，来了一个巨人，他们很害怕，不知道巨人想要做什么? 巨人说:「别怕!我也想住在花裏，穿花衣，吃花粉，喝花蜜。」 小矮人帮巨人，做了一个大花房，还送他一包包的花粉和一杯杯的花蜜。", "GREEN85": "零食 零食 食物 食物 Green 85 零食  我們家櫃整裏面，放了很多零食，因為我們家的人都愛吃零食。 姐姐愛吃芒果乾，弟弟愛吃薯片，我愛吃豬肉乾。 我們都知道吃了零食，就不想吃媽媽煮的飯菜後。可是，我們還是忍不住要吃零食。 今天，我們打開櫃子，裏面是空的，沒有零食了。 家裏沒有了零食，媽媽煮的飯菜，好像變得更香了…... Green 85 零食  我们家柜整裏面，放了很多零食，因为我们家的人都爱吃零食。 姐姐爱吃芒果乾，弟弟爱吃薯片，我爱吃猪肉乾。 我们都知道吃了零食，就不想吃妈妈煮的饭菜后。可是，我们还是忍不住要吃零食。 今天，我们打开柜子，裏面是空的，没有零食了。 家裏没有了零食，妈妈煮的饭菜，好像变得更香了…...", "GREEN86": "西瓜和番茄 西瓜和番茄 食物 食物 Green 86 西瓜和番茄  小西瓜和爸爸媽媽住在一起，他們的鄰居是紅番茄。 一天，小西瓜看到了方西瓜，小紅蕃茄看到了紫番茄。 他們的爸爸說:「方西瓜、紫番茄是你們的表哥、表弟。」 又一天，小西瓜看到了三角西瓜。小紅蕃茄看到了藍番茄。 他們想:他們又是誰?啊! 三角西瓜和藍番茄一定是我們的堂哥、堂弟。 Green 86 西瓜和番茄  小西瓜和爸爸妈妈住在一起，他们的邻居是红番茄。 一天，小西瓜看到了方西瓜，小红蕃茄看到了紫番茄。 他们的爸爸说:「方西瓜、紫番茄是你们的表哥、表弟。」 又一天，小西瓜看到了三角西瓜。小红蕃茄看到了蓝番茄。 他们想:他们又是谁?啊! 三角西瓜和蓝番茄一定是我们的堂哥、堂弟。", "GREEN87": "香味 香味 食物 食物 Green 87 香味  今天媽媽做蛋糕，烤蛋糕的時候，香味飄出來了。 客廳、飯廳、書房和臥室都是香味。聞到香味，我肚子都餓了。 「叩!叩!叩!」有人敲門，我打開門，原來的鄰居小胖。 他說:「你家蛋糕的香味飄到我家了。」我說:「香味是可以分享的呀!」 他說:「那蛋糕可以分享嗎?」 Green 87 香味  今天妈妈做蛋糕，烤蛋糕的时候，香味飘出来了。 客厅、饭厅、书房和卧室都是香味。闻到香味，我肚子都饿了。 「叩!叩!叩!」有人敲门，我打开门，原来的邻居小胖。 他说:「你家蛋糕的香味飘到我家了。」我说:「香味是可以分享的呀!」 他说:「那蛋糕可以分享吗?」", "GREEN88": "好吃的東西 好吃的东西 食物 食物 Green 88 好吃的東西  為什麼我覺得好吃的東西，大人都說是不健康的。 我愛吃棒棒糖，老師說吃了會蛀牙。 我愛吃冰淇淋，奶奶說吃了會喉嚨痛。 我想喝汽水，爸爸說喝了會變胖。 我說:「媽媽，請你青菜加糖，肉加冰淇淋，湯加汽水，好嗎?」 Green 88 好吃的东西  为什么我觉得好吃的东西，大人都说是不健康的。 我爱吃棒棒糖，老师说吃了会蛀牙。 我爱吃冰淇淋，奶奶说吃了会喉咙痛。 我想喝汽水，爸爸说喝了会变胖。 我说:「妈妈，请你青菜加糖，肉加冰淇淋，汤加汽水，好吗?」", "GREEN89": "先吃再付錢 先吃再付钱 食物 食物 Green 89 先吃再付錢  媽媽讓我帶弟弟去超級市場，買我們喜歡吃的零食。 我選了巧克力和冰淇淋，弟弟選了薯片和棒棒糖。 我提籃子去排隊的時候，發現弟弟不見了。 我去找他，看到他坐在地上吃薯片。我說:「我們還沒付錢呀!」 他說:「吃了再付錢，不行嗎? 飯店都是這樣的。」 Green 89 先吃再付钱  妈妈让我带弟弟去超级市场，买我们喜欢吃的零食。 我选了巧克力和冰淇淋，弟弟选了薯片和棒棒糖。 我提篮子去排队的时候，发现弟弟不见了。 我去找他，看到他坐在地上吃薯片。我说:「我们还没付钱呀!」 他说:「吃了再付钱，不行吗? 饭店都是这样的。」", "GREEN90": "食物夢 食物梦 食物 食物 Green 90 食物夢  我做了一個夢，夢裏都是食物。我坐的船是木瓜做的，河水是牛奶。 河上有橋，橋是香蕉做的。河邊有路，路是麵包做的。 路的兩邊有西瓜做的椅子，還有薯片做的花。 河裏有很多巧克力做的魚，我伸手去抓魚….. 我就醒了，一看!我手裏真的有巧克力魚呢! Green 90 食物梦  我做了一个梦，梦裏都是食物。我坐的船是木瓜做的，河水是牛奶。 河上有桥，桥是香蕉做的。河边有路，路是麵包做的。 路的两边有西瓜做的椅子，还有薯片做的花。 河裏有很多巧克力做的鱼，我伸手去抓鱼….. 我就醒了，一看!我手裏真的有巧克力鱼呢!", "GREEN91": "星星吃月亮 星星吃月亮 自然 自然 Green 91 星星吃月亮  天上的月亮大又圓，星星看見了，很嫉妒月亮。 於是，它們決定去吃月亮，把月亮吃得彎彎的。 不久，月亮又變得大又圓，星星又嫉妒月亮了。 它們又去吃月亮，月亮又變得彎彎的。 所以，我看到的月亮，有時是圓圓的，有時是彎彎的。 Green 91 星星吃月亮  天上的月亮大又圆，星星看见了，很嫉妒月亮。 于是，它们决定去吃月亮，把月亮吃得弯弯的。 不久，月亮又变得大又圆，星星又嫉妒月亮了。 它们又去吃月亮，月亮又变得弯弯的。 所以，我看到的月亮，有时是圆圆的，有时是弯弯的。", "GREEN92": "找寶藏 找宝藏 自然 自然 Green 92 找寶藏  這是一張寶藏圖，來!我們一起去找寶藏。 寶藏在哪裏呢?讓我們再看清楚寶藏圖。 先爬上高高的山，再渡過長長的河 。 找到最大的石頭，再穿過下面的小山洞。 「救命呀!」原來是一場夢，什麼寶藏也沒有。 Green 92 找宝藏  这是一张宝藏图，来!我们一起去找宝藏。 宝藏在哪裏呢?让我们再看清楚宝藏图。 先爬上高高的山，再渡过长长的河 。 找到最大的石头，再穿过下面的小山洞。 「救命呀!」原来是一场梦，什么宝藏也没有。", "GREEN93": "我喜歡大自然 我喜欢大自然 自然 自然 Green 93 我喜歡大自然  晴天的時候，我喜歡到大海裏和魚兒游泳。 陰天的時候，我喜歡和朋友爬上高山，一起去探險。 颳風的時候，我喜歡放風箏，讓風箏飛上天空和鳥兒玩。 下雨的時候，我喜歡畫畫，畫什麼呢? 我畫了大海的魚兒，一起爬山的朋友，和天空的鳥兒。 Green 93 我喜欢大自然  晴天的时候，我喜欢到大海裏和鱼儿游泳。 阴天的时候，我喜欢和朋友爬上高山，一起去探险。 颳风的时候，我喜欢放风筝，让风筝飞上天空和鸟儿玩。 下雨的时候，我喜欢画画，画什么呢? 我画了大海的鱼儿，一起爬山的朋友，和天空的鸟儿。", "GREEN94": "遊太空 游太空 自然 自然 Green 94 遊太空  老師給我一個氣球，我用力吹，氣球越吹越大。 我飛上了天，小鳥咬破我的氣球。 我掉在白雲上，飄啊飄，我抓住火箭向上飛…... 我看見太空人，他讓我穿上太空衣，坐上太空船，然後帶我回家去 。 媽媽問:「你剛剛去了哪裏?」我說:「我去了很多地方!」 Green 94 游太空  老师给我一个气球，我用力吹，气球越吹越大。 我飞上了天，小鸟咬破我的气球。 我掉在白云上，飘啊飘，我抓住火箭向上飞…... 我看见太空人，他让我穿上太空衣，坐上太空船，然后带我回家去 。 妈妈问:「你刚刚去了哪裏?」我说:「我去了很多地方!」", "GREEN95": "寶石 宝石 自然 自然 Green 95 寶石  媽媽的游泳衣上， 有很多漂亮的小魚，媽媽跳進水裏， 小魚游走了。 媽媽追小魚，小魚游得很快，媽媽也游得很快。 小魚游進一個洞裏，媽媽也游進去，媽媽見到了美人魚和沉船， 沉船裏面有很多寶石，有紅寶石，綠寶石和藍寶石。媽媽開心地大叫! 媽媽醒了，沒有美人魚，沒有沉船，只有曬紅的臉。 Green 95 宝石  妈妈的游泳衣上， 有很多漂亮的小鱼，妈妈跳进水裏， 小鱼游走了。 妈妈追小鱼，小鱼游得很快，妈妈也游得很快。 小鱼游进一个洞裏，妈妈也游进去，妈妈见到了美人鱼和沉船， 沉船裏面有很多宝石，有红宝石，绿宝石和蓝宝石。妈妈开心地大叫! 妈妈醒了，没有美人鱼，没有沉船，只有晒红的脸。", "GREEN96": "老樹 The old tree 老树 The old tree 自然 自然 Green 96 老樹  我家院子裏有棵很老的大樹，它的樹幹和樹枝都很粗。 白天，我會爬上老樹，坐在粗粗的樹枝上看書和睡覺。 晚上，我也會爬上老樹，躺在粗粗的樹枝上看月亮和數星星。 我傷心的時候，也會爬上老樹，抱著樹枝哭，說出我的心事。 老樹好像是我另外一個家，也是我最好的朋友。 Green 96 老树  我家院子裏有棵很老的大树，它的树干和树枝都很粗。 白天，我会爬上老树，坐在粗粗的树枝上看书和睡觉。 晚上，我也会爬上老树，躺在粗粗的树枝上看月亮和数星星。 我伤心的时候，也会爬上老树，抱着树枝哭，说出我的心事。 老树好像是我另外一个家，也是我最好的朋友。", "GREEN97": "美麗的星星 美丽的星星 自然 自然 Green 97 美麗的星星  有一天，太陽、白雲和彩虹在說話，它們要比一比，看誰最美麗。 太陽說:「我又大又紅，當然是我最美麗。」 白雲說:「我一會兒像小羊，一會兒像白兔，當然是我最美麗。」 彩虹說:「你們只有一種顏色，我有七種顏色，當然是我最美麗。」 星星聽到了，它說:「只有我一閃一閃的像寶石，我才最美麗。」 Green 97 美丽的星星  有一天，太阳、白云和彩虹在说话，它们要比一比，看谁最美丽。 太阳说:「我又大又红，当然是我最美丽。」 白云说:「我一会儿像小羊，一会儿像白兔，当然是我最美丽。」 彩虹说:「你们只有一种颜色，我有七种颜色，当然是我最美丽。」 星星听到了，它说:「只有我一闪一闪的像宝石，我才最美丽。」", "GREEN98": "雨天的積水 雨天的积水 自然 自然 Green 98 雨天的積水  我喜歡雨天，我愛拿著雨傘在雨中慢慢地走。 我也愛在雨中跑來跑去，讓雨點打在我的臉上，打在我的身上。 我更愛踩著雨天的積水，喜歡和朋友比賽，看誰踩積水，把水濺得最高。 糟糕! 全身都濕了，媽媽來了，我看見她生氣的臉，怎麼辦? 趕快回家，洗個熱水澡，再告訴她，我踩積水，把水濺得最高! Green 98 雨天的积水  我喜欢雨天，我爱拿着雨伞在雨中慢慢地走。 我也爱在雨中跑来跑去，让雨点打在我的脸上，打在我的身上。 我更爱踩着雨天的积水，喜欢和朋友比赛，看谁踩积水，把水溅得最高。 糟糕! 全身都湿了，妈妈来了，我看见她生气的脸，怎么办? 赶快回家，洗个热水澡，再告诉她，我踩积水，把水溅得最高!", "GREEN99": "春夏秋冬 春夏秋冬 自然 自然 Green 99 春夏秋冬  春天到了，山上長滿了青草，一隻羊在吃草。 一頭牛來了，也想吃草，羊說: 「這麼多草，我們一起吃吧!」 夏天到了，山上的草長高了，牛和羊吃得好飽好飽。 秋天到了，羊的肚子餓了，山上沒草了。牛說:「你來我家吧!」 牛的家裏很多草，羊開心地說:「這麼多草，冬天到了也不怕!」 Green 99 春夏秋冬  春天到了，山上长满了青草，一隻羊在吃草。 一头牛来了，也想吃草，羊说: 「这么多草，我们一起吃吧!」 夏天到了，山上的草长高了，牛和羊吃得好饱好饱。 秋天到了，羊的肚子饿了，山上没草了。牛说:「你来我家吧!」 牛的家裏很多草，羊开心地说:「这么多草，冬天到了也不怕!」", "GREEN100": "小種子 小种子 自然 自然 Green 100 小種子  我把小種子種在土裏，放在窗戶旁邊，讓太陽照著它 天天 給它喝水，一天天的過去了，種子終於發芽了。 我想讓它快點長大，就把它移到窗戶外面， 讓它曬更多太陽，喝更多雨水。 結果，它曬太多太陽，喝太多雨水，我的小種子死了! Green 100 小种子  我把小种子种在土裏，放在窗户旁边，让太阳照着它 天天 给它喝水，一天天的过去了，种子终于发芽了。 我想让它快点长大，就把它移到窗户外面， 让它晒更多太阳，喝更多雨水。 结果，它晒太多太阳，喝太多雨水，我的小种子死了!"};

// --- 搜尋規則：書號完全比對（RED1 不會配到 RED10）；英文整字比對（ice 不會配到 rice，含複數/所有格）；中文部分比對；多個關鍵字需全部符合 ---
        function normText(s){return (s||'').toLowerCase().replace(/[’‘]/g,"'")}
        function makeMatcher(query){
          var q=normText(query).trim();
          if(!q)return null;
          var idm=q.replace(/\s+/g,'').match(/^(red|yellow|green)0*(\d+)$/);
          if(idm){var want=(idm[1]+idm[2]).toUpperCase();return function(b){return b.id===want}}
          var tests=q.split(/\s+/).map(function(t){
            if(!/[a-z]/.test(t))return function(text){return text.indexOf(t)>=0};
            var forms=[t];
            if(t.length>=4&&/es$/.test(t))forms.push(t.slice(0,-2));
            if(t.length>=4&&/s$/.test(t))forms.push(t.slice(0,-1));
            var re=new RegExp("(^|[^a-z0-9])("+forms.map(function(f){return f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+")(s|es|'s)?(?![a-z0-9])");
            return function(text){return re.test(text)};
          });
          return function(b){var text=SEARCH_TEXT[b.id]||'';return tests.every(function(f){return f(text)})};
        }
        // 搜尋索引：書號、英文書名與翻譯、繁簡書名、主題、繁簡內文
        var SEARCH_TEXT={};
        BOOKS.forEach(function(b){SEARCH_TEXT[b.id]=normText([b.id,b.level,b.title_en,b.en_content,b.title_zh,ZH_TEXT[b.id]].join(' '))});

        // State
        let currentFilter = 'all';
        let searchTerm = '';
        let filteredBooks = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
        });

        // Setup Event Listeners
        function setupEventListeners() {
            // Search input
            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchTerm = e.target.value.toLowerCase();
                filterAndRender();
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    filterAndRender();
                });
            });

            // Close modal when clicking outside
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        }

        // Filter and Render
        function filterAndRender() {
            const matcher = makeMatcher(searchTerm);
            filteredBooks = BOOKS.filter(book => {
                // Apply level filter
                if (currentFilter !== 'all' && book.level !== currentFilter) {
                    return false;
                }

                // Apply search filter
                return !matcher || matcher(book);
            });

            renderBooks();
        }

        // Render Books
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            if (filteredBooks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: #999;">' + tx('找不到符合的書', 'No books found') + '</div>';
                document.getElementById('resultCount').textContent = '0';
                return;
            }

            filteredBooks.forEach(book => {
                const card = createCard(book);
                grid.appendChild(card);
            });

            document.getElementById('resultCount').textContent = filteredBooks.length;
        }

        // Create Card
        function createCard(book) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(book);

            const levelClass = book.level.toLowerCase();
            const badgeText = `${book.level}${book.number}`;

            card.innerHTML = `
                <div class="card-cover">
                    <img src="${book.cover}" alt="${book.title_zh}" onerror="this.src='/covers/placeholder.png'">
                </div>
                <div class="card-color-bar ${levelClass}"></div>
                <div class="card-body">
                    <div class="card-badge ${levelClass}">${badgeText}</div>
                    <div class="card-title-zh">${book.title_zh}</div>
                    <div class="card-title-en">${book.title_en}</div>
                </div>
            `;

            return card;
        }

        // Open Modal
        function openModal(book) {
            const levelClass = book.level.toLowerCase();
            const badgeText = `${book.level}${book.number}`;

            document.getElementById('modalCover').src = book.cover;
            document.getElementById('modalCover').onerror = function() {
                this.src = '/covers/placeholder.png';
            };
            
            const badgeEl = document.getElementById('modalBadge');
            badgeEl.textContent = badgeText;
            badgeEl.className = `modal-badge ${levelClass}`;
            
            document.getElementById('modalTitle').textContent = book.title_zh;
            document.getElementById('modalSubtitle').textContent = book.title_en;
            document.getElementById('modalTranslation').textContent = book.en_content;

            document.getElementById('modal').classList.add('active');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

// --- 中/英介面切換：靜態文字用 data-en / data-en-placeholder，動態文字用 tx('中文','English') ---
var UI_LANG='zh',LANG_KEY='lele_translate_lang';
function tx(zh,en){return UI_LANG==='en'?en:zh}
function setUiLang(lang){
  UI_LANG=lang==='en'?'en':'zh';
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(el.dataset.zh===undefined)el.dataset.zh=el.innerHTML;
    el.innerHTML=UI_LANG==='en'?el.dataset.en:el.dataset.zh;
  });
  document.querySelectorAll('[data-en-placeholder]').forEach(function(el){
    if(el.dataset.zhPlaceholder===undefined)el.dataset.zhPlaceholder=el.placeholder;
    el.placeholder=UI_LANG==='en'?el.dataset.enPlaceholder:el.dataset.zhPlaceholder;
  });
  document.documentElement.lang=UI_LANG==='en'?'en':'zh-TW';
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    var on=b.dataset.lang===UI_LANG;
    b.classList.toggle('active',on);
    b.setAttribute('aria-pressed',on);
  });
  try{localStorage.setItem(LANG_KEY,UI_LANG)}catch(e){}
  onUiLangChange();
}
function initUiLang(){
  var lang='en';
  try{lang=localStorage.getItem(LANG_KEY)||lang}catch(e){}
  var q=new URLSearchParams(location.search).get('lang');
  if(q==='en'||q==='zh')lang=q;
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click',function(){setUiLang(b.dataset.lang)});
  });
  setUiLang(lang);
}
function onUiLangChange(){
  document.title=tx('樂樂翻譯查找器 | Le Le Translation Finder','Le Le Translation Finder');
  filterAndRender();
}
initUiLang();
    </script>
