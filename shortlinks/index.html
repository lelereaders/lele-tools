<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短網址管理</title>
  <!-- QR Code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #111; }

    /* Password overlay */
    #overlay { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 999; }
    #overlay.hidden { display: none; }
    .pw-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 40px 48px; max-width: 360px; width: 90%; text-align: center; }
    .pw-box h2 { font-size: 20px; margin-bottom: 8px; }
    .pw-box p { font-size: 14px; color: #888; margin-bottom: 24px; }
    .pw-box input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px; outline: none; }
    .pw-box input:focus { border-color: #111; }
    .pw-box button { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .pw-error { color: #c00; font-size: 13px; margin-top: 8px; }

    .header { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-actions { display: flex; gap: 10px; }

    .main { max-width: 1000px; margin: 0 auto; padding: 28px 20px; }

    .card { background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; padding: 24px 28px; margin-bottom: 24px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 18px; }

    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { flex: 1; min-width: 180px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 7px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #111; }
    .form-note { font-size: 11px; color: #bbb; margin-top: 3px; }

    .btn { padding: 10px 20px; border: none; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-primary { background: #111; color: #fff; }
    .btn-primary:hover { background: #333; }
    .btn-outline { background: #fff; color: #111; border: 1px solid #ddd; }
    .btn-outline:hover { border-color: #999; }
    .btn-danger { background: #fff; color: #c00; border: 1px solid #fcc; }
    .btn-danger:hover { background: #fff0f0; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-import { background: #e8f0fe; color: #1a56db; border: 1px solid #c3d5ff; }
    .btn-import:hover { background: #daeafe; }

    /* Import section */
    .import-section { display: none; }
    .import-section.open { display: block; }
    .drop-zone { border: 2px dashed #ddd; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.15s; margin-bottom: 12px; }
    .drop-zone:hover, .drop-zone.drag { border-color: #111; }
    .drop-zone p { color: #888; font-size: 14px; }
    .drop-zone strong { color: #111; }

    /* Table */
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .list-header h2 { font-size: 15px; font-weight: 600; }
    .count-badge { background: #f0f0f0; color: #555; font-size: 12px; padding: 3px 10px; border-radius: 20px; }

    .search-bar { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none; }
    .search-bar:focus { border-color: #111; }

    table { width: 100%; border-collapse: collapse; }
    th { font-size: 12px; font-weight: 600; color: #888; text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; }
    td { padding: 12px 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .code-cell { font-family: monospace; font-size: 13px; font-weight: 600; }
    .name-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-cell { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-cell a { color: #555; text-decoration: none; font-size: 12px; }
    .url-cell a:hover { color: #111; text-decoration: underline; }
    .clicks-cell { color: #888; font-size: 13px; }
    .actions-cell { white-space: nowrap; }
    .actions-cell .btn { margin-left: 4px; }

    .short-link { color: #1a56db; font-size: 12px; display: block; margin-top: 2px; }

    .empty { text-align: center; padding: 48px; color: #bbb; font-size: 14px; }

    /* QR Modal */
    #qrModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; align-items: center; justify-content: center; }
    #qrModal.open { display: flex; }
    .qr-box { background: #fff; border-radius: 14px; padding: 32px; text-align: center; max-width: 320px; width: 90%; }
    .qr-box h3 { font-size: 16px; margin-bottom: 6px; }
    .qr-box p { font-size: 12px; color: #888; margin-bottom: 20px; }
    #qrCanvas { border-radius: 8px; }
    .qr-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #111; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- Password overlay -->
<div id="overlay">
  <div class="pw-box">
    <h2>短網址管理</h2>
    <p>請輸入管理密碼</p>
    <input type="password" id="pwInput" placeholder="Admin Key">
    <button onclick="checkPw()">進入</button>
    <div class="pw-error" id="pwError"></div>
  </div>
</div>

<!-- QR Modal -->
<div id="qrModal">
  <div class="qr-box">
    <h3 id="qrTitle"></h3>
    <p id="qrUrl"></p>
    <canvas id="qrCanvas"></canvas>
    <div class="qr-actions">
      <button class="btn btn-outline btn-sm" onclick="downloadQr()">下載 PNG</button>
      <button class="btn btn-outline btn-sm" onclick="closeQr()">關閉</button>
    </div>
  </div>
</div>

<div id="mainContent" style="display:none">
  <div class="header">
    <h1>短網址管理 <span style="font-size:13px;color:#888;font-weight:400;margin-left:8px;">lelechinese.co</span></h1>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="toggleImport()">匯入 Lihi CSV</button>
      <button class="btn btn-primary btn-sm" onclick="loadLinks()">重新整理</button>
    </div>
  </div>

  <div class="main">
    <!-- Add form -->
    <div class="card">
      <h2>新增短網址</h2>
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label>目標網址</label>
          <input type="url" id="newUrl" placeholder="https://example.com/long-url">
        </div>
        <div class="form-group" style="flex:1.5">
          <label>名稱（內部備註）</label>
          <input type="text" id="newName" placeholder="例：端午節活動頁">
        </div>
        <div class="form-group" style="flex:0.8">
          <label>自訂代碼（選填）</label>
          <input type="text" id="newCode" placeholder="abc123">
          <div class="form-note">留空自動產生</div>
        </div>
        <div>
          <button class="btn btn-primary" onclick="createLink()" style="white-space:nowrap">建立</button>
        </div>
      </div>
    </div>

    <!-- Import -->
    <div class="card import-section" id="importSection">
      <h2>匯入 Lihi CSV</h2>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('csvFile').click()">
        <p><strong>點擊選擇</strong>或拖曳 CSV 檔案到此</p>
        <p style="margin-top:6px;font-size:12px;">支援 Lihi 匯出格式</p>
      </div>
      <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="handleCsvFile(this.files[0])">
      <div id="importPreview" style="display:none">
        <p style="font-size:14px;color:#555;margin-bottom:10px;" id="importCount"></p>
        <button class="btn btn-primary" onclick="doImport()">確認匯入</button>
        <button class="btn btn-outline" style="margin-left:8px" onclick="cancelImport()">取消</button>
      </div>
    </div>

    <!-- List -->
    <div>
      <div class="list-header">
        <h2>現有連結</h2>
        <span class="count-badge" id="countBadge">載入中...</span>
      </div>
      <input type="text" class="search-bar" id="searchBar" placeholder="搜尋名稱或代碼..." oninput="renderTable()">
      <div id="tableWrap">
        <div class="empty">載入中...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Config — set your Worker URL here
  const WORKER_URL = 'https://lele-shortlinks.lele-culture.workers.dev';
  const SHORT_DOMAIN = 'https://lelechinese.co';

  let ADMIN_KEY = '';
  let allLinks = [];
  let pendingImport = [];
  let currentQrUrl = '';
  let currentQrName = '';

  // ── Auth ─────────────────────────────────────────────────────────
  function checkPw() {
    const val = document.getElementById('pwInput').value.trim();
    if (!val) { document.getElementById('pwError').textContent = '請輸入密碼'; return; }
    ADMIN_KEY = val;
    // Test auth
    fetch(WORKER_URL + '/api/links', { headers: { 'X-Admin-Key': ADMIN_KEY } })
      .then(r => {
        if (r.status === 401) { document.getElementById('pwError').textContent = '密碼錯誤'; return; }
        sessionStorage.setItem('sl_key', ADMIN_KEY);
        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('mainContent').style.display = 'block';
        return r.json().then(data => { allLinks = data; renderTable(); });
      })
      .catch(() => { document.getElementById('pwError').textContent = '無法連線到 Worker，請確認已部署'; });
  }
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

  const savedKey = sessionStorage.getItem('sl_key');
  if (savedKey) {
    ADMIN_KEY = savedKey;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('mainContent').style.display = 'block';
    loadLinks();
  }

  // ── API ──────────────────────────────────────────────────────────
  function headers() { return { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY }; }

  async function loadLinks() {
    const r = await fetch(WORKER_URL + '/api/links', { headers: { 'X-Admin-Key': ADMIN_KEY } });
    allLinks = await r.json();
    renderTable();
  }

  async function createLink() {
    const url = document.getElementById('newUrl').value.trim();
    const name = document.getElementById('newName').value.trim();
    const code = document.getElementById('newCode').value.trim();
    if (!url) { showToast('請輸入目標網址'); return; }
    const r = await fetch(WORKER_URL + '/api/links', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ url, name, code: code || undefined }),
    });
    const data = await r.json();
    if (!r.ok) { showToast(data.error || '建立失敗'); return; }
    document.getElementById('newUrl').value = '';
    document.getElementById('newName').value = '';
    document.getElementById('newCode').value = '';
    showToast('建立成功：' + SHORT_DOMAIN + '/' + data.code);
    await loadLinks();
  }


  // ── Render ───────────────────────────────────────────────────────
  let _filtered = [];

  function renderTable() {
    const q = (document.getElementById('searchBar').value || '').toLowerCase();
    _filtered = allLinks.filter(l =>
      !q || l.code.includes(q) || (l.name || '').toLowerCase().includes(q) || (l.url || '').toLowerCase().includes(q)
    );
    document.getElementById('countBadge').textContent = allLinks.length + ' 個';
    const wrap = document.getElementById('tableWrap');
    if (_filtered.length === 0) {
      wrap.innerHTML = '<div class="empty">' + (q ? '沒有符合的結果' : '尚無連結') + '</div>';
      return;
    }
    wrap.innerHTML = '<table>' +
      '<thead><tr><th>代碼</th><th>名稱 / 短網址</th><th>目標網址</th><th>點擊</th><th>建立日期</th><th></th></tr></thead>' +
      '<tbody>' + _filtered.map((l, i) => {
        const shortUrl = SHORT_DOMAIN + '/' + l.code;
        const date = l.createdAt ? l.createdAt.slice(0,10) : '';
        return '<tr>' +
          '<td class="code-cell">' + esc(l.code) + '</td>' +
          '<td><div class="name-cell">' + esc(l.name || '—') + '</div>' +
            '<a class="short-link" href="' + esc(shortUrl) + '" target="_blank">' + esc(shortUrl) + '</a></td>' +
          '<td class="url-cell"><a href="' + esc(l.url) + '" target="_blank">' + esc(l.url) + '</a></td>' +
          '<td class="clicks-cell">' + (l.clicks || 0) + '</td>' +
          '<td style="font-size:12px;color:#bbb">' + date + '</td>' +
          '<td class="actions-cell">' +
            '<button class="btn btn-outline btn-sm" onclick="copyLink(' + i + ',this)">複製</button>' +
            '<button class="btn btn-outline btn-sm" onclick="showQr(' + i + ')">QR</button>' +
            '<button class="btn btn-danger btn-sm" onclick="deleteLink(' + i + ')">刪除</button>' +
          '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  }

  function copyLink(idx, btn) {
    const l = _filtered[idx];
    const url = SHORT_DOMAIN + '/' + l.code;
    navigator.clipboard.writeText(url);
    const orig = btn.textContent;
    btn.textContent = '已複製';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  }

  async function deleteLink(idx) {
    const l = _filtered[idx];
    if (!confirm('確定刪除 /' + l.code + '？')) return;
    await fetch(WORKER_URL + '/api/links/' + l.code, { method: 'DELETE', headers: { 'X-Admin-Key': ADMIN_KEY } });
    showToast('已刪除');
    await loadLinks();
  }

  // ── QR ───────────────────────────────────────────────────────────
  function showQr(idx) {
    const l = _filtered[idx];
    const url = SHORT_DOMAIN + '/' + l.code;
    const name = l.name || l.code;
    currentQrUrl = url;
    currentQrName = name;
    document.getElementById('qrTitle').textContent = name;
    document.getElementById('qrUrl').textContent = url;
    QRCode.toCanvas(document.getElementById('qrCanvas'), url, { width: 220, margin: 2 });
    document.getElementById('qrModal').classList.add('open');
  }
  function closeQr() { document.getElementById('qrModal').classList.remove('open'); }
  function downloadQr() {
    const canvas = document.getElementById('qrCanvas');
    const link = document.createElement('a');
    link.download = 'qr-' + currentQrName.replace(/[^a-z0-9]/gi,'_') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
  document.getElementById('qrModal').addEventListener('click', function(e) {
    if (e.target === this) closeQr();
  });

  // ── Import ───────────────────────────────────────────────────────
  function toggleImport() {
    document.getElementById('importSection').classList.toggle('open');
  }

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file) handleCsvFile(file);
  });

  function handleCsvFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => parseLihiCsv(e.target.result);
    reader.readAsText(file, 'UTF-8');
  }

  function parseLihiCsv(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) { showToast('CSV 格式錯誤'); return; }

    // Detect header
    const header = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
    // Lihi columns may vary — look for common names
    const idxUrl = findCol(header, ['目標網址', 'target', 'url', 'destination', '原始網址']);
    const idxCode = findCol(header, ['短網址代碼', 'code', 'slug', '短碼', 'short']);
    const idxName = findCol(header, ['名稱', 'name', 'title', '標題']);
    const idxClicks = findCol(header, ['點擊次數', 'clicks', 'click', '訪問']);
    const idxDate = findCol(header, ['建立時間', 'created', 'date', '日期']);

    pendingImport = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = splitCsvLine(lines[i]);
      if (!cols.length) continue;
      const url = idxUrl >= 0 ? cols[idxUrl] : '';
      if (!url) continue;

      let code = idxCode >= 0 ? cols[idxCode] : '';
      // Extract code from full short URL if needed
      if (code && code.includes('/')) code = code.split('/').pop();
      if (!code) code = genCodeClient(6);

      pendingImport.push({
        code: code.trim().toLowerCase(),
        url: url.trim(),
        name: idxName >= 0 ? cols[idxName] : '',
        clicks: idxClicks >= 0 ? parseInt(cols[idxClicks]) || 0 : 0,
        createdAt: idxDate >= 0 ? cols[idxDate] : new Date().toISOString(),
      });
    }

    document.getElementById('importCount').textContent = '找到 ' + pendingImport.length + ' 筆連結，確認後匯入';
    document.getElementById('importPreview').style.display = 'block';
  }

  function findCol(header, candidates) {
    for (const c of candidates) {
      const i = header.findIndex(h => h.includes(c));
      if (i >= 0) return i;
    }
    return -1;
  }

  function splitCsvLine(line) {
    const result = [];
    let cur = '';
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    result.push(cur.trim());
    return result;
  }

  async function doImport() {
    if (!pendingImport.length) return;
    const r = await fetch(WORKER_URL + '/api/import', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ links: pendingImport }),
    });
    const data = await r.json();
    showToast('匯入完成：' + data.imported + ' 筆');
    pendingImport = [];
    document.getElementById('importPreview').style.display = 'none';
    document.getElementById('importSection').classList.remove('open');
    await loadLinks();
  }

  function cancelImport() {
    pendingImport = [];
    document.getElementById('importPreview').style.display = 'none';
  }

  // ── Utilities ────────────────────────────────────────────────────
  function genCodeClient(len) {
    const chars = '0123456789abcdefghijklmnopqrstuvwxyz';
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => chars[b % chars.length]).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
