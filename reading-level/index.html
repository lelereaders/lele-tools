<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>樂樂讀者字彙測試器</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #faf7f2;
    color: #2b2b2b;
    margin: 0;
    padding: 24px 16px 80px;
    line-height: 1.7;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: 2px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .controls {
    background: #fff;
    border: 1px solid #e5ddd0;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label { font-weight: 600; min-width: 110px; }
  select, input[type=text] {
    font: inherit;
    padding: 10px 14px;
    border: 1.5px solid #d9cfbd;
    border-radius: 8px;
    background: #fff;
    flex: 1;
    min-width: 140px;
  }
  select:focus, input:focus { outline: none; border-color: #d4a017; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 24px;
    background: #d4a017;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #b8890f; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }

  .result { display: none; }
  .result.show { display: block; }

  .book-header {
    background: #fff;
    border: 1px solid #e5ddd0;
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .book-title { font-size: 22px; font-weight: 700; margin: 0; }
  .book-meta { color: #888; font-size: 13px; margin-top: 4px; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 8px;
  }
  .badge.red    { background: #ffe5e5; color: #b33; }
  .badge.green  { background: #e5f5e5; color: #2a8c3a; }
  .badge.yellow { background: #fff3cc; color: #a8780a; }

  .score { text-align: right; }
  .score-num {
    font-size: 40px;
    font-weight: 800;
    color: #d4a017;
    line-height: 1;
  }
  .score-label { font-size: 12px; color: #888; margin-top: 4px; }

  .stats {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #666;
  }
  .stats b { color: #2b2b2b; font-size: 15px; }

  .panel {
    background: #fff;
    border: 1px solid #e5ddd0;
    border-radius: 14px;
    padding: 24px 28px;
    margin-bottom: 16px;
  }
  .panel-label {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .passage {
    font-size: 22px;
    line-height: 2;
    letter-spacing: 1px;
  }
  .passage .mask {
    display: inline-block;
    width: 0.9em;
    height: 0.9em;
    background: #2b2b2b;
    vertical-align: middle;
    margin: 0 1px;
    border-radius: 2px;
  }

  .original { font-size: 17px; color: #555; line-height: 2; }

  .error {
    background: #fff4f4;
    border: 1px solid #f0bcbc;
    color: #c44;
    padding: 14px 18px;
    border-radius: 10px;
    display: none;
  }
  .error.show { display: block; }

  .book-list-btn {
    background: none;
    color: #d4a017;
    font-size: 13px;
    padding: 4px 8px;
  }
  .book-list-btn:hover { background: #fff5dd; }

  .book-list {
    display: none;
    background: #fff;
    border: 1px solid #e5ddd0;
    border-radius: 14px;
    padding: 16px;
    margin-top: 10px;
    max-height: 340px;
    overflow-y: auto;
  }
  .book-list.show { display: block; }
  .book-list-section { margin-bottom: 14px; }
  .book-list-section h3 { font-size: 14px; margin: 0 0 8px; }
  .book-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .book-list td { padding: 4px 8px; border-bottom: 1px solid #f2ebde; cursor: pointer; }
  .book-list td:hover { background: #fff5dd; }
  .book-list td.code { font-family: ui-monospace, monospace; color: #888; width: 80px; }

  footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>樂樂讀者字彙測試器</h1>
  <div class="subtitle">輸入認識的字數，看看讀者看得懂哪些故事 · 共 300 本書 · 1160 個字</div>

  <div class="controls">
    <div class="row">
      <label for="vocab">認識的字數</label>
      <select id="vocab">
        <option value="100">100 字</option>
        <option value="200">200 字</option>
        <option value="300" selected>300 字</option>
        <option value="400">400 字</option>
        <option value="500">500 字</option>
        <option value="600">600 字</option>
        <option value="700">700 字</option>
        <option value="800">800 字</option>
        <option value="900">900 字</option>
        <option value="1000">1000 字</option>
        <option value="1160">1160 字（全部）</option>
      </select>
    </div>
    <div class="row">
      <label for="bookCode">書本代號</label>
      <input type="text" id="bookCode" placeholder="例如 #red01 或 green50" autocomplete="off">
      <button id="goBtn">顯示</button>
      <button class="book-list-btn" id="listBtn" type="button">全部書單 ▾</button>
    </div>
    <div class="hint">代號格式：#red01–100、#green01–100、#yellow01–100（大小寫皆可，#號可省略）</div>
    <div class="book-list" id="bookList"></div>
  </div>

  <div class="error" id="err"></div>

  <div class="result" id="result">
    <div class="book-header">
      <div>
        <h2 class="book-title"><span id="badge"></span><span id="title"></span></h2>
        <div class="book-meta" id="meta"></div>
      </div>
      <div class="score">
        <div class="score-num" id="score">–</div>
        <div class="score-label">理解度</div>
      </div>
    </div>

    <div class="panel" style="padding:14px 28px;">
      <div class="stats" style="justify-content:space-around;">
        <span>總字數 <b id="total">–</b></span>
        <span>認得 <b id="known" style="color:#2a8c3a;">–</b></span>
        <span>不認得 <b id="unknown" style="color:#c44;">–</b></span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">遮罩版（不認識的字變 ■）</div>
      <div class="passage" id="masked"></div>
    </div>

    <div class="panel">
      <div class="panel-label">原文對照</div>
      <div class="original" id="original"></div>
    </div>
  </div>

  <footer>資料來源：樂樂文化叢書 · 字頻取自 tools.lelechinese.com</footer>
</div>

<script>
const BOOKS = {"RED01":{"code":"RED01","number":1,"color":"red","title":"溜冰","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"左腳，右腳，向前，轉圈，跳起來，落地。拍手！"},"RED02":{"code":"RED02","number":2,"color":"red","title":"坐過山車","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"上車，上去，轉彎，倒過來，衝下來，下車，昏倒了！"},"RED03":{"code":"RED03","number":3,"color":"red","title":"玩滑板","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"小孩，抱滑板，站上去，跌下來，又站上去，又跌下來。趴上去，用手滑！"},"RED04":{"code":"RED04","number":4,"color":"red","title":"收玩具","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"大汽車，大飛機，大恐龍，大娃娃，玩具收好了！哇！哇！弟弟哭了！對不起！"},"RED05":{"code":"RED05","number":5,"color":"red","title":"機器人幫我","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"我的機器人，幫我穿鞋，幫我收玩具，幫我讀書，幫我做功課，幫我罵人。機器人挨罵了！"},"RED06":{"code":"RED06","number":6,"color":"red","title":"玩什麼","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"沒電了，人影，是誰？鬼嗎？是小胖！「沒電，玩什麼？」「玩捉迷藏！」"},"RED07":{"code":"RED07","number":7,"color":"red","title":"救火","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"救火員，穿衣，戴帽，滑下來，上救火車，救火，在烤肉！"},"RED08":{"code":"RED08","number":8,"color":"red","title":"生日","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"蛋糕，蠟燭，好朋友，唱歌，吹蠟燭，切蛋糕。我六歲了！"},"RED09":{"code":"RED09","number":9,"color":"red","title":"當媽媽","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"爸爸當馬，當橋，當滑梯，當轉輪，當吊杆，當飛機，爸爸當媽媽了！"},"RED10":{"code":"RED10","number":10,"color":"red","title":"誰在運動","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"運動啦！誰在游泳？誰在跑步？誰在滑雪？誰在打球？誰在沖浪？誰不在運動？"},"RED11":{"code":"RED11","number":11,"color":"red","title":"今天","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"穿衣服，吃飯，看書，玩玩具，看電視，騎車，今天放假，真好!"},"RED12":{"code":"RED12","number":12,"color":"red","title":"沖浪","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"沖浪!沖浪板，趴上去，手滑水，浪來了，站起來，褲子!"},"RED13":{"code":"RED13","number":13,"color":"red","title":"停車","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"下雨天，上車，關門，綁安全帶，開車，停車，怎麼了?"},"RED14":{"code":"RED14","number":14,"color":"red","title":"比賽","category":"日常生活","author":"李琇琇","illustrator":"林淑芬","content":"開始，跑，走，跳，爬，騎車。我第一!"},"RED15":{"code":"RED15","number":15,"color":"red","title":"藏起來","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"小手，舉起來，伸出來，握起來，張開來，翻過來，藏起來!"},"RED16":{"code":"RED16","number":16,"color":"red","title":"怎麼了","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"大哭，大叫，不吃，踢東西，摔東西，不理人，生氣了!"},"RED17":{"code":"RED17","number":17,"color":"red","title":"行不行","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"「我要吃。。。」，媽媽說:「不行!」「我要跳。。。」，媽媽說:「不行!」"},"RED18":{"code":"RED18","number":18,"color":"red","title":"去公園","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"去公園，這是鞦韆，這是滑梯，這是攀爬架，這是沙坑，這是翹翹板，砰!這是大樹!"},"RED19":{"code":"RED19","number":19,"color":"red","title":"小熊","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"熊媽媽，小熊跟著媽媽，小熊滑倒了!站起來，小熊又滑倒了。爬上去，媽媽真好!"},"RED20":{"code":"RED20","number":20,"color":"red","title":"牠是誰","category":"動物","author":"李琇琇","illustrator":"林淑芬","content":"牠是誰?是蛇嗎?是狼嗎?是豹嗎?是獅子嗎?啊!是老虎!大家快跑啊!"},"RED21":{"code":"RED21","number":21,"color":"red","title":"吃草的動物","category":"動物","author":"李琇琇","illustrator":"林淑芬","content":"來吃草啦!馬吃草，狗不吃草，牛吃草，虎不吃草，羊吃草，蛇不吃草。你吃草嗎?"},"RED22":{"code":"RED22","number":22,"color":"red","title":"動物花紋","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"花貓，花狗，花鹿，花豹，花蛇，花在哪裏?沒有花，是花紋!"},"RED23":{"code":"RED23","number":23,"color":"red","title":"動物和泰山","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"小泰山，河馬，長頸鹿，豹，獅子，鱷魚，爸爸!"},"RED24":{"code":"RED24","number":24,"color":"red","title":"動物拍照","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"照相機，給斑馬拍照，給犀牛拍照，給河馬拍照，給黑熊拍照。黑熊回洞裏。啊!牠們要一起拍照。"},"RED25":{"code":"RED25","number":25,"color":"red","title":"爬樹的動物","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"有一棵樹，猴子爬上樹，松鼠爬上樹，樹熊爬上樹，豹爬上樹，大象來了，大象會拔樹!"},"RED26":{"code":"RED26","number":26,"color":"red","title":"魚和蝦","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"大海裏，有小蝦，小魚吃小蝦，大魚吃小魚，鯊魚吃大魚。魚網來了，誰吃了魚和蝦?"},"RED27":{"code":"RED27","number":27,"color":"red","title":"烏鴉","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"一個農夫，種玉米，玉米長大了，烏鴉吃玉米，一個稻草人，烏鴉來了，他捉到烏鴉了。"},"RED28":{"code":"RED28","number":28,"color":"red","title":"動物的叫聲","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"小鳥，吱吱吱。小牛，哞哞哞。小羊，咩咩咩。小鴨，嘎嘎嘎。小貓，喵喵喵。小狗，汪汪汪。蛇來了，牠們都不叫了。"},"RED29":{"code":"RED29","number":29,"color":"red","title":"不一樣的動物","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"不一樣的魚，不一樣的大象，不一樣的青蛙，不一樣的斑馬，不一樣的老鼠，不一樣的狐狸，哪個不一樣?"},"RED30":{"code":"RED30","number":30,"color":"red","title":"斑馬過河","category":"動物","author":"姚釹","illustrator":"林淑芬","content":"一條河，斑馬，過河。大鱷魚，追斑馬，快追到了，斑馬跳上去了!"},"RED31":{"code":"RED31","number":31,"color":"red","title":"動物在哪裏","category":"動物","author":"李琇琇","illustrator":"林淑芬","content":"兔子在哪裏?小鹿在哪裏?小鳥在哪裏?猴子在哪裏?小熊在哪裏?狐狸在哪裏?獵人在哪裏?"},"RED32":{"code":"RED32","number":32,"color":"red","title":"動物變變變","category":"動物","author":"李琇琇","illustrator":"林淑芬","content":"蝌蚪，變青蛙。毛毛蟲，變蝴蝶。雞蛋，變小雞。小朋友,變爸爸?變媽媽?"},"RED33":{"code":"RED33","number":33,"color":"red","title":"動物的蛋","category":"動物","author":"李琇琇","illustrator":"林淑芬","content":"這是企鵝的蛋。這是蛇的蛋。這是鳥的蛋。這是蝴蝶的蛋。這是青蛙的蛋。這是誰的蛋?是我的巧克力蛋。"},"RED34":{"code":"RED34","number":34,"color":"red","title":"書","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"同學有。。。形狀書，翻翻書，摸摸書，拉拉書，立體書，我有電子書。"},"RED35":{"code":"RED35","number":35,"color":"red","title":"老師","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"想一想，畫一畫，剪一剪，貼一貼，摺一摺，卡片做好了。老師，給你!"},"RED36":{"code":"RED36","number":36,"color":"red","title":"筆盒","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"鉛筆，藏在哪兒?橡皮，藏在哪兒?彩色筆，藏在哪兒?剪刀，藏在哪兒?水筆，藏在哪兒?膠水，藏在哪兒?都放進筆盒了!"},"RED37":{"code":"RED37","number":37,"color":"red","title":"長方形","category":"學校/學校活動","author":"李琇琇","illustrator":"林淑芬","content":"三角形，三角形的筆盒。圓形，圓形的飯盒。正方形，正方形的書。長方形在哪裏?"},"RED38":{"code":"RED38","number":38,"color":"red","title":"學校活動","category":"學校/學校活動","author":"李琇琇","illustrator":"林淑芬","content":"我會畫畫，我會寫字，我會騎車，我會跳舞，我會唱歌，我會踢球。我不會游泳!"},"RED39":{"code":"RED39","number":39,"color":"red","title":"學校","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"學校，跳舞房，游泳池，操場，音樂教室，課室。學校的照片。"},"RED40":{"code":"RED40","number":40,"color":"red","title":"去學校","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"太晚了，穿校服，拿書包，拿飯盒，上校車，到學校了，下車了!鞋呢?"},"RED41":{"code":"RED41","number":41,"color":"red","title":"你我他","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"我，你，他，我們，你們，他們，看!一個星星!"},"RED42":{"code":"RED42","number":42,"color":"red","title":"誰的錯","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"停車!撞車!「你的錯!」「你的錯!」「我沒錯!」「誰的錯?」「牠們的錯!」"},"RED43":{"code":"RED43","number":43,"color":"red","title":"秘密","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"我走過去，他看見了，他也要走過去，他掉下去了!我沒有掉下去。秘密!下面有石頭!"},"RED44":{"code":"RED44","number":44,"color":"red","title":"對不起","category":"關鍵字","author":"李琇琇","illustrator":"林淑芬","content":"停車場，出口，餐廳，廁所，男，女，對不起!"},"RED45":{"code":"RED45","number":45,"color":"red","title":"像什麼","category":"關鍵字","author":"李琇琇","illustrator":"林淑芬","content":"一塊石頭?一隻烏龜。一條繩子?一條蛇。一個雪球?一隻熊!像女生?像男生?"},"RED46":{"code":"RED46","number":46,"color":"red","title":"一片沙漠","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"一粒沙，一點沙，一盤沙，一把沙，一堆沙，一座沙山，一片沙漠!"},"RED47":{"code":"RED47","number":47,"color":"red","title":"一半","category":"關鍵字","author":"李琇琇","illustrator":"林淑芬","content":"一個大西瓜，切一半，你一半，我一半，爸爸、媽媽沒有，再切一半，爸爸、媽媽都有了。"},"RED48":{"code":"RED48","number":48,"color":"red","title":"上下","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"小老鼠，進去，上上，左左，下下，右右，啊!乳酪!"},"RED49":{"code":"RED49","number":49,"color":"red","title":"長短","category":"關鍵字","author":"李琇琇","illustrator":"林淑芬","content":"小小的魚，胖胖的魚，瘦瘦的魚，長長的魚，短短的魚，大魚來了，魚不見了!"},"RED50":{"code":"RED50","number":50,"color":"red","title":"厚薄","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"大大的葉子，小小的葉子，圓圓的葉子，尖尖的葉子，厚厚的葉子，薄薄的葉子，葉子項鍊!"},"RED51":{"code":"RED51","number":51,"color":"red","title":"好大好大","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"下雪了，好大好大的雪，好高好高的雪，好黑好黑的家，好多好多的雪，好長好長的洞，好棒好棒的我!"},"RED52":{"code":"RED52","number":52,"color":"red","title":"我是老五","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"老大叫Do，老二叫Rei，老三叫Mi，老四叫Fa。媽媽叫:「DoReiMiFaSo!]「So是誰?」我是老五!"},"RED53":{"code":"RED53","number":53,"color":"red","title":"不大不小","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"穿鞋子，鞋破了。買鞋，太大，太小，不大不小，剛剛好!我的鞋!"},"RED54":{"code":"RED54","number":54,"color":"red","title":"一顆心","category":"關鍵字","author":"姚釹","illustrator":"林淑芬","content":"一朵花，一棵樹，一隻蝴蝶，一條魚，一把扇子，一顆心，好看嗎?"},"RED55":{"code":"RED55","number":55,"color":"red","title":"我在家嗎","category":"家/家人","author":"姚釹","illustrator":"林淑芬","content":"媽媽在家，爸爸在家，爺爺和奶奶在家，哥哥和姐姐在家，弟弟和妹妹在家，大家都在家。我在家嗎?"},"RED56":{"code":"RED56","number":56,"color":"red","title":"姐姐和妹妹","category":"家/家人","author":"姚釹","illustrator":"林淑芬","content":"姐姐和妹妹，妹妹睡了。妹妹哭了，姐姐看看妹妹，給你。妹妹睡了，給我了。"},"RED57":{"code":"RED57","number":57,"color":"red","title":"小寶寶","category":"家/家人","author":"姚釹","illustrator":"林淑芬","content":"小寶寶哭了!給玩具，還是哭!給牛奶，還是哭!給水，還是哭!拍一拍，抱起來，小寶寶笑了!"},"RED58":{"code":"RED58","number":58,"color":"red","title":"家","category":"家/家人","author":"姚釹","illustrator":"林淑芬","content":"牆，屋頂，窗，門，路，我，回家了!"},"RED59":{"code":"RED59","number":59,"color":"red","title":"媽媽","category":"家/家人","author":"李琇琇","illustrator":"林淑芬","content":"媽媽在廁所?在睡房?在廚房?在書房?在陽臺?在客廳?媽媽在這裏!"},"RED60":{"code":"RED60","number":60,"color":"red","title":"大家","category":"家/家人","author":"李琇琇","illustrator":"林淑芬","content":"爸爸睡了，哥哥病了，弟弟餓了，妹妹尿了，姐姐哭了!媽媽回來了，大家都笑了。"},"RED61":{"code":"RED61","number":61,"color":"red","title":"弟弟","category":"家/家人","author":"姚釹","illustrator":"林淑芬","content":"弟弟追狗，追到客廳，追到飯廳，追到臥室，追到廁所，追到狗屋，卡住了!"},"RED62":{"code":"RED62","number":62,"color":"red","title":"哪個好看","category":"身體","author":"姚釹","illustrator":"林淑芬","content":"長臉，圓臉，長髮，短髮，圓眼睛，細眼睛，高鼻子，矮鼻子，小嘴巴，大嘴巴，長耳朵，短耳朵。哪個好看?"},"RED63":{"code":"RED63","number":63,"color":"red","title":"不癢了","category":"身體","author":"姚釹","illustrator":"林淑芬","content":"頭癢，手癢，腳癢，屁股癢，全身癢，跳進水裏，不癢了。"},"RED64":{"code":"RED64","number":64,"color":"red","title":"臉","category":"身體","author":"姚釹","illustrator":"林淑芬","content":"頭髮，眼睛，鼻子，嘴巴，耳朵。海水來了，臉呢?"},"RED65":{"code":"RED65","number":65,"color":"red","title":"疤","category":"身體","author":"姚釹","illustrator":"林淑芬","content":"跌倒了，流血了，塗藥。過一天，結疤了。過三天，疤掉了，好了!"},"RED66":{"code":"RED66","number":66,"color":"red","title":"翅膀","category":"身體","author":"姚釹","illustrator":"林淑芬","content":"小頭，長脖子，大身體，細腳，一對翅膀。不會飛?是鴕鳥!"},"RED67":{"code":"RED67","number":67,"color":"red","title":"癢","category":"身體","author":"姚釹","illustrator":"林淑芬","content":"眼睛癢，揉眼睛。頭癢，洗頭。鼻子癢，打噴嚏。嘴巴癢，吃東西。"},"RED68":{"code":"RED68","number":68,"color":"red","title":"蛋糕","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"香蕉蛋糕，草莓蛋糕，乳酪蛋糕，紅蘿蔔蛋糕，巧克力蛋糕，冰淇淋蛋糕。糟糕!蛋糕。。。"},"RED69":{"code":"RED69","number":69,"color":"red","title":"吃東西","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"大象，吃花生，吃香蕉，吃橙，吃蘋果，吃餅乾。吃手機?"},"RED70":{"code":"RED70","number":70,"color":"red","title":"湯","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"紅蘿蔔，青菜，青豆，青瓜，玉米，鹽，湯好了，喝湯!"},"RED71":{"code":"RED71","number":71,"color":"red","title":"魚","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"黑貓生日，生日禮物!乳酪?紅蘿蔔?松果?花貓來了，魚!魚!"},"RED72":{"code":"RED72","number":72,"color":"red","title":"點心","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"背包，薯片，漢堡，果汁，糖。背好背包，點心呢?"},"RED73":{"code":"RED73","number":73,"color":"red","title":"想吃東西","category":"食物","author":"李琇琇","illustrator":"林淑芬","content":"想吃冰淇淋，想吃漢堡，想吃薯條，想吃糖，想吃巧克力，想吃蛋糕。吃藥了!"},"RED74":{"code":"RED74","number":74,"color":"red","title":"蛋炒飯","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"蛋，打蛋，油，炒蛋，飯，鹽，炒一炒，吃蛋炒飯。"},"RED75":{"code":"RED75","number":75,"color":"red","title":"雞蛋","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"公雞叫，吃蟲了!小雞叫，吃米了!母雞叫，生蛋了!我叫:「吃雞蛋了!」"},"RED76":{"code":"RED76","number":76,"color":"red","title":"水果","category":"食物","author":"李琇琇","illustrator":"林淑芬","content":"很多水果。蘋果，橙，草莓，香蕉，葡萄。一張水果臉!"},"RED77":{"code":"RED77","number":77,"color":"red","title":"花","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"樹上有紅花，水上有荷花，海上有浪花，火上有火花，雪上有雪花，天上有煙花，看得我眼花。"},"RED78":{"code":"RED78","number":78,"color":"red","title":"櫻桃樹","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"姐姐，姐姐畫畫，畫櫻桃樹，畫櫻桃，小鳥來了，小鳥要吃櫻桃。真的櫻桃樹!"},"RED79":{"code":"RED79","number":79,"color":"red","title":"風","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"風車，風箏，風鈴。風來了，風車轉，風箏飛，風鈴響。"},"RED80":{"code":"RED80","number":80,"color":"red","title":"樹","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"樹有樹根，有樹幹，有樹洞，有樹枝，有樹葉。一棵大樹，還有樹蔭!"},"RED81":{"code":"RED81","number":81,"color":"red","title":"海邊","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"海邊，有太陽，有沙，有海浪，有船，有海鳥，還有我!"},"RED82":{"code":"RED82","number":82,"color":"red","title":"大浪","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"晚上的大海，有一條船，有大雨，有大風，有大浪。東南西北?啊!還有燈塔!"},"RED83":{"code":"RED83","number":83,"color":"red","title":"世界","category":"自然","author":"姚釹","illustrator":"林淑芬","content":"小鳥看到。。。大海，高山，森林，小河，城市。小鳥看到了世界!"},"RED84":{"code":"RED84","number":84,"color":"red","title":"開花了","category":"自然","author":"李琇琇","illustrator":"林淑芬","content":"大風吹，小種子，在土裏。下雨了，月亮，太陽，開花了!"},"RED85":{"code":"RED85","number":85,"color":"red","title":"幾隻腳","category":"數字","author":"姚釹","illustrator":"林淑芬","content":"動物。兩隻腳的動物，四隻腳的動物，六隻腳的動物，八隻腳的動物，十隻腳的動物，幾隻腳的動物?"},"RED86":{"code":"RED86","number":86,"color":"red","title":"十五隻小鳥","category":"數字","author":"姚釹","illustrator":"林淑芬","content":"一隻小鳥，兩隻小鳥，三隻小鳥，四隻小鳥，五隻小鳥。十五隻小鳥，沒有小鳥了!"},"RED87":{"code":"RED87","number":87,"color":"red","title":"好多錢","category":"數字","author":"姚釹","illustrator":"林淑芬","content":"一毛錢，兩毛錢，五毛錢，一塊錢，兩塊錢，五塊錢，好多錢，捐了!"},"RED88":{"code":"RED88","number":88,"color":"red","title":"一星期","category":"數字","author":"李琇琇","illustrator":"林淑芬","content":"星期一，星期二，星期三，星期四，星期五，星期六，星期日。"},"RED89":{"code":"RED89","number":89,"color":"red","title":"下雪","category":"天氣","author":"姚釹","illustrator":"林淑芬","content":"冬天，下雪了，很多雪。腳印?誰的?開門，聖誕老人!"},"RED90":{"code":"RED90","number":90,"color":"red","title":"雲","category":"天氣","author":"姚釹","illustrator":"林淑芬","content":"晴天，有白雲。陰天，有灰雲。雨天，有黑雲。颳風，沒有雲。"},"RED91":{"code":"RED91","number":91,"color":"red","title":"閃電","category":"天氣","author":"李琇琇","illustrator":"林淑芬","content":"颳風了，下雨了，閃電了，打雷了，害怕了。門開了，爸爸回來了!"},"RED92":{"code":"RED92","number":92,"color":"red","title":"雨天","category":"天氣","author":"李琇琇","illustrator":"林淑芬","content":"晴天，去游泳。陰天，去爬山。颳風，去放風箏。雨天，在家玩。"},"RED93":{"code":"RED93","number":93,"color":"red","title":"什麼顏色","category":"顏色","author":"姚釹","illustrator":"林淑芬","content":"沒有顏色，藍色，紅色，綠色，橙色，黑色，變成五顏六色!"},"RED94":{"code":"RED94","number":94,"color":"red","title":"果汁的顏色","category":"顏色","author":"姚釹","illustrator":"林淑芬","content":"紅色的果汁，好甜。黃色的果汁，好酸。綠色的果汁，不酸不甜。白色的果汁?是豆漿!"},"RED95":{"code":"RED95","number":95,"color":"red","title":"顏色豆","category":"顏色","author":"姚釹","illustrator":"林淑芬","content":"白豆，黑豆，紅豆，綠豆，黃豆，咖啡豆，豆子畫。"},"RED96":{"code":"RED96","number":96,"color":"red","title":"變顏色","category":"顏色","author":"李琇琇","illustrator":"林淑芬","content":"紅色，黃色，紅色和黃色，變橙色。藍色，紅色和藍色，變紫色。黃色和藍色，變綠色。彩色!"},"RED97":{"code":"RED97","number":97,"color":"red","title":"鞋子","category":"衣物","author":"姚釹","illustrator":"林淑芬","content":"穿運動鞋，穿雨鞋，穿舞鞋，穿溜冰鞋，穿涼鞋，穿高跟鞋，穿鞋，好累!"},"RED98":{"code":"RED98","number":98,"color":"red","title":"毛線","category":"衣物","author":"姚釹","illustrator":"林淑芬","content":"毛線，織毛線。織毛線帽子，織毛線圍巾，織毛線背心，織毛線襪子。狗狗不冷了!"},"RED99":{"code":"RED99","number":99,"color":"red","title":"雨衣","category":"衣物","author":"姚釹","illustrator":"林淑芬","content":"下雨了!穿雨衣，穿雨鞋，戴雨帽。太陽出來了，都脫了，下大雨了!"},"RED100":{"code":"RED100","number":100,"color":"red","title":"衣服","category":"衣物","author":"姚釹","illustrator":"林淑芬","content":"內衣，內褲，上衣，裙子，褲子，襪子。衣服都髒了!"},"GREEN01":{"code":"GREEN01","number":1,"color":"green","title":"說秘密","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"青蛙有一個秘密，牠把秘密告訴了小蝸牛。小蝸牛把秘密告訴了小烏龜。小烏龜又告訴了小金魚。小金魚看到青蛙說:「我知道你的秘密了!」青蛙想:「原來，秘密是不能說的。」"},"GREEN02":{"code":"GREEN02","number":2,"color":"green","title":"上學","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"阿姨有隻小狗，我常常抱牠、親牠。小狗明天要上學了，問阿姨：「小狗上學，是不是學中文、英文和體育?」她說：「不是!小狗要學做朋友。」"},"GREEN03":{"code":"GREEN03","number":3,"color":"green","title":"數一數","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"家裏有幾個人?弟弟數一數少了一個人。數筆時，忘了手上的筆。騎馬時，數馬沒忘記自己騎的馬。我誇他很聰明，給他十顆糖，數時他說:「怎麼只有九顆?」"},"GREEN04":{"code":"GREEN04","number":4,"color":"green","title":"誰是書蟲","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"有個人很愛看書，早上、中午、晚上，晴天、陰天、雨天讀書，坐著、走著、躺著讀書，甚至倒立讀書。他就叫「書蟲」。我也是書蟲，但不吃書。"},"GREEN05":{"code":"GREEN05","number":5,"color":"green","title":"做我喜歡的事","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"星期一到五上學，學中文、英文和數學。星期六上午游泳，下午體操、彈鋼琴。星期天吃飯。想要一個星期八天，專門做我喜歡的事。"},"GREEN06":{"code":"GREEN06","number":6,"color":"green","title":"捉迷藏","category":"日常活動","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"我在家沒人陪我玩，於是和小狗、小羊、小兔玩捉迷藏。「躲好了沒有?」找到小狗和小兔，小羊卻不見了。小朋友，幫忙找找小羊吧!"},"GREEN07":{"code":"GREEN07","number":7,"color":"green","title":"練習","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我在電腦上看到只有兩隻腳的狗，沒有手指的女孩，沒有雙手的人，都能做出很多事。這是因為他們不斷練習、練習再練習。"},"GREEN08":{"code":"GREEN08","number":8,"color":"green","title":"玩接龍遊戲","category":"日常活動","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"玩接龍遊戲，像是喝水接水草，國家接家人等。你要不要找幾個朋友一起來玩中文接龍遊戲?"},"GREEN09":{"code":"GREEN09","number":9,"color":"green","title":"找蛋遊戲","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"復活節我們去買了五個巧克力蛋。爸爸藏起來，我們找到四個，但弟弟滿嘴巧克力時才發現第五個蛋已經被他吃了。"},"GREEN10":{"code":"GREEN10","number":10,"color":"green","title":"學游泳","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"狗爸爸和狗媽媽帶著小狗們去海邊學游泳。牠們本來害怕，一個大海浪把牠們捲進海裏，最後牠們拼命游向海邊，學會了游泳。"},"GREEN11":{"code":"GREEN11","number":11,"color":"green","title":"躲貓貓","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"捉迷藏又叫「躲貓貓」。一天，小象、猴子、松鼠和小貓玩「躲貓貓」。小象躲在石頭後面，猴子躲在樹上，松鼠很快就找到牠們了。但是，牠找不到小貓。忽然，牠聽到「喵喵」的叫聲。原來，牠躲在洞裏。小貓說:「我不是躲在洞裏，我是掉進洞裏!」於是，動物們一個拉一個，把小貓救出來了。「躲貓貓」變成了「救貓貓」。"},"GREEN12":{"code":"GREEN12","number":12,"color":"green","title":"盪鞦韆","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小胖在盪鞦韆，盪過來又盪遇去。我也想盪鞦韆，可是我不會。小胖就教我，到遠一點的地方，先站好，然後跑，再跳。我就學小胖，先站好，然後跑，再跳，結果，我飛過去了。小胖說:「沒關係，再來一次!到遠一點的地方。」我又先站好，然後跑，再跳。這次，剛剛好。我好開心地盪過來又盪過去!"},"GREEN13":{"code":"GREEN13","number":13,"color":"green","title":"怕鬼","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"騎車，我怕跌下來。攀岩，我怕掉下來。划船，我怕船翻了。沖浪，我怕沈下去。笨豬跳，我怕高。跳傘，我怕傘不開。朋友笑著說:「你什麼都怕，你是膽小鬼!」我說:「不要叫我膽小鬼，因為我怕鬼!」"},"GREEN14":{"code":"GREEN14","number":14,"color":"green","title":"想要有一雙鞋","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我想要有一雙鞋子，一雙神奇的鞋子。它有小馬達，穿上它，可以跑得很快。它有彈簧穿上它，可以彈起來，跳過去。它有氣墊，穿上它，可以在水面上走。它有螺旋槳，穿上它，還可以在空中飛!"},"GREEN15":{"code":"GREEN15","number":15,"color":"green","title":"滑滑梯","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我帶我的小狗去滑滑梯，我們慢慢地向上爬。爬到滑梯上面，我先滑下，小狗還站在上面。我滑下來以後，發現滑梯上面的小狗很害怕，我怎麼叫，牠也不肯滑下來!忽然，我看到一隻大花狗衝上滑梯，牠舔舔我小狗。接著，大花狗和我的小狗就一起滑下來了!"},"GREEN16":{"code":"GREEN16","number":16,"color":"green","title":"當一把傘","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我是一把花傘，你把我轉一轉，我就變色了。有人用我來遮太陽，我就是陽傘。有人用我來遮雨，我就是雨傘。不過，我喜歡有人用我來跳舞，載我轉來又轉去。也喜歡有人用我來表演，把我頂在頭上或鼻子上。當然，我最得意的是老公公和老婆婆把我當他們的拐杖!"},"GREEN17":{"code":"GREEN17","number":17,"color":"green","title":"幫忙","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"姐姐把牛奶打翻了，弟弟來幫忙，他弄得滿桌都是牛奶。媽媽把油打翻了，弟弟來幫忙，他弄得滿地都是油。哥哥把水彩打翻了，弟弟來幫忙，他弄得滿身都是水彩。媽媽、哥哥和姐姐說:「你不是幫忙，你是越幫越忙!」弟弟不明白。他問:「誰要我幫忙?我會越幫越忙!」"},"GREEN18":{"code":"GREEN18","number":18,"color":"green","title":"騎車","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻瘦猴子，想騎腳踏車，牠的手扶著車頭，腳卻踩不到踏板。一隻胖猴子，也想騎腳踏車，牠的腳踩到踏板，手卻扶不到車頭。瘦猴子和胖猴子，看著腳踏車，摸摸頭。你看著我，我看著你。忽然…..胖猴子跳到車上，瘦猴子跳到胖猴子的肩膀上。胖猴子腳踩踏板，瘦猴子手扶車頭，牠們騎車去了。"},"GREEN19":{"code":"GREEN19","number":19,"color":"green","title":"放風箏","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我和小胖去放風箏，我用兩隻手把風箏高高地舉起來。小胖拉著風箏的線，快快地跑。風箏在天上轉了轉，掉下來了。我又拿起風箏，高高地舉起來，小胖又拉著風箏線要跑。我說:「等一等。」一陣大風吹來，我叫小胖快跑…..小胖跑呀跑，風箏飛呀飛，飛上天空，飛到雲裏，不見了!"},"GREEN20":{"code":"GREEN20","number":20,"color":"green","title":"寫兒歌","category":"日常活動","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"老師教我們唸兒歌，他一邊唸，一邊寫。白板上寫了:一二三四五，上山打老虎，老虎打不到，打到小松鼠。老師說每句話的最後一個字，聲音都有一點相同，唸起來容易又好聽。老師也要我們試試看，寫一首自己的兒歌。我就寫了一首兒歌:五隻小老虎，要找母老虎，找呀找不到，找到小老鼠。"},"GREEN21":{"code":"GREEN21","number":21,"color":"green","title":"樹熊","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"樹熊有胖胖的身體，小小的眼睛和短短的腳。我也有胖胖的身體，小小的眼睛和短短的腳。我覺得當樹熊真好，每天就是吃和睡，不用上學。所以，我告訴媽媽，我長得很像樹熊，我要當樹熊。媽媽說:「好吧!我把你寄到澳洲當樹熊。記得，你只可以吃樹葉喔!」"},"GREEN22":{"code":"GREEN22","number":22,"color":"green","title":"兩隻豬","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"豬爸爸和豬媽媽有兩個豬寶寶，一隻叫乾乾淨淨，一隻叫亂七八糟。乾乾淨淨當然是喜歡把家裏弄得又乾淨又整齊。可是，亂七八糟來了，就把家裏弄得又髒又亂，很不乾淨。亂七八糟說:「豬就是不乾淨、不整齊的，我們喜歡又髒又亂。」乾乾淨淨說:「難道，我們又乾淨又整齊，就不是豬了嗎?」"},"GREEN23":{"code":"GREEN23","number":23,"color":"green","title":"螢火蟲","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"弟弟在草地上走著，忽然，草裏飛出好多好多的螢火蟲。牠們一閃一閃的，好像星星，又好像小燈籠，十分美麗。弟弟雙手一合，就捉到了一隻螢火蟲。他仔細地看看螢火蟲，發現牠的屁股會發亮。晚上，弟弟在屁股上綁了一根螢光棒，他跳啊跳地說:「我是螢火蟲了!」"},"GREEN24":{"code":"GREEN24","number":24,"color":"green","title":"烏鴉","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"弟弟在讀一本圖畫書，他指著上面的字讀:「\"烏\"鴉。」哥哥聽到了說:「應該讀\"烏\"鴉，不是\"鳥\"鴉!」哥哥說:「那個像\"鳥\"的字，它唸\"烏\"，是黑色的意思。」弟弟看看圖畫上的鳥，牠身上的羽毛都是黑色的。弟弟問:「是烏龜的\"烏\"嗎?可是，烏龜不是黑色的，為什麼叫\"烏\"龜?」"},"GREEN25":{"code":"GREEN25","number":25,"color":"green","title":"老鼠和貓兒","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"老鼠都怕貓兒。可是，我家的老鼠和貓兒是好朋友。一天，我打開冰箱，沒有看到老鼠跑進去了。砰!冰箱門關上了。可是，貓兒卻一直抓冰箱的門。我說:「貓兒，你想吃什麼?」然後，我打開冰箱門，老鼠跑了出來!老鼠冷得發抖!貓兒來了，牠抱著老鼠，老鼠就緊緊地靠著牠。"},"GREEN26":{"code":"GREEN26","number":26,"color":"green","title":"小鴨找媽媽","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小鴨找媽媽，牠看到一條蟲以為是蚯蚓，小鳥說:「那是蜈蚣，不能吃。」小鴨看到鱷魚，鱷魚要帶小鴨找媽媽。小鳥說:「那是鱷魚，牠要吃你!」小鴨看到小鳥後面有大鳥，牠說:「你後面有大鳥，牠要吃你!」小鳥笑了，牠說:「牠是我媽媽，牠不會吃我!」小鳥說:「你坐到我媽媽的背上，我們可以飛上天，幫你找媽媽。」"},"GREEN27":{"code":"GREEN27","number":27,"color":"green","title":"小豬不笨","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小豬媽媽要小豬吃菜。小豬說那個菜看起來黑黑的，不好吃。媽媽說:「你沒有吃，怎麼知道不好吃?」小豬試著吃了，發現很好吃。小豬看到青蛙，想跟牠玩。青蛙說小豬看起來笨笨的，不會玩。小豬說:「你沒有跟我玩，怎麼知道我不會玩?」青蛙試著和小豬玩，牠發現小豬很會玩。"},"GREEN28":{"code":"GREEN28","number":28,"color":"green","title":"動物的叫聲","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一天早上，森林裏的小鳥吱吱吱地叫。青蛙說:「你們很吵，可以不要叫嗎?」小鳥說:「可是，晚上你們呱呱呱地叫，你們也很吵啊!」大樹說:「你們一個早上吵，一個晚上吵，吵死人了!」於是，大樹用樹葉塞住小鳥和青蛙的嘴巴，不讓牠們叫。第二天，森林裏很安靜。大樹覺得沒有叫聲，好像沒有朋友了!"},"GREEN29":{"code":"GREEN29","number":29,"color":"green","title":"北極熊","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"摩摩和爸爸坐雪橇去打魚，他們常常看到一隻北極熊。摩摩常常丟魚給牠，牠會高興地在地上滾一滾。冬天到了，摩摩都沒有看到北極熊，以為他冬眠了。可是，爸爸說北極熊不會冬眠。春天來了，摩摩看到北極熊，後面跟著兩隻熊寶寶，向他慢慢走來。原來，牠當媽媽了，冬天正牠生小寶寶的時候。"},"GREEN30":{"code":"GREEN30","number":30,"color":"green","title":"黑熊媽媽說話","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"黑熊媽媽在樹下休息。黑熊哥哥和妹妹爬到媽媽身上。牠們又爬到樹幹上，原來，小黑熊是很會爬樹的。黑熊哥哥和妹妹爬到很高的地方玩耍。忽然，牠們聽到樹下媽媽的吼聲。黑熊妹妹看著哥哥，好像在問:「媽媽在說什麼?」哥哥告訴妹妹，媽媽說:「吃飯了，快下來!」牠們快快跳到媽媽身上吃奶。"},"GREEN31":{"code":"GREEN31","number":31,"color":"green","title":"動物幫手","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"動物園有動物管理員，他要照顧動物園裏的動物。一天，動物管理員非常忙，因為有小老虎出生了。他需要一個幫手，幫他照顧剛出生的小老虎。他想:「我的幫手要不怕小動物，才會是一個好幫手。」後來，他找到了一個好幫手，牠非常會照顧小動物。"},"GREEN32":{"code":"GREEN32","number":32,"color":"green","title":"蜘蛛","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻蜘蛛掉進浴缸裏了，牠想爬出來，可是，牠爬上去又掉下來了。雖然我有點怕蜘蛛，但是我還是想幫牠。蜘蛛又向上爬的時候，我拿了一張報紙，發在浴缸底。蜘蛛爬到一半，就在報紙上了。我把報紙拿到外面樹下。第二天，樹枝上有個美麗的蜘蛛網!"},"GREEN33":{"code":"GREEN33","number":33,"color":"green","title":"海獺","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"海獺住在海裏，有胖胖的身體和圓圓的頭。海獺是很聰明的動物，牠會拿石頭膏開貝殼，吃裏面的肉。牠們常常一起手牽手，捲在海藻裏睡覺。這樣，海浪來了，就不會把牠們沖走了。牠們還常常一起玩遊戲，海獺真的很聰明呢!"},"GREEN34":{"code":"GREEN34","number":34,"color":"green","title":"狗兒一家","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我和媽媽去「流浪狗中心」，領養了一隻大花狗。爸爸說再領養一隻，讓牠有個伴。所以，我們就有了兩隻大花狗了。一天，哥哥帶了兩隻小花狗回家，他說:「這是我朋友送給我的小狗。」小花狗看見了大花狗，就跑過去舔牠們。大花狗也舔一舔小花狗，牠們好像是一家人!"},"GREEN35":{"code":"GREEN35","number":35,"color":"green","title":"小藍企鵝","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"企鵝有很多種，有的大，有的小，顏色也不相同。在澳洲，有一種小企鵝，有藍色的毛，人們叫牠們小藍企鵝。海邊岸上有很多小藍企鵝的家，每個家裏都有小寶寶。天黑了，小藍企鵝會跳上海邊，走回岸上的家，餵牠們的小寶寶。牠們很厲害，每隻都會找到自己的家，不會走錯的!"},"GREEN36":{"code":"GREEN36","number":36,"color":"green","title":"小動物","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小老鼠不開心，因為大動物不跟牠玩，說牠太小了。小老鼠想:我比蝴蝶、蜻蜓大，可是牠們是昆蟲。小老鼠覺得小松鼠和牠差不多大小。於是，牠去找小松鼠玩。牠和小松鼠做了好朋友，還發明了很多遊戲。大動物來了，想跟小老鼠和小松鼠玩。牠們說:「你們太大了，不能玩我們的遊戲。」"},"GREEN37":{"code":"GREEN37","number":37,"color":"green","title":"瓢蟲","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"蟲有很多種，有的是益蟲，有的是害蟲。我是飄蟲，身上有圓圓的斑點，漂亮。我住在花上、樹上和草上。我最愛吃一種害蟲叫蚜蟲。我最怕農藥，農藥是用來殺死害蟲的。結果，它把我也殺死了。現在誰來吃害蟲呢?"},"GREEN38":{"code":"GREEN38","number":38,"color":"green","title":"松鼠","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"在公園裏面，常常有可愛的松鼠，牠們跑得很快。牠們爬樹更快，還會「咻」地一聲，跳到另一根樹枝上。有一天，我看到一隻松鼠，嘴巴一直動，好像在和我說話。忽然，牠不動了，看著我，好像要我幫牠拍照。「咔」地一聲，我拍了一張照片。「你看!松鼠很可愛吧!」"},"GREEN39":{"code":"GREEN39","number":39,"color":"green","title":"綿羊","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小胖和家人去加拿大度假。爸爸和媽媽帶他去農場，看「剪羊毛」。農場主人拿著剃刀，一會兒，綿羊身上的毛都被剃光了。媽媽說我們可以用這些羊毛，織毛衣來穿。小胖看到綿羊光禿禿的身體，心想:牠們一定很冷。他對媽媽說:「你可以織多毛衣，給這些綿羊穿嗎?"},"GREEN40":{"code":"GREEN40","number":40,"color":"green","title":"動物玩偶","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我用動物玩偶，把我的房間佈置成動物園。我帶弟弟到我的動物園，他開心地摸摸每個動物。晚上，我回到房間，發現我的動物玩偶都不見了。忽然，我聽到弟弟在叫:「你們不要吃我!」原來，動物玩偶都在弟弟床上，他躺在牠們中間睡著了!"},"GREEN41":{"code":"GREEN41","number":41,"color":"green","title":"動物會保護自己","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"爸爸讀書給弟弟聽，爸爸說:「變色龍會變色，讓你找不到牠。」「蝴蝶會不動，讓你看不到牠。」「臭鼬會噴臭氣，讓你躲開牠。」「刺蝟有刺，讓你不敢捉牠。」「墨魚會噴黑汁，讓你看不見牠。」弟弟馬上去躲起來，讓爸爸找不到他。可是，狗狗在弟弟躲的地方，不停地汪汪叫!"},"GREEN42":{"code":"GREEN42","number":42,"color":"green","title":"螃蟹","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"在海邊，你可以玩沙、玩水，還可以捉螃蟹。有一次，我看到一隻螃蟹，可是，牠很快就逃進洞裏。我把手伸進洞裏捉牠，牠卻夾住我的手指，很痛…...我趕快把手拉出來，螃蟹也一起被拉出來了。唉!不知道是我捉螃蟹，還是螃蟹捉我呢?"},"GREEN43":{"code":"GREEN43","number":43,"color":"green","title":"刺蝟","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"刺蝟的身上有很多刺，別的動物怕牠們的刺。有一天，刺蝟刺了滿身的水果，要把它們帶回家吃。別的動物笑牠，你身上有很多水果，可是，你的腳很短，拿不到也吃不到啊!又來了一隻刺蝟，身上也刺滿了水果。牠們說:「你們忘了，我們是互相幫忙的動物!」"},"GREEN44":{"code":"GREEN44","number":44,"color":"green","title":"小河馬和大烏龜","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"有一天，一隻小河馬失去了媽媽。有人把牠帶到野生動物園，那裏有一隻三十歲的大烏龜。小河馬走過靠著牠，牠天天跟著大烏龜。大烏龜成了牠的新媽媽，原來，動物會領養別的動物孩子。就好像我的媽媽，領養我一樣。"},"GREEN45":{"code":"GREEN45","number":45,"color":"green","title":"松鼠玩偶","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我帶著我的松鼠玩偶，去公園玩。我要盪鞦韆，我把松鼠玩偶放在草地上。一隻真的松鼠來了，牠看著松鼠玩偶，然後跑走了。一會兒，牠又回來了，手裏拿著松果，牠把松果放在松鼠玩偶前面，還輕輕地靠著松鼠玩偶。"},"GREEN46":{"code":"GREEN46","number":46,"color":"green","title":"噴水的龍","category":"動物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"龍媽媽生了很多小龍，每隻小龍都會噴火，但是有一隻只會噴水。噴水龍問媽媽:「為什麼別的龍都噴火，很厲害，我只會噴水?」龍媽媽告訴牠，噴水的龍才厲害，因為火都怕水。牠說:「你看!人人需要水，家家需要水。」噴水龍想:難怪，家家都有「水龍頭」，但是沒有「火龍頭」。"},"GREEN47":{"code":"GREEN47","number":47,"color":"green","title":"蓋房子","category":"家/家人","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"老鼠一家住在破鞋子裏，風吹雨打，更怕大貓來捉。爸爸說:「我們要蓋個好房子，不怕風吹雨打，也不怕大貓來捉。」爺爺和奶奶蓋牆壁，爸爸和媽媽蓋屋頂。哥哥和姊姊做大門，弟弟和妹妹做窗戶。房子蓋好了，沒有風也沒有雨，大貓來了也不怕。"},"GREEN48":{"code":"GREEN48","number":48,"color":"green","title":"奶奶","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"奶奶有一條項鏈，她說等我長大了要給我。可是，她怕忘了放項鍊的地方，要我寫張紙條。她把紙條放好了。可是，她又怕忘了放紙條的地方，要我寫:「紙條放在…..]於是我寫了:「紙條放在…...]。我問奶奶:「那要寫多少張紙條啊?」我說:「你還是現在就把項鏈送給我吧!」"},"GREEN49":{"code":"GREEN49","number":49,"color":"green","title":"爸爸沒回家","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"下雨天，小鴨爸爸看到家裏的屋頂漏水了。牠拿了工具箱和梯子，爬上去修屋頂了。小鴨媽媽開門，推倒了梯子，就把梯子放回原來的地方。天黑了，鴨媽媽覺得很奇怪，鴨爸爸怎麼還沒回家?爸爸不見了，小鴨們傷心地哭了，牠們不知道原來爸爸就在屋頂上!"},"GREEN50":{"code":"GREEN50","number":50,"color":"green","title":"會飛的房子","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我去看電影，電影裏有個房子，綁了很多氣球就飛起來了。我希望我們家的房子也可以飛。媽媽說那是電影裏的房子，不是真的。我只好自己做夢，夢裏面的房子，綁了氣球也會飛。後來，氣球一個一個破了，房子掉下來，我嚇醒了.哥哥對我說:「現在有飛機旅館，你不用做夢了!」"},"GREEN51":{"code":"GREEN51","number":51,"color":"green","title":"媽媽愛誰多一點","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"姐姐和我是雙胞胎。我問媽媽愛誰多一點?媽媽說:「你們都是從我肚子裏出來的，我兩個都愛!」我覺得不對，媽媽應該要愛我多一點。媽媽想知道為什麼?我說:「姐姐比我早三分鐘出來，你已經多愛她三分鐘了。所以，現在你應該要愛我多一點!」"},"GREEN52":{"code":"GREEN52","number":52,"color":"green","title":"狗狗和我","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"狗狗在門外用爪子抓門，牠想進我的房間。我打開門對狗狗說:「你今天不乖，不可以進我的房間。」狗狗在門外嗚嗚地叫，好像很傷心地在哭。我也傷心地哭了，我去把門打開，讓狗狗進來。狗狗撲到我的身上，用舌頭舔我的眼淚。"},"GREEN53":{"code":"GREEN53","number":53,"color":"green","title":"家人聽對了嗎","category":"家/家人","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"媽媽要花，可是，妹妹拿畫給她。爺爺要扇，可是，弟弟拿傘給他。姐姐要花貓，可是，哥哥拿花帽給她。奶奶要梳子，可是，弟弟拿樹枝給她。爸爸要飛機，可是媽媽拿肥雞給他!"},"GREEN54":{"code":"GREEN54","number":54,"color":"green","title":"海盜弟弟","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我幫弟弟做了一把劍，姐姐幫他做了一個眼罩。弟弟穿了橫紋衣服，又戴上媽媽做的海盜帽子。他跑到媽媽那裏:「我是海盜，把寶藏給我。」媽媽把很多零錢給了弟弟，他很高興地數錢。然後，弟弟把錢都放進小豬存錢筒裏面了。"},"GREEN55":{"code":"GREEN55","number":55,"color":"green","title":"家裏有聲音","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"晚上，我在睡覺，聽到一個聲音，嚇得我…..跑到姐姐的房間去。姐姐也聽到一個聲音，她和我一起….跑到爸爸、媽媽的臥房。爸爸、媽媽也聽到了，他們拿著手電筒…...我們跟在爸媽後面走到客廳，看到桌上的杯子倒了…...啊!原來是一隻小鳥困在客廳裏了，爸爸把窗戶開大一點，讓牠飛走了。"},"GREEN56":{"code":"GREEN56","number":56,"color":"green","title":"媽媽出差","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"放學回家，沒有看到媽媽。我問爸爸:「媽媽呢?」爸爸說媽媽「出差」了。我問:「什麼是出差?」爸爸說「出差」就是要到別的地方工作幾天，不回家。晚上，爸爸講故事的時候，我有點兒想媽媽。媽媽終於回家了，我跳到她身上說:「下次，我要和你一起\"出差\"!」"},"GREEN57":{"code":"GREEN57","number":57,"color":"green","title":"花園房子","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小胖說他美國的家有花園，裏面有花，也有水果樹。花園旁邊有個游泳池，後面是空地，可以騎腳踏車。我聽了，也想有個這樣的花園房子。可是，我住在高樓大廈裏面。我想想，就畫了一個有花園的家，花園旁邊也有個游泳池…...當然還要有我，在空地上騎腳踏車!"},"GREEN58":{"code":"GREEN58","number":58,"color":"green","title":"把弟弟送給你","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我有一個討厭的弟弟，他總是和我搶玩具。他還會亂畫我的本子。所以，我決定把他送給別人。阿姨來我的家，我把弟弟送給她，阿姨把弟弟帶走了。現在，我只能自己玩了，我開始想弟弟…...我打電話給阿姨說:「你把弟弟還給我吧!」"},"GREEN59":{"code":"GREEN59","number":59,"color":"green","title":"我不貪心","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"爸爸常常教樂樂不要貪心，不是每一樣東西都要更好的。一天，樂樂回家，把成績單拿給爸爸看。爸爸看到樂樂的成績都是A，只是英文是B。爸爸說:「樂樂，用功一點，英文成績就會更好的。」樂樂心裏想:「B不是比C好嗎?爸爸不是說不要什麼都要更好的，我不貪心!」"},"GREEN60":{"code":"GREEN60","number":60,"color":"green","title":"我的好朋友","category":"家/家人","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"這是我家的小狗，牠是我的好朋友。我無聊的時候，喜歡幫牠穿上不同的漂亮衣服。我高興的時候，喜歡拉著牠的腳跳舞。放學回家以後，我喜歡當牠的老師。天冷的時候，我還會抱著牠睡覺。你呢?你想和小狗做什麼?"},"GREEN61":{"code":"GREEN61","number":61,"color":"green","title":"家裏的好人和壞人","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我和弟弟玩遊戲，我當好人，要他當壞人，他哭著說:「我也要當好人!」我說:「好吧!我們一起當好人，一起去捉壞人。」我們輕輕地走進哥哥的房間，在那裏，我們捉到很多壞人。哥哥回來了，他一走進房間，就大叫:「我的變形金剛呢?」"},"GREEN62":{"code":"GREEN62","number":62,"color":"green","title":"妹妹","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"妹妹做功課，我說她寫的字不好看。她說:「可以啦!」妹妹穿衣服，我說她衣服穿反了。她說:「可以啦!」妹妹洗完手，我說她的手還是髒。她說:「可以啦!」我生氣地說她真是一個「馬馬虎虎」的人!妹妹說:「我不屬馬，也不屬虎，我屬牛!」"},"GREEN63":{"code":"GREEN63","number":63,"color":"green","title":"媽媽像什麼","category":"家/家人","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"媽媽像什麼?我的媽媽什麼都像。她高興的時候，好像小鳥，嘰嘰喳喳不停地說話。她生氣的時候，好像老虎，對我兇巴巴地說話。她忙的時候，好像八爪魚，一次想做八件事情。她累的時候，好像大棕熊，躲進被窩裏睡大覺。"},"GREEN64":{"code":"GREEN64","number":64,"color":"green","title":"我討厭的事","category":"家/家人","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"我有很多討厭的事。吃飯的時候，我討厭媽媽一直叫我吃青菜。用電腦的時候，我討厭爸爸一直要我關機。看電視的時候，我討厭婆婆一直要我轉台。洗澡的時候，我討厭姐姐一直要我快點出來。你呢?你有什麼討厭的事?說來給我聽聽!"},"GREEN65":{"code":"GREEN65","number":65,"color":"green","title":"冬眠的弟弟","category":"家/家人","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"冬天的早上，弟弟睡在暖和的被子裏面，不肯起床。媽媽叫他起床，他不要，拉著棉被說:「我冬眠了。」到了中午，弟弟還是睡在床上，不肯起床。到了晚上，弟弟起床了，他肚子餓，想要吃東西。媽媽說:「動物冬眠的時候，是不需要吃東西的。」"},"GREEN66":{"code":"GREEN66","number":66,"color":"green","title":"尾巴","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"星期天，我穿了一條美麗的花裙子，和爸爸去動物園。到了那裏，我們看到大象、棕熊、獅子，和很多不同的動物。後來我們去看孔雀，很可惜，牠沒有張開美麗的尾巴。我靠近籠子，想讓孔雀看看我美麗的花裙子。牠慢慢地張開尾巴，好像告訴我:「我的尾巴比你的花裙子更美麗!」"},"GREEN67":{"code":"GREEN67","number":67,"color":"green","title":"角、鬍鬚和尾巴","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"大風吹呀吹，吹走了羊的角。吹走了松鼠的尾巴，吹走了小貓的鬍鬚。動物們說:「大風，大風，不要吹!」可是大風還是吹呀吹…...大風把我也吹上了天，我看到了角、尾巴和鬍鬚，就去抱住它們。忽然，大風停了，我從天上掉下來，動物們開心地接住我!"},"GREEN68":{"code":"GREEN68","number":68,"color":"green","title":"腿斷了","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻小象，掉進的坑，出不來了。小象媽媽不停地吼叫，很多人聽到，一起救出了小象。可是，他們發現小象的腿斷了，需要送醫院。他們打電話，來了一架直升機，把小象吊在空中，送到醫院。獸醫給小象綁了支架，小象可以慢慢地走路了!"},"GREEN69":{"code":"GREEN69","number":69,"color":"green","title":"能貓的毛","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小熊貓出生了，很小很小，粉紅色的。小熊貓開始長毛了，牠有黑色和白色的毛。但是，牠的耳朵、眼睛和四隻腳是白色的，身體卻是黑色的。不過，牠看起來還是很可愛，小朋友特別喜歡牠…...因為，牠長得和別的熊貓不一樣，牠很特別!"},"GREEN70":{"code":"GREEN70","number":70,"color":"green","title":"大熊的背","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"大熊趴在洞口，覺得背上癢癢的，牠伸手一抓，原來是小老鼠。牠問:「你在我背上做什麼?」小老鼠說:「我在跳舞。」大熊問牠為什麼在牠背上跳舞,小老鼠說:「因為你的背軟軟的，跌倒也不痛。」從此，牠們做了好朋友，小老鼠天天來跳舞。一天，大熊說牠要冬眠了。小老鼠說:「我要等三個月才能跳舞啊!那我跟你一起冬眠吧!」"},"GREEN71":{"code":"GREEN71","number":71,"color":"green","title":"羽毛","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻孔雀覺得自己的羽毛最美麗。小鳥們向牠要一根羽毛，孔雀說:「不行!」一天，孔雀睡完覺醒來，發現自己尾巴上美麗的羽毛沒有了。孔雀很傷心地去找牠的羽毛。小鳥們就給他幾自己身上的羽毛。孔雀把小鳥們送給牠的羽毛，插在尾巴上，現在牠覺得自己的羽毛更美麗。"},"GREEN72":{"code":"GREEN72","number":72,"color":"green","title":"牙齒","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一天早上，小明起床，走進浴室。他看到爺爺拿者牙齒，然後放進嘴巴裏。他不明白爺爺為什麼要吃牙齒?他對爺爺說:「你不要吃牙齒。」「你把牙齒放在枕頭下面，小牙仙會給你禮物。」爺爺問小明:「我沒有牙齒，這是假牙，小牙仙看見假牙，也會給我禮物嗎?」"},"GREEN73":{"code":"GREEN73","number":73,"color":"green","title":"頭上的大包","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"弟弟跌倒了，頭上腫了個大包。他哭著說:「好痛呀!」媽媽來了，她幫弟弟揉揉，可是，他還是說痛。奶奶來了，她給弟弟一顆糖，可是，他還是說痛。爸爸來了，他說:「去讓醫生打一針吧!」弟弟就不哭了。弟弟說:「不痛了!」然後，趕快把糖放進口裏。"},"GREEN74":{"code":"GREEN74","number":74,"color":"green","title":"腳受傷了","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻大狗和主人散步，牠看到一隻猴子，猴子也看到牠。第二天，猴子來找大狗，牠們一起吃飯和玩耍，從此，牠們做了好朋友。人們看到，覺得很奇怪，狗怎麼會和猴子做好朋友呢?可是，牠們天天都在一起，還常常到河裏游泳。一天，猴子沒看到大狗…...原來，大狗的腳受傷了。猴子也一跛一跛地走路，牠說:「我的腳也受傷了!」"},"GREEN75":{"code":"GREEN75","number":75,"color":"green","title":"熊熊生病了","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"弟弟拿起聽筒，放在他的小熊玩偶的身上。一會兒，他說:「熊熊生病了!他拿來溫度計，放進熊熊的嘴巴裏。一會兒，他說:「熊熊發燒了!」他又拿來針筒，給熊熊打針。他對熊熊說:「你不哭，我給你吃糖。」一會兒，他拿來了蜜糖給熊熊吃。然後，他抱起熊熊說:「我的熊熊是世界上最乖的熊!」"},"GREEN76":{"code":"GREEN76","number":76,"color":"green","title":"生病的公雞","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"天亮了，太陽出來了，公雞沒有喔喔叫。母雞很生氣地問牠:「你為什麼沒有喔喔叫?」公雞說牠生病了，牠的喉嚨很痛，叫不出聲音了。母雞說:「我帶你去看醫生，打一針，你就會叫了。」公雞看見醫生說:「你可以給母雞打一針，讓牠喔喔叫嗎?」"},"GREEN77":{"code":"GREEN77","number":77,"color":"green","title":"羽毛","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻孔雀覺得自己的羽毛最美麗。小鳥們向牠要一根羽毛，孔雀說:「不行!」一天，孔雀睡完覺醒來，發現自己尾巴上美麗的羽毛沒有了。孔雀很傷心地去找牠的羽毛。小鳥們就給他幾自己身上的羽毛。孔雀把小鳥們送給牠的羽毛，插在尾巴上，現在牠覺得自己的羽毛更美麗。"},"GREEN78":{"code":"GREEN78","number":78,"color":"green","title":"牙齒","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一天早上，小明起床，走進浴室。他看到爺爺拿著牙齒，然後放進嘴巴裏。他不明白爺爺為什麼要吃牙齒?他對爺爺說:「你不要吃牙齒。」「你把牙齒放在枕頭下面，小牙仙會給你禮物。」爺爺問小明:「我沒有牙齒，這是假牙，小牙仙看見假牙，也會給我禮物嗎?」"},"GREEN79":{"code":"GREEN79","number":79,"color":"green","title":"頭上的大包","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"弟弟跌倒了，頭上腫了個大包。他哭著說:「好痛呀!」媽媽來了，她幫弟弟揉揉，可是，他還是說痛。奶奶來了，她給弟弟一顆糖，可是，他還是說痛。爸爸來了，他說:「去讓醫生打一針吧!」弟弟就不哭了。弟弟說:「不痛了!」然後，趕快把糖放進口裏。"},"GREEN80":{"code":"GREEN80","number":80,"color":"green","title":"腳受傷了","category":"身體","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"一隻大狗和主人散步，牠看到一隻猴子，猴子也看到牠。第二天，猴子來找大狗，牠們一起吃飯和玩耍，從此，牠們做了好朋友。人們看到，覺得很奇怪，狗怎麼會和猴子做好朋友呢?可是，牠們天天都在一起，還常常到河裏游泳。一天，猴子沒看到大狗…...原來，大狗的腳受傷了。猴子也一跛一跛地走路，牠說:「我的腳也受傷了!」"},"GREEN81":{"code":"GREEN81","number":81,"color":"green","title":"冰淇淋","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"弟弟從廚房出來，他把手藏在背後。媽媽問：「你為什麼把手藏在背後？伸出來給我看！」弟弟不想伸出手，他說：「我手上的東西是．．．．．．」媽媽要他快點伸出手來！弟弟慢慢地伸出手．．．．．．「咦!冰淇淋怎麼沒有了?」弟弟奇怪地說。"},"GREEN82":{"code":"GREEN82","number":82,"color":"green","title":"烤鴨","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"北京烤鴨是中國菜，它已經有幾百年的歷史。烤好的鴨子，外面的皮是黃黃脆脆的，裏面的肉是軟軟嫩嫩的。吃烤鴨時要拿一張薄餅，加醬和大蔥，然後把鴨肉片包起來吃。媽媽!快帶我去吃烤鴨吧！"},"GREEN83":{"code":"GREEN83","number":83,"color":"green","title":"巧克力蛋糕","category":"食物","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"姐姐過生日，她八歲了，我要做一個蛋糕送給她。先放蛋，再放麵粉，還要加牛油和糖。姐姐愛吃巧克力，所以，要多放一點。結果蛋糕變成一座巧克力山，姐姐還是很愛吃。"},"GREEN84":{"code":"GREEN84","number":84,"color":"green","title":"花粉和花蜜","category":"食物","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"小矮人住在山村花裏，吃花粉，喝花蜜。一天來了一個巨人，小矮人很害怕，結果巨人說他也想住在花裏，吃花粉，喝花蜜。小矮人們幫他做了一個大花房，送他花粉和花蜜。"},"GREEN85":{"code":"GREEN85","number":85,"color":"green","title":"零食","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我們家櫃子裏有很多零食，姐姐愛吃芒果乾，弟弟愛吃薯片，我愛吃豬肉乾。雖然我們知道吃了零食不想吃飯，可是還是忍不住吃零食。今天櫃子裏的零食沒有了，媽媽煮的飯變得更香了……"},"GREEN86":{"code":"GREEN86","number":86,"color":"green","title":"西瓜和番茄","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"小西瓜和小番茄發現了方西瓜和紫番茄，爸爸告訴他們那些是表哥表弟。後來他們看到三角西瓜和藍番茄，猜測他們是堂哥堂弟。"},"GREEN87":{"code":"GREEN87","number":87,"color":"green","title":"香味","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"媽媽烤蛋糕時，香味飄滿了整個家，連鄰居小胖也聞到了。他來敲門說：「你家蛋糕的香味飄到我家了！」我說：「香味可以分享呀！」他問：「那蛋糕可以分享嗎？」"},"GREEN88":{"code":"GREEN88","number":88,"color":"green","title":"好吃的東西","category":"食物","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"我覺得好吃的東西大人都說不健康。我愛吃棒棒糖，老師說會蛀牙；我愛吃冰淇淋，奶奶說會喉嚨痛；爸爸說喝汽水會變胖。我想讓媽媽加點糖、冰淇淋和汽水到飯菜裡，好嗎？"},"GREEN89":{"code":"GREEN89","number":89,"color":"green","title":"先吃再付錢","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"媽媽讓我帶弟弟去超市買零食。我選了巧克力和冰淇淋，弟弟選了薯片和棒棒糖。我發現弟弟不見了，原來他坐在地上吃薯片。我說:「我們還沒付錢呢！」弟弟說:「吃了再付錢，不行嗎？」"},"GREEN90":{"code":"GREEN90","number":90,"color":"green","title":"食物夢","category":"食物","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我做了一個夢，夢裏的船是木瓜做的，河水是牛奶，橋是香蕉，路是麵包。河邊有西瓜椅子和薯片花，河裡有巧克力魚。我伸手去抓魚，醒來發現手裡真的有巧克力魚呢！"},"GREEN91":{"code":"GREEN91","number":91,"color":"green","title":"星星吃月亮","category":"自然","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"天上的月亮大又圓，星星看見了，很嫉妒月亮。它們決定去吃月亮，把月亮吃得彎彎的。不久，月亮又變得大又圓，星星又嫉妒，繼續吃月亮，於是月亮有時圓，有時彎。"},"GREEN92":{"code":"GREEN92","number":92,"color":"green","title":"找寶藏","category":"自然","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"這是一張寶藏圖，來!我們一起去找寶藏。先爬上高山，再渡過長河，找到最大的石頭，穿過小山洞。突然「救命呀!」原來只是一場夢，什麼寶藏也沒有。"},"GREEN93":{"code":"GREEN93","number":93,"color":"green","title":"我喜歡大自然","category":"自然","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"晴天時，我喜歡在大海和魚兒游泳；陰天時，我喜歡和朋友爬山探險；颳風時，我喜歡放風箏，讓它飛上天空；下雨時，我喜歡畫畫，畫我在大海、爬山和天空的美景。"},"GREEN94":{"code":"GREEN94","number":94,"color":"green","title":"遊太空","category":"自然","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"老師給我一個氣球，我用力吹，結果飛上了天。小鳥咬破氣球，我掉在白雲上，抓住火箭飛向太空，遇到太空人穿上太空衣坐上太空船回家。媽媽問我去了哪，我說去了很多地方。"},"GREEN95":{"code":"GREEN95","number":95,"color":"green","title":"寶石","category":"自然","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"媽媽的泳衣上有很多小魚，媽媽跳進水裏，小魚游走了。媽媽追著魚游進一個洞，見到了美人魚和沉船，船裏有各色寶石。媽媽高興地大叫，醒來後發現只有她曬紅的臉。"},"GREEN96":{"code":"GREEN96","number":96,"color":"green","title":"老樹","category":"自然","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我家院子有一棵老樹，白天我會爬上樹看書、睡覺，晚上看月亮數星星。傷心時，我會爬上樹，抱著樹枝哭，說出心事。這棵老樹就像我的家，也是我最好的朋友。"},"GREEN97":{"code":"GREEN97","number":97,"color":"green","title":"美麗的星星","category":"自然","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"有一天，太陽、白雲和彩虹比美。太陽說自己又大又紅最美，白雲說自己像小羊小兔最美，彩虹說自己有七種顏色最美。星星聽了說，只有它一閃一閃像寶石，才是最美麗的。"},"GREEN98":{"code":"GREEN98","number":98,"color":"green","title":"雨天的積水","category":"自然","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"我喜歡雨天，拿著雨傘慢慢走，也喜歡在雨中跑來跑去，讓雨打在臉上。最愛踩積水，和朋友比誰濺得最高。結果全身濕透，媽媽生氣了，我趕快回家洗澡，再告訴她我贏了比賽。"},"GREEN99":{"code":"GREEN99","number":99,"color":"green","title":"春夏秋冬","category":"自然","author":"姚釹","illustrator":"黃孝璋/蕭莉芳","content":"春天羊在山上吃草，牛來了也想吃，羊說：「一起吃吧!」夏天草長高了，牛羊都吃得飽飽的。秋天羊肚子餓了，牛請牠去家裡吃草。羊說：「冬天也不怕沒草了！」"},"GREEN100":{"code":"GREEN100","number":100,"color":"green","title":"小種子","category":"自然","author":"李琇琇","illustrator":"黃孝璋/蕭莉芳","content":"我把小種子種在土裏，天天澆水，過了很久，種子發芽了。我把它移到窗外曬更多太陽，喝更多雨水，結果曬太多、喝太多，小種子死了。"},"YELLOW01":{"code":"YELLOW01","number":1,"color":"yellow","title":"忘了","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"前天，我忘了帶足球回家。昨天，我忘了帶外套回家。今天，我忘了帶滑板回家。媽媽很生氣。糟糕!媽媽發現自己忘了帶鑰匙，她對我說:「不能回家了!」我拿出我的鑰匙!"},"YELLOW02":{"code":"YELLOW02","number":2,"color":"yellow","title":"我沒空","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"兒子說:「你答應今天跟我踢球!」爸爸說:「我今天沒空!」兒子說:「你答應今天跟我騎車!」爸爸說:「我今天沒空!」兒子說:「我今天沒空!」"},"YELLOW03":{"code":"YELLOW03","number":3,"color":"yellow","title":"找什麼","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"桌子上沒有，抽屜裏沒有，口袋裏沒有，皮包裏也沒有，我問:「媽媽，你找什麼?」她說:「我的眼鏡!」我說:「你的眼鏡就在你頭上!」"},"YELLOW04":{"code":"YELLOW04","number":4,"color":"yellow","title":"生病","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"我生病了，媽媽不要我上學，她不要我做功課，她要我喝很多水。我可以睡在她的床上。我可以在她的床一看電視。妹妹說:「我也要生病!」"},"YELLOW05":{"code":"YELLOW05","number":5,"color":"yellow","title":"拉吊床","category":"日常生活","author":"姚釹","illustrator":"林淑芬","content":"我爬進吊床，躺在裏面，真舒服啊!弟弟來了，他用力地拉吊床，他說:「我也要躺在裏面。」我說:「不要拉!不要拉!」砰!我跌下吊床，弟弟躺在裏面了!"},"YELLOW06":{"code":"YELLOW06","number":6,"color":"yellow","title":"下不來了","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"貓兒，你在哪兒?不在廚房，不在家睡覺，不在陽臺曬太陽，不在院子追老鼠。「喵!喵!」我聽到貓兒叫了!啊!牠爬上樹，卻下不來了!"},"YELLOW07":{"code":"YELLOW07","number":7,"color":"yellow","title":"禮物在哪兒","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"我的生日禮物呢?在椅子上面?在書包裏面?在桌子下面?在床上面?在媽媽的手裏?原來，禮物是一隻小鳥!"},"YELLOW08":{"code":"YELLOW08","number":8,"color":"yellow","title":"夢到什麼","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"我穿好睡衣，爬上床，看恐龍故事書，看呀看，我睡著了。我夢到恐龍說:「下雪了!」我打開窗戶，外面真的下雪了!"},"YELLOW09":{"code":"YELLOW09","number":9,"color":"yellow","title":"我們很無聊","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"哥哥很無聊，他看著電腦。弟弟很無聊，他看著電視。爸爸說:「不可以看電腦，也不可以看電視。」他們說:「下雨了，為什麼要洗車?」"},"YELLOW10":{"code":"YELLOW10","number":10,"color":"yellow","title":"做拼圖","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"拿一張圖貼在硬紙上，畫九個格子，剪成拼圖，送給妹妹玩。妹妹說:「我要做十二片的拼圖給你玩!」"},"YELLOW11":{"code":"YELLOW11","number":11,"color":"yellow","title":"我還是很愛你","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"小狗很麻煩，愛尿地毯，愛咬沙發，愛喝髒水，愛挖洞。我說:「你是不乖的小狗!不過，我還是很愛你!」"},"YELLOW12":{"code":"YELLOW12","number":12,"color":"yellow","title":"照顧寵物","category":"日常生活","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"狗狗是哥哥的寵物，媽媽帶狗散步。烏龜是妹妹的，魚是弟弟的。媽媽說:「你們的寵物，怎麼都是我在照顧?」我們說:「因為我們是你的寵物!」"},"YELLOW13":{"code":"YELLOW13","number":13,"color":"yellow","title":"你想住在哪裏","category":"日常生活","author":"李琇琇","illustrator":"林淑芬","content":"我想住在圖書館，看什麼書，就看什麼書。我想住在玩具店，玩什麼玩具，就玩什麼。我想住在媽媽口袋裏，她去哪兒，我就去哪兒。"},"YELLOW14":{"code":"YELLOW14","number":14,"color":"yellow","title":"動物的船沉了","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"船沉了，動物跳進海裏，游到小島，寫「救命」。直升機看到了，飛走了，但後來又回來了!動物們得救了!"},"YELLOW15":{"code":"YELLOW15","number":15,"color":"yellow","title":"不是真的動物","category":"動物","author":"李琇琇","illustrator":"林淑芬、鄧博賢","content":"我去公園，看到袋鼠、小馬、白兔，貓頭鷹也在樹上不睡覺。但牠們都不動，原來它們是雕像!"},"YELLOW16":{"code":"YELLOW16","number":16,"color":"yellow","title":"動物的朋友","category":"動物","author":"李琇琇","illustrator":"林淑芬、鄧博賢","content":"有朋友真好!貓帶狗玩耍，鵝帶鴨游泳，兔子帶青蛙跳繩，蜜蜂帶蝴蝶採蜜，黃牛帶小馬吃草，老鷹帶我飛上天，去看美麗的世界。"},"YELLOW17":{"code":"YELLOW17","number":17,"color":"yellow","title":"狗兒","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"我牽狗兒去散步，牠看到好朋友就跑。我們也跟著牠跑。最後，狗兒的主人也成了朋友!"},"YELLOW18":{"code":"YELLOW18","number":18,"color":"yellow","title":"老鷹和兔子","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"老鷹飛向兔子，兔子逃跑。老鷹快抓到兔子時，兔子突然轉彎，老鷹來不及轉彎，只好飛上天。"},"YELLOW19":{"code":"YELLOW19","number":19,"color":"yellow","title":"好看的動物","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"給動物塗色，加上圖案。海星有圓圈，海馬有線條，海豚有鑽石，章魚有螺旋，海龜有花圖案。動物更好看了!"},"YELLOW20":{"code":"YELLOW20","number":20,"color":"yellow","title":"會飛的動物","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"巫婆有掃把就會飛，阿拉丁有飛毯，超人有披風就會飛，蜘蛛俠有蜘蛛絲就會飛，人們有飛行傘就會飛。小猴子也想飛….牠只要找個會飛的好朋友「鸚鵡」"},"YELLOW21":{"code":"YELLOW21","number":21,"color":"yellow","title":"什麼動物最棒","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"動物們在樹下七嘴八舌。豹說:「我跑得最快，我最棒!」鼴鼠說:「我挖洞最快，我最棒!」袋鼠說:「我跳得最快，我最棒!」猴子說:「我爬樹最快，我最棒!」獵人說:「我最棒!」"},"YELLOW22":{"code":"YELLOW22","number":22,"color":"yellow","title":"說話的魚","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"會吃人的魚，鯊魚。會噴水的魚，鯨魚。會發電的魚，電鰻。會清潔的魚，清潔魚。會發光的魚，燭光魚。會回家的魚，鮭魚。會說話的魚，美人魚。"},"YELLOW23":{"code":"YELLOW23","number":23,"color":"yellow","title":"動物的腳印","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"地上有大腳印。「不是我們的腳印，我們的像葉子。「不是我們的腳印，我們的像花。」「是誰的腳印呢?」牠們想…「是我的!」大熊說。「是大熊，快逃!」小動物們說。「不要逃!進來吃蜂蜜!」大熊說。"},"YELLOW24":{"code":"YELLOW24","number":24,"color":"yellow","title":"貓兒在哪裏","category":"動物","author":"李琇琇","illustrator":"林淑芬、鄧博賢","content":"這是我的貓，牠的名字叫小月。有一天，牠不見了!小月在樹上嗎?小月在洞裏嗎?小月在哪裏?「喵!」小月當媽媽了!"},"YELLOW25":{"code":"YELLOW25","number":25,"color":"yellow","title":"動物寶寶","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"鳥媽媽坐在鳥巢裏，蜻蜓飛過來，看一看!樹蛙跳過來，看一看!小松鼠爬過來，看一看!小朋友把頭伸過來，看一看!鳥爸爸回來了，牠說:「我的寶寶都出來了!」"},"YELLOW26":{"code":"YELLOW26","number":26,"color":"yellow","title":"魚鷹","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"一隻魚鷹站在樹上，牠張開翅膀飛向大海，牠飛進大海裏，又飛出來，爪子抓著一條魚，牠飛到海邊吃魚。魚鷹就是吃魚的鷹。"},"YELLOW27":{"code":"YELLOW27","number":27,"color":"yellow","title":"小鴨","category":"動物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"老鷹來捉小雞了，小雞都躲到母雞的翅膀下，小鴨也躲到母鴨的翅膀下，老鷹飛走了。母鴨傷心地說:「一隻小鴨不見了。」母雞說:「牠在我這兒呢!」"},"YELLOW28":{"code":"YELLOW28","number":28,"color":"yellow","title":"剪紙","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"一張正方形的白紙，摺一半是三角形，在長邊中間畫個點，右角摺上去，左角摺上去，在中間畫上樹幹和樹枝。剪下來，再打開，就是一片雪花!"},"YELLOW29":{"code":"YELLOW29","number":29,"color":"yellow","title":"比賽","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"各就各位，預備，開始，跑!小烏龜和小蝸牛還在爬，他們說:「怎麼不比誰最慢?」"},"YELLOW30":{"code":"YELLOW30","number":30,"color":"yellow","title":"橡皮","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"弟弟打開我的書包，他拿出我的筆盒，打開筆盒，拿出橡皮。弟弟聞一聞橡皮說:「好香!」然後把橡皮放進口裏。我說:「弟弟!那是橡皮，不是糖呀!」"},"YELLOW31":{"code":"YELLOW31","number":31,"color":"yellow","title":"摺紙","category":"學校/學校活動","author":"李琇琇","illustrator":"林淑芬、鄧博賢","content":"一張正方形的紙，把它摺一半，變成三角形。再把上面兩個角，向下摺，變成兩個耳朵。然後畫一雙眼睛，再畫一個小鼻子，就變成一隻可愛的小狗了。"},"YELLOW32":{"code":"YELLOW32","number":32,"color":"yellow","title":"少了什麼","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"風箏少了什麼不能飛?腳踏車少了什麼不能騎?汽車少了什麼不能開?沙坑少了什麼不能玩?皮球少了什麼不能拍?風車少了什麼不能轉?我少了什麼?"},"YELLOW33":{"code":"YELLOW33","number":33,"color":"yellow","title":"剪剪貼貼","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"先剪一個黑色橢圓形，再剪一個白色心形貼在上面。然後剪一個白色圓形，貼在下面。接著再剪三個小三角形和兩個大三角形，剪兩個黑色長方形，做企鵝。"},"YELLOW34":{"code":"YELLOW34","number":34,"color":"yellow","title":"帶寶貝到學校","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬","content":"老師讓我們帶自己的寶貝到學校，有人帶寵物，有人帶遊戲機，有人帶貼紙，有人帶玩偶。老師問:「你的寶貝呢?」我說:「她來了!」妹妹爬過來了!"},"YELLOW35":{"code":"YELLOW35","number":35,"color":"yellow","title":"新書包","category":"學校/學校活動","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"媽媽送給弟弟一個新書包，弟弟說:「書包要有筆盒。」接著又說:「筆盒要有鉛筆。」最後畫了一張畫送給媽媽。"},"YELLOW36":{"code":"YELLOW36","number":36,"color":"yellow","title":"破了","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"小小的乒乓球，圓圓的乒乓球拍，乒乓球桌和乒乓球網。重重地拍球，球跳得好高，又好快落下來。啪!球破了!"},"YELLOW37":{"code":"YELLOW37","number":37,"color":"yellow","title":"不一樣","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"左邊和右邊的髮夾不一樣，耳環不一樣，指甲顏色不一樣，襪子不一樣，鞋子不一樣。姐姐說:「不一樣才美麗!」"},"YELLOW38":{"code":"YELLOW38","number":38,"color":"yellow","title":"甜蜜蜜","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"小黑鼠找朋友，看到了兇巴巴的小狗、懶洋洋的小貓、髒兮兮的小鴨、臭乎乎的小豬，最後遇到了笑瞇瞇的小白鼠，兩隻小老鼠甜蜜蜜的。"},"YELLOW39":{"code":"YELLOW39","number":39,"color":"yellow","title":"還是好朋友","category":"關鍵字","author":"李琇琇","illustrator":"胡子建","content":"小馬吃得少，小豬吃得多。小馬跑得快，小豬跑得慢。小馬長得高，小豬長得矮。小馬和小豬還是好朋友。"},"YELLOW40":{"code":"YELLOW40","number":40,"color":"yellow","title":"不見了","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"小小的海島，清清的海水，白白的海鷗，涼涼的海風，層層的海浪，大大的海嘯，海島不見了!"},"YELLOW41":{"code":"YELLOW41","number":41,"color":"yellow","title":"一堆什麼","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"母雞要生蛋了，找到......一堆石頭，太硬了。一堆土，太髒了。一堆沙，太軟了。一堆樹枝，太刺了。一堆乾草，剛剛好!母雞下蛋了!"},"YELLOW42":{"code":"YELLOW42","number":42,"color":"yellow","title":"撞到了","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"快艇開了，它經過公園，繞過小島，穿過大橋，飛過石頭，躲過鯨魚，砰!撞到了碼頭!"},"YELLOW43":{"code":"YELLOW43","number":43,"color":"yellow","title":"知道和不知道","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"我很想知道……天上的星星有多少?海邊的沙有多少?海裏的魚有多少?地上的石頭有多少?大人都說:「不知道!」我很想知道，大人為什麼也不知道?"},"YELLOW44":{"code":"YELLOW44","number":44,"color":"yellow","title":"真假恐龍","category":"關鍵字","author":"姚釹","illustrator":"胡子建","content":"安安有很多玩具恐龍，文文說:「現在沒有恐龍了。」安安說:「以前有很多恐龍。」文文說:「我害怕恐龍。」安安說:「我喜歡恐龍。」文文說:「你喜歡的是玩具恐龍，是假的。」"},"YELLOW45":{"code":"YELLOW45","number":45,"color":"yellow","title":"我是美美","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"美美是個女孩子，爺爺親親她，奶奶抱抱她，爸爸陪她玩，媽媽陪她讀書。她說:「大家都愛我，我愛誰呢?」她摸摸媽媽的大肚子說:「我愛弟弟!」"},"YELLOW46":{"code":"YELLOW46","number":46,"color":"yellow","title":"不是雙胞胎","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"我們長得一樣，穿一樣的衣服，背一樣的書包，上一樣的學校，有一樣的爸爸媽媽，我們不是雙胞胎，我們是三胞胎!"},"YELLOW47":{"code":"YELLOW47","number":47,"color":"yellow","title":"老大老二","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"妹妹問媽媽:「為什麼我總是穿姐姐的舊衣服?」姐姐說:「因為我是老大，你是老二。」妹妹說:「我不要當老二，我要當老大。」"},"YELLOW48":{"code":"YELLOW48","number":48,"color":"yellow","title":"抱妹妹","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"妹妹什麼都愛抱。床上的娃娃，她要抱。椅子上的軟墊，她要抱。地上的狗狗，她要抱。窗臺上的貓兒，她也要抱。門口的大樹，她也要抱。她要我抱。"},"YELLOW49":{"code":"YELLOW49","number":49,"color":"yellow","title":"我也很好","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"哥哥功課做得很好，姐姐跳舞跳得很好，弟弟游泳游得很好，妹妹溜冰溜得很好。我呢?我什麼做得好?我家狗兒跳到我身上舔我，我也很好!"},"YELLOW50":{"code":"YELLOW50","number":50,"color":"yellow","title":"全家人","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"弟弟在玩玩具，妹妹在跳舞，姐姐在做功課，哥哥在踢球，媽媽和爸爸在看電視，爺爺和奶奶在看報紙。全家人在一起吃飯!"},"YELLOW51":{"code":"YELLOW51","number":51,"color":"yellow","title":"我的家","category":"家/家人","author":"姚釹","illustrator":"胡子建","content":"小熊說:「我要一個家!」小魚說:「來我家!」小熊說:「我不會游泳啊!」小蝸牛說:「來我家!」小熊說:「我太大了!」小鳥說:「來我家!」小熊看到山洞說:「啊!我的家!」"},"YELLOW52":{"code":"YELLOW52","number":52,"color":"yellow","title":"騎在我身上","category":"身體","author":"姚釹","illustrator":"胡子建","content":"我是一隻狗，主人才兩歲，牠愛拉耳朵、咬尾巴、打屁股，還愛騎在我身上。唉!當狗很辛苦!"},"YELLOW53":{"code":"YELLOW53","number":53,"color":"yellow","title":"畫龍","category":"身體","author":"姚釹","illustrator":"胡子建","content":"畫一個馬的臉，兩隻虎的眼睛，一個獅子的鼻子，兩隻鹿的角，兩隻牛的耳朵，一個蛇的身體，兩隻鷹的爪子。再加龍鬚，像龍嗎?"},"YELLOW54":{"code":"YELLOW54","number":54,"color":"yellow","title":"用耳朵聽","category":"身體","author":"姚釹","illustrator":"胡子建","content":"一隻兔子，牠聽到附近有聲音，牠聞到味道，牠看到動物，用耳朵聽、鼻子聞、眼睛看。不好了，是獅子!快逃!"},"YELLOW55":{"code":"YELLOW55","number":55,"color":"yellow","title":"畫小鳥","category":"身體","author":"李琇琇","illustrator":"胡子建","content":"先畫一個大大的身體，再畫一個頭，頭上畫兩隻小小的眼睛，再加上一個小小的嘴，身體下面畫一個小尾巴，再加上翅膀。變成小鳥!飛了!再見了!"},"YELLOW56":{"code":"YELLOW56","number":56,"color":"yellow","title":"動物們吃東西","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"兔子看到紅蘿蔔說:「又要吃紅蘿蔔!」老鼠看到乳酪說:「又要吃乳酪!」青蛙看見小蟲說:「又要吃小蟲!」小雞看見米說:「又要吃米!」小貓看見魚說:「又要吃魚!」動物們說:「我們來交換吧!」哎呀!真難吃!"},"YELLOW57":{"code":"YELLOW57","number":57,"color":"yellow","title":"小鱷魚吃東西","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"小鱷魚看到很多食物，牠吃了薯片，脆脆的。牠吃了漢堡，軟軟的。牠吃了冰淇淋，冰冰的。牠喝了汽水，甜甜的。牠看到很多叉子。小鱷魚不能吃東西了!"},"YELLOW58":{"code":"YELLOW58","number":58,"color":"yellow","title":"做餅乾","category":"食物","author":"姚釹","illustrator":"林淑芬","content":"一堆麵粉，中間挖個洞，把雞蛋放進洞裏，把牛油放進洞裏，把牛奶倒進洞裏，把糖放進洞裏。然後，揉麵和擀麵，再切成餅乾形狀去烤一烤。餅乾烤好了，好香!"},"YELLOW59":{"code":"YELLOW59","number":59,"color":"yellow","title":"甜餅乾","category":"食物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"弟弟愛吃甜餅乾，媽媽不要弟弟吃太多甜餅乾，弟弟常常偷吃甜餅乾。媽媽生氣地藏起甜餅乾。弟弟又偷吃了，他怕媽媽生氣……他寫一張字條給媽媽，「我只吃了一塊!」"},"YELLOW60":{"code":"YELLOW60","number":60,"color":"yellow","title":"新鮮的水果","category":"食物","author":"姚釹","illustrator":"林淑芬、鄧博賢","content":"蘋果，做成蘋果派。鳳梨，做成鳳梨酥。香蕉，做成香蕉蛋糕。芒果，做成芒果布丁。葡萄，做成葡萄冰棍兒。草莓，做成草莓冰淇淋。還是新鮮的水果好吃。"},"YELLOW61":{"code":"YELLOW61","number":61,"color":"yellow","title":"剩下的食物","category":"食物","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"剩下的飯，剩下的肉，剩下的菜，把它們全部倒進鍋裡，加一點油，炒！炒！炒！香噴噴的炒飯做好了！炒飯吃光了！一點都不剩！"},"YELLOW62":{"code":"YELLOW62","number":62,"color":"yellow","title":"蔥油餅","category":"食物","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"把麵粉放進大碗裡，加點水，用筷子攪一攪，把攪好的麵粉倒出來，用手揉成一個大麵糰，拿一小塊麵糰，用擀麵棍擀平，上面放油、蔥和鹽，再用手捲起來壓平，然後用油煎一煎，蔥油餅就做好了！"},"YELLOW63":{"code":"YELLOW63","number":63,"color":"yellow","title":"大水","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"大水來了，盆子裡有一個小寶寶，大樹上有幾隻猴子，牠們拿起盆子，摸摸裡的小寶寶，大水退了，猴子們把寶寶送回家！"},"YELLOW64":{"code":"YELLOW64","number":64,"color":"yellow","title":"沒有下雨","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"很久沒有下雨了，土地裂了，玉米死了，樹木枯了，池塘乾了，水龍頭也沒水了，旱災來了！"},"YELLOW65":{"code":"YELLOW65","number":65,"color":"yellow","title":"堅果","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"小松鼠找到一個堅果，牠在地上挖了一個洞，把堅果放進去，再把堅果埋起來。冬天到了，小松鼠找不到堅果。春天到了，樹芽冒出來，小松鼠看著它，心裡想：這是誰種的小樹？"},"YELLOW66":{"code":"YELLOW66","number":66,"color":"yellow","title":"寶石","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"下大雪，樹枝上積滿雪。一隻小綠鳥躲在樹枝裡，我開窗讓小綠鳥飛進來。雪停了，太陽出來了，我開窗讓小綠鳥飛走。「叩叩叩！」小綠鳥敲窗，我打開窗，發現一顆寶石！"},"YELLOW67":{"code":"YELLOW67","number":67,"color":"yellow","title":"星星","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"有一座山，山上有一棵樹，樹上有鳥窩，窩裡有幾顆鳥蛋。一條蛇爬上樹，想要吃鳥蛋，鳥爸爸來了，蛇被嚇到，從樹上掉下來！"},"YELLOW68":{"code":"YELLOW68","number":68,"color":"yellow","title":"植物","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"阿姨送我一棵植物，我把它放在鋼琴上，我天天彈鋼琴給它聽。植物長出新葉，長出花苞，花兒開了！阿姨說：「原來植物也喜歡聽音樂！」"},"YELLOW69":{"code":"YELLOW69","number":69,"color":"yellow","title":"星球","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"這個星球光禿禿的，沒有樹木。這個星球平平的，沒有山。這個星球太乾了，沒有水。這個星球很多沙，沒有石頭。這個星球太黑了，沒有光。這個星球臭臭的，沒有空氣。這個星球是地球。"},"YELLOW70":{"code":"YELLOW70","number":70,"color":"yellow","title":"彩虹","category":"自然","author":"姚釹","illustrator":"林淑芬，鄧博賢","content":"你聽！嘩！嘩！嘩！是什麼聲音？是瀑布！好大的瀑布！你看，那裡有一道彩虹！你看，那裡還有一道彩虹！咦！彩虹不見了！「沒關係，我們回家看彩虹！」"},"YELLOW71":{"code":"YELLOW71","number":71,"color":"yellow","title":"數數看","category":"數字","author":"姚釹","illustrator":"胡子建","content":"數數看，有幾條蛇？四條。數數看，有幾隻毛毛蟲？五隻。數數看，有幾隻螞蟻？六隻。數數看，有幾隻螢火蟲？七隻。數數看，有幾隻蜘蛛？八隻。數數看，有幾隻蝌蚪？九隻。數數看，有幾隻瓢蟲？十隻。"},"YELLOW72":{"code":"YELLOW72","number":72,"color":"yellow","title":"二四六八十","category":"數字","author":"姚釹","illustrator":"胡子建","content":"牠有一個大大的身體，兩個小小的頭，四個圓圓的嘴，六個方方的眼睛，八隻長長的手，十隻短短的腳。牠就是怪物！"},"YELLOW73":{"code":"YELLOW73","number":73,"color":"yellow","title":"多少","category":"數字","author":"姚釹","illustrator":"胡子建","content":"過生日，有禮物、蛋糕和蠟燭。你的禮物有多少？不多也不少。你的小蛋糕有多少？一人一個，剛剛好。你的蠟燭有多少？六歲六根，一根也不少。"},"YELLOW74":{"code":"YELLOW74","number":74,"color":"yellow","title":"第一第二第三","category":"數字","author":"姚釹","illustrator":"胡子建","content":"每個小朋友都摺了紙飛機，一、二、三，把飛機扔出去。我的飛得最遠，是第一。你的飛得不遠也不近，是第二。"},"YELLOW75":{"code":"YELLOW75","number":75,"color":"yellow","title":"第四","category":"數字","author":"姚釹","illustrator":"胡子建","content":"第一張餅，翻過來，掉在地上，狗吃了。第二張餅，翻過來，掉在窗台，貓舔了。第三張餅，翻過來，怎麼不見了？第四張餅，翻過來，接到了！"},"YELLOW76":{"code":"YELLOW76","number":76,"color":"yellow","title":"一二三四五六七","category":"數字","author":"姚釹","illustrator":"胡子建","content":"一隻大豬，跌了一跤，頭上有了兩個大包，三隻腳斷了，四隻熊來抬牠，五個狗醫生來了，六隻小豬來看牠，七顆星星來陪牠！"},"YELLOW77":{"code":"YELLOW77","number":77,"color":"yellow","title":"四季","category":"天氣/季節","author":"姚釹","illustrator":"胡子建","content":"一年有四季，春天、夏天、秋天和冬天。新加坡沒有四季，新加坡一年都是夏天。我要去那裏！為什麼？一年都是暑假，不用上學！"},"YELLOW78":{"code":"YELLOW78","number":78,"color":"yellow","title":"天氣","category":"天氣/季節","author":"姚釹","illustrator":"胡子建","content":"星期一，晴天。星期二，陰天。星期三，雨天。星期四，有冰雹。星期五，有大霧。星期六，有大風。星期天，有沙塵暴！"},"YELLOW79":{"code":"YELLOW79","number":79,"color":"yellow","title":"冬天和春天","category":"天氣/季節","author":"姚釹","illustrator":"胡子建","content":"冬天到了，樹葉變黑色？原來是黑鳥在樹上。冬天的樹，光禿禿的。春天到了，是否是綠鳥在樹上？啊！原來是春天到，長綠葉了！"},"YELLOW80":{"code":"YELLOW80","number":80,"color":"yellow","title":"颱風","category":"天氣/季節","author":"姚釹","illustrator":"胡子建","content":"下大雨了，吹大風了，大樹倒了，房子歪了，汽車翻了，颱風來了。原來是拍電影。"},"YELLOW81":{"code":"YELLOW81","number":81,"color":"yellow","title":"晴天","category":"天氣/季節","author":"姚釹","illustrator":"胡子建","content":"親愛的太陽公公，你躲到哪裏去了？我不喜歡雨天，我也不喜歡陰天，我喜歡晴天。你快點出來，好不好？想念你的陽陽！"},"YELLOW82":{"code":"YELLOW82","number":82,"color":"yellow","title":"很酷的顏色","category":"顏色","author":"姚釹","illustrator":"胡子建","content":"戴著藍色的帽子，戴著黑色的眼鏡，穿著紅色的衣服，穿著綠色的褲子，吃著橙色的棒棒糖，穿著紫色的鞋子，玩著黃色的滑板。我很酷！"},"YELLOW83":{"code":"YELLOW83","number":83,"color":"yellow","title":"彩虹衣","category":"顏色","author":"李琇琇","illustrator":"胡子建","content":"媽媽要洗衣服了，弟弟的紅帽子，爸爸的藍褲子，姐姐的黃裙子，妹妹的橙上衣，哥哥的紫襪子。洗好了，看！我們的彩虹衣。"},"YELLOW84":{"code":"YELLOW84","number":84,"color":"yellow","title":"顏色變了","category":"顏色","author":"李琇琇","illustrator":"胡子建","content":"森林裏有一隻變色龍，牠吃了紅色蘋果，橙色的橙，黃色的香蕉，紫色的葡萄，綠色的葉子，咦！變色龍不見了！"},"YELLOW85":{"code":"YELLOW85","number":85,"color":"yellow","title":"彩色糖果屋","category":"顏色","author":"李琇琇","illustrator":"胡子建","content":"一顆黃色的星星，一根綠色的棒子，走進藍色的門，看到紅色的箱子，拿起白色的鑰匙，穿上黑色的衣服，變！變出了彩色糖果屋！"},"YELLOW86":{"code":"YELLOW86","number":86,"color":"yellow","title":"拐杖和帽子","category":"衣物","author":"姚釹","illustrator":"胡子建","content":"爺爺要出去，我幫他穿鞋、綁鞋帶，我幫他拿拐杖和帽子，我幫他開門，他說：「我不出去了！」我幫他放好拐杖和帽子，我幫他解鞋帶、脫鞋子。爺爺站起來以說：「我要出去！」"},"YELLOW87":{"code":"YELLOW87","number":87,"color":"yellow","title":"女孩子的衣物","category":"衣物","author":"姚釹","illustrator":"胡子建","content":"我是男孩，我有一個姐姐，今天我穿了她的長裙子，腳上穿了她的高跟鞋，嘴上塗了她的口紅，身上背了她的皮包。媽媽說：「你是女孩了。」我說：「姐姐說今天她只跟女孩玩。」"},"YELLOW88":{"code":"YELLOW88","number":88,"color":"yellow","title":"一層一層的衣服","category":"衣物","author":"姚釹","illustrator":"胡子建","content":"今天天氣非常冷，我穿上內衣，穿上長袖衣服，又穿上毛衣，外面加一件外套，再加上大風衣。這就是洋蔥穿衣法，一層又一層。"},"YELLOW89":{"code":"YELLOW89","number":89,"color":"yellow","title":"姐姐穿衣服","category":"衣物","author":"姚釹","illustrator":"胡子建","content":"這件衣服太長了，換一件。這條裙子太短了，換一條。這雙襪子太花了，換一雙。這雙鞋子太舊了，換一雙。這件外套剛剛好。姐姐看看鏡子說：「我真漂亮！」媽媽說：「今天要上學，穿校服。」"},"YELLOW90":{"code":"YELLOW90","number":90,"color":"yellow","title":"害怕","category":"情感","author":"姚釹","illustrator":"胡子建","content":"害怕時，你躲在哪兒？躲在棉被裏。傷心時，你躲在哪兒？躲在廁所裏。害羞時，你躲在哪兒？躲在媽媽的懷裏。妹妹害羞時，我讓她躲在我的懷裏。"},"YELLOW91":{"code":"YELLOW91","number":91,"color":"yellow","title":"笑臉","category":"情感","author":"姚釹","illustrator":"胡子建","content":"萬聖節到了，哥哥戴了鬼臉，妹妹很害怕!姐姐畫了貓臉，小狗很驚訝!弟弟畫了花臉，大家都有了笑臉!"},"YELLOW92":{"code":"YELLOW92","number":92,"color":"yellow","title":"節日(1)","category":"節慶","author":"李琇琇","illustrator":"胡子建","content":"元宵節，看花燈。端午節，賽龍舟。中秋節，去賞月。過新年，拿紅包。"},"YELLOW93":{"code":"YELLOW93","number":93,"color":"yellow","title":"節日(2)","category":"節慶","author":"李琇琇","illustrator":"胡子建","content":"元宵節，吃湯圓。端午節，吃粽子。中秋節，吃月餅。過新年，吃年糕。"},"YELLOW94":{"code":"YELLOW94","number":94,"color":"yellow","title":"醫生","category":"職業","author":"姚釹","illustrator":"胡子建","content":"醫生，我生病了。醫生，我頭痛。醫生，我喉嚨痛。醫生，我耳朵痛。醫生，我肚子痛。護士給我打一針。醫生，我屁股也痛了。"},"YELLOW95":{"code":"YELLOW95","number":95,"color":"yellow","title":"醫院","category":"職業","author":"姚釹","illustrator":"胡子建","content":"狗狗生病了，我們帶狗狗去動物醫院，醫生給狗狗看病，給狗狗打針、吃藥。我說：「醫生，我也要看病!」他說：「這是動物醫院。」我說：「我也是動物啊!」"},"YELLOW96":{"code":"YELLOW96","number":96,"color":"yellow","title":"是學生","category":"職業","author":"姚釹","illustrator":"胡子建","content":"看他的鼻子，猜他是小丑。看他的帽子，猜他是廚師。看他的聽筒，猜他是醫生。看他的衣服，猜他是救火員。看他的徽章，猜他是警察。看他的腰帶，猜他是工人。"},"YELLOW97":{"code":"YELLOW97","number":97,"color":"yellow","title":"長大要做什麼","category":"職業","author":"姚釹","illustrator":"胡子建","content":"大人愛問我們：「你長大要做什麼?」有的人要當舞蹈家，有的人要當老師，有的人要當廚師，有的人要當畫家，有的人要當太空人。我說：「我要當小孩，不想長大!」"},"YELLOW98":{"code":"YELLOW98","number":98,"color":"yellow","title":"坐直升機","category":"交通工具","author":"姚釹","illustrator":"胡子建","content":"這個地方有很多交通工具。坐電車，我看到很多店。坐地下鐵，我看到很多人。坐渡輪，我看到很多船。坐雙層巴士，我看到很多房子。坐纜車，我看到高山和的大海。坐直升機，我看到這個地方，真美!"},"YELLOW99":{"code":"YELLOW99","number":99,"color":"yellow","title":"不同的車","category":"交通工具","author":"姚釹","illustrator":"胡子建","content":"我先坐計程車，到了地鐵站，去坐地鐵。再坐機場快線，去機場，又坐飛機，去中國。然後，坐機場巴士到纜車站。最後，坐纜車上山，我終於可以滑雪了!"},"YELLOW100":{"code":"YELLOW100","number":100,"color":"yellow","title":"坐什麼車快","category":"交通工具","author":"李琇琇","illustrator":"胡子建","content":"騎自行車比走路快，坐電車比騎自行車快，坐公共汽車比坐電車快，坐汽車比坐公共汽車快，坐火車比坐汽車快，坐飛機比坐火車快，火箭最快!"}};

function normalizeCode(raw) {
  if (!raw) return null;
  const s = raw.trim().toUpperCase().replace(/[#\s]/g, '');
  const m = s.match(/^(RED|GREEN|YELLOW)0*(\d{1,3})$/);
  if (!m) return null;
  const n = parseInt(m[2], 10);
  if (n < 1 || n > 100) return null;
  return m[1] + String(n).padStart(2, '0');
}

function isCJK(ch) {
  const code = ch.codePointAt(0);
  return (code >= 0x4E00 && code <= 0x9FFF) ||
         (code >= 0x3400 && code <= 0x4DBF);
}

function analyze(content, known) {
  let total = 0, knownCount = 0, unknownCount = 0;
  const masked = [];
  for (const ch of content) {
    if (isCJK(ch)) {
      total++;
      if (known.has(ch)) { knownCount++; masked.push(ch); }
      else { unknownCount++; masked.push('<span class="mask"></span>'); }
    } else {
      masked.push(ch);
    }
  }
  return { total, knownCount, unknownCount, maskedHtml: masked.join('') };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const raw = document.getElementById('bookCode').value;
  const code = normalizeCode(raw);
  const err = document.getElementById('err');
  const result = document.getElementById('result');

  err.classList.remove('show');
  result.classList.remove('show');

  if (!code || !BOOKS[code]) {
    err.textContent = '找不到書本代號「' + raw + '」。請用 #red01、#green01、#yellow01 格式（1–100）。';
    err.classList.add('show');
    return;
  }

  const book = BOOKS[code];
  const vocabSize = parseInt(document.getElementById('vocab').value, 10);
  const known = new Set(FREQ.slice(0, vocabSize));
  const stats = analyze(book.content, known);
  const pct = stats.total ? Math.round(stats.knownCount / stats.total * 100) : 0;

  document.getElementById('badge').innerHTML =
    '<span class="badge ' + book.color + '">#' + book.code.toLowerCase() + '</span>';
  document.getElementById('title').textContent = book.title;
  document.getElementById('meta').innerHTML =
    '分類：' + escapeHtml(book.category || '—') +
    ' · 作者：' + escapeHtml(book.author || '—') +
    ' · 繪者：' + escapeHtml(book.illustrator || '—');
  const scoreEl = document.getElementById('score');
  scoreEl.textContent = pct + '%';
  scoreEl.style.color = pct >= 90 ? '#2a8c3a' : pct >= 60 ? '#d4a017' : '#c44';
  document.getElementById('total').textContent = stats.total;
  document.getElementById('known').textContent = stats.knownCount;
  document.getElementById('unknown').textContent = stats.unknownCount;
  document.getElementById('masked').innerHTML = stats.maskedHtml;
  document.getElementById('original').textContent = book.content;

  result.classList.add('show');
}

function buildBookList() {
  const panel = document.getElementById('bookList');
  const colors = [['red','紅書'], ['green','綠書'], ['yellow','黃書']];
  let html = '';
  for (const [color, label] of colors) {
    html += '<div class="book-list-section"><h3>' + label + '</h3><table>';
    for (let i = 1; i <= 100; i++) {
      const code = color.toUpperCase() + String(i).padStart(2,'0');
      const b = BOOKS[code];
      if (!b) continue;
      html += '<tr data-code="' + code + '"><td class="code">#' + code.toLowerCase() +
              '</td><td>' + escapeHtml(b.title) + '</td></tr>';
    }
    html += '</table></div>';
  }
  panel.innerHTML = html;
  panel.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => {
      document.getElementById('bookCode').value = '#' + tr.dataset.code.toLowerCase();
      panel.classList.remove('show');
      render();
    });
  });
}

document.getElementById('goBtn').addEventListener('click', render);
document.getElementById('bookCode').addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
document.getElementById('vocab').addEventListener('change', () => {
  if (document.getElementById('bookCode').value.trim()) render();
});
document.getElementById('listBtn').addEventListener('click', () => {
  document.getElementById('bookList').classList.toggle('show');
});
buildBookList();

document.getElementById('bookCode').value = '#red01';
render();
