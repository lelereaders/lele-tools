<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樂樂文化 庫存管理系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#E8735A;--primary-dark:#d4634a;--accent:#D4A017;
      --bg:#FDF8F3;--surface:#fff;--text:#3D2B1F;--text-light:#7A5C4E;
      --border:#E8D5C4;--success:#6BAF7E;--danger:#E05252;--warn:#E8A23A;
      --produce:#3A8FE8;--ship:#8B5CF6;--consume:#E8A23A;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    header{background:var(--primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    header h1{font-size:18px;font-weight:700}
    header p{font-size:11px;opacity:.85}
    .sync-dot{width:8px;height:8px;border-radius:50%;background:#6BAF7E;display:inline-block;margin-right:5px}
    .sync-dot.syncing{background:var(--accent);animation:blink 1s infinite}
    .sync-dot.error{background:var(--danger)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .main{max-width:1200px;margin:0 auto;padding:18px 16px}

    /* Nav */
    .nav{display:flex;gap:4px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px}
    .nav-btn{flex:1;padding:10px 6px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;border-radius:9px;transition:all .15s;text-align:center}
    .nav-btn.active{background:var(--primary);color:#fff}
    .nav-btn.active.produce{background:var(--produce)}
    .nav-btn.active.ship{background:var(--ship)}
    .nav-btn:hover:not(.active){background:#F5EDE6;color:var(--text)}
    .section{display:none}
    .section.active{display:block}

    /* Card */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
    .card-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .card-title.produce{color:var(--produce)}
    .card-title.ship{color:var(--ship)}
    .card-title.consume{color:var(--consume)}

    /* Tabs + Sort (like UPC tool) */
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
    .tabs{display:flex;gap:4px;flex-wrap:wrap}
    .tab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:none;color:var(--text-light);cursor:pointer;font-family:inherit;transition:all .15s}
    .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .tab:hover:not(.active){border-color:var(--primary);color:var(--primary)}
    .sort-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .sort-label{font-size:11px;font-weight:700;color:var(--text-light);white-space:nowrap}
    .sort-btn{padding:4px 12px;border:1.5px solid var(--border);border-radius:20px;background:none;font-size:11px;font-weight:600;color:var(--text-light);font-family:inherit;cursor:pointer;transition:all .15s}
    .sort-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .sort-btn:hover:not(.active){border-color:var(--primary);color:var(--primary)}
    .search-row{display:flex;gap:10px;margin-bottom:12px}
    .search-row input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--bg)}
    .search-row input:focus{border-color:var(--primary);background:#fff}
    .btn-refresh{padding:9px 16px;background:var(--success);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}

    /* Table */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#FFF5F0;padding:9px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text-light);border-bottom:2px solid var(--border);white-space:nowrap}
    td{padding:9px 12px;border-bottom:1px solid #F5EDE6;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#FDFAF8}
    .sku{font-family:monospace;font-size:12.5px;font-weight:700;color:var(--text)}
    .barcode-display{font-family:monospace;font-size:11px;letter-spacing:.5px;color:var(--text-light)}
    .cat-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
    .cat-書籍{background:#E8F0FF;color:#3059B3}
    .cat-配件{background:#FFF0E6;color:#C06020}
    .cat-耗材{background:#E8F5E9;color:#2E7D32}
    .cat-套組{background:#FFF3E0;color:#E65100}
    .qty-cell{font-size:18px;font-weight:700;color:var(--primary)}
    .qty-zero{color:#ccc}
    .qty-low{color:var(--warn)}
    .date-cell{font-size:11px;color:var(--text-light)}
    .empty{text-align:center;padding:40px;color:#bbb;font-size:14px}
    .loading{text-align:center;padding:30px;color:var(--text-light);font-size:13px}

    /* Forms */
    .field{margin-bottom:13px}
    .field label{display:block;font-size:11px;font-weight:700;color:var(--text-light);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
    .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
    .field input:focus,.field select:focus{border-color:var(--primary);background:#fff}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    /* Produce sub-tabs */
    .sub-tabs{display:flex;gap:6px;margin-bottom:14px}
    .sub-tab{flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);background:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:center;color:var(--text-light);transition:all .15s}
    .sub-tab.active-in{border-color:var(--produce);background:#EFF6FF;color:var(--produce)}
    .sub-tab.active-out{border-color:var(--consume);background:#FFF8E1;color:var(--consume)}
    .sub-tab:hover{border-color:var(--primary)}
    .sub-panel{display:none}
    .sub-panel.active{display:block}
    .sub-note{background:#F8F8F0;border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:12px;color:var(--text-light);margin-bottom:12px;line-height:1.5}

    /* Picker */
    .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
    .picker-item{border:2px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;background:var(--bg);user-select:none}
    .picker-item:hover{border-color:var(--primary)}
    .picker-item.sel-in{border-color:var(--produce);background:#EFF6FF}
    .picker-item.sel-out{border-color:var(--consume);background:#FFF8E1}
    .picker-item.sel-ship{border-color:var(--ship);background:#F5F0FF}
    .picker-sku{font-family:monospace;font-size:11px;font-weight:700;color:var(--text-light)}
    .picker-name{font-size:12px;color:var(--text);line-height:1.3;margin-top:2px}
    .picker-stock{font-size:11px;color:var(--text-light);margin-top:4px}

    /* Sel rows */
    .sel-row{display:grid;grid-template-columns:1fr 100px 100px 32px;gap:8px;align-items:center;margin-bottom:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
    .sel-row.row-in{border-color:#BFDBFE}
    .sel-row.row-out{border-color:#FDE68A}
    .sel-row.row-ship{border-color:#DDD5F5}
    .sel-input{padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;text-align:center;background:#fff;width:100%;outline:none}
    .sel-input:focus{border-color:var(--produce)}
    .sel-input.in-input:focus{border-color:var(--produce)}
    .sel-input.out-input:focus{border-color:var(--consume)}
    .sel-input.ship-input:focus{border-color:var(--ship)}
    .sel-del{border:none;background:none;color:#ccc;cursor:pointer;font-size:18px;padding:0;line-height:1}
    .sel-del:hover{color:var(--danger)}
    .sel-header{display:grid;grid-template-columns:1fr 100px 100px 32px;gap:8px;font-size:10px;font-weight:700;color:var(--text-light);padding:0 12px;margin-bottom:4px;text-transform:uppercase}

    /* Buttons */
    .btn-primary{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;margin-top:6px}
    .btn-in{background:var(--produce);color:#fff}
    .btn-in:hover{background:#2a7fd8}
    .btn-in:disabled{background:#aaa;cursor:not-allowed}
    .btn-out{background:var(--consume);color:#fff}
    .btn-out:hover{background:#d4901a}
    .btn-out:disabled{background:#aaa;cursor:not-allowed}
    .btn-ship{background:var(--ship);color:#fff}
    .btn-ship:hover{background:#7c4def}
    .btn-ship:disabled{background:#aaa;cursor:not-allowed}
    .summary-box{background:#F0F7FF;border:1px solid #BFDBFE;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.9;color:var(--text)}
    .summary-box.out-summary{background:#FFFBEB;border-color:#FDE68A}
    .summary-box.ship-summary{background:#F5F0FF;border-color:#DDD5F5}
    .summary-row{display:flex;justify-content:space-between}
    .summary-key{color:var(--text-light)}
    .flash{border-radius:8px;padding:11px 14px;font-size:13px;margin-top:10px;display:none}
    .flash.ok{background:#E8F5E9;border:1px solid #A5D6A7;color:#2E7D32}
    .flash.err{background:#FFEBEE;border:1px solid #FFCDD2;color:#C62828}

    /* History */
    .history-item{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--surface)}
    .history-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
    .history-date{font-size:12px;font-weight:700}
    .history-type{font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px}
    .type-produce{background:#DBEAFE;color:var(--produce)}
    .type-consume{background:#FEF3C7;color:var(--consume)}
    .type-ship{background:#EDE9FE;color:var(--ship)}
    .history-note{font-size:12px;color:var(--text-light);margin-bottom:8px;font-style:italic}
    .history-items{display:flex;flex-wrap:wrap;gap:6px}
    .history-chip{font-size:11px;padding:3px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--border)}
    .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
    .filter-row select,.filter-row input{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);outline:none}
    .btn-export-hist{padding:8px 16px;background:var(--success);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;margin-left:auto}

    /* Password */
    #pw-overlay{position:fixed;inset:0;background:rgba(253,248,243,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px}
    #pw-overlay h2{font-size:22px;font-weight:700;color:var(--primary)}
    #pw-overlay p{font-size:13px;color:var(--text-light)}
    #pw-input{width:260px;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;text-align:center;outline:none}
    #pw-input:focus{border-color:var(--primary)}
    #pw-btn{padding:12px 32px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
    #pw-error{color:#c0392b;font-size:12px;display:none}
  </style>
</head>
<body>

<div id="pw-overlay">
  <h2>樂樂文化 庫存系統</h2>
  <p>請輸入密碼以繼續</p>
  <input id="pw-input" type="password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')checkPw()">
  <button id="pw-btn" onclick="checkPw()">進入</button>
  <span id="pw-error">密碼錯誤，請再試一次</span>
</div>

<header>
  <div>
    <h1>樂樂文化 庫存管理系統</h1>
    <p>生產 · 用料 · 出貨 · 即時同步</p>
  </div>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-status">連線中...</span>
    <span id="header-date" style="margin-left:8px;opacity:.8"></span>
  </div>
</header>

<div class="main">
  <div class="nav">
    <button class="nav-btn active" onclick="showSection('inventory')">📦 目前庫存</button>
    <button class="nav-btn produce" onclick="showSection('produce')">🏭 生產 / 用料</button>
    <button class="nav-btn ship" onclick="showSection('ship')">🚚 記錄出貨</button>
    <button class="nav-btn" onclick="showSection('history')">📋 歷史紀錄</button>
  </div>

  <!-- ===== 庫存 ===== -->
  <div class="section active" id="sec-inventory">
    <div class="card">
      <div class="toolbar">
        <div class="tabs" id="inv-tabs">
          <button class="tab active" onclick="setInvTab('全部')">全部</button>
          <button class="tab" onclick="setInvTab('書籍')">書籍</button>
          <button class="tab" onclick="setInvTab('配件')">配件</button>
          <button class="tab" onclick="setInvTab('耗材')">耗材</button>
          <button class="tab" onclick="setInvTab('套組')">套組</button>
        </div>
        <div class="sort-row">
          <span class="sort-label">排序：</span>
          <button class="sort-btn active" data-isort="sku" onclick="setInvSort('sku')">SKU</button>
          <button class="sort-btn" data-isort="name" onclick="setInvSort('name')">品名</button>
          <button class="sort-btn" data-isort="qty" onclick="setInvSort('qty')">數量</button>
          <button class="sort-btn" data-isort="cat" onclick="setInvSort('cat')">類別</button>
        </div>
      </div>
      <div class="search-row">
        <input type="text" id="inv-search" placeholder="搜尋 SKU 或商品名稱..." oninput="renderInvTable()">
        <button class="btn-refresh" onclick="loadInventory()">重新整理</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>國際條碼</th>
              <th>商品名稱</th>
              <th>類別</th>
              <th style="text-align:right">現有數量</th>
              <th style="text-align:right">箱數</th>
              <th>最後更新</th>
            </tr>
          </thead>
          <tbody id="inv-tbody"></tbody>
        </table>
        <div id="inv-empty" class="empty" style="display:none">沒有符合的產品</div>
        <div id="inv-loading" class="loading">載入中...</div>
      </div>
    </div>
  </div>

  <!-- ===== 生產 / 用料 ===== -->
  <div class="section" id="sec-produce">
    <div class="card">
      <div class="card-title produce" style="margin-bottom:8px">生產 / 用料記錄</div>
      <div class="row2" style="margin-bottom:14px">
        <div class="field"><label>日期</label><input type="date" id="p-date"></div>
        <div class="field"><label>備注（選填）</label><input type="text" id="p-note" placeholder="例：第一批生產"></div>
      </div>

      <!-- Sub-tabs -->
      <div class="sub-tabs">
        <button class="sub-tab active-in" id="stab-in" onclick="setProdSubTab('in')">
          入庫（產出）<br><small style="font-weight:400;font-size:11px">做好的成品，增加庫存</small>
        </button>
        <button class="sub-tab" id="stab-out" onclick="setProdSubTab('out')">
          出庫（用料）<br><small style="font-weight:400;font-size:11px">拿去製作的原料，扣除庫存</small>
        </button>
      </div>

      <!-- 入庫面板 -->
      <div class="sub-panel active" id="panel-in">
        <div class="sub-note">選擇本次<strong>做好</strong>的產品，填入生產套數與箱數</div>
        <div class="picker-grid" id="produce-picker-in"></div>
        <div id="produce-in-wrap" style="display:none">
          <div class="sel-header"><div>產品</div><div style="text-align:center">產出套數</div><div style="text-align:center">箱數</div><div></div></div>
          <div id="produce-in-rows"></div>
          <div class="summary-box" id="in-summary"></div>
        </div>
        <button class="btn-primary btn-in" id="btn-in" onclick="submitProduce('in')">確認入庫（產出）</button>
        <div class="flash ok" id="in-flash"></div>
        <div class="flash err" id="in-err"></div>
      </div>

      <!-- 出庫面板 -->
      <div class="sub-panel" id="panel-out">
        <div class="sub-note">選擇本次<strong>拿去製作</strong>消耗的材料，填入用量</div>
        <div class="picker-grid" id="produce-picker-out"></div>
        <div id="produce-out-wrap" style="display:none">
          <div class="sel-header"><div>材料</div><div style="text-align:center">消耗數量</div><div style="text-align:center">現有庫存</div><div></div></div>
          <div id="produce-out-rows"></div>
          <div class="summary-box out-summary" id="out-summary"></div>
        </div>
        <button class="btn-primary btn-out" id="btn-out" onclick="submitProduce('out')">確認出庫（用料）</button>
        <div class="flash ok" id="out-flash"></div>
        <div class="flash err" id="out-err"></div>
      </div>
    </div>
  </div>

  <!-- ===== 出貨 ===== -->
  <div class="section" id="sec-ship">
    <div class="card">
      <div class="card-title ship">記錄出貨</div>
      <div class="row2">
        <div class="field"><label>出貨日期</label><input type="date" id="s-date"></div>
        <div class="field"><label>訂單編號 / 備注</label><input type="text" id="s-ref" placeholder="例：ORD-20260602 或客戶名"></div>
      </div>
      <div class="picker-grid" id="ship-picker"></div>
      <div id="ship-selected-wrap" style="display:none">
        <div class="sel-header"><div>產品</div><div style="text-align:center">出貨數量</div><div style="text-align:center">現有庫存</div><div></div></div>
        <div id="ship-selected"></div>
        <div class="summary-box ship-summary" id="ship-summary"></div>
      </div>
      <button class="btn-primary btn-ship" id="ship-btn" onclick="submitShip()">確認記錄出貨</button>
      <div class="flash ok" id="ship-flash"></div>
      <div class="flash err" id="ship-err"></div>
    </div>
  </div>

  <!-- ===== 歷史 ===== -->
  <div class="section" id="sec-history">
    <div class="card">
      <div class="card-title">歷史紀錄</div>
      <div class="filter-row">
        <select id="hist-type" onchange="renderHistory()">
          <option value="">全部類型</option>
          <option value="produce">入庫（產出）</option>
          <option value="consume">出庫（用料）</option>
          <option value="ship">出貨記錄</option>
        </select>
        <input type="month" id="hist-month" onchange="renderHistory()">
        <button class="btn-export-hist" onclick="exportHistory()">匯出 CSV</button>
      </div>
      <div id="history-list"><div class="loading">載入中...</div></div>
    </div>
  </div>
</div>

// ===================== SUPABASE =====================
function sbH(){ return {'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}; }
async function sbGet(t,p){ var r=await fetch(SB_URL+'/rest/v1/'+t+'?'+(p||''),{headers:sbH()}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function sbUpsert(t,d){ var r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:Object.assign({},sbH(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(d)}); if(!r.ok) throw new Error(await r.text()); }
async function sbInsert(t,d){ var r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:Object.assign({},sbH(),{'Prefer':'return=representation'}),body:JSON.stringify(d)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

// ===================== INVENTORY TABLE =====================
async function loadInventory(){
  setSyncing('syncing');
  document.getElementById('inv-loading').style.display='block';
  document.getElementById('inv-tbody').innerHTML='';
  document.getElementById('inv-empty').style.display='none';
  try{
    var rows = await sbGet('inventory','select=sku,qty,cartons,last_updated');
    _invCache={};
    rows.forEach(function(r){_invCache[r.sku]=r;});
    setSyncing('ok');
  }catch(e){ setSyncing('error'); }
  document.getElementById('inv-loading').style.display='none';
  renderInvTable();
}

function setInvTab(t){ _invTab=t; document.querySelectorAll('#inv-tabs .tab').forEach(function(el){el.classList.toggle('active',el.textContent===t);}); renderInvTable(); }
function setInvSort(s){ _invSort=s; document.querySelectorAll('[data-isort]').forEach(function(el){el.classList.toggle('active',el.dataset.isort===s);}); renderInvTable(); }

function renderInvTable(){
  var q=(document.getElementById('inv-search').value||'').trim().toLowerCase();
  var list=PRODUCTS.filter(function(p){
    if(_invTab!=='全部'&&p.cat!==_invTab)return false;
    if(q&&!p.sku.toLowerCase().includes(q)&&!p.name.toLowerCase().includes(q)&&!p.barcode.includes(q))return false;
    return true;
  });
  list.sort(function(a,b){
    if(_invSort==='sku')  return a.sku.localeCompare(b.sku,'en',{sensitivity:'base'});
    if(_invSort==='name') return a.name.localeCompare(b.name,'zh-TW');
    if(_invSort==='cat')  return a.cat.localeCompare(b.cat,'zh-TW')||a.sku.localeCompare(b.sku,'en');
    if(_invSort==='qty'){
      var qa=(_invCache[a.sku]||{qty:0}).qty, qb=(_invCache[b.sku]||{qty:0}).qty;
      return qb-qa;
    }
    return 0;
  });
  var tbody=document.getElementById('inv-tbody');
  if(!list.length){tbody.innerHTML='';document.getElementById('inv-empty').style.display='block';return;}
  document.getElementById('inv-empty').style.display='none';
  tbody.innerHTML=list.map(function(p){
    var s=_invCache[p.sku]||{qty:0,cartons:0,last_updated:null};
    var qcls=s.qty===0?'qty-zero':(s.qty<=10?'qty-low':'');
    return '<tr>'+
      '<td class="sku">'+p.sku+'</td>'+
      '<td><span class="barcode-display">'+p.barcode+'</span></td>'+
      '<td>'+esc(p.name)+'</td>'+
      '<td><span class="cat-badge cat-'+p.cat+'">'+p.cat+'</span></td>'+
      '<td style="text-align:right"><span class="qty-cell '+qcls+'">'+s.qty+'</span> <span style="font-size:11px;color:var(--text-light)">'+p.unit+'</span></td>'+
      '<td style="text-align:right;font-size:13px;color:var(--text-light)">'+(s.cartons||0)+' 箱</td>'+
      '<td class="date-cell">'+(s.last_updated||'—')+'</td>'+
      '</tr>';
  }).join('');
}

async function submitProduce(mode){
  var date=document.getElementById('p-date').value;
  var note=document.getElementById('p-note').value.trim();
  var sel=mode==='in'?_selIn:_selOut;
  var errEl=document.getElementById(mode+'-err');
  var flashEl=document.getElementById(mode+'-flash');
  var btnEl=document.getElementById('btn-'+mode);
  errEl.style.display='none';
  if(!date){showMsg(errEl,'請選擇日期');return;}
  var keys=Object.keys(sel).filter(function(k){return (sel[k].qty||0)>0;});
  if(!keys.length){showMsg(errEl,'請選擇至少一個產品並填入數量');return;}
  btnEl.disabled=true; btnEl.textContent='儲存中...';
  setSyncing('syncing');
  try{
    var type=mode==='in'?'produce':'consume';
    var histRows=await sbInsert('inv_history',{type:type,date:date,note:note||null});
    var histId=histRows[0].id;
    var items=[],invUpdates=[];
    keys.forEach(function(sku){
      var item=sel[sku],qty=item.qty||0,ctns=item.cartons||0;
      var cur=_invCache[sku]||{qty:0,cartons:0};
      items.push({history_id:histId,sku:sku,name:item.name,qty:qty,cartons:ctns,unit:item.unit});
      var newQty=mode==='in'?cur.qty+qty:Math.max(0,cur.qty-qty);
      var newCtns=mode==='in'?cur.cartons+ctns:cur.cartons;
      invUpdates.push({sku:sku,qty:newQty,cartons:newCtns,last_updated:date});
    });
    await sbInsert('inv_history_items',items);
    await sbUpsert('inventory',invUpdates);
    setSyncing('ok');
    showMsg(flashEl,mode==='in'?'入庫成功！庫存已增加。':'用料記錄完成！庫存已扣除。');
    if(mode==='in'){_selIn={};}else{_selOut={};}
    setTimeout(function(){ loadInventory(); renderProdPicker(); if(mode==='in'){document.getElementById('produce-in-wrap').style.display='none';}else{document.getElementById('produce-out-wrap').style.display='none';} },1500);
  }catch(e){setSyncing('error');showMsg(errEl,'儲存失敗：'+e.message);}
  finally{btnEl.disabled=false;btnEl.textContent=mode==='in'?'確認入庫（產出）':'確認出庫（用料）';}
}

function resetProduceForm(){
  _selIn={}; _selOut={};

  ['in-flash','in-err','out-flash','out-err'].forEach(function(id){document.getElementById(id).style.display='none';});
  setProdSubTab('in');
}

  var list=document.getElementById('history-list');
  list.innerHTML='<div class="loading">載入中...</div>';
  setSyncing('syncing');
  try{
    var params='select=id,type,date,note,inv_history_items(sku,name,qty,unit,cartons)&order=date.desc,id.desc&limit=100';
    if(typeF) params+='&type=eq.'+typeF;
    if(monthF) params+='&date=gte.'+monthF+'-01&date=lt.'+nextMonth(monthF)+'-01';
    var rows=await sbGet('inv_history',params);
    setSyncing('ok');
    if(!rows.length){list.innerHTML='<div class="empty">沒有符合的紀錄</div>';return;}
    var typeLabels={produce:'入庫（產出）',consume:'出庫（用料）',ship:'出貨記錄'};
    list.innerHTML=rows.map(function(h){
      var chips=(h.inv_history_items||[]).map(function(item){return '<span class="history-chip">'+item.sku+' × '+item.qty+' '+item.unit+'</span>';}).join('');
      return '<div class="history-item">'+
        '<div class="history-meta"><span class="history-date">'+h.date+'</span>'+
        '<span class="history-type type-'+h.type+'">'+(typeLabels[h.type]||h.type)+'</span></div>'+
        (h.note?'<div class="history-note">'+esc(h.note)+'</div>':'')+
        '<div class="history-items">'+chips+'</div></div>';
    }).join('');
  }catch(e){setSyncing('error');list.innerHTML='<div class="empty">載入失敗：'+e.message+'</div>';}
}

async function exportHistory(){
  var rows=await sbGet('inv_history','select=id,type,date,note,inv_history_items(sku,name,qty,unit)&order=date.desc&limit=1000');
  var typeLabels={produce:'入庫（產出）',consume:'出庫（用料）',ship:'出貨記錄'};
  var csv=[['日期','類型','備注','SKU','商品名稱','數量','單位']];
  rows.forEach(function(h){(h.inv_history_items||[]).forEach(function(item){csv.push([h.date,typeLabels[h.type]||h.type,h.note||'',item.sku,item.name,item.qty,item.unit]);});});
  var blob=new Blob(['﻿'+csv.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lele-inventory-'+todayStr()+'.csv';a.click();
}

// ===================== UTILS =====================
function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showMsg(el,msg){el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none';},6000);}
function nextMonth(ym){var d=new Date(ym+'-01');d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7);}

// ===================== INIT =====================
function init(){
  var now=new Date();
  document.getElementById('header-date').textContent=now.getFullYear()+'/'+(now.getMonth()+1).toString().padStart(2,'0')+'/'+now.getDate().toString().padStart(2,'0');
  document.getElementById('p-date').value=todayStr();
  document.getElementById('s-date').value=todayStr();
  loadInventory();
}
</script>
