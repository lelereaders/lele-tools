<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>找字系統 — 樂樂文化</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
:root{--brand:#8B5CF6;--bg:#fff;--card:#fff;--text:#1a1a1a;--sub:#888;--accent:#7C3AED;--hover:#EDE9FE}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);min-height:100vh}
.hdr{text-align:center;padding:2rem 1rem 1rem;background:#fff}
.hdr img{max-width:500px;width:85%;margin-bottom:8px}
.hdr .desc{font-size:15px;color:#666;margin-bottom:12px}
.toggle-row{display:flex;gap:0;justify-content:center;margin-bottom:12px}
.toggle-btn{padding:10px 32px;border:2px solid #ddd;background:#fff;cursor:pointer;font-size:14px;transition:all .15s;color:#666}
.toggle-btn:first-child{border-radius:8px 0 0 8px;border-right:1px solid #ddd}
.toggle-btn:last-child{border-radius:0 8px 8px 0;border-left:1px solid #ddd}
.toggle-btn.active{background:#D4A843;color:#fff;border-color:#D4A843;font-weight:700}
.bar{max-width:900px;margin:0 auto;padding:0 1rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:180px;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:16px;outline:none;background:#f8f8f8;transition:border .2s}
.bar input:focus{border-color:var(--brand);background:#fff}
.bar select{padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;background:#f8f8f8;cursor:pointer}
.stats{max-width:900px;margin:.5rem auto 0;padding:0 1rem;font-size:13px;color:var(--sub)}
.grid{max-width:900px;margin:1rem auto;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.ch{background:var(--card);border:1px solid #e0e0e0;border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;padding:8px 0}
.ch:hover{border-color:var(--brand);background:var(--hover);transform:translateY(-2px);box-shadow:0 4px 12px rgba(139,92,246,.15)}
.ch .c{font-size:24px;color:var(--text)}
.ch .n{font-size:11px;color:var(--sub);margin-top:2px}
.pager{max-width:900px;margin:0 auto;padding:1rem;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pg{padding:6px 14px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;font-size:14px;transition:all .15s}
.pg:hover{border-color:var(--brand);background:var(--hover)}
.pg.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.detail-overlay.open{display:flex}
.detail{background:#fff;border-radius:16px;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;padding:1.5rem;position:relative}
.detail .close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:var(--sub);background:none;border:none}
.detail h2{font-size:32px;text-align:center;color:var(--accent);margin-bottom:4px}
.detail .meta{text-align:center;color:var(--sub);font-size:13px;margin-bottom:1rem}
.detail .bk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.detail .bk:last-child{border:none}
.detail .bk .info{flex:1}
.detail .bk .t{font-size:14px;color:var(--text)}
.detail .bk .id{font-size:12px;color:var(--sub)}
.detail .bk .bar-wrap{width:80px;height:8px;background:#f0ecff;border-radius:4px;overflow:hidden}
.detail .bk .bar-fill{height:100%;background:var(--brand);border-radius:4px}
.footer{background:#1a1a1a;color:#fff;text-align:center;padding:1.2rem 1rem;font-size:14px;margin-top:2rem}
.footer a{color:#fff;text-decoration:none;margin:0 .6rem;opacity:.8}
.footer a:hover{opacity:1}
.sub-footer{font-size:12px;opacity:.6;margin-top:6px}
@media(max-width:500px){.grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}.ch .c{font-size:20px}.hdr img{max-width:300px}}
</style>
</head>

<div class="pager" id="pager"></div>

<div class="detail" id="det"></div>
</div>

function setVariant(v){
  variant=v;
  document.querySelectorAll('.toggle-btn').forEach(function(b,i){b.className='toggle-btn'+(i===(v==='tc'?0:1)?' active':'')});
  var L=labels[v];
  sorted_data=[...(v==='tc'?TC_DATA:SC_DATA)];
  document.getElementById('charCount').textContent=sorted_data.length;
  document.getElementById('pageDesc').innerHTML='300 '+L.books+' · <span id="charCount">'+sorted_data.length+'</span> '+L.unit+' · '+(v==='tc'?'點擊查看出現在哪些書':'点击查看出现在哪些书');

  var sel=document.getElementById('sort');sel.options[0].text=L.sortFreq;sel.options[1].text=L.sortBooks;

}
function doSort(){var s=document.getElementById('sort').value;if(s==='freq')sorted_data.sort(function(a,b){return b.t-a.t});else sorted_data.sort(function(a,b){return b.n-a.n||(b.t-a.t)});curPage=1;render()}
function render(){
  var q=document.getElementById('q').value.trim();var L=labels[variant];
  filtered=q?sorted_data.filter(function(x){return q.indexOf(x.c)>=0}):sorted_data;
  var totalPages=Math.ceil(filtered.length/PAGE);if(curPage>totalPages)curPage=totalPages||1;
  var start=(curPage-1)*PAGE;var show=filtered.slice(start,start+PAGE);
  document.getElementById('grid').innerHTML=show.map(function(x,i){var idx=start+i;return'<div class="ch" onclick="openD('+idx+')"><div class="c">'+x.c+'</div><div class="n">'+x.t+L.times+'</div></div>'}).join('');
  document.getElementById('stats').textContent=L.show+' '+(start+1)+'-'+(start+show.length)+' / '+filtered.length+' '+L.unit;
  renderPager(totalPages);
}
function renderPager(total){if(total<=1){document.getElementById('pager').innerHTML='';return}var h='';for(var i=1;i<=total;i++)h+='<button class="pg'+(i===curPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';document.getElementById('pager').innerHTML=h}
function goPage(p){curPage=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function openD(i){
  var x=filtered[i];if(!x)return;var L=labels[variant];
  var maxC=x.b[0]?x.b[0][2]:1;
  var bks=x.b.map(function(b){var pct=Math.max(5,Math.round(b[2]/maxC*100));return'<div class="bk"><div class="info"><div class="t">'+b[1]+'</div><div class="id">'+b[0]+' · '+L.appear2+' '+b[2]+' '+L.times+'</div></div><div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>'}).join('');
  document.getElementById('det').innerHTML='<button class="close" onclick="closeD()">&times;</button><h2>'+x.c+'</h2><div class="meta">'+L.appear+' '+x.t+' '+L.times+' · '+L.dist+' '+x.n+' '+L.bookUnit+'</div>'+bks;
  document.getElementById('ov').classList.add('open');document.body.style.overflow='hidden';
}
function closeD(){document.getElementById('ov').classList.remove('open');document.body.style.overflow=''}
